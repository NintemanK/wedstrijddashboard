    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
      mount({"requirements": ["pandas", "numpy", "scipy", "matplotlib", "altair"], "entrypoint": "app.py", "files": {"myva_pipeline/__init__.py": "\"\"\"myva_pipeline: MyVA-wedstrijdcoderingen omzetten in patronen en een wedstrijdbeeld.\"\"\"\n", "myva_pipeline/__main__.py": "\"\"\"Maakt `python -m myva_pipeline` gelijk aan het commando `myva`.\"\"\"\n\nimport sys\n\nfrom myva_pipeline.cli import main\n\nsys.exit(main())\n", "myva_pipeline/analyse/__init__.py": "\"\"\"Analyse: tellen, vergelijken en bepalen wat een bevinding is. Schrijft geen bestanden.\"\"\"\n", "myva_pipeline/analyse/momenten.py": "\"\"\"Losse momenten voor het grote veld: een rij per gebeurtenis, met zone, kant en uitkomst.\n\nElke tabel heeft dezelfde kolommen: wedstrijd, titel, helft, minuut, videotijd, zone,\nkant, uitkomst en reeks_id. De zone volgt de fases, want de XML heeft geen plek op het\nveld. De kant komt alleen uit wat gecodeerd is: links of rechts langs het blok, of een\nvoorzet van links of rechts. Links en rechts zijn gezien vanuit het eigen team.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import vergelijkingen as vg\nfrom myva_pipeline.analyse.patronen import speelminuut\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.analyse.seizoen import situatie\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, VERDEDIGEN\nfrom myva_pipeline.model import markov as m\nfrom myva_pipeline.model.reeksen import schotmomenten\n\nKOLOMMEN = [\"wedstrijd\", \"titel\", \"helft\", \"minuut\", \"videotijd\", \"zone\", \"kant\", \"uitkomst\", \"reeks_id\"]\n\n# De fase waarin een aanval van de tegenstander eindigde, als zone op ons veld.\nFASE_TEGEN = {\n    \"F0\": \"hun_doeltrap\", \"F1A\": \"hun_opbouw\", \"F1B\": \"hun_opbouw\", \"F1C-L\": \"langs_blok\", \"F1C-R\": \"langs_blok\",\n    \"F2A\": \"door_blok\", \"F2B\": \"door_blok\", \"F2C\": \"achter_blok\", \"F3\": \"onze_eindfase\",\n}\n\n\ndef _rij(a: Analyse, r: pd.Series, **velden) -> dict:\n    helft = r[\"helft\"] if r[\"helft\"] is not None and not pd.isna(r[\"helft\"]) else None\n    minuut = speelminuut(r[\"start_min\"]) if r[\"start_min\"] is not None and not pd.isna(r[\"start_min\"]) else None\n    return {\"wedstrijd\": a.wedstrijd.naam, \"titel\": a.wedstrijd.titel, \"helft\": helft, \"minuut\": minuut, \"reeks_id\": r[\"reeks_id\"], **velden}\n\n\ndef _kant(pad: list[str], voorzet) -> str | None:\n    \"\"\"Links of rechts als dat gecodeerd is: eerst de voorzet, anders langs welke kant van het blok.\"\"\"\n    if voorzet in (\"links\", \"rechts\"):\n        return voorzet\n    if \"F1C-L\" in pad and \"F1C-R\" not in pad:\n        return \"links\"\n    if \"F1C-R\" in pad and \"F1C-L\" not in pad:\n        return \"rechts\"\n    return None\n\n\ndef _uitkomst(eind) -> str:\n    if eind in m.SCHOT_EINDEN:\n        return str(eind)\n    return {\"BV\": \"balverlies\", \"BW\": \"veroverd\", \"uit\": \"uit\"}.get(eind, \"anders\")\n\n\ndef doeltrap_tegenstander(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Elke aanval van de tegenstander die met een doeltrap begon: waar hij eindigde en hoe.\"\"\"\n    rijen = []\n    for a in analyses:\n        r = a.reeksen\n        for _, x in r[(r[\"hoofdfunctie\"] == VERDEDIGEN) & r[\"pad\"].apply(lambda p: \"F0\" in p)].iterrows():\n            rijen.append(_rij(a, x, videotijd=float(x[\"end\"]), zone=FASE_TEGEN.get(x[\"pad\"][-1], \"hun_doeltrap\"), kant=None, uitkomst=_uitkomst(x[\"eind\"])))\n    return pd.DataFrame(rijen, columns=KOLOMMEN)\n\n\ndef opbouw(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Elke opgebouwde aanval van ons: over welke kant, hoe ver hij kwam en hoe hij eindigde.\"\"\"\n    rijen = []\n    for a in analyses:\n        r = a.reeksen\n        for _, x in r[r[\"hoofdfunctie\"] == AANVALLEN].iterrows():\n            pad = list(x[\"pad\"])\n            verst = \"eindfase\" if \"F3\" in pad else \"middenveld\" if any(f.startswith(\"F2\") for f in pad) else \"opbouw\"\n            rijen.append(_rij(a, x, videotijd=float(x[\"start\"]), zone=verst, kant=_kant(pad, x[\"voorzet\"]) or \"midden\", uitkomst=_uitkomst(x[\"eind\"])))\n    return pd.DataFrame(rijen, columns=KOLOMMEN)\n\n\ndef schoten(analyses: list[Analyse], kant: str) -> pd.DataFrame:\n    \"\"\"Elk schot van `kant` (\"eigen\" of \"tegen\"): uit welke spelsituatie, en voor eigen schoten over welke kant.\"\"\"\n    rijen = []\n    for a in analyses:\n        reeksen = a.reeksen.set_index(\"reeks_id\")\n        sm = schotmomenten(a.kansen)\n        for _, k in sm[sm[\"kant\"] == kant].iterrows():\n            spelsituatie = situatie(k[\"herkomst\"])\n            flank = None\n            if kant == \"eigen\" and k[\"reeks_id\"] in reeksen.index and reeksen.loc[k[\"reeks_id\"], \"hoofdfunctie\"] in EIGEN_BEZIT:\n                x = reeksen.loc[k[\"reeks_id\"]]\n                flank = _kant(list(x[\"pad\"]), x[\"voorzet\"])\n            zone = \"spelhervatting\" if spelsituatie in (\"corner\", \"vrije trap\", \"ingooi\") else spelsituatie\n            rijen.append(_rij(a, k, videotijd=float(k[\"start\"]), zone=zone, kant=flank or \"midden\", uitkomst=\"goal\" if k[\"is_goal\"] else \"schot\"))\n    return pd.DataFrame(rijen, columns=KOLOMMEN)\n\n\ndef balverlies(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Elk balverlies in onze opgebouwde aanval: in welke zone, en wat de tegenstander daarna deed.\"\"\"\n    bv = vg.balverlies_tabel(analyses)\n    bv = bv[bv[\"soort\"] == \"opbouw\"]\n    rijen = []\n    for _, x in bv.iterrows():\n        uitkomst = \"goal tegen\" if x[\"av_goal\"] else \"schot tegen\" if x[\"av_schot\"] else \"eindfase tegen\" if x[\"av_eindfase\"] else \"geen gevaar\"\n        helft = x[\"helft\"] if x[\"helft\"] is not None and not pd.isna(x[\"helft\"]) else None\n        minuut = speelminuut(x[\"start_min\"]) if x[\"start_min\"] is not None and not pd.isna(x[\"start_min\"]) else None\n        rijen.append({\"wedstrijd\": x[\"wedstrijd\"], \"titel\": x[\"titel\"], \"helft\": helft, \"minuut\": minuut, \"videotijd\": float(x[\"videotijd\"]),\n                      \"zone\": x[\"zone\"], \"kant\": None, \"uitkomst\": uitkomst, \"reeks_id\": x[\"reeks_id\"]})\n    return pd.DataFrame(rijen, columns=KOLOMMEN)\n", "myva_pipeline/analyse/patronen.py": "\"\"\"Patroonregels van een wedstrijd uit reeksen, kansen en fasewaarden.\n\nElke regel is een telling met minstens id, type, kant, hoofdfunctie, helft, a en b.\nCondities dragen daarnaast het Beta-Binomiaal-resultaat: een 90%-interval per ratio\nen de kans dat de ene ratio groter is dan de andere. De zin bij een regel komt uit\nweergave.regeltekst.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom typing import Callable\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.statistiek import beta_interval, kans_groter\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, KANT, OMSCHAKELEN_AV, OMSCHAKELEN_VA, REEKS_FUNCTIES, VERDEDIGEN\nfrom myva_pipeline.model import markov as m\nfrom myva_pipeline.model.reeksen import schotmomenten\n\nVENSTER_MIN = 5\nTOP_PADEN = 5\nZEKERHEID_OPVALLEND = 0.90\nMAX_OPVALLEND = 5\n\nUitkomst = Callable[[pd.DataFrame], pd.Series]\n\n\ndef speelminuut(start_min: float) -> int:\n    \"\"\"Voetbalconventie: 9:36 na de aftrap is de 10e minuut.\"\"\"\n    return int(math.floor(float(start_min))) + 1\n\n\ndef bereikt_f3(reeksen: pd.DataFrame) -> pd.Series:\n    \"\"\"De reeks haalde de eindfase, of het was een omschakeling waarna dezelfde partij er kort na de balwissel kwam.\"\"\"\n    return reeksen[\"pad\"].apply(lambda pad: \"F3\" in pad).astype(bool) | reeksen[\"eindfase_vervolg\"].astype(bool)\n\n\ndef schot(reeksen: pd.DataFrame) -> pd.Series:\n    return reeksen[\"eind\"].isin(m.SCHOT_EINDEN)\n\n\ndef verlies(reeksen: pd.DataFrame) -> pd.Series:\n    return pd.Series(\n        [e == m.verlies_eind(hf) for e, hf in zip(reeksen[\"eind\"], reeksen[\"hoofdfunctie\"])],\n        index=reeksen.index,\n        dtype=bool,\n    )\n\n\ndef heeft_fase(reeksen: pd.DataFrame, fase: str) -> pd.Series:\n    return reeksen[\"pad\"].apply(lambda pad: fase in pad).astype(bool)\n\n\nUITKOMSTEN: dict[str, Uitkomst] = {\"f3\": bereikt_f3, \"schot\": schot, \"verlies\": verlies}\n\n\ndef _regel(regels: list, wedstrijd: str, type_: str, **velden) -> dict:\n    volgnr = sum(r[\"type\"] == type_ for r in regels) + 1\n    regel = {\"id\": f\"{wedstrijd}_{type_}_{volgnr:02d}\", \"type\": type_, \"helft\": None, \"score\": 0.0}\n    regel.update(velden)\n    regels.append(regel)\n    return regel\n\n\ndef regels_pad(reeksen: pd.DataFrame, wedstrijd: str, regels: list) -> None:\n    for hf in REEKS_FUNCTIES:\n        sub = reeksen[reeksen[\"hoofdfunctie\"] == hf]\n        if sub.empty:\n            continue\n        volledig = [\n            \">\".join(list(pad) + [\"einde\" if eind is None or pd.isna(eind) else str(eind)])\n            for pad, eind in zip(sub[\"pad\"], sub[\"eind\"])\n        ]\n        tel = pd.Series(volledig).value_counts()\n        for pad_str, n in tel.head(TOP_PADEN + 1).items():\n            leeg = \">\" not in pad_str\n            _regel(regels, wedstrijd, \"pad\", kant=KANT[hf], hoofdfunctie=hf, a=int(n), b=int(len(sub)), score=0.0 if leeg else float(n), pad=pad_str, leeg=leeg)\n\n\ndef _conditie(regels: list, wedstrijd: str, vergelijking: str, uitkomst_code: str, hf_a: str, groep_a: pd.DataFrame, hf_b: str, groep_b: pd.DataFrame) -> None:\n    \"\"\"Dezelfde uitkomst in twee groepen reeksen: a van b tegenover a2 van b2.\"\"\"\n    uitkomst = UITKOMSTEN[uitkomst_code]\n    masker_a, masker_b = uitkomst(groep_a), uitkomst(groep_b)\n    a1, b1 = int(masker_a.sum()), len(groep_a)\n    a2, b2 = int(masker_b.sum()), len(groep_b)\n    if b1 == 0 and b2 == 0:\n        return\n    kans = kans_groter(a1, b1, a2, b2)\n    _regel(\n        regels,\n        wedstrijd,\n        \"conditie\",\n        kant=KANT[hf_a] if hf_a == hf_b else \"beide\",\n        hoofdfunctie=hf_a if hf_a == hf_b else f\"{hf_a}|{hf_b}\",\n        a=a1,\n        b=b1,\n        a2=a2,\n        b2=b2,\n        kans_a_groter=kans,\n        zekerheid=float(\"nan\") if math.isnan(kans) else max(kans, 1 - kans),\n        interval_a=beta_interval(a1, b1),\n        interval_b=beta_interval(a2, b2),\n        score=0.0 if math.isnan(kans) else abs(kans - 0.5) * 2 * (b1 + b2),\n        vergelijking=vergelijking,\n        uitkomst_code=uitkomst_code,\n        clips_a=groep_a[masker_a.to_numpy(dtype=bool)][\"reeks_id\"].tolist() if b1 else [],\n        clips_b=groep_b[masker_b.to_numpy(dtype=bool)][\"reeks_id\"].tolist() if b2 else [],\n    )\n\n\ndef regels_conditie(reeksen: pd.DataFrame, wedstrijd: str, regels: list) -> None:\n    per_functie = {hf: reeksen[reeksen[\"hoofdfunctie\"] == hf] for hf in REEKS_FUNCTIES}\n    A, V, AV, VA = (per_functie[hf] for hf in (AANVALLEN, VERDEDIGEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA))\n\n    def vergelijk(vergelijking, uitkomst_code, hf_a, groep_a, hf_b, groep_b):\n        _conditie(regels, wedstrijd, vergelijking, uitkomst_code, hf_a, groep_a, hf_b, groep_b)\n\n    for hf, df in ((AANVALLEN, A), (VERDEDIGEN, V)):\n        hoog, laag = df[df[\"drukhoogte\"] == \"hoog\"], df[df[\"drukhoogte\"] == \"laag\"]\n        vergelijk(\"druk\", \"verlies\", hf, hoog, hf, laag)\n        vergelijk(\"druk\", \"f3\", hf, hoog, hf, laag)\n\n    for hf, df in ((AANVALLEN, A), (VERDEDIGEN, V)):\n        vergelijk(\"route\", \"f3\", hf, df[heeft_fase(df, \"F2A\")], hf, df[heeft_fase(df, \"F2C\")])\n\n    for hf, df in ((AANVALLEN, A), (VERDEDIGEN, V)):\n        f0 = heeft_fase(df, \"F0\")\n        vergelijk(\"doeltrap\", \"f3\", hf, df[f0], hf, df[~f0])\n\n    for hf, df in ((AANVALLEN, A), (VERDEDIGEN, V)):\n        lb = df[\"lange_bal\"].astype(bool)\n        vergelijk(\"lange_bal\", \"f3\", hf, df[lb], hf, df[~lb])\n        vergelijk(\"lange_bal\", \"verlies\", hf, df[lb], hf, df[~lb])\n\n    for code in (\"f3\", \"verlies\", \"schot\"):\n        vergelijk(\"teams_opbouw\", code, AANVALLEN, A, VERDEDIGEN, V)\n    for code in (\"schot\", \"f3\"):\n        vergelijk(\"teams_omschakeling\", code, OMSCHAKELEN_VA, VA, OMSCHAKELEN_AV, AV)\n\n    for hf, df, code in ((AANVALLEN, A, \"f3\"), (AANVALLEN, A, \"verlies\"), (OMSCHAKELEN_AV, AV, \"schot\"), (OMSCHAKELEN_VA, VA, \"schot\")):\n        vergelijk(\"helft\", code, hf, df[df[\"helft\"] == 1], hf, df[df[\"helft\"] == 2])\n\n    eigen = reeksen[reeksen[\"hoofdfunctie\"].isin(EIGEN_BEZIT)]\n    vergelijk(\"voorzet\", \"schot\", AANVALLEN, eigen[eigen[\"voorzet\"] == \"links\"], AANVALLEN, eigen[eigen[\"voorzet\"] == \"rechts\"])\n\n\ndef opvallende_condities(regels: pd.DataFrame, zekerheid: float = ZEKERHEID_OPVALLEND, maximum: int = MAX_OPVALLEND) -> pd.DataFrame:\n    \"\"\"De zekerste verschillen van een wedstrijd, hoogstens een per soort vergelijking en kant.\"\"\"\n    cond = regels[(regels[\"type\"] == \"conditie\") & (regels[\"zekerheid\"] >= zekerheid)].sort_values(\"score\", ascending=False)\n    return cond.drop_duplicates(subset=[\"vergelijking\", \"kant\"]).head(maximum)\n\n\ndef regels_herkomst(kansen: pd.DataFrame, wedstrijd: str, regels: list) -> None:\n    for _, k in schotmomenten(kansen).iterrows():\n        _regel(\n            regels,\n            wedstrijd,\n            \"herkomst\",\n            kant=k[\"kant\"],\n            hoofdfunctie=k[\"herkomst\"] if k[\"herkomst\"] in REEKS_FUNCTIES else None,\n            helft=int(k[\"helft\"]) if k[\"helft\"] is not None and not pd.isna(k[\"helft\"]) else None,\n            a=1,\n            b=1,\n            score=2.0 if k[\"is_goal\"] else 1.0,\n            kans_id=k[\"kans_id\"],\n            reeks_id=k[\"reeks_id\"],\n            soort=\"goal\" if k[\"is_goal\"] else \"schot\",\n            start_min=k[\"start_min\"],\n        )\n\n\ndef schoten_per_groep(kansen: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Schoten per herkomstgroep (opbouw, omschakeling, spelhervatting), voor en tegen.\"\"\"\n    k = schotmomenten(kansen)\n\n    def groep(herkomst: str) -> str:\n        if herkomst in (AANVALLEN, VERDEDIGEN):\n            return \"opbouw\"\n        if herkomst in (OMSCHAKELEN_VA, OMSCHAKELEN_AV):\n            return \"omschakeling\"\n        if herkomst.startswith(\"spelhervatting:\"):\n            return \"spelhervatting\"\n        return \"onbekend\"\n\n    k[\"groep\"] = k[\"herkomst\"].map(groep)\n    t = k.pivot_table(index=\"groep\", columns=\"kant\", values=\"kans_id\", aggfunc=\"count\", fill_value=0)\n    t = t.reindex([\"opbouw\", \"omschakeling\", \"spelhervatting\", \"onbekend\"]).fillna(0).astype(int)\n    t = t[t.sum(axis=1) > 0]\n    for kolom in (\"eigen\", \"tegen\"):\n        if kolom not in t.columns:\n            t[kolom] = 0\n    return t[[\"eigen\", \"tegen\"]]\n\n\ndef tempo_tabel(reeksen: pd.DataFrame) -> pd.DataFrame:\n    t = reeksen.groupby([\"hoofdfunctie\", \"helft\"]).agg(reeksen=(\"reeks_id\", \"count\"), duur_gem=(\"duur\", \"mean\")).reset_index()\n    t[\"duur_gem\"] = t[\"duur_gem\"].round(1)\n    return t\n\n\ndef regels_tempo(reeksen: pd.DataFrame, wedstrijd: str, regels: list) -> None:\n    t = tempo_tabel(reeksen)\n    for hf in REEKS_FUNCTIES:\n        sub = t[t[\"hoofdfunctie\"] == hf]\n        if sub.empty:\n            continue\n        _regel(regels, wedstrijd, \"tempo\", kant=KANT[hf], hoofdfunctie=hf, a=int(sub[\"reeksen\"].sum()), b=int(len(reeksen)), score=float(sub[\"reeksen\"].sum()))\n\n\ndef verloop_tabel(reeksen: pd.DataFrame, kansen: pd.DataFrame, resultaten: dict) -> pd.DataFrame:\n    \"\"\"Per venster van VENSTER_MIN speelminuten per helft: tellingen en dreiging.\"\"\"\n    r = reeksen[reeksen[\"helft\"].notna()].copy()\n    r[\"dreiging\"] = m.reeks_dreiging(r, resultaten)\n    r[\"venster\"] = (r[\"start_min\"].astype(float) // VENSTER_MIN * VENSTER_MIN).astype(int)\n    k = schotmomenten(kansen)\n    k = k[k[\"helft\"].notna()].copy()\n    k[\"venster\"] = (k[\"start_min\"].astype(float) // VENSTER_MIN * VENSTER_MIN).astype(int)\n\n    rijen = []\n    for helft in sorted(r[\"helft\"].unique()):\n        rh = r[r[\"helft\"] == helft]\n        kh = k[k[\"helft\"] == helft]\n        laatste = int(max(rh[\"venster\"].max(), kh[\"venster\"].max() if not kh.empty else 0))\n        for v in range(0, laatste + VENSTER_MIN, VENSTER_MIN):\n            rv = rh[rh[\"venster\"] == v]\n            kv = kh[kh[\"venster\"] == v]\n            eigen = rv[rv[\"hoofdfunctie\"].isin(EIGEN_BEZIT)]\n            tegen = rv[~rv[\"hoofdfunctie\"].isin(EIGEN_BEZIT)]\n            rijen.append(\n                {\n                    \"helft\": int(helft),\n                    \"venster\": f\"{v}-{v + VENSTER_MIN}\",\n                    \"aanvallen\": int((rv[\"hoofdfunctie\"] == AANVALLEN).sum()),\n                    \"omschakelingen_va\": int((rv[\"hoofdfunctie\"] == OMSCHAKELEN_VA).sum()),\n                    \"omschakelingen_av\": int((rv[\"hoofdfunctie\"] == OMSCHAKELEN_AV).sum()),\n                    \"av_eindfase\": int(bereikt_f3(rv[rv[\"hoofdfunctie\"] == OMSCHAKELEN_AV]).sum()) if not rv.empty else 0,\n                    \"schoten_voor\": int((kv[\"kant\"] == \"eigen\").sum()),\n                    \"schoten_tegen\": int((kv[\"kant\"] == \"tegen\").sum()),\n                    \"dreiging_voor\": round(float(eigen[\"dreiging\"].sum()), 2),\n                    \"dreiging_tegen\": round(float(tegen[\"dreiging\"].sum()), 2),\n                }\n            )\n    return pd.DataFrame(rijen)\n\n\ndef regels_verloop(verloop: pd.DataFrame, wedstrijd: str, regels: list) -> None:\n    for _, v in verloop.iterrows():\n        _regel(\n            regels,\n            wedstrijd,\n            \"verloop\",\n            kant=\"beide\",\n            hoofdfunctie=None,\n            helft=int(v[\"helft\"]),\n            a=int(v[\"schoten_voor\"]),\n            b=int(v[\"schoten_voor\"] + v[\"schoten_tegen\"]),\n            score=abs(float(v[\"dreiging_voor\"] - v[\"dreiging_tegen\"])),\n            venster=v[\"venster\"],\n            dreiging_voor=float(v[\"dreiging_voor\"]),\n            dreiging_tegen=float(v[\"dreiging_tegen\"]),\n        )\n\n\ndef bouw_patronen(reeksen: pd.DataFrame, kansen: pd.DataFrame, resultaten: dict, wedstrijd: str) -> dict:\n    regels: list[dict] = []\n    regels_pad(reeksen, wedstrijd, regels)\n    regels_conditie(reeksen, wedstrijd, regels)\n    regels_herkomst(kansen, wedstrijd, regels)\n    regels_tempo(reeksen, wedstrijd, regels)\n    verloop = verloop_tabel(reeksen, kansen, resultaten)\n    regels_verloop(verloop, wedstrijd, regels)\n    return {\"regels\": pd.DataFrame(regels), \"verloop\": verloop, \"tempo\": tempo_tabel(reeksen)}\n\n\ndef top(regels: pd.DataFrame, type_: str, kant: str | None = None, n: int = 5, strikt: bool = False) -> pd.DataFrame:\n    \"\"\"Beste n regels van een type. kant filtert; strikt sluit regels voor 'beide' uit.\"\"\"\n    sub = regels[regels[\"type\"] == type_]\n    if kant is not None:\n        sub = sub[sub[\"kant\"] == kant] if strikt else sub[sub[\"kant\"].isin((kant, \"beide\"))]\n    return sub.sort_values(\"score\", ascending=False).head(n)\n", "myva_pipeline/analyse/resultaat.py": "\"\"\"Het resultaat van de analyse van een wedstrijd: alles wat weergave en uitvoer nodig hebben.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport pandas as pd\n\nfrom myva_pipeline.invoer.correcties import TOEGEPAST_KOLOMMEN\nfrom myva_pipeline.invoer.metadata import Wedstrijd\nfrom myva_pipeline.model.markov import MarkovResultaat\n\n\n@dataclass\nclass Analyse:\n    wedstrijd: Wedstrijd\n    instances: pd.DataFrame\n    reeksen: pd.DataFrame\n    kansen: pd.DataFrame\n    niet_gekoppeld: dict[str, pd.DataFrame]\n    markov: dict[str, MarkovResultaat]\n    regels: pd.DataFrame\n    verloop: pd.DataFrame\n    tempo: pd.DataFrame\n    correcties: pd.DataFrame = field(default_factory=lambda: pd.DataFrame(columns=TOEGEPAST_KOLOMMEN))\n    meldingen: list[str] = field(default_factory=list)\n", "myva_pipeline/analyse/seizoen.py": "\"\"\"Meerdere wedstrijden van een team gestapeld tot een seizoensbeeld.\n\nTellingen worden over alle wedstrijden opgeteld. Een vergelijking wordt pas een\nbevinding als het verschil in de opgetelde tellingen zeker genoeg is en in de\nmeeste losse wedstrijden dezelfde kant op wijst (steun). Zo telt \"3 van 4\" in\neen wedstrijd niet zwaarder dan \"20 van 40\" over alle wedstrijden.\n\nDeze module levert alleen tellingen. De zinnen erbij komen uit weergave.formulering.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass, field\nfrom typing import ClassVar\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import vergelijkingen as vg\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.analyse.statistiek import kans_groter\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, OMSCHAKELEN_AV, OMSCHAKELEN_VA, VERDEDIGEN\nfrom myva_pipeline.model.reeksen import schotmomenten\n\n# Een wedstrijd telt mee voor de steun als beide groepen daar minstens zoveel waarnemingen hebben.\nMIN_PER_WEDSTRIJD = 3\n\n\n@dataclass(frozen=True)\nclass Drempels:\n    \"\"\"Wanneer een verschil een bevinding wordt. Alle vier moeten gehaald worden.\"\"\"\n\n    zekerheid: float = 0.90  # kans dat het verschil in de opgetelde tellingen echt is\n    steun: float = 0.75  # aandeel van de telbare wedstrijden waarin het verschil dezelfde kant op wijst\n    wedstrijden: int = 3  # minimaal aantal telbare wedstrijden\n    groep: int = 20  # minimaal aantal waarnemingen per groep, opgeteld\n\n\nGEVOELIGHEID_ZEKERHEID = (0.80, 0.85, 0.90, 0.95, 0.975)\nGEVOELIGHEID_STEUN = (0.5, 0.75, 1.0)\n\nSITUATIES = [\"opbouw\", \"omschakeling\", \"corner\", \"vrije trap\", \"ingooi\", \"onbekend\"]\n\n# Zones op het schematische veld, in volgorde van eigen doel naar doel van de tegenstander.\nZONES = [\"opbouw\", \"links langs het blok\", \"rechts langs het blok\", \"door het blok\", \"achter het blok\", \"eindfase\"]\nMIN_AANVALSKANT = 20\nAANDEEL_AANVALSKANT = 0.65\nSTEUN_AANVALSKANT = 0.75\nMIN_WEDSTRIJDEN_AANVALSKANT = 3\n\n# Vergelijkingen waarvan de uitkomst in het fasemodel zit ingebakken. Een doeltrap begint het verst van\n# het doel en wie achter het blok is, is al bijna in de eindfase: het verschil zegt dan niets over het team.\n# Ze staan in de onderbouwing, maar worden geen bevinding. Daarvoor in de plaats staan de vergelijkingen\n# tussen de teams (doeltrap_teams, achter_blok_teams).\nINGEBAKKEN = {(\"doeltrap\", \"f3\"): \"een doeltrap begint het verst van het doel\", (\"route\", \"f3\"): \"wie achter het blok is, is al dicht bij de eindfase\"}\n\n# Vergelijkingen over hetzelfde onderwerp leveren samen hoogstens een bevinding.\nFAMILIE = {\"helft_schoten\": \"helft\", \"beginfase_schoten\": \"periode\", \"slotfase_schoten\": \"periode\"}\n\n\n@dataclass(frozen=True)\nclass WedstrijdTelling:\n    \"\"\"De twee groepen van een vergelijking in een wedstrijd: a1 van b1 tegenover a2 van b2.\"\"\"\n\n    wedstrijd: str\n    titel: str\n    a1: int\n    b1: int\n    a2: int\n    b2: int\n    telt: bool  # beide groepen zijn groot genoeg om te vergelijken\n    zelfde: bool  # het verschil wijst dezelfde kant op als in de opgetelde tellingen\n\n\n@dataclass(frozen=True, eq=False)\nclass Verschil:\n    \"\"\"Een vergelijking die de drempels haalt.\"\"\"\n\n    soort: ClassVar[str] = \"vergelijking\"\n    vergelijking: str\n    kant: str\n    uitkomst_code: str\n    a1: int\n    b1: int\n    a2: int\n    b2: int\n    richting: int  # 1 als groep A hoger ligt, -1 als groep B hoger ligt\n    zekerheid: float\n    steun: int\n    telbaar: int\n    per_wedstrijd: tuple[WedstrijdTelling, ...]\n\n\n@dataclass(frozen=True, eq=False)\nclass SchotenHerkomst:\n    \"\"\"Uit welke spelsituatie de meeste schoten tegen en voor komen. Staat er altijd in.\"\"\"\n\n    soort: ClassVar[str] = \"herkomst\"\n    tabel: pd.DataFrame\n    top_tegen: str\n    top_voor: str\n    steun: int\n    telbaar: int\n\n\n@dataclass(frozen=True, eq=False)\nclass BalverliesZone:\n    \"\"\"De zone waar balverlies in een aanval het vaakst een schot tegen wordt.\"\"\"\n\n    soort: ClassVar[str] = \"balverlies\"\n    zones: pd.DataFrame\n    top: str\n    omschakeling: dict[str, int]\n    gekoppeld: int\n    totaal: int\n    wedstrijden: int\n\n\n@dataclass(frozen=True, eq=False)\nclass Aanvalskant:\n    \"\"\"De kant waarover het eigen team duidelijk het vaakst aanvalt.\"\"\"\n\n    soort: ClassVar[str] = \"aanvalskant\"\n    kant: str\n    ander: str\n    links: int\n    rechts: int\n    tabel: pd.DataFrame\n    steun: int\n    telbaar: int\n\n\nBevinding = Verschil | SchotenHerkomst | BalverliesZone | Aanvalskant\n\n\n@dataclass\nclass Seizoen:\n    team: str\n    analyses: list[Analyse]\n    reeksen: pd.DataFrame\n    kansen: pd.DataFrame\n    wedstrijden: pd.DataFrame\n    herkomst: pd.DataFrame\n    vergelijkingen: pd.DataFrame\n    bevindingen: list[Bevinding]\n    verwant: list[Verschil]  # halen de drempels ook, maar gaan over hetzelfde onderwerp als een bevinding\n    drempels: Drempels = field(default_factory=Drempels)\n    gevoeligheid: pd.DataFrame = field(default_factory=pd.DataFrame)\n    balverlies: pd.DataFrame = field(default_factory=pd.DataFrame)\n\n    @property\n    def naam(self) -> str:\n        eerste, laatste = self.wedstrijden[\"datum\"].iloc[0], self.wedstrijden[\"datum\"].iloc[-1]\n        return f\"{self.team.replace(' ', '-')}_seizoen_{eerste}_tot_{laatste}\"\n\n\ndef situatie(herkomst: str) -> str:\n    \"\"\"Spelsituatie van een kans, ongeacht welk team de spelhervatting nam.\"\"\"\n    if herkomst in (AANVALLEN, VERDEDIGEN):\n        return \"opbouw\"\n    if herkomst in (OMSCHAKELEN_AV, OMSCHAKELEN_VA):\n        return \"omschakeling\"\n    if herkomst.startswith(\"spelhervatting:\"):\n        soort = herkomst.split(\":\", 1)[1].split()[0].lower()\n        return {\"vrijetrap\": \"vrije trap\"}.get(soort, soort)\n    return \"onbekend\"\n\n\ndef _richting(t: dict) -> int:\n    if not t[\"b1\"] or not t[\"b2\"]:\n        return 0\n    verschil = t[\"a1\"] / t[\"b1\"] - t[\"a2\"] / t[\"b2\"]\n    return (verschil > 0) - (verschil < 0)\n\n\ndef vergelijkingen_tabel(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Een rij per vergelijking: opgetelde tellingen, zekerheid, en de tellingen per wedstrijd.\"\"\"\n    per_wedstrijd = [vg.tellingen(a) for a in analyses]\n    totaal = vg.opgeteld(per_wedstrijd)\n\n    rijen = []\n    for sleutel, t in totaal.items():\n        richting = _richting(t)\n        details, steun, telbaar = [], 0, 0\n        for a, d in zip(analyses, per_wedstrijd):\n            w = d.get(sleutel, vg.telling(0, 0, 0, 0))\n            telt = min(w[\"b1\"], w[\"b2\"]) >= MIN_PER_WEDSTRIJD\n            zelfde = telt and richting != 0 and _richting(w) == richting\n            telbaar += int(telt)\n            steun += int(zelfde)\n            details.append({**w, \"wedstrijd\": a.wedstrijd.naam, \"titel\": a.wedstrijd.titel, \"telt\": telt, \"zelfde\": zelfde})\n        kans = kans_groter(t[\"a1\"], t[\"b1\"], t[\"a2\"], t[\"b2\"])\n        rijen.append(\n            {\n                \"vergelijking\": sleutel[0], \"kant\": sleutel[1], \"uitkomst_code\": sleutel[2], \"hoofdfunctie\": sleutel[3],\n                **t,\n                \"zekerheid\": float(\"nan\") if math.isnan(kans) else max(kans, 1 - kans),\n                \"richting\": richting, \"steun\": steun, \"telbaar\": telbaar, \"per_wedstrijd\": details,\n            }\n        )\n    return pd.DataFrame(rijen).sort_values(\"zekerheid\", ascending=False).reset_index(drop=True)\n\n\ndef _voldoet(v: pd.Series, d: Drempels) -> bool:\n    if (v[\"vergelijking\"], v[\"uitkomst_code\"]) in INGEBAKKEN:\n        return False\n    if pd.isna(v[\"zekerheid\"]) or v[\"zekerheid\"] < d.zekerheid or v[\"richting\"] == 0:\n        return False\n    if min(v[\"b1\"], v[\"b2\"]) < d.groep or v[\"telbaar\"] < max(d.wedstrijden, 1):\n        return False\n    return v[\"steun\"] / v[\"telbaar\"] >= d.steun\n\n\ndef _familie(v: pd.Series) -> str:\n    \"\"\"Vergelijkingen over hetzelfde onderwerp; de sterkste wordt de bevinding, de rest staat eronder.\"\"\"\n    if v[\"vergelijking\"] in FAMILIE:\n        return FAMILIE[v[\"vergelijking\"]] + \":beide\"\n    return f\"{v['vergelijking']}:{v['kant']}\"\n\n\ndef _verschil(v: pd.Series) -> Verschil:\n    return Verschil(\n        vergelijking=v[\"vergelijking\"], kant=v[\"kant\"], uitkomst_code=v[\"uitkomst_code\"],\n        a1=int(v[\"a1\"]), b1=int(v[\"b1\"]), a2=int(v[\"a2\"]), b2=int(v[\"b2\"]),\n        richting=int(v[\"richting\"]), zekerheid=float(v[\"zekerheid\"]),\n        steun=int(v[\"steun\"]), telbaar=int(v[\"telbaar\"]),\n        per_wedstrijd=tuple(WedstrijdTelling(**w) for w in v[\"per_wedstrijd\"]),\n    )\n\n\ndef selecteer(verg: pd.DataFrame, d: Drempels) -> tuple[list[Verschil], list[Verschil]]:\n    \"\"\"(bevindingen, verwante verschillen die dezelfde bevinding ondersteunen). Geen maximum.\"\"\"\n    bevindingen, verwant, gezien = [], [], set()\n    for _, v in verg.iterrows():\n        if not _voldoet(v, d):\n            continue\n        doel = verwant if _familie(v) in gezien else bevindingen\n        gezien.add(_familie(v))\n        doel.append(_verschil(v))\n    return bevindingen, verwant\n\n\ndef gevoeligheid_tabel(verg: pd.DataFrame, d: Drempels) -> pd.DataFrame:\n    \"\"\"Aantal bevindingen bij andere drempels voor zekerheid (rijen) en steun (kolommen).\"\"\"\n    rijen = {}\n    for z in GEVOELIGHEID_ZEKERHEID:\n        rijen[f\"{100 * z:g}%\"] = {\n            f\"{100 * st:g}%\": len(selecteer(verg, Drempels(zekerheid=z, steun=st, wedstrijden=d.wedstrijden, groep=d.groep))[0])\n            for st in GEVOELIGHEID_STEUN\n        }\n    return pd.DataFrame.from_dict(rijen, orient=\"index\")\n\n\ndef herkomst_tabel(kansen: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Schoten en goals per spelsituatie, voor en tegen. Goals zitten in de schoten.\"\"\"\n    sm = schotmomenten(kansen).copy()\n    sm[\"situatie\"] = sm[\"herkomst\"].map(situatie)\n    rijen = []\n    for s in SITUATIES:\n        sub = sm[sm[\"situatie\"] == s]\n        e, t = sub[sub[\"kant\"] == \"eigen\"], sub[sub[\"kant\"] == \"tegen\"]\n        rijen.append({\"situatie\": s, \"schoten_voor\": len(e), \"goals_voor\": int(e[\"is_goal\"].sum()), \"schoten_tegen\": len(t), \"goals_tegen\": int(t[\"is_goal\"].sum())})\n    t = pd.DataFrame(rijen).set_index(\"situatie\")\n    return t[(t[\"schoten_voor\"] + t[\"schoten_tegen\"]) > 0]\n\n\ndef bevinding_herkomst(herkomst: pd.DataFrame, per_wedstrijd: list[pd.DataFrame]) -> SchotenHerkomst:\n    top_tegen = herkomst[\"schoten_tegen\"].idxmax()\n    steun = sum(1 for h in per_wedstrijd if h[\"schoten_tegen\"].sum() and h[\"schoten_tegen\"].idxmax() == top_tegen)\n    return SchotenHerkomst(tabel=herkomst, top_tegen=top_tegen, top_voor=herkomst[\"schoten_voor\"].idxmax(), steun=steun, telbaar=len(per_wedstrijd))\n\n\ndef balverlies_per_zone(bv: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Balverlies in de opgebouwde aanval per zone: aantal, en hoe vaak de tegenstander daarna de eindfase of een schot haalde.\"\"\"\n    sub = bv[bv[\"soort\"] == \"opbouw\"]\n    t = sub.groupby(\"zone\").agg(balverlies=(\"zone\", \"size\"), eindfase_tegen=(\"av_eindfase\", \"sum\"), schot_tegen=(\"av_schot\", \"sum\"), goal_tegen=(\"av_goal\", \"sum\"))\n    return t.reindex(ZONES + [\"geen fase\"]).fillna(0).astype(int)\n\n\ndef bevinding_balverlies(bv: pd.DataFrame, minimum: int = MIN_AANVALSKANT) -> BalverliesZone | None:\n    \"\"\"Alleen bij minstens `minimum` keer balverlies in een aanval.\"\"\"\n    if bv.empty:\n        return None\n    z = balverlies_per_zone(bv)\n    z = z[z.index != \"geen fase\"]\n    if int(z[\"balverlies\"].sum()) < max(minimum, 1):\n        return None\n    oms = bv[bv[\"soort\"] == \"omschakeling\"]\n    return BalverliesZone(\n        zones=z,\n        top=z.sort_values([\"schot_tegen\", \"balverlies\"], ascending=False).index[0],\n        omschakeling={\"balverlies\": len(oms), \"eindfase_tegen\": int(oms[\"av_eindfase\"].sum()), \"schot_tegen\": int(oms[\"av_schot\"].sum())},\n        gekoppeld=int(bv[\"gekoppeld\"].sum()), totaal=len(bv), wedstrijden=int(bv[\"wedstrijd\"].nunique()),\n    )\n\n\ndef aanvalskant_tabel(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Per wedstrijd hoe vaak het eigen team links en rechts langs het blok kwam en voorzetten gaf.\"\"\"\n    rijen = []\n    for a in analyses:\n        df, k = a.instances, a.kansen[a.kansen[\"kant\"] == \"eigen\"]\n        rijen.append(\n            {\n                \"wedstrijd\": a.wedstrijd.naam, \"titel\": a.wedstrijd.titel,\n                \"langs_links\": int(((df[\"hoofdfunctie\"] == AANVALLEN) & (df[\"fase\"] == \"F1C-L\")).sum()),\n                \"langs_rechts\": int(((df[\"hoofdfunctie\"] == AANVALLEN) & (df[\"fase\"] == \"F1C-R\")).sum()),\n                \"voorzet_links\": int((k[\"soort\"] == \"voorzet_links\").sum()),\n                \"voorzet_rechts\": int((k[\"soort\"] == \"voorzet_rechts\").sum()),\n            }\n        )\n    return pd.DataFrame(rijen)\n\n\ndef aanvalskant(t: pd.DataFrame) -> Aanvalskant:\n    \"\"\"De telling links tegenover rechts, zonder drempel.\"\"\"\n    links = int(t[\"langs_links\"].sum() + t[\"voorzet_links\"].sum())\n    rechts = int(t[\"langs_rechts\"].sum() + t[\"voorzet_rechts\"].sum())\n    kant, ander = (\"rechts\", \"links\") if rechts >= links else (\"links\", \"rechts\")\n    per = [(int(r[\"langs_links\"] + r[\"voorzet_links\"]), int(r[\"langs_rechts\"] + r[\"voorzet_rechts\"])) for _, r in t.iterrows()]\n    telbaar = [x for x in per if sum(x) >= MIN_PER_WEDSTRIJD]\n    steun = sum(1 for li, re_ in telbaar if (re_ > li) == (kant == \"rechts\") and li != re_)\n    return Aanvalskant(kant=kant, ander=ander, links=links, rechts=rechts, tabel=t, steun=steun, telbaar=len(telbaar))\n\n\ndef bevinding_aanvalskant(t: pd.DataFrame) -> Aanvalskant | None:\n    \"\"\"Alleen een bevinding als een kant duidelijk overheerst, ook in de meeste losse wedstrijden.\"\"\"\n    b = aanvalskant(t)\n    totaal = b.links + b.rechts\n    if totaal < MIN_AANVALSKANT or max(b.links, b.rechts) / totaal < AANDEEL_AANVALSKANT:\n        return None\n    if b.telbaar < MIN_WEDSTRIJDEN_AANVALSKANT or b.steun / b.telbaar < STEUN_AANVALSKANT:\n        return None\n    return b\n\n\ndef wedstrijden_tabel(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Een rij per wedstrijd met de uitslag en de belangrijkste tellingen.\"\"\"\n    rijen = []\n    for a in analyses:\n        w, r = a.wedstrijd, a.reeksen\n        sm = schotmomenten(a.kansen)\n        f3 = r[\"pad\"].apply(lambda pad: \"F3\" in pad).astype(bool)\n        eigen = r[\"hoofdfunctie\"].isin(EIGEN_BEZIT)\n        rijen.append(\n            {\n                \"wedstrijd\": w.naam, \"datum\": w.datum, \"titel\": w.titel, \"team\": w.team, \"tegenstander\": w.tegenstander, \"thuis\": w.thuis, \"uitslag\": w.uitslag,\n                \"goals_voor\": int(((sm[\"kant\"] == \"eigen\") & sm[\"is_goal\"]).sum()), \"goals_tegen\": int(((sm[\"kant\"] == \"tegen\") & sm[\"is_goal\"]).sum()),\n                \"schoten_voor\": int((sm[\"kant\"] == \"eigen\").sum()), \"schoten_tegen\": int((sm[\"kant\"] == \"tegen\").sum()),\n                \"eindfase_voor\": int((f3 & eigen).sum()), \"eindfase_tegen\": int((f3 & ~eigen).sum()),\n                \"reeksen\": len(r), \"meldingen\": len(a.meldingen),\n            }\n        )\n    return pd.DataFrame(rijen)\n\n\ndef bouw(analyses: list[Analyse], drempels: Drempels | None = None) -> Seizoen:\n    \"\"\"Stapelt de analyses van een team. Verwacht minstens een analyse.\"\"\"\n    drempels = drempels or Drempels()\n    if not analyses:\n        raise ValueError(\"Geen wedstrijden om te stapelen\")\n    analyses = sorted(analyses, key=lambda a: (a.wedstrijd.datum, a.wedstrijd.naam))\n    teams = {a.wedstrijd.team for a in analyses}\n    if len(teams) != 1:\n        raise ValueError(f\"Stapelen kan alleen voor een team; gevonden: {sorted(teams)}\")\n    dubbel = pd.Series([a.wedstrijd.naam for a in analyses])\n    if dubbel.duplicated().any():\n        raise ValueError(f\"Dezelfde wedstrijd staat meer dan een keer in de map: {sorted(dubbel[dubbel.duplicated()])}\")\n\n    reeksen = pd.concat([a.reeksen.assign(reeks_id=a.wedstrijd.naam + \":\" + a.reeksen[\"reeks_id\"]) for a in analyses], ignore_index=True)\n    kansen = pd.concat([a.kansen for a in analyses], ignore_index=True)\n    herkomst = herkomst_tabel(kansen)\n    verg = vergelijkingen_tabel(analyses)\n\n    verschillen, verwant = selecteer(verg, drempels)\n    balverlies = vg.balverlies_tabel(analyses)\n    vaste_tellingen = [bevinding_herkomst(herkomst, [herkomst_tabel(a.kansen) for a in analyses]), bevinding_balverlies(balverlies)]\n    aanvalskant = bevinding_aanvalskant(aanvalskant_tabel(analyses))\n    bevindingen = [b for b in vaste_tellingen if b] + verschillen + ([aanvalskant] if aanvalskant else [])\n\n    return Seizoen(\n        team=teams.pop(), analyses=analyses, reeksen=reeksen, kansen=kansen,\n        wedstrijden=wedstrijden_tabel(analyses), herkomst=herkomst, vergelijkingen=verg,\n        bevindingen=bevindingen, verwant=verwant, drempels=drempels, gevoeligheid=gevoeligheid_tabel(verg, drempels),\n        balverlies=balverlies,\n    )\n", "myva_pipeline/analyse/statistiek.py": "\"\"\"Beta-Binomiaal voor ratio's: hoe zeker is \"a van b\", en is de ene ratio echt groter dan de andere.\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nfrom scipy import stats\n\nMC_STEEKPROEF = 20000\nINTERVAL = 0.90\n\n\ndef beta_interval(a: int, b: int, niveau: float = INTERVAL) -> tuple[float, float]:\n    \"\"\"Geloofwaardigheidsinterval van de ratio a van b, posterior Beta(a+1, b-a+1).\"\"\"\n    if b == 0:\n        return (float(\"nan\"), float(\"nan\"))\n    onder = (1 - niveau) / 2\n    d = stats.beta(a + 1, b - a + 1)\n    return (float(d.ppf(onder)), float(d.ppf(1 - onder)))\n\n\ndef kans_groter(a1: int, b1: int, a2: int, b2: int, seed: int = 0) -> float:\n    \"\"\"Kans dat ratio 1 groter is dan ratio 2, via steekproef uit beide posteriors.\"\"\"\n    if b1 == 0 or b2 == 0:\n        return float(\"nan\")\n    rng = np.random.default_rng(seed)\n    s1 = rng.beta(a1 + 1, b1 - a1 + 1, MC_STEEKPROEF)\n    s2 = rng.beta(a2 + 1, b2 - a2 + 1, MC_STEEKPROEF)\n    return float((s1 > s2).mean())\n", "myva_pipeline/analyse/vergelijkingen.py": "\"\"\"Alle vergelijkingen van een wedstrijd als tellingen: a1 van b1 tegenover a2 van b2.\n\nElke telling is optelbaar, dus het beeld over meerdere wedstrijden is de som van\nde wedstrijden. De sleutel is (vergelijking, kant, uitkomst, teamfunctie); de\neerste drie kiezen het sjabloon in teksten.py. Alleen wat in elke wedstrijd op\ndezelfde manier gecodeerd is doet mee: fases en druk bij Aanvallen en Verdedigen,\nde Eindfase van omschakelingen, kansen, spelhervattingen en de labels BV, BW en LB.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import patronen as pt\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, OMSCHAKELEN_AV, OMSCHAKELEN_VA, VERDEDIGEN\nfrom myva_pipeline.model import markov as m\nfrom myva_pipeline.model.reeksen import schotmomenten\n\nSleutel = tuple[str, str, str, str]\n\n# De omschakeling van de tegenstander wordt aangeklikt terwijl onze reeks nog loopt:\n# in de coderingen begint hij vrijwel altijd 4 tot 6 seconden voor het einde daarvan.\nKOPPEL_VOOR_S = 7.0\nKOPPEL_NA_S = 2.5\n# Een schot hoort bij een spelhervatting als het binnen deze marge rond de instance begint.\nSPELHERVATTING_MARGE_S = 3.0\nKWARTIER_MIN = 15\nSLOTFASE_VANAF_MIN = 30\n\nZONE_VAN_FASE = {\n    \"F0\": \"opbouw\", \"F1A\": \"opbouw\", \"F1B\": \"opbouw\",\n    \"F1C-L\": \"links langs het blok\", \"F1C-R\": \"rechts langs het blok\",\n    \"F2A\": \"door het blok\", \"F2B\": \"door het blok\", \"F2C\": \"achter het blok\", \"F3\": \"eindfase\",\n}\nSPELHERVATTINGEN = {\"corner\": \"Corner\", \"vrije_trap\": \"Vrijetrap\", \"ingooi\": \"Ingooi\"}\n\n\ndef telling(a1, b1, a2, b2) -> dict:\n    return {\"a1\": int(a1), \"b1\": int(b1), \"a2\": int(a2), \"b2\": int(b2)}\n\n\ndef _heeft(reeksen: pd.DataFrame, fase: str) -> pd.Series:\n    return reeksen[\"pad\"].apply(lambda pad: fase in pad).astype(bool)\n\n\ndef _schot(reeksen: pd.DataFrame) -> pd.Series:\n    return reeksen[\"eind\"].isin(m.SCHOT_EINDEN)\n\n\ndef _f3(reeksen: pd.DataFrame) -> pd.Series:\n    return pt.bereikt_f3(reeksen)\n\n\ndef _verlies(reeksen: pd.DataFrame) -> pd.Series:\n    \"\"\"Balverlies voor het team dat de bal heeft: BV bij ons, BW bij de tegenstander.\"\"\"\n    return pd.Series([e == m.verlies_eind(hf) for e, hf in zip(reeksen[\"eind\"], reeksen[\"hoofdfunctie\"])], index=reeksen.index, dtype=bool)\n\n\nUITKOMST = {\"schot\": _schot, \"f3\": _f3, \"verlies\": _verlies}\n\n\ndef _paar(groep_a: pd.DataFrame, groep_b: pd.DataFrame, uitkomst: str) -> dict:\n    fn = UITKOMST[uitkomst]\n    return telling(fn(groep_a).sum(), len(groep_a), fn(groep_b).sum(), len(groep_b))\n\n\ndef balverlies_tabel(analyses: list) -> pd.DataFrame:\n    \"\"\"Een rij per eigen reeks die in balverlies eindigde, met wat de tegenstander daarna deed.\n\n    De omschakeling van de tegenstander hoort bij het balverlies als hij begint\n    tussen KOPPEL_VOOR_S voor en KOPPEL_NA_S na het einde van onze reeks.\n    \"\"\"\n    rijen = []\n    for a in analyses:\n        r = a.reeksen\n        av = r[r[\"hoofdfunctie\"] == OMSCHAKELEN_AV]\n        for _, x in r[r[\"hoofdfunctie\"].isin(EIGEN_BEZIT) & (r[\"eind\"] == \"BV\")].iterrows():\n            gat = av[\"start\"] - x[\"end\"]\n            binnen = av[(gat >= -KOPPEL_VOOR_S) & (gat <= KOPPEL_NA_S)]\n            v = binnen.loc[(binnen[\"start\"] - x[\"end\"]).abs().idxmin()] if len(binnen) else None\n            rijen.append(\n                {\n                    \"wedstrijd\": a.wedstrijd.naam, \"titel\": a.wedstrijd.titel, \"reeks_id\": x[\"reeks_id\"],\n                    \"soort\": \"opbouw\" if x[\"hoofdfunctie\"] == AANVALLEN else \"omschakeling\",\n                    \"zone\": ZONE_VAN_FASE.get(x[\"pad\"][-1], \"geen fase\") if x[\"pad\"] else \"geen fase\",\n                    \"helft\": x[\"helft\"], \"start_min\": x[\"start_min\"], \"videotijd\": float(x[\"end\"]),\n                    \"lange_bal\": bool(x[\"lange_bal\"]),\n                    \"gekoppeld\": v is not None,\n                    \"av_eindfase\": bool(v is not None and (\"F3\" in v[\"pad\"] or v[\"eindfase_vervolg\"])),\n                    \"av_schot\": bool(v is not None and v[\"eind\"] in m.SCHOT_EINDEN),\n                    \"av_goal\": bool(v is not None and v[\"eind\"] == \"goal\"),\n                }\n            )\n    kolommen = [\"wedstrijd\", \"titel\", \"reeks_id\", \"soort\", \"zone\", \"helft\", \"start_min\", \"videotijd\", \"lange_bal\", \"gekoppeld\", \"av_eindfase\", \"av_schot\", \"av_goal\"]\n    return pd.DataFrame(rijen, columns=kolommen)\n\n\ndef _basis(a: Analyse) -> dict[Sleutel, dict]:\n    regels: list = []\n    pt.regels_conditie(a.reeksen, a.wedstrijd.naam, regels)\n    return {(r[\"vergelijking\"], r[\"kant\"], r[\"uitkomst_code\"], r[\"hoofdfunctie\"]): telling(r[\"a\"], r[\"b\"], r[\"a2\"], r[\"b2\"]) for r in regels}\n\n\ndef _aandeel_schoten(sm: pd.DataFrame, in_a: pd.Series) -> dict:\n    eigen = sm[\"kant\"] == \"eigen\"\n    return telling((eigen & in_a).sum(), in_a.sum(), (eigen & ~in_a).sum(), (~in_a).sum())\n\n\ndef _schoten(a: Analyse) -> dict[Sleutel, dict]:\n    sm = schotmomenten(a.kansen)\n    sm = sm[sm[\"helft\"].notna()]\n    minuut = sm[\"start_min\"].astype(float)\n    eerste_kwartier = (sm[\"helft\"] == 1) & (minuut < KWARTIER_MIN)\n    laatste_kwartier = (sm[\"helft\"] == 2) & (minuut >= SLOTFASE_VANAF_MIN)\n    return {\n        (\"helft_schoten\", \"beide\", \"aandeel\", \"kansen\"): _aandeel_schoten(sm, sm[\"helft\"] == 1),\n        (\"beginfase_schoten\", \"beide\", \"aandeel\", \"kansen\"): _aandeel_schoten(sm, eerste_kwartier),\n        (\"slotfase_schoten\", \"beide\", \"aandeel\", \"kansen\"): _aandeel_schoten(sm, ~laatste_kwartier),\n    }\n\n\ndef _opbouw(A: pd.DataFrame, V: pd.DataFrame) -> dict[Sleutel, dict]:\n    uit: dict[Sleutel, dict] = {}\n    a_dt, v_dt = A[_heeft(A, \"F0\")], V[_heeft(V, \"F0\")]\n    uit[(\"doeltrap_teams\", \"beide\", \"f3\", \"aanvallen|verdedigen\")] = _paar(a_dt, v_dt, \"f3\")\n    uit[(\"doeltrap_teams\", \"beide\", \"verlies\", \"aanvallen|verdedigen\")] = _paar(a_dt, v_dt, \"verlies\")\n    uit[(\"achter_blok_teams\", \"beide\", \"f2c\", \"aanvallen|verdedigen\")] = telling(_heeft(A, \"F2C\").sum(), len(A), _heeft(V, \"F2C\").sum(), len(V))\n\n    for kant, hf, df in ((\"eigen\", AANVALLEN, A), (\"tegen\", VERDEDIGEN, V)):\n        hoog, laag = df[df[\"drukhoogte\"] == \"hoog\"], df[df[\"drukhoogte\"] == \"laag\"]\n        uit[(\"druk\", kant, \"schot\", hf)] = _paar(hoog, laag, \"schot\")\n        lb = df[\"lange_bal\"].astype(bool)\n        uit[(\"lange_bal\", kant, \"schot\", hf)] = _paar(df[lb], df[~lb], \"schot\")\n        met_keeper = _heeft(df, \"F1A\")\n        zonder_keeper = _heeft(df, \"F1B\") & ~met_keeper\n        for uitkomst in (\"f3\", \"verlies\"):\n            uit[(\"keeper\", kant, uitkomst, hf)] = _paar(df[met_keeper], df[zonder_keeper], uitkomst)\n\n    # Links en rechts zijn alleen voor ons eigen team eenduidig.\n    links, rechts = A[_heeft(A, \"F1C-L\")], A[_heeft(A, \"F1C-R\")]\n    for uitkomst in (\"f3\", \"schot\", \"verlies\"):\n        uit[(\"flank\", \"eigen\", uitkomst, AANVALLEN)] = _paar(links, rechts, uitkomst)\n    return uit\n\n\ndef _druk_zetten(A: pd.DataFrame, V: pd.DataFrame) -> dict[Sleutel, dict]:\n    \"\"\"Hoe vaak er hoog druk wordt gezet, van de aanvallen waarbij de drukhoogte gecodeerd is.\"\"\"\n    a_druk, v_druk = A[A[\"drukhoogte\"].notna()], V[V[\"drukhoogte\"].notna()]\n    v1, v2 = v_druk[v_druk[\"helft\"] == 1], v_druk[v_druk[\"helft\"] == 2]\n    hoog = lambda df: int((df[\"drukhoogte\"] == \"hoog\").sum())\n    return {\n        (\"teams_druk\", \"beide\", \"hoog\", \"verdedigen|aanvallen\"): telling(hoog(v_druk), len(v_druk), hoog(a_druk), len(a_druk)),\n        (\"helft_druk\", \"eigen\", \"hoog\", VERDEDIGEN): telling(hoog(v1), len(v1), hoog(v2), len(v2)),\n    }\n\n\ndef _helften(V: pd.DataFrame, VA: pd.DataFrame, AV: pd.DataFrame) -> dict[Sleutel, dict]:\n    helft = lambda df, h: df[df[\"helft\"] == h]\n    return {\n        (\"helft\", \"tegen\", \"f3\", VERDEDIGEN): _paar(helft(V, 1), helft(V, 2), \"f3\"),\n        (\"helft\", \"tegen\", \"verlies\", VERDEDIGEN): _paar(helft(V, 1), helft(V, 2), \"verlies\"),\n        (\"helft_omschakeling\", \"eigen\", \"f3\", OMSCHAKELEN_VA): _paar(helft(VA, 1), helft(VA, 2), \"f3\"),\n        (\"helft_omschakeling\", \"tegen\", \"f3\", OMSCHAKELEN_AV): _paar(helft(AV, 1), helft(AV, 2), \"f3\"),\n    }\n\n\ndef _spelhervattingen(a: Analyse) -> dict[Sleutel, dict]:\n    \"\"\"Per soort spelhervatting: hoeveel er een schot opleverden, voor ons en voor de tegenstander.\"\"\"\n    sm = schotmomenten(a.kansen)\n    uit = {}\n    for naam, code in SPELHERVATTINGEN.items():\n        paar = []\n        for richting, kant in ((\"aanvallend\", \"eigen\"), (\"verdedigend\", \"tegen\")):\n            volledige_code = f\"{code} {richting}\"\n            momenten = a.instances[a.instances[\"code\"] == volledige_code]\n            schoten = sm[(sm[\"kant\"] == kant) & (sm[\"herkomst\"] == f\"spelhervatting:{volledige_code}\")][\"start\"]\n            raak = sum(bool(((schoten >= s - SPELHERVATTING_MARGE_S) & (schoten <= e + SPELHERVATTING_MARGE_S)).any()) for s, e in zip(momenten[\"start\"], momenten[\"end\"]))\n            paar += [raak, len(momenten)]\n        uit[(naam, \"beide\", \"schot\", \"spelhervatting\")] = telling(*paar)\n    return uit\n\n\ndef _stand(a: Analyse, A: pd.DataFrame, AV: pd.DataFrame) -> dict[Sleutel, dict]:\n    \"\"\"Bij een achterstand tegenover een gelijke stand of voorsprong, op het moment dat de reeks begint.\"\"\"\n    goals = schotmomenten(a.kansen)\n    goals = goals[goals[\"is_goal\"]]\n    voor, tegen = goals[goals[\"kant\"] == \"eigen\"][\"start\"], goals[goals[\"kant\"] == \"tegen\"][\"start\"]\n    achter = lambda df: df[\"start\"].apply(lambda t: int((voor < t).sum()) < int((tegen < t).sum())).astype(bool)\n    a_achter, av_achter = achter(A), achter(AV)\n    return {\n        (\"stand\", \"eigen\", \"f3\", AANVALLEN): _paar(A[a_achter], A[~a_achter], \"f3\"),\n        (\"stand\", \"eigen\", \"verlies\", AANVALLEN): _paar(A[a_achter], A[~a_achter], \"verlies\"),\n        (\"stand\", \"tegen\", \"schot\", OMSCHAKELEN_AV): _paar(AV[av_achter], AV[~av_achter], \"schot\"),\n    }\n\n\ndef _balverlies(a: Analyse) -> dict[Sleutel, dict]:\n    bv = balverlies_tabel([a])\n    bv = bv[(bv[\"soort\"] == \"opbouw\") & (bv[\"zone\"] != \"geen fase\")]\n    eigen_opbouw = bv[\"zone\"] == \"opbouw\"\n    return {\n        (\"balverlies_zone\", \"eigen\", \"afgestraft\", AANVALLEN): telling(\n            bv[eigen_opbouw][\"av_schot\"].sum(), eigen_opbouw.sum(), bv[~eigen_opbouw][\"av_schot\"].sum(), (~eigen_opbouw).sum()\n        )\n    }\n\n\ndef _voorzetten(a: Analyse) -> dict[Sleutel, dict]:\n    eind = a.reeksen.set_index(\"reeks_id\")[\"eind\"]\n    k = a.kansen[(a.kansen[\"kant\"] == \"eigen\") & a.kansen[\"soort\"].str.startswith(\"voorzet\") & a.kansen[\"reeks_id\"].notna()]\n    met_schot = k[\"reeks_id\"].map(eind).isin(m.SCHOT_EINDEN)\n    vroeg, laat = k[\"voorzet_type\"] == \"Vroege voorzet\", k[\"voorzet_type\"] == \"Late voorzet\"\n    return {(\"voorzet_type\", \"eigen\", \"schot\", AANVALLEN): telling((met_schot & vroeg).sum(), vroeg.sum(), (met_schot & laat).sum(), laat.sum())}\n\n\ndef tellingen(a: Analyse) -> dict[Sleutel, dict]:\n    \"\"\"Alle vergelijkingen van een wedstrijd.\"\"\"\n    r = a.reeksen\n    A, V = r[r[\"hoofdfunctie\"] == AANVALLEN], r[r[\"hoofdfunctie\"] == VERDEDIGEN]\n    VA, AV = r[r[\"hoofdfunctie\"] == OMSCHAKELEN_VA], r[r[\"hoofdfunctie\"] == OMSCHAKELEN_AV]\n    uit = _basis(a)\n    # Direct weer balverlies na balverovering, tegenover de tegenstander na ons balverlies.\n    uit[(\"teams_omschakeling\", \"beide\", \"verlies\", \"omschakelen_va|omschakelen_av\")] = _paar(VA, AV, \"verlies\")\n    for groep in (_schoten(a), _opbouw(A, V), _druk_zetten(A, V), _helften(V, VA, AV), _spelhervattingen(a), _stand(a, A, AV), _balverlies(a), _voorzetten(a)):\n        uit.update(groep)\n    return uit\n\n\ndef opgeteld(per_wedstrijd: list[dict[Sleutel, dict]]) -> dict[Sleutel, dict]:\n    totaal: dict[Sleutel, dict] = {}\n    for d in per_wedstrijd:\n        for sleutel, t in d.items():\n            som = totaal.setdefault(sleutel, telling(0, 0, 0, 0))\n            for k in som:\n                som[k] += t[k]\n    return totaal\n", "myva_pipeline/analyse/wedstrijdbeeld.py": "\"\"\"Tellingen die het dashboard naast elkaar zet: per kwartier, de vaste wedstrijdkaart, en een wedstrijd tegenover een reeks andere.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import patronen as pt\nfrom myva_pipeline.analyse import vergelijkingen as vg\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.domein import AANVALLEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA, VERDEDIGEN\nfrom myva_pipeline.model.reeksen import schotmomenten\n\nKWARTIEREN = [\"1-15\", \"16-30\", \"31-45+\", \"46-60\", \"61-75\", \"76-90+\"]\nMIN_PER_GROEP = 5\n\n\ndef _kwartier(helft: float, start_min: float) -> str:\n    \"\"\"Speelminuut binnen de helft naar een van de zes kwartieren; blessuretijd valt in het laatste kwartier van de helft.\"\"\"\n    minuut = float(start_min)\n    i = 0 if minuut < 15 else 1 if minuut < 30 else 2\n    return KWARTIEREN[i + (3 if int(helft) == 2 else 0)]\n\n\ndef kwartieren(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Schoten en goals per kwartier speeltijd, voor en tegen, over alle wedstrijden.\"\"\"\n    rijen = []\n    for a in analyses:\n        sm = schotmomenten(a.kansen)\n        sm = sm[sm[\"helft\"].notna() & sm[\"start_min\"].notna()]\n        for _, k in sm.iterrows():\n            rijen.append({\"kwartier\": _kwartier(k[\"helft\"], k[\"start_min\"]), \"kant\": k[\"kant\"], \"goal\": bool(k[\"is_goal\"])})\n    if not rijen:\n        return pd.DataFrame(columns=[\"kwartier\", \"schoten_voor\", \"goals_voor\", \"schoten_tegen\", \"goals_tegen\"])\n    df = pd.DataFrame(rijen)\n    uit = []\n    for kw in KWARTIEREN:\n        sub = df[df[\"kwartier\"] == kw]\n        e, t = sub[sub[\"kant\"] == \"eigen\"], sub[sub[\"kant\"] == \"tegen\"]\n        uit.append({\"kwartier\": kw, \"schoten_voor\": len(e), \"goals_voor\": int(e[\"goal\"].sum()), \"schoten_tegen\": len(t), \"goals_tegen\": int(t[\"goal\"].sum())})\n    return pd.DataFrame(uit)\n\n\nMOMENT_KOLOMMEN = [\"helft\", \"start_min\", \"videotijd\", \"goal\"]\n# De vaste punten van de wedstrijdkaart: per teamfunctie hoe vaak de eindfase gehaald wordt, plus de schoten.\nEINDFASE_PER_FUNCTIE = {\"eindfase_voor\": AANVALLEN, \"eindfase_tegen\": VERDEDIGEN, \"omschakeling_voor\": OMSCHAKELEN_VA, \"omschakeling_tegen\": OMSCHAKELEN_AV}\nSCHOTEN_PER_KANT = {\"schoten_voor\": \"eigen\", \"schoten_tegen\": \"tegen\"}\nKAARTPUNTEN = [\"eindfase_voor\", \"schoten_voor\", \"eindfase_tegen\", \"schoten_tegen\", \"omschakeling_voor\", \"omschakeling_tegen\"]\n\n\n@dataclass(frozen=True)\nclass Kaartpunt:\n    \"\"\"Een punt van de wedstrijdkaart: `geteld` van de `van`, of een aantal als `van` None is, met de momenten erbij.\"\"\"\n\n    geteld: int\n    van: int | None\n    momenten: pd.DataFrame\n\n\ndef wedstrijdkaart(a: Analyse) -> dict[str, Kaartpunt]:\n    \"\"\"De vaste punten van een wedstrijd, elke wedstrijd dezelfde, met per punt de momenten om terug te kijken.\"\"\"\n    r = a.reeksen\n    haalt_eindfase = pt.bereikt_f3(r)\n    kaart = {}\n    for sleutel, functie in EINDFASE_PER_FUNCTIE.items():\n        van_functie = r[\"hoofdfunctie\"] == functie\n        m = r[van_functie & haalt_eindfase].assign(videotijd=lambda d: d[\"start\"], goal=lambda d: d[\"eind\"] == \"goal\")\n        kaart[sleutel] = Kaartpunt(len(m), int(van_functie.sum()), m[MOMENT_KOLOMMEN].reset_index(drop=True))\n    sm = schotmomenten(a.kansen)\n    for sleutel, kant in SCHOTEN_PER_KANT.items():\n        m = sm[sm[\"kant\"] == kant].assign(videotijd=lambda d: d[\"start\"], goal=lambda d: d[\"is_goal\"])\n        kaart[sleutel] = Kaartpunt(len(m), None, m[MOMENT_KOLOMMEN].reset_index(drop=True))\n    return kaart\n\n\n# Waar een aanval van de tegenstander eindigde. Links en rechts langs het blok samen: de kant van de tegenstander staat niet vast.\nZONES_TEGEN = [\"opbouw\", \"langs het blok\", \"door het blok\", \"achter het blok\", \"eindfase\"]\n\n\ndef balverovering_per_zone(analyses: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Per zone waar een opgebouwde aanval van de tegenstander eindigde: hoeveel aanvallen, en in hoeveel wij de bal veroverden.\n\n    Aanvallen zonder gecodeerde fase tellen niet mee.\n    \"\"\"\n    rijen = []\n    for a in analyses:\n        r = a.reeksen[a.reeksen[\"hoofdfunctie\"] == VERDEDIGEN]\n        for pad, eind in zip(r[\"pad\"], r[\"eind\"]):\n            if pad:\n                rijen.append({\"zone\": vg.ZONE_VAN_FASE[pad[-1]].removeprefix(\"links \").removeprefix(\"rechts \"), \"veroverd\": eind == \"BW\"})\n    t = pd.DataFrame(rijen, columns=[\"zone\", \"veroverd\"]).groupby(\"zone\")[\"veroverd\"].agg(aanvallen=\"size\", veroverd=\"sum\")\n    return t.reindex(ZONES_TEGEN).fillna(0).astype(int).reset_index()\n\n\nAFWIJKING_KOLOMMEN = [\"vergelijking\", \"kant\", \"uitkomst\", \"groep\", \"gekozen_a\", \"gekozen_b\", \"rest_a\", \"rest_b\", \"verschil\"]\n\n\ndef afwijking(gekozen: Analyse, rest: list[Analyse]) -> pd.DataFrame:\n    \"\"\"Per groep van elke vergelijking: een wedstrijd tegenover een reeks andere wedstrijden, in procentpunten.\n\n    Alleen groepen met minstens MIN_PER_GROEP waarnemingen aan beide kanten tellen mee.\n    De grootste verschillen staan bovenaan.\n    \"\"\"\n    if not rest:\n        return pd.DataFrame(columns=AFWIJKING_KOLOMMEN)\n    opgeteld = vg.opgeteld([vg.tellingen(a) for a in rest])\n    rijen = []\n    for sleutel, t in vg.tellingen(gekozen).items():\n        r = opgeteld.get(sleutel)\n        if r is None:\n            continue\n        for groep, a, b, ra, rb in ((\"a\", t[\"a1\"], t[\"b1\"], r[\"a1\"], r[\"b1\"]), (\"b\", t[\"a2\"], t[\"b2\"], r[\"a2\"], r[\"b2\"])):\n            if b < MIN_PER_GROEP or rb < MIN_PER_GROEP:\n                continue\n            rijen.append({\n                \"vergelijking\": sleutel[0], \"kant\": sleutel[1], \"uitkomst\": sleutel[2], \"groep\": groep,\n                \"gekozen_a\": int(a), \"gekozen_b\": int(b), \"rest_a\": int(ra), \"rest_b\": int(rb),\n                \"verschil\": 100.0 * a / b - 100.0 * ra / rb,\n            })\n    df = pd.DataFrame(rijen, columns=AFWIJKING_KOLOMMEN)\n    return df.reindex(df[\"verschil\"].abs().sort_values(ascending=False).index).reset_index(drop=True)\n", "myva_pipeline/cli.py": "\"\"\"Commandoregel: `myva` verwerkt alle XML's in data/raw, of de bestanden en mappen die je opgeeft.\n\nDe uitvoer is een PDF per team. Met --rapporten komen daar de rapporten per wedstrijd en de onderbouwing bij,\nmet --tabellen de vaste tabellen voor Power BI. `myva --dashboard` opent het dashboard in de browser.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport sys\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nfrom myva_pipeline import config, pipeline\nfrom myva_pipeline.analyse import seizoen\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.invoer import metadata\nfrom myva_pipeline.uitvoer import schrijven, webpagina\nfrom myva_pipeline.weergave.formulering import formuleer\n\nSTANDAARD_MAP = \"data/raw\"\n\n# Huisstijl van het dashboard. Alleen bereikbaar op de eigen computer, en geen gebruiksstatistieken naar buiten.\nDASHBOARD_OPTIES = [\n    \"--theme.base\", \"light\",\n    \"--theme.primaryColor\", \"#3E8B5D\",\n    \"--theme.backgroundColor\", \"#FFFFFF\",\n    \"--theme.secondaryBackgroundColor\", \"#E9F4EC\",\n    \"--theme.textColor\", \"#111111\",\n    \"--browser.gatherUsageStats\", \"false\",\n    \"--server.address\", \"localhost\",\n    \"--client.toolbarMode\", \"minimal\",\n    \"--logger.hideWelcomeMessage\", \"true\",\n]\n\n\ndef verzamel_bestanden(paden: list[str]) -> tuple[list[Path], list[str]]:\n    \"\"\"Alle XML's uit de opgegeven bestanden en mappen, ook uit submappen, elk een keer. Geeft ook terug wat niet gevonden is.\"\"\"\n    bestanden: list[Path] = []\n    niet_gevonden: list[str] = []\n    for pad in paden:\n        doel = Path(pad)\n        if doel.is_dir():\n            bestanden += sorted(doel.rglob(\"*.xml\"))\n        elif doel.is_file():\n            bestanden.append(doel)\n        else:\n            niet_gevonden.append(pad)\n    uniek = list({b.resolve(): b for b in bestanden}.values())\n    return uniek, niet_gevonden\n\n\ndef _argumenten(argv: list[str] | None, instellingen: config.Instellingen) -> argparse.Namespace:\n    parser = argparse.ArgumentParser(\n        prog=\"myva\",\n        description=\"MyVA-coderingen van twee of meer wedstrijden van een team omzetten in een seizoensbeeld als PDF.\",\n    )\n    parser.add_argument(\"bestanden\", nargs=\"*\", help=f\"XML-bestanden en mappen met XML's, zoveel als je wilt (standaard: {STANDAARD_MAP})\")\n    parser.add_argument(\"--output\", default=\"output\", help=\"map voor de uitvoer (standaard: output)\")\n    parser.add_argument(\"--rapporten\", action=\"store_true\", help=\"schrijf ook het rapport en de trainerspagina per wedstrijd, de tussentabellen en de onderbouwing van de PDF\")\n    parser.add_argument(\"--tabellen\", action=\"store_true\", help=\"schrijf ook de vaste tabellen als CSV naar <output>/tabellen, voor Power BI\")\n    parser.add_argument(\"--dashboard\", action=\"store_true\", help=\"open het dashboard in de browser in plaats van een PDF te maken\")\n    parser.add_argument(\"--web\", metavar=\"MAP\", help=\"schrijf het dashboard als webpagina (index.html) naar deze map, om online te zetten; de pagina draait in de browser van de gebruiker\")\n    parser.add_argument(\"--zonder-wedstrijdkaart\", action=\"store_true\", help=\"bij --web: laat het tabblad Wedstrijdkaart weg en toon het tabblad Vergelijken met de grootste verschillen\")\n    parser.add_argument(\"--feedbackadres\", metavar=\"URL\", help=\"bij --web: het webadres dat feedback uit het dashboard ontvangt; zonder adres is er geen tabblad Feedback\")\n    parser.add_argument(\"--feedback\", default=\"data/feedback.csv\", help=\"feedback-CSV bij --rapporten, wordt aangemaakt als hij ontbreekt\")\n    parser.add_argument(\"--video\", help=\"map met de wedstrijdvideo's; knipt de clips bij de trainerspagina en zet --rapporten aan\")\n    parser.add_argument(\"--snel\", action=\"store_true\", help=\"clips knippen zonder hercoderen (snel, tot enkele seconden onnauwkeurig)\")\n    parser.add_argument(\"--opnieuw\", action=\"store_true\", help=\"bestaande clips opnieuw knippen\")\n    parser.add_argument(\"--zekerheid\", type=float, default=instellingen.zekerheid, help=f\"minimale zekerheid voor een bevinding over meerdere wedstrijden (standaard {instellingen.zekerheid:g})\")\n    parser.add_argument(\"--steun\", type=float, default=instellingen.steun, help=f\"minimaal aandeel wedstrijden waarin het verschil terugkomt (standaard {instellingen.steun:g})\")\n    args = parser.parse_args(argv)\n    args.rapporten = args.rapporten or bool(args.video)\n    return args\n\n\ndef _verwerk_wedstrijd(pad: Path, args: argparse.Namespace, eigen_club: str | None) -> Analyse:\n    a = pipeline.analyseer(pad, eigen_club)\n    print(f\"Wedstrijd: {a.wedstrijd.titel} ({a.wedstrijd.datum or 'datum onbekend'})\")\n    for melding in a.meldingen:\n        print(f\"LET OP: {melding}\")\n    for _, c in a.correcties.iterrows():\n        print(f\"Correctie toegepast: {c['code']} op videotijd {float(c['start']):.0f} s niet meegeteld.\")\n    if args.rapporten:\n        uit = schrijven.schrijf_wedstrijd(\n            a, Path(args.output),\n            feedback_pad=Path(args.feedback) if args.feedback else None,\n            video_dir=Path(args.video) if args.video else None,\n            snel=args.snel, opnieuw=args.opnieuw,\n        )\n        print(f\"Trainerspagina: {uit.trainer_html}  (ook {uit.trainer_md.name})\")\n        print(f\"Clips voor MyVA: {uit.clips_xml}\")\n        print(f\"Volledig rapport: {uit.rapport}\")\n    return a\n\n\ndef _verwerk_seizoen(team: str, analyses: list[Analyse], args: argparse.Namespace) -> None:\n    s = seizoen.bouw(analyses, seizoen.Drempels(zekerheid=args.zekerheid, steun=args.steun))\n    uit = schrijven.schrijf_seizoen(s, Path(args.output), met_onderbouwing=args.rapporten)\n    print(f\"\\n== {team}: {len(analyses)} wedstrijden gestapeld, {len(s.bevindingen)} bevindingen\")\n    for i, bevinding in enumerate(s.bevindingen, start=1):\n        print(f\"  {i}. {formuleer(bevinding).titel}\")\n    print(f\"PDF: {uit.pdf}\")\n    if uit.onderbouwing:\n        print(f\"Onderbouwing: {uit.onderbouwing}\")\n\n\ndef start_dashboard() -> int:\n    try:\n        from streamlit.web import cli as streamlit_cli\n    except ImportError:\n        print(\"Het dashboard heeft streamlit nodig. Start het met: uv run --extra dashboard myva --dashboard\")\n        return 1\n    sys.argv = [\"streamlit\", \"run\", str(Path(__file__).with_name(\"dashboard.py\")), *DASHBOARD_OPTIES]\n    print(\"Het dashboard opent zo in je browser. Het draait alleen op deze computer. Sluit dit venster om het te stoppen.\", flush=True)\n    return streamlit_cli.main()\n\n\ndef main(argv: list[str] | None = None) -> int:\n    try:\n        instellingen = config.laad()\n    except ValueError as fout:\n        print(fout)\n        return 1\n    args = _argumenten(argv, instellingen)\n    if args.dashboard:\n        return start_dashboard()\n    if args.web:\n        pad = webpagina.schrijf_webpagina(Path(args.web), wedstrijdkaart=not args.zonder_wedstrijdkaart, feedback_adres=args.feedbackadres or \"\")\n        print(f\"Webpagina: {pad}\\nZet dit bestand online. Wat iemand erin sleept, blijft op zijn eigen computer.\")\n        return 0\n\n    bestanden, niet_gevonden = verzamel_bestanden(args.bestanden or [STANDAARD_MAP])\n    for pad in niet_gevonden:\n        print(f\"Niet gevonden: {pad}\")\n    if not bestanden:\n        print(f\"Geen XML-bestanden gevonden. Zet de MyVA-exports in {STANDAARD_MAP}/ of geef bestanden of mappen op: myva wedstrijd1.xml wedstrijd2.xml\")\n        return 1\n    if args.video and not Path(args.video).is_dir():\n        print(f\"Videomap bestaat niet: {args.video}\")\n        return 1\n\n    eigen_club = instellingen.eigen_club or metadata.raad_eigen_club([b.stem for b in bestanden])\n    if eigen_club and not instellingen.eigen_club:\n        print(f\"Eigen team herkend uit de bestandsnamen: {eigen_club}\")\n    try:\n        metadata.vul_meta_aan(bestanden, eigen_club)\n    except OSError as fout:\n        print(f\"meta.csv kon niet worden aangevuld: {fout}\")\n\n    analyses, mislukt = [], []\n    for pad in bestanden:\n        print(f\"== {pad.name}\")\n        try:\n            analyses.append(_verwerk_wedstrijd(pad, args, eigen_club))\n        except (ValueError, KeyError, ET.ParseError) as fout:\n            mislukt.append(f\"{pad.name}: {fout}\")\n            print(f\"OVERGESLAGEN: {fout}\")\n\n    groepen, meldingen = pipeline.per_team(analyses)\n    meldingen = [f\"{a.wedstrijd.bron.name}: {m}\" for a in analyses for m in a.meldingen] + meldingen\n    for team, groep in groepen.items():\n        _verwerk_seizoen(team, groep, args)\n    if args.tabellen and analyses:\n        map_ = Path(args.output) / \"tabellen\"\n        schrijven.schrijf_tabellen(analyses, map_)\n        print(f\"\\nTabellen voor Power BI: {map_}\")\n\n    print(f\"\\nKlaar: {len(analyses)} van de {len(bestanden)} wedstrijden verwerkt. De uitvoer staat in {args.output}/.\")\n    for regel in meldingen + [f\"Overgeslagen: {m}\" for m in mislukt]:\n        print(f\"LET OP: {regel}\")\n    return 1 if mislukt or niet_gevonden else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "myva_pipeline/config.py": "\"\"\"Instellingen uit myva.toml in de map waar het commando draait. Elk veld is optioneel.\"\"\"\n\nfrom __future__ import annotations\n\nimport tomllib\nfrom dataclasses import dataclass, fields\nfrom pathlib import Path\n\nBESTAND = \"myva.toml\"\n\n\n@dataclass(frozen=True)\nclass Instellingen:\n    # Afkorting van de eigen club zoals die in de MyVA-bestandsnamen staat. Staat die als\n    # tweede in de naam, dan is het een uitwedstrijd. Zonder deze instelling komt thuis of uit\n    # alleen uit meta.csv.\n    eigen_club: str | None = None\n    zekerheid: float = 0.90\n    steun: float = 0.75\n\n\ndef laad(pad: Path | None = None) -> Instellingen:\n    pad = Path(pad or BESTAND)\n    if not pad.exists():\n        return Instellingen()\n    waarden = tomllib.loads(pad.read_text(encoding=\"utf-8\"))\n    onbekend = set(waarden) - {f.name for f in fields(Instellingen)}\n    if onbekend:\n        raise ValueError(f\"{pad}: onbekende instelling {sorted(onbekend)}\")\n    return Instellingen(**waarden)\n", "myva_pipeline/dashboard.py": "\"\"\"Het dashboard: MyVA-exports erin slepen en in een oogopslag zien wat er gebeurde.\n\nStarten met `myva --dashboard`. Alles draait op de eigen computer; er gaat niets naar buiten.\nHet dashboard is een andere weergave van dezelfde analyse als de PDF: er wordt niets anders geteld.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport html\nimport io\nimport os\nimport sys\nimport tempfile\nimport xml.etree.ElementTree as ET\nimport zipfile\nfrom pathlib import Path\n\nimport altair as alt\nimport pandas as pd\nimport streamlit as st\n\nfrom myva_pipeline import config, pipeline\nfrom myva_pipeline.analyse import momenten, seizoen, wedstrijdbeeld\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.cli import STANDAARD_MAP, verzamel_bestanden\nfrom myva_pipeline.domein import OVERIG\nfrom myva_pipeline.invoer import inlezen, metadata\nfrom myva_pipeline.uitvoer import versturen\nfrom myva_pipeline.weergave import onderbouwing, tabellen, veldstippen, visueel\nfrom myva_pipeline.weergave.formulering import formuleer, ingevuld, kleur_groepen, procent, zeker_tekst\nfrom myva_pipeline.weergave.teksten import KAART, MAAT, SITUATIE_LABEL, SJABLONEN, XML_NIET, XML_WEL, ZONE_KORT, ZONE_TEGEN\n\nGROEN, GROEN_LICHT, ROOD, ROOD_LICHT, VLAK, INKT_3 = visueel.GROEN, visueel.GROEN_LICHT, visueel.ROOD, visueel.ROOD_LICHT, visueel.VLAK, visueel.INKT_3\nMIN_TREND = 6\n# Als webpagina draait het dashboard in de browser zelf en is er geen map op de computer om te lezen.\nIN_DE_BROWSER = sys.platform == \"emscripten\"\n# De wedstrijdkaart kan uit: dan staat er een tabblad Vergelijken met alleen de grootste verschillen.\nMET_WEDSTRIJDKAART = os.environ.get(\"MYVA_WEDSTRIJDKAART\", \"1\") != \"0\"\n# Zonder adres is er geen feedbackformulier.\nFEEDBACK_ADRES = os.environ.get(\"MYVA_FEEDBACK_ADRES\", \"\")\nMAX_BEELDEN, MAX_BEELD_MB = 3, 5\n# Vanaf dit verschil krijgt een punt van de wedstrijdkaart een pijl: procentpunten, of aantallen per wedstrijd.\nKAART_VERSCHIL_PCT, KAART_VERSCHIL_AANTAL = 5, 2\nZEKERHEDEN = [0.80, 0.85, 0.90, 0.95, 0.975]\nSTEUNEN = [0.5, 0.75, 1.0]\nVELD_BREEDTE = 660\n\nSTIJL = f\"\"\"\n<style>\n.block-container {{padding-top: 1.2rem; padding-bottom: 1rem; max-width: 1500px;}}\nheader[data-testid=\"stHeader\"] {{height: 0; background: transparent;}}\nsection[data-testid=\"stSidebar\"] {{width: 17rem !important; min-width: 17rem !important;}}\nsection[data-testid=\"stSidebar\"] .block-container {{padding-top: 1rem;}}\ndiv[data-testid=\"stTabs\"] button p {{font-size: 1rem; font-weight: 600;}}\n.kop {{background: {GROEN}; color: #fff; border-radius: 10px; padding: 12px 20px; margin-bottom: 6px;\n       display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;}}\n.kop .team {{font-size: 1.9rem; font-weight: 800; letter-spacing: .01em;}}\n.kop .periode {{font-size: .95rem; opacity: .92;}}\n.tegels {{display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 4px 0 14px;}}\n.tegel {{background: {VLAK}; border-radius: 10px; padding: 10px 14px;}}\n.tegel .wat {{font-size: .82rem; color: #3C4A42; font-weight: 600;}}\n.tegel .getal {{font-size: 1.75rem; font-weight: 800; color: #111; line-height: 1.2;}}\n.tegel .getal .tegen {{color: {ROOD};}}\n.tegel .onder {{font-size: .78rem; color: #5F6E65;}}\n.kaart {{border-left: 5px solid {GROEN}; background: #fff; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px;\n         box-shadow: 0 1px 2px rgba(0,0,0,.08);}}\n.kaart.tegen {{border-left-color: {ROOD};}}\n.tabelvak {{overflow: auto; border: 1px solid #DDE7E0; border-radius: 8px;}}\ntable.tabel {{width: 100%; border-collapse: collapse; font-size: .86rem;}}\ntable.tabel th {{position: sticky; top: 0; background: {VLAK}; text-align: left; padding: 6px 10px; color: #3C4A42; font-weight: 600;}}\ntable.tabel td {{padding: 6px 10px; border-top: 1px solid #EEF3EF; white-space: nowrap;}}\n.functie {{font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: {GROEN}; margin-bottom: 6px;}}\n.kaartpunt {{background: {VLAK}; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;}}\n.kaartpunt .naam {{font-size: .9rem; font-weight: 700; color: #3C4A42; min-height: 2.5em;}}\n.kaartpunt .waarde {{font-size: 2.3rem; font-weight: 800; color: #111; line-height: 1.1;}}\n.kaartpunt .pijl {{font-size: 1.3rem; margin-left: 10px; vertical-align: middle;}}\n.kaartpunt .pijl.beter {{color: {GROEN};}}\n.kaartpunt .pijl.minder {{color: {ROOD};}}\n.kaartpunt .pijl.gelijk {{color: #5F6E65;}}\n.kaartpunt .onder {{font-size: .82rem; color: #3C4A42;}}\n.kaartpunt .ander {{font-size: .78rem; color: #5F6E65; margin-top: 6px;}}\n.vgl-raster {{display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start;}}\n@media (max-width: 1100px) {{.vgl-raster {{grid-template-columns: repeat(2, 1fr);}}}}\n.vgl {{background: {VLAK}; border-radius: 10px; padding: 12px 16px;}}\n.vgl .naam {{font-size: 1.05rem; font-weight: 800; color: #111;}}\n.vgl .maat {{font-size: .8rem; color: #3C4A42; margin-bottom: 8px; min-height: 2.3em;}}\n.vgl .rij {{display: flex; align-items: center; gap: 10px; margin-top: 4px;}}\n.vgl .pct {{font-size: 1.5rem; font-weight: 800; color: #111; width: 3.4rem; text-align: right;}}\n.vgl .rest .pct {{font-size: 1.05rem; font-weight: 600; color: #5F6E65;}}\n.vgl .balk {{flex: 1; background: #fff; border-radius: 4px; height: 12px;}}\n.vgl .balk i {{display: block; height: 12px; border-radius: 4px; min-width: 2px;}}\n.vgl .tel {{font-size: .78rem; color: #5F6E65; width: 6.2rem;}}\n.vgl details {{margin-top: 8px; font-size: .84rem; color: #3C4A42;}}\n.vgl summary {{cursor: pointer; color: {GROEN}; font-weight: 600;}}\n.vgl details p {{margin: 6px 0 0;}}\n.kaart .titel {{font-weight: 700; font-size: .98rem; color: #111;}}\n.kaart .stuur {{font-size: .88rem; color: {GROEN}; font-weight: 600; margin-top: 2px;}}\n.kaart .waar {{font-size: .84rem; color: #111; margin-top: 4px;}}\n.tussenkop {{font-size: .82rem; font-weight: 700; color: #3C4A42; margin: 10px 0 4px;}}\n.tegels.klein .tegel {{padding: 6px 12px;}}\n.tegels.klein .getal {{font-size: 1.3rem;}}\n.kaart .gezien {{font-size: .78rem; color: #5F6E65; margin-top: 2px;}}\n<\/style>\n\"\"\"\n\n\ndef _gewijzigd(pad: Path) -> float:\n    \"\"\"Laatste wijziging van de XML en van meta.csv en correcties.csv ernaast; die bepalen samen de analyse.\"\"\"\n    naast = [pad.parent / \"meta.csv\", pad.parent / \"correcties.csv\"]\n    return max(p.stat().st_mtime for p in [pad, *naast] if p.exists())\n\n\n@st.cache_resource(show_spinner=False)\ndef _analyse(pad: str, gewijzigd: float, eigen_club: str | None) -> Analyse:\n    return pipeline.analyseer(Path(pad), eigen_club)\n\n\ndef _uploads_naar_map(bestanden: list) -> Path:\n    \"\"\"De gesleepte bestanden in een eigen tijdelijke map, zodat meta.csv en correcties.csv naast de XML's staan.\"\"\"\n    if \"uploadmap\" not in st.session_state:\n        st.session_state.uploadmap = tempfile.mkdtemp(prefix=\"myva_\")\n    map_ = Path(st.session_state.uploadmap)\n    namen = {b.name for b in bestanden}\n    for oud in map_.iterdir():\n        if oud.name not in namen:\n            oud.unlink()\n    for b in bestanden:\n        doel = map_ / b.name\n        if not doel.exists() or doel.read_bytes() != b.getvalue():\n            doel.write_bytes(b.getvalue())\n    return map_\n\n\n# In de browser kost een wedstrijd inlezen en doorrekenen ongeveer zoveel seconden.\nSECONDEN_PER_WEDSTRIJD = 6\n\n\n@st.fragment(run_every=0.3)\ndef _tik() -> None:\n    \"\"\"Start de volgende ronde vanuit de browser, zodat het scherm eerst wordt bijgewerkt.\"\"\"\n    if st.session_state.get(\"ronde_getekend\"):\n        st.session_state[\"ronde_getekend\"] = False\n        st.rerun()\n    st.session_state[\"ronde_getekend\"] = True\n\n\ndef _meld_inlezen(bron: Path, eigen_club: str | None, plek) -> None:\n    \"\"\"Zet bij nieuwe bestanden eerst een melding op het scherm en leest ze pas in de ronde daarna in.\n\n    Het scherm werkt pas bij als een ronde van het script klaar is; zonder die eerste ronde zou er\n    tijdens het inlezen niets te zien zijn. Staat alles al in het geheugen, dan gebeurt er niets.\n    \"\"\"\n    ingelezen = st.session_state.setdefault(\"ingelezen\", set())\n    nieuw = frozenset((str(pad), _gewijzigd(pad), eigen_club) for pad in verzamel_bestanden([str(bron)])[0]) - ingelezen\n    if not nieuw:\n        return\n    tekst = f\"{len(nieuw)} wedstrijd{'en' if len(nieuw) != 1 else ''} inlezen en doorrekenen.\"\n    if IN_DE_BROWSER:\n        tekst += f\" Dit duurt ongeveer {max(10, round(SECONDEN_PER_WEDSTRIJD * len(nieuw), -1))} seconden; daarna gaat alles direct.\"\n    plek.progress(0.5, text=tekst)\n    if st.session_state.get(\"aangekondigd\") == nieuw:\n        ingelezen |= nieuw\n        return\n    st.session_state[\"aangekondigd\"] = nieuw\n    if not IN_DE_BROWSER:\n        st.rerun()\n    _tik()\n    st.stop()\n\n\ndef _lees(bron: Path, eigen_club: str | None) -> tuple[list[Analyse], list[str]]:\n    paden, _ = verzamel_bestanden([str(bron)])\n    analyses, fouten = [], []\n    for pad in paden:\n        try:\n            analyses.append(_analyse(str(pad), _gewijzigd(pad), eigen_club))\n        except (ValueError, KeyError, ET.ParseError) as fout:\n            fouten.append(f\"{pad.name}: {fout}\")\n    return analyses, fouten\n\n\ndef _per_team(analyses: list[Analyse]) -> tuple[dict[str, list[Analyse]], list[str]]:\n    groepen: dict[str, dict[str, Analyse]] = {}\n    meldingen = []\n    for a in analyses:\n        w = a.wedstrijd\n        if not w.compleet:\n            meldingen.append(f\"{w.bron.name}: datum, team of tegenstander staat niet in de bestandsnaam. Hernoem het bestand zoals MyVA exporteert.\")\n        elif w.naam in groepen.setdefault(w.team, {}):\n            meldingen.append(f\"{w.bron.name}: deze wedstrijd staat er al in; alleen de eerste telt mee.\")\n        else:\n            groepen[w.team][w.naam] = a\n    return {t: sorted(g.values(), key=lambda a: (a.wedstrijd.datum, a.wedstrijd.naam)) for t, g in sorted(groepen.items()) if g}, meldingen\n\n\n@st.cache_
