hot\"\n    if \"voorzet links\" in code:\n        return \"voorzet_links\"\n    if \"voorzet rechts\" in code:\n        return \"voorzet_rechts\"\n    raise ValueError(f\"Onbekende kanscode: {code}\")\n\n\ndef goal_tweelingen(kans_df: pd.DataFrame) -> pd.Series:\n    \"\"\"True voor het schot dat bij een goal hoort.\n\n    Een goal wordt in MyVA ook als schot getagd, meestal op hetzelfde moment en\n    soms enkele seconden eerder. Per goal telt het overlappende schot van\n    dezelfde kant met de dichtstbijzijnde start als tweeling; een eerder schot\n    in dezelfde aanval blijft een eigen schot.\n    \"\"\"\n    dubbel = pd.Series(False, index=kans_df.index)\n    for _, g in kans_df[kans_df[\"code\"].str.endswith(\"goal\")].iterrows():\n        kant = g[\"code\"].rsplit(\" - \", 1)[0]\n        schoten = kans_df[(kans_df[\"code\"] == f\"{kant} - schot\") & ~dubbel]\n        overlapt = schoten[(schoten[\"start\"] < g[\"end\"]) & (schoten[\"end\"] > g[\"start\"])]\n        if not overlapt.empty:\n            dubbel[(overlapt[\"start\"] - g[\"start\"]).abs().idxmin()] = True\n    return dubbel\n\n\ndef schotmomenten(kansen: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Schoten en goals uit de kansentabel, een rij per schotmoment.\n\n    De tweeling van een goal valt weg, en twee instances van dezelfde kant met\n    dezelfde starttijd tellen als een moment.\n    \"\"\"\n    k = kansen[kansen[\"soort\"].isin((\"schot\", \"goal\")) & ~kansen[\"dubbel\"].astype(bool)].copy()\n    k[\"moment\"] = k[\"start\"].round(1)\n    k[\"is_goal\"] = k[\"soort\"] == \"goal\"\n    return k.sort_values([\"moment\", \"is_goal\"], ascending=[True, False]).drop_duplicates([\"kant\", \"moment\"]).sort_values(\"start\")\n\n\ndef _speelminuut(start: float, helft, intervallen: dict) -> float | None:\n    if helft is None or pd.isna(helft):\n        return None\n    return round((start - intervallen[int(helft)][0]) / 60, 2)\n\n\ndef _afstand_tot_begin(kandidaten: pd.DataFrame, na: float, van: float, tot: float, niet_voor: float) -> float | None:\n    \"\"\"Kleinste afstand in seconden tussen `na` en een kandidaat die in [na + van, na + tot] en na niet_voor begint.\"\"\"\n    s = kandidaten[\"start\"]\n    binnen = s[(s >= na + van) & (s <= na + tot) & (s > niet_voor)]\n    return None if binnen.empty else float((binnen - na).abs().min())\n\n\ndef _begint_in(kandidaten: pd.DataFrame, na: float, van: float, tot: float, niet_voor: float) -> bool:\n    return _afstand_tot_begin(kandidaten, na, van, tot, niet_voor) is not None\n\n\nclass _Reeksbouwer:\n    \"\"\"Bouwt de reeksentabel uit de instances. Eenmalig gebruik per wedstrijd.\"\"\"\n\n    def __init__(self, df: pd.DataFrame, wedstrijd: str | None):\n        self.df = df\n        self.wedstrijd = wedstrijd\n        self.intervallen = inlezen.helft_intervallen(df)\n        self.reeksen = df[df[\"hoofdfunctie\"].isin(REEKS_FUNCTIES) & df[\"fase\"].isna()].sort_values(\"start\")\n        self.toewijzing = self._koppel_kinderen()\n        self.kinderen_per_reeks = self._groepeer_kinderen()\n        self.reeks_id: dict = {}\n        self._tellers = {f: 0 for f in REEKS_FUNCTIES}\n        self._vervolg = self._vervolgsignalen()\n        eindfase = df[df[\"fase\"] == \"F3\"]\n        self._eindfase_vervolg = {\n            OMSCHAKELEN_AV: eindfase[eindfase[\"hoofdfunctie\"] == VERDEDIGEN][\"start\"],\n            OMSCHAKELEN_VA: eindfase[eindfase[\"hoofdfunctie\"] == AANVALLEN][\"start\"],\n        }\n\n    def _koppel_kinderen(self) -> dict[str, pd.Series]:\n        df, reeksen = self.df, self.reeksen\n        hf = df[\"hoofdfunctie\"]\n        fase_prefix = hf.isin((AANVALLEN, VERDEDIGEN)) & df[\"fase\"].notna()\n        eindfase = hf.isin((OMSCHAKELEN_AV, OMSCHAKELEN_VA)) & (df[\"fase\"] == \"eindfase\")\n        groepen = {\n            \"fase_aanvallen\": (fase_prefix & (hf == AANVALLEN), (AANVALLEN,)),\n            \"fase_verdedigen\": (fase_prefix & (hf == VERDEDIGEN), (VERDEDIGEN,)),\n            \"eindfase_av\": (eindfase & (hf == OMSCHAKELEN_AV), (OMSCHAKELEN_AV,)),\n            \"eindfase_va\": (eindfase & (hf == OMSCHAKELEN_VA), (OMSCHAKELEN_VA,)),\n            \"fase_los\": (hf == FASE_LOS, (OMSCHAKELEN_AV, OMSCHAKELEN_VA)),\n            \"kans\": (hf == KANS, EIGEN_BEZIT),\n            \"kans_tegen\": (hf == KANS_TEGEN, TEGEN_BEZIT),\n        }\n        toewijzing = {\n            naam: koppel_aan_reeks(df[masker], reeksen[reeksen[\"hoofdfunctie\"].isin(functies)])\n            for naam, (masker, functies) in groepen.items()\n        }\n        toewijzing[\"kans\"] = self._kans_naar_omschakeling(toewijzing[\"kans\"], OMSCHAKELEN_VA)\n        toewijzing[\"kans_tegen\"] = self._kans_naar_omschakeling(toewijzing[\"kans_tegen\"], OMSCHAKELEN_AV)\n        return toewijzing\n\n    def _kans_naar_omschakeling(self, toewijzing: pd.Series, omschakeling: str) -> pd.Series:\n        \"\"\"Een kans kort na de balwissel hoort bij de omschakeling, ook als de reeks erna al was aangeklikt.\n\n        Geldt voor een schot of voorzet aan een opgebouwde reeks die uit een omschakeling voortkomt.\n        De kansknop en de omschakelknop hebben beide een voorloop, dus het verschil tussen hun\n        begintijden is de tijd tussen balwissel en kans.\n        \"\"\"\n        df, reeksen = self.df, self.reeksen\n        oms = reeksen[reeksen[\"hoofdfunctie\"] == omschakeling]\n        uit = toewijzing.copy()\n        for kans_idx, reeks_idx in toewijzing.dropna().items():\n            reeks, kans = reeksen.loc[reeks_idx], df.loc[kans_idx]\n            if reeks[\"hoofdfunctie\"] == omschakeling:\n                continue\n            ervoor = oms[\n                (oms[\"start\"] <= kans[\"start\"]) & (kans[\"start\"] <= oms[\"start\"] + NA_WISSEL_S)\n                & (reeks[\"start\"] >= oms[\"start\"]) & (reeks[\"start\"] <= oms[\"end\"] + OPBOUW_VENSTER_S)\n            ]\n            if not ervoor.empty:\n                uit[kans_idx] = ervoor[\"start\"].idxmax()\n        return uit\n\n    def _groepeer_kinderen(self) -> dict:\n        per_reeks: dict = {idx: [] for idx in self.reeksen.index}\n        for serie in self.toewijzing.values():\n            for kind_idx, reeks_idx in serie.dropna().items():\n                per_reeks[reeks_idx].append(kind_idx)\n        return per_reeks\n\n    def _vervolgsignalen(self) -> dict[str, tuple[pd.DataFrame, pd.DataFrame, pd.DataFrame]]:\n        \"\"\"Per teamfunctie: (reeksen die 'opbouw' betekenen, instances die 'uit' betekenen, reeksen die een balwissel betekenen).\"\"\"\n        df = self.df\n        leeg = df.iloc[0:0]\n        per_functie = {f: self.reeksen[self.reeksen[\"hoofdfunctie\"] == f] for f in REEKS_FUNCTIES}\n        spelhervattingen = df[df[\"hoofdfunctie\"] == SPELHERVATTING]\n        doeltrap_eigen = df[df[\"code\"] == \"Aanvallen - doeltrap (F0)\"]\n        doeltrap_tegen = df[df[\"code\"] == \"Verdedigen - doeltrap (F0)\"]\n        uit_eigen = pd.concat([spelhervattingen, doeltrap_tegen])\n        uit_tegen = pd.concat([spelhervattingen, doeltrap_eigen])\n        return {\n            AANVALLEN: (leeg, uit_eigen, leeg),\n            OMSCHAKELEN_VA: (per_functie[AANVALLEN], uit_eigen, per_functie[VERDEDIGEN]),\n            VERDEDIGEN: (leeg, uit_tegen, leeg),\n            OMSCHAKELEN_AV: (per_functie[VERDEDIGEN], uit_tegen, per_functie[AANVALLEN]),\n        }\n\n    def niet_gekoppeld(self) -> dict[str, pd.DataFrame]:\n        return {naam: self.df.loc[serie[serie.isna()].index] for naam, serie in self.toewijzing.items()}\n\n    def bouw(self) -> pd.DataFrame:\n        rijen = [self._rij(idx, r) for idx, r in self.reeksen.iterrows()]\n        uit = pd.DataFrame(rijen, columns=KOLOMMEN)\n        for kol in _OBJECT_KOLOMMEN:\n            uit[kol] = pd.Series([rij[kol] for rij in rijen], index=uit.index, dtype=\"object\")\n        return uit\n\n    def _rij(self, idx, r: pd.Series) -> dict:\n        hf = r[\"hoofdfunctie\"]\n        kind_idx = self.kinderen_per_reeks[idx]\n        kinderen = self.df.loc[kind_idx].sort_values(\"start\") if kind_idx else self.df.iloc[0:0]\n        fases = kinderen[kinderen[\"fase\"].notna() & ~kinderen[\"code\"].isin(DOELTRAP_CONTAINERS)]\n        start = float(r[\"start\"])\n        end = self._einde(float(r[\"end\"]), fases)\n\n        labels = set(r[\"labels\"]).union(*kinderen[\"labels\"])\n        bv, bw, lb, bop = \"BV\" in labels, \"BW\" in labels, \"LB\" in labels, \"BOP\" in labels\n        kansen = kinderen[kinderen[\"hoofdfunctie\"].isin((KANS, KANS_TEGEN))]\n        soorten = [kans_soort(c) for c in kansen[\"code\"]]\n\n        self._tellers[hf] += 1\n        reeks_id = f\"{PREFIX[hf]}{self._tellers[hf]:03d}\"\n        self.reeks_id[idx] = reeks_id\n        pad = self._pad(fases)\n        eind = self._eind(hf, soorten, bv, bw, bop, start, end)\n        return {\n            \"reeks_id\": reeks_id,\n            \"wedstrijd\": self.wedstrijd,\n            \"hoofdfunctie\": hf,\n            \"helft\": r[\"helft\"],\n            \"start_min\": _speelminuut(start, r[\"helft\"], self.intervallen),\n            \"start\": start,\n            \"end\": end,\n            \"duur\": round(end - start, 2),\n            \"pad\": pad,\n            \"pad_str\": \">\".join(pad),\n            \"drukhoogte\": self._drukhoogte(fases),\n            \"eind\": eind,\n            \"voorzet\": next((s.removeprefix(\"voorzet_\") for s in soorten if s.startswith(\"voorzet_\")), None),\n            \"schoten\": self._schotmomenten(kansen),\n            \"lange_bal\": lb,\n            \"label_BV\": bv,\n            \"label_BW\": bw,\n            \"eindfase_vervolg\": self._haalt_eindfase_in_vervolg(hf, eind, start),\n        }\n\n    def _haalt_eindfase_in_vervolg(self, hf: str, eind: str | None, start: float) -> bool:\n        \"\"\"Een omschakeling zonder eigen eindfase waarna dezelfde partij kort na de balwissel in de eindfase komt.\"\"\"\n        if hf not in self._eindfase_vervolg or eind in (\"BV\", \"BW\"):\n            return False\n        s = self._eindfase_vervolg[hf]\n        return bool(((s >= start) & (s <= start + OMSCHAKEL_VOORLOOP_S + NA_WISSEL_S)).any())\n\n    @staticmethod\n    def _pad(fases: pd.DataFrame) -> list[str]:\n        pad = [\"F3\" if f == \"eindfase\" else f for f in fases[~fases[\"fase\"].isin(DRUK_FASES)][\"fase\"]]\n        # Een doeltrap is per definitie het begin; de volgende fase wordt soms\n        # een fractie eerder aangeklikt.\n        if \"F0\" in pad:\n            pad = [\"F0\"] + [f for f in pad if f != \"F0\"]\n        return pad\n\n    @staticmethod\n    def _einde(end: float, fases: pd.DataFrame) -> float:\n        eindfases = fases[fases[\"fase\"] == \"eindfase\"]\n        return max(end, float(eindfases[\"end\"].max())) if not eindfases.empty else end\n\n    @staticmethod\n    def _drukhoogte(fases: pd.DataFrame) -> str | None:\n        druk = fases[fases[\"fase\"].isin(DRUK_FASES)]\n        if druk.empty:\n            return None\n        return \"hoog\" if druk.iloc[0][\"fase\"] == \"hoog_druk\" else \"laag\"\n\n    @staticmethod\n    def _schotmomenten(kansen: pd.DataFrame) -> int:\n        \"\"\"Een goal is ook als schot getagd; die twee tellen als een moment.\"\"\"\n        schoten = kansen[kansen[\"code\"].str.endswith((\"schot\", \"goal\"))]\n        schoten = schoten[~goal_tweelingen(schoten)]\n        return int(schoten[\"start\"].round(1).nunique())\n\n    def _eind(self, hf: str, soorten: list[str], bv: bool, bw: bool, bop: bool, start: float, end: float) -> str | None:\n        if \"goal\" in soorten:\n            return \"goal\"\n        if \"schot\" in soorten:\n            return \"schot\"\n        if bv and bw:\n            return \"BV\" if hf in EIGEN_BEZIT else \"BW\"\n        if bv:\n            return \"BV\"\n        if bw:\n            return \"BW\"\n        if bop:\n            return \"uit\"\n        opbouw, uit, wissel = self._vervolg[hf]\n        naar_opbouw = _afstand_tot_begin(opbouw, end, -OPBOUW_VENSTER_S, OPBOUW_VENSTER_S, start)\n        naar_wissel = _afstand_tot_begin(wissel, end, -OPBOUW_VENSTER_S, OPBOUW_VENSTER_S, start)\n        # Een omschakeling zonder label die overgaat in balbezit van de andere partij is een balwissel.\n        if naar_wissel is not None and (naar_opbouw is None or naar_wissel < naar_opbouw):\n            return \"BV\" if hf in EIGEN_BEZIT else \"BW\"\n        if naar_opbouw is not None:\n            return \"opbouw\"\n        if _begint_in(uit, end, -VOORLOOP_S, UIT_VENSTER_S, start):\n            return \"uit\"\n        return None\n\n    def kansen(self, reeksen: pd.DataFrame) -> pd.DataFrame:\n        \"\"\"Een rij per kans, met herkomst: de reeks, anders de spelhervatting, anders onbekend.\"\"\"\n        df = self.df\n        kans_df = df[df[\"hoofdfunctie\"].isin((KANS, KANS_TEGEN))].sort_values(\"start\")\n        naar_reeks = pd.concat([self.toewijzing[\"kans\"], self.toewijzing[\"kans_tegen\"]])\n        naar_spelhervatting = koppel_aan_reeks(kans_df, df[df[\"hoofdfunctie\"] == SPELHERVATTING])\n        dubbel = goal_tweelingen(kans_df)\n        per_id = reeksen.set_index(\"reeks_id\")\n\n        rijen = []\n        for n, (idx, k) in enumerate(kans_df.iterrows(), start=1):\n            reeks_id = self.reeks_id.get(naar_reeks.get(idx))\n            herkomst, laatste_fase, druk = \"onbekend\", None, None\n            if reeks_id is not None:\n                rk = per_id.loc[reeks_id]\n                herkomst = rk[\"hoofdfunctie\"]\n                laatste_fase = rk[\"pad\"][-1] if rk[\"pad\"] else None\n                druk = rk[\"drukhoogte\"]\n            elif naar_spelhervatting.get(idx) is not None:\n                herkomst = \"spelhervatting:\" + df.loc[naar_spelhervatting[idx], \"code\"]\n            rijen.append(\n                {\n                    \"kans_id\": f\"K{n:03d}\",\n                    \"wedstrijd\": self.wedstrijd,\n                    \"kant\": \"eigen\" if k[\"hoofdfunctie\"] == KANS else \"tegen\",\n                    \"soort\": kans_soort(k[\"code\"]),\n                    \"helft\": k[\"helft\"],\n                    \"start_min\": _speelminuut(float(k[\"start\"]), k[\"helft\"], self.intervallen),\n                    \"start\": float(k[\"start\"]),\n                    \"reeks_id\": reeks_id,\n                    \"herkomst\": herkomst,\n                    \"laatste_fase\": laatste_fase,\n                    \"drukhoogte\": druk,\n                    \"voorzet_type\": next((lab for lab in k[\"labels\"] if lab.endswith(\"voorzet\")), None),\n                    \"dubbel\": bool(dubbel[idx]),\n                }\n            )\n        uit = pd.DataFrame(rijen, columns=KANS_KOLOMMEN)\n        for kol in _KANS_OBJECT_KOLOMMEN:\n            uit[kol] = pd.Series([rij[kol] for rij in rijen], index=uit.index, dtype=\"object\")\n        return uit\n\n\ndef bouw_reeksen(df: pd.DataFrame, wedstrijd: str | None = None) -> ReeksResultaat:\n    bouwer = _Reeksbouwer(df, wedstrijd)\n    reeksen = bouwer.bouw()\n    return ReeksResultaat(reeksen=reeksen, kansen=bouwer.kansen(reeksen), niet_gekoppeld=bouwer.niet_gekoppeld())\n", "myva_pipeline/pipeline.py": "\"\"\"De pijplijn van een wedstrijd, en welke wedstrijden samen een seizoensbeeld vormen.\n\n    invoer      XML, bestandsnaam, meta.csv en correcties.csv lezen\n    model       reeksen bouwen, overgangen en fasewaarden schatten\n    analyse     patronen en vergelijkingen tellen, wedstrijden stapelen\n    weergave    tellingen omzetten in tekst, HTML en PDF\n    uitvoer     bestanden schrijven en clips knippen\n\nElke laag gebruikt alleen de lagen erboven in deze lijst. Deze module rijgt de eerste\ndrie aan elkaar en schrijft zelf niets.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import defaultdict\nfrom dataclasses import replace\nfrom pathlib import Path\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import patronen\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.invoer import correcties, inlezen, metadata\nfrom myva_pipeline.model import markov, reeksen\n\n\ndef _uitslag_uit_codering(kansen: pd.DataFrame, thuis: bool) -> str:\n    \"\"\"Uitslag volgens de goals in de codering, thuisploeg eerst.\"\"\"\n    goals = kansen[kansen[\"soort\"] == \"goal\"]\n    eigen, tegen = int((goals[\"kant\"] == \"eigen\").sum()), int((goals[\"kant\"] == \"tegen\").sum())\n    return f\"{eigen}-{tegen}\" if thuis else f\"{tegen}-{eigen}\"\n\n\ndef analyseer(xml_path: Path, eigen_club: str | None = None) -> Analyse:\n    \"\"\"Van een MyVA-export naar alle tabellen van een wedstrijd.\"\"\"\n    wedstrijd = metadata.lees_wedstrijd(Path(xml_path), eigen_club)\n    instances, toegepast = correcties.pas_toe(inlezen.lees_instances(wedstrijd.bron), correcties.lees_correcties(wedstrijd.bron))\n    res = reeksen.bouw_reeksen(instances, wedstrijd=wedstrijd.naam)\n\n    meldingen = []\n    onbekend = inlezen.onbekende_codes(instances)\n    if not onbekend.empty:\n        lijst = \", \".join(f\"{code} ({n})\" for code, n in onbekend.items())\n        meldingen.append(\n            f\"Onbekende codes overgeslagen, die tellen nergens mee: {lijst}. \"\n            \"Hoort de knop bij het codeerschema, voeg hem dan toe aan CODE_MAP in invoer/inlezen.py.\"\n        )\n    gecodeerd = _uitslag_uit_codering(res.kansen, wedstrijd.thuis)\n    if not wedstrijd.uitslag:\n        wedstrijd = replace(wedstrijd, uitslag=gecodeerd)\n    elif wedstrijd.uitslag != gecodeerd:\n        meldingen.append(\n            f\"De uitslag {wedstrijd.uitslag} komt niet overeen met de goals in de codering ({gecodeerd}, thuisploeg eerst). \"\n            \"Controleer de uitslag, thuis of uit in meta.csv, en de Kans-goal-instances.\"\n        )\n\n    mk = markov.bereken(res.reeksen)\n    pat = patronen.bouw_patronen(res.reeksen, res.kansen, mk, wedstrijd.naam)\n    return Analyse(\n        wedstrijd=wedstrijd,\n        instances=instances,\n        reeksen=res.reeksen,\n        kansen=res.kansen,\n        niet_gekoppeld=res.niet_gekoppeld,\n        markov=mk,\n        regels=pat[\"regels\"],\n        verloop=pat[\"verloop\"],\n        tempo=pat[\"tempo\"],\n        correcties=toegepast,\n        meldingen=meldingen,\n    )\n\n\ndef per_team(analyses: list[Analyse]) -> tuple[dict[str, list[Analyse]], list[str]]:\n    \"\"\"De wedstrijden die gestapeld kunnen worden, per team, en meldingen over de rest.\n\n    Een wedstrijd zonder datum, team of tegenstander doet niet mee. Staat dezelfde\n    wedstrijd meer dan een keer bij een team, dan wordt dat team niet gestapeld.\n    \"\"\"\n    meldingen = []\n    groepen: dict[str, list[Analyse]] = defaultdict(list)\n    for a in analyses:\n        if a.wedstrijd.compleet:\n            groepen[a.wedstrijd.team].append(a)\n        else:\n            meldingen.append(f\"{a.wedstrijd.bron.name}: datum, team of tegenstander ontbreekt. Vul de regel in meta.csv in, dan telt deze wedstrijd mee in het seizoensbeeld.\")\n\n    stapelbaar = {}\n    for team, groep in sorted(groepen.items()):\n        namen = [a.wedstrijd.naam for a in groep]\n        dubbel = {n for n in namen if namen.count(n) > 1}\n        if dubbel:\n            bronnen = \", \".join(a.wedstrijd.bron.name for a in groep if a.wedstrijd.naam in dubbel)\n            meldingen.append(f\"{team}: dezelfde wedstrijd staat er meer dan een keer in ({bronnen}). Haal de oude export weg; er is geen seizoensbeeld gemaakt.\")\n        elif len(groep) >= 2:\n            stapelbaar[team] = groep\n        else:\n            meldingen.append(f\"{team}: een wedstrijd gevonden. Voor de PDF zijn minstens twee wedstrijden van hetzelfde team nodig.\")\n    return stapelbaar, meldingen\n", "myva_pipeline/uitvoer/__init__.py": "\"\"\"Uitvoer: bestanden schrijven en clips knippen.\"\"\"\n", "myva_pipeline/uitvoer/clips.py": "\"\"\"Clips snijden uit de wedstrijdvideo met ffmpeg.\n\nffmpeg komt mee via imageio-ffmpeg; een systeem-ffmpeg gaat voor als die er is.\nTijden in de XML zijn videoseconden van het bestand dat in MyVA op de tijdlijn\nstond, dus de video in de map moet datzelfde bestand zijn.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nimport shutil\nimport subprocess\nfrom pathlib import Path\n\nVIDEO_EXTENSIES = (\".mov\", \".mp4\", \".m4v\", \".mkv\", \".avi\", \".mts\")\nVOORLOOP_S = 3.0\nNALOOP_S = 2.0\nMAX_CLIP_S = 90.0\n\n\ndef ffmpeg_exe() -> str:\n    systeem = shutil.which(\"ffmpeg\")\n    if systeem:\n        return systeem\n    import imageio_ffmpeg\n\n    return imageio_ffmpeg.get_ffmpeg_exe()\n\n\ndef _datum_cijfers(naam: str) -> str | None:\n    m = re.match(r\"(\\d{4})[.\\-]?(\\d{2})[.\\-]?(\\d{2})\", naam)\n    return \"\".join(m.groups()) if m else None\n\n\ndef zoek_video(xml_path: Path, video_dir: Path) -> Path | None:\n    \"\"\"Video bij een XML: zelfde naam, anders de enige video, anders dezelfde datum.\"\"\"\n    videos = sorted(p for p in video_dir.iterdir() if p.suffix.lower() in VIDEO_EXTENSIES)\n    if not videos:\n        return None\n    for v in videos:\n        if v.stem == xml_path.stem:\n            return v\n    if len(videos) == 1:\n        return videos[0]\n    datum = _datum_cijfers(xml_path.stem)\n    kandidaten = [v for v in videos if datum and _datum_cijfers(v.stem) == datum]\n    return kandidaten[0] if len(kandidaten) == 1 else None\n\n\ndef clip_bestandsnaam(reeks_id: str) -> str:\n    return f\"{reeks_id}.mp4\"\n\n\ndef ffmpeg_commando(video: Path, start: float, end: float, uit: Path, snel: bool = False) -> list[str]:\n    \"\"\"Commando voor een clip van start tot end (videoseconden), met voor- en naloop.\n\n    snel=False: opnieuw coderen naar h264 720p, exact geknipt, klein bestand.\n    snel=True: stream copy, geen hercodering, knipt op het dichtstbijzijnde\n    keyframe en is daardoor tot een paar seconden onnauwkeurig.\n    \"\"\"\n    begin = max(0.0, start - VOORLOOP_S)\n    duur = min(end - start + VOORLOOP_S + NALOOP_S, MAX_CLIP_S)\n    cmd = [ffmpeg_exe(), \"-hide_banner\", \"-loglevel\", \"error\", \"-y\", \"-ss\", f\"{begin:.2f}\", \"-i\", str(video), \"-t\", f\"{duur:.2f}\"]\n    if snel:\n        cmd += [\"-c\", \"copy\", \"-avoid_negative_ts\", \"make_zero\"]\n    else:\n        cmd += [\n            \"-vf\", \"scale=-2:720\",\n            \"-c:v\", \"libx264\", \"-preset\", \"veryfast\", \"-crf\", \"23\", \"-pix_fmt\", \"yuv420p\",\n            \"-c:a\", \"aac\", \"-b:a\", \"96k\",\n            \"-movflags\", \"+faststart\",\n        ]\n    cmd.append(str(uit))\n    return cmd\n\n\ndef knip_clips(clips: list[dict], video: Path, uit_dir: Path, snel: bool = False, opnieuw: bool = False, melding=print) -> dict[str, Path]:\n    \"\"\"Knip elke clip (dict met reeks_id, start, end) naar uit_dir. Geeft reeks_id -> pad.\n\n    Een clip die al bestaat wordt overgeslagen, tenzij opnieuw=True.\n    \"\"\"\n    uit_dir.mkdir(parents=True, exist_ok=True)\n    paden: dict[str, Path] = {}\n    uniek: dict[str, dict] = {}\n    for c in clips:\n        uniek.setdefault(c[\"reeks_id\"], c)\n    totaal = len(uniek)\n    for n, (rid, c) in enumerate(uniek.items(), start=1):\n        uit = uit_dir / clip_bestandsnaam(rid)\n        if uit.exists() and not opnieuw:\n            paden[rid] = uit\n            continue\n        melding(f\"  clip {n}/{totaal}: {rid} ({c['start']:.0f} s)\")\n        resultaat = subprocess.run(ffmpeg_commando(video, c[\"start\"], c[\"end\"], uit, snel), capture_output=True, text=True)\n        if resultaat.returncode != 0 or not uit.exists():\n            melding(f\"  mislukt: {rid}: {resultaat.stderr.strip()[:200]}\")\n            continue\n        paden[rid] = uit\n    return paden\n", "myva_pipeline/uitvoer/schrijven.py": "\"\"\"Alle bestanden die de pijplijn schrijft. De weergave levert tekst of bytes, deze module zet ze op schijf.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\nfrom typing import Callable\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import seizoen\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.uitvoer import clips\nfrom myva_pipeline.weergave import onderbouwing, rapport, regeltekst, tabellen, trainerspagina, visueel\n\nMelding = Callable[[str], None]\n\n\n@dataclass\nclass Uitvoer:\n    rapport: Path\n    trainer_html: Path\n    trainer_md: Path\n    clips_xml: Path\n    feedback_template: Path\n    clip_dir: Path | None = None\n    features: list[Path] = field(default_factory=list)\n\n\n@dataclass\nclass SeizoenUitvoer:\n    seizoen: seizoen.Seizoen\n    pdf: Path\n    onderbouwing: Path | None = None\n\n\ndef _features_map(bron: Path, output_dir: Path) -> Path:\n    \"\"\"data/features als de XML in data/raw staat (ook in een submap), anders een map features in de uitvoermap.\"\"\"\n    for map_ in bron.resolve().parents:\n        if map_.name == \"raw\" and map_.parent.name == \"data\":\n            return map_.parent / \"features\"\n    return output_dir / \"features\"\n\n\ndef _schrijf_features(a: Analyse, features_dir: Path) -> list[Path]:\n    features_dir.mkdir(parents=True, exist_ok=True)\n    tabellen = {\n        \"instances\": a.instances.assign(labels=a.instances[\"labels\"].apply(\"|\".join)),\n        \"reeksen\": a.reeksen.drop(columns=[\"pad\"]),\n        \"kansen\": a.kansen,\n        \"regels\": regeltekst.met_tekst(a),\n    }\n    paden = []\n    for soort, tabel in tabellen.items():\n        pad = features_dir / f\"{a.wedstrijd.naam}_{soort}.csv\"\n        tabel.to_csv(pad, index=False)\n        paden.append(pad)\n    return paden\n\n\ndef _schrijf_feedback_template(a: Analyse, pad: Path) -> None:\n    regels = regeltekst.met_tekst(a)\n    sub = regels[regels[\"type\"].isin((\"pad\", \"conditie\"))].sort_values(\"score\", ascending=False)\n    pd.DataFrame(\n        {\"regel_id\": sub[\"id\"], \"wedstrijd\": a.wedstrijd.naam, \"oordeel\": \"\", \"opmerking\": \"\", \"tekst\": sub[\"tekst\"]}\n    ).to_csv(pad, index=False)\n\n\ndef _maak_feedback_csv(pad: Path) -> None:\n    if not pad.exists():\n        pad.parent.mkdir(parents=True, exist_ok=True)\n        pad.write_text(\"regel_id,wedstrijd,oordeel,opmerking\\n\", encoding=\"utf-8\")\n\n\ndef _knip_clips(inhoud: trainerspagina.Inhoud, video: Path, clip_dir: Path, snel: bool, opnieuw: bool, melding: Melding) -> dict[str, str]:\n    alle = trainerspagina.alle_clips(inhoud)\n    melding(f\"Clips knippen uit {video.name} ({len({c['reeks_id'] for c in alle})} clips) naar {clip_dir.name}/\")\n    geknipt = clips.knip_clips(alle, video, clip_dir, snel=snel, opnieuw=opnieuw, melding=melding)\n    return {rid: f\"{clip_dir.name}/{pad.name}\" for rid, pad in geknipt.items()}\n\n\ndef schrijf_wedstrijd(\n    a: Analyse,\n    output_dir: Path,\n    *,\n    feedback_pad: Path | None = None,\n    video_dir: Path | None = None,\n    snel: bool = False,\n    opnieuw: bool = False,\n    melding: Melding = print,\n) -> Uitvoer:\n    \"\"\"Rapport, trainerspagina, clips-XML, feedbacktemplate en tussentabellen van een wedstrijd.\"\"\"\n    output_dir = Path(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n    naam = a.wedstrijd.naam\n\n    uit = Uitvoer(\n        rapport=output_dir / f\"{naam}.md\",\n        trainer_html=output_dir / f\"{naam}_trainer.html\",\n        trainer_md=output_dir / f\"{naam}_trainer.md\",\n        clips_xml=output_dir / f\"{naam}_clips.xml\",\n        feedback_template=output_dir / f\"{naam}_feedback.csv\",\n    )\n    uit.rapport.write_text(rapport.render(a), encoding=\"utf-8\")\n    uit.features = _schrijf_features(a, _features_map(a.wedstrijd.bron, output_dir))\n    _schrijf_feedback_template(a, uit.feedback_template)\n    if feedback_pad is not None:\n        _maak_feedback_csv(Path(feedback_pad))\n\n    inhoud = trainerspagina.bouw_inhoud(a)\n    clip_map: dict[str, str] = {}\n    if video_dir is not None:\n        video = clips.zoek_video(a.wedstrijd.bron, Path(video_dir))\n        if video is None:\n            melding(f\"Geen video gevonden voor {a.wedstrijd.bron.name} in {video_dir}; clips overgeslagen.\")\n        else:\n            uit.clip_dir = output_dir / f\"{naam}_clips\"\n            clip_map = _knip_clips(inhoud, video, uit.clip_dir, snel, opnieuw, melding)\n\n    uit.trainer_md.write_text(trainerspagina.render_md(a, inhoud, clip_map), encoding=\"utf-8\")\n    uit.trainer_html.write_text(trainerspagina.render_html(a, inhoud, clip_map), encoding=\"utf-8\")\n    uit.clips_xml.write_text(trainerspagina.render_clips_xml(a, inhoud), encoding=\"utf-8\")\n    return uit\n\n\ndef schrijf_tabellen(analyses: list[Analyse], map_: Path) -> list[Path]:\n    \"\"\"De vaste tabellen als CSV, een bestand per tabel. Power BI leest ze via Gegevens ophalen > Map.\"\"\"\n    map_ = Path(map_)\n    map_.mkdir(parents=True, exist_ok=True)\n    paden = []\n    for naam, tabel in tabellen.tabellen(analyses).items():\n        pad = map_ / f\"{naam}.csv\"\n        tabel.to_csv(pad, index=False, encoding=\"utf-8-sig\")\n        paden.append(pad)\n    return paden\n\n\ndef schrijf_seizoen(s: seizoen.Seizoen, output_dir: Path, met_onderbouwing: bool = False) -> SeizoenUitvoer:\n    \"\"\"De PDF van een seizoensbeeld, en op verzoek de natelbare onderbouwing ernaast.\"\"\"\n    output_dir = Path(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n    uit = SeizoenUitvoer(seizoen=s, pdf=output_dir / f\"{s.naam}.pdf\")\n    uit.pdf.write_bytes(visueel.render_pdf(s))\n    if met_onderbouwing:\n        uit.onderbouwing = output_dir / f\"{s.naam}.md\"\n        uit.onderbouwing.write_text(onderbouwing.render_md(s), encoding=\"utf-8\")\n    return uit\n", "myva_pipeline/uitvoer/versturen.py": "\"\"\"Feedback uit het dashboard naar een webadres sturen.\n\nHet adres ontvangt een JSON-bericht als platte tekst en antwoordt met JSON: {\"ok\": true},\nof {\"ok\": false, \"fout\": \"...\"} als het de feedback niet kon bewaren. In de browser gaat het\nversturen via de browser zelf, omdat Python daar geen eigen netwerkverbinding heeft.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport base64\nimport json\nimport sys\nimport urllib.request\n\nSOORT = \"text/plain;charset=utf-8\"\nWACHTTIJD_S = 60\n\n\ndef beeld(naam: str, soort: str, inhoud: bytes) -> dict:\n    \"\"\"Een afbeelding in de vorm waarin het bericht hem meestuurt.\"\"\"\n    return {\"naam\": naam, \"soort\": soort, \"inhoud\": base64.b64encode(inhoud).decode(\"ascii\")}\n\n\ndef _controleer(antwoord: str) -> None:\n    try:\n        uitkomst = json.loads(antwoord)\n    except ValueError:\n        raise OSError(\"het adres gaf geen geldig antwoord\") from None\n    if not isinstance(uitkomst, dict) or not uitkomst.get(\"ok\"):\n        raise OSError(str(uitkomst.get(\"fout\", \"het adres nam de feedback niet aan\")) if isinstance(uitkomst, dict) else \"het adres nam de feedback niet aan\")\n\n\ndef verstuur(adres: str, bericht: dict) -> None:\n    \"\"\"Stuurt het bericht. Geeft een OSError als het adres het niet aanneemt of niet kon bewaren.\"\"\"\n    tekst = json.dumps(bericht)\n    if sys.platform == \"emscripten\":\n        from js import XMLHttpRequest\n\n        verzoek = XMLHttpRequest.new()\n        verzoek.open(\"POST\", adres, False)\n        verzoek.setRequestHeader(\"Content-Type\", SOORT)\n        try:\n            verzoek.send(tekst)\n        except Exception as fout:\n            raise OSError(str(fout)) from fout\n        if verzoek.status >= 400:\n            raise OSError(f\"het adres antwoordde met {verzoek.status}\")\n        _controleer(str(verzoek.responseText))\n        return\n    verzoek = urllib.request.Request(adres, data=tekst.encode(\"utf-8\"), headers={\"Content-Type\": SOORT})\n    with urllib.request.urlopen(verzoek, timeout=WACHTTIJD_S) as antwoord:\n        _controleer(antwoord.read().decode(\"utf-8\", errors=\"replace\"))\n", "myva_pipeline/uitvoer/webpagina.py": "\"\"\"Het dashboard als een webpagina die in de browser zelf draait, zonder server.\n\nDe pagina bevat de code van het pakket en laat de browser Python uitvoeren (stlite).\nWat een gebruiker erin sleept, blijft op zijn eigen computer.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom myva_pipeline.weergave import visueel\n\nSTLITE_VERSIE = \"1.9.2\"\nPAKKETTEN = [\"pandas\", \"numpy\", \"scipy\", \"matplotlib\", \"altair\"]\nPAKKET = Path(__file__).resolve().parents[1]\n\n# Streamlit voert dit bestand bij elke klik opnieuw uit; het dashboard is een module in het pakket.\nSTART = (\n    \"import os\\nimport runpy\\nimport sys\\n\\nos.environ['MYVA_WEDSTRIJDKAART'] = {kaart!r}\\nos.environ['MYVA_FEEDBACK_ADRES'] = {feedback!r}\\n\"\n    \"sys.path.insert(0, '.')\\nrunpy.run_module('myva_pipeline.dashboard', run_name='__main__')\\n\"\n)\n\nTHEMA = {\n    \"theme.base\": \"light\",\n    \"theme.primaryColor\": visueel.GROEN,\n    \"theme.backgroundColor\": \"#FFFFFF\",\n    \"theme.secondaryBackgroundColor\": visueel.VLAK,\n    \"theme.textColor\": visueel.INKT,\n    \"client.toolbarMode\": \"minimal\",\n}\n\nSJABLOON = \"\"\"<!doctype html>\n<html lang=\"nl\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\" />\n    <title>MyVA-dashboard<\/title>\n    <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@stlite/browser@{versie}/build/stlite.css\" />\n  <\/head>\n  <body>\n    <div id=\"root\"><\/div>\n    <script type=\"module\">\n      import {{ mount }} from \"https://cdn.jsdelivr.net/npm/@stlite/browser@{versie}/build/stlite.js\";\n      mount({instellingen}, document.getElementById(\"root\"));\n    <\/script>\n  <\/body>\n<\/html>\n\"\"\"\n\n\ndef bronbestanden() -> dict[str, str]:\n    \"\"\"De code van het pakket, per pad vanaf de map boven het pakket.\"\"\"\n    return {pad.relative_to(PAKKET.parent).as_posix(): pad.read_text(encoding=\"utf-8\") for pad in sorted(PAKKET.rglob(\"*.py\"))}\n\n\ndef render_webpagina(wedstrijdkaart: bool = True, feedback_adres: str = \"\") -> str:\n    start = START.format(kaart=\"1\" if wedstrijdkaart else \"0\", feedback=feedback_adres)\n    instellingen = {\"requirements\": PAKKETTEN, \"entrypoint\": \"app.py\", \"files\": bronbestanden() | {\"app.py\": start}, \"streamlitConfig\": THEMA}\n    # De code staat als tekst in een scriptblok; \"<\/\" zou dat blok voortijdig sluiten.\n    return SJABLOON.format(versie=STLITE_VERSIE, instellingen=json.dumps(instellingen).replace(\"<\/\", \"<\\\\/\"))\n\n\ndef schrijf_webpagina(map_: Path, wedstrijdkaart: bool = True, feedback_adres: str = \"\") -> Path:\n    map_.mkdir(parents=True, exist_ok=True)\n    pad = map_ / \"index.html\"\n    pad.write_text(render_webpagina(wedstrijdkaart, feedback_adres), encoding=\"utf-8\")\n    return pad\n", "myva_pipeline/weergave/__init__.py": "\"\"\"Weergave: van analyse naar tekst, pagina's en grafieken. Schrijft niets naar schijf.\"\"\"\n", "myva_pipeline/weergave/conclusies.py": "\"\"\"Conclusies in voetbaltaal, met clips, voor de trainerspagina.\n\nEen conclusie is een dict: titel, zin, zekerheid, clips (lijst van reeksen met\nvideotijd) en regel_id. Welke verschillen opvallen bepaalt de analyse; de zinnen\nkomen uit teksten.WEDSTRIJD_SJABLONEN en de getallen zijn de tellingen uit de regels.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.patronen import opvallende_condities, speelminuut\nfrom myva_pipeline.model.reeksen import schotmomenten\nfrom myva_pipeline.weergave import taal\nfrom myva_pipeline.weergave.teksten import WEDSTRIJD_SJABLONEN\n\nMAX_CLIPS_TEKST = 12\n\n\ndef videotijd(seconden: float) -> str:\n    s = int(round(seconden))\n    return f\"{s // 3600}:{(s % 3600) // 60:02d}:{s % 60:02d}\"\n\n\ndef ratio(a: int, b: int) -> str:\n    \"\"\"'1 op 4' voor 16 van 64. Bij a = 0: 'geen'.\"\"\"\n    if a == 0 or b == 0:\n        return \"geen\"\n    n = round(b / a)\n    return \"bijna elke keer\" if n <= 1 else f\"1 op {n}\"\n\n\ndef _clips(reeks_ids: list[str], reeksen: pd.DataFrame, namen: dict) -> list[dict]:\n    ridx = reeksen.set_index(\"reeks_id\")\n    uit = []\n    for rid in reeks_ids:\n        if rid not in ridx.index:\n            continue\n        r = ridx.loc[rid]\n        uit.append(\n            {\n                \"reeks_id\": rid,\n                \"helft\": int(r[\"helft\"]) if r[\"helft\"] is not None and not pd.isna(r[\"helft\"]) else None,\n                \"minuut\": speelminuut(r[\"start_min\"]) if r[\"start_min\"] is not None else None,\n                \"start\": float(r[\"start\"]),\n                \"end\": float(r[\"end\"]),\n                \"videotijd\": videotijd(float(r[\"start\"])),\n                \"teamfunctie\": namen[r[\"hoofdfunctie\"]],\n                \"verloop\": taal.pad_leesbaar(r[\"pad_str\"]).replace(\", \", \" > \") if r[\"pad_str\"] else \"geen fase\",\n                \"eind\": taal.EIND_UITLEG.get(str(r[\"eind\"]), \"einde zonder label\") if r[\"eind\"] is not None and not pd.isna(r[\"eind\"]) else \"einde zonder label\",\n            }\n        )\n    return sorted(uit, key=lambda c: c[\"start\"])\n\n\ndef conclusie_uit_regel(regel: pd.Series, reeksen: pd.DataFrame, namen: dict) -> dict:\n    titel, zin = WEDSTRIJD_SJABLONEN[(regel[\"vergelijking\"], regel[\"kant\"], regel[\"uitkomst_code\"])]\n    a1, b1, a2, b2 = int(regel[\"a\"]), int(regel[\"b\"]), int(regel[\"a2\"]), int(regel[\"b2\"])\n    velden = {\n        \"a1\": a1, \"b1\": b1, \"a2\": a2, \"b2\": b2,\n        \"r1\": ratio(a1, b1), \"r2\": ratio(a2, b2),\n        \"tegen\": namen[\"tegenstander\"], \"team\": namen[\"team\"],\n    }\n    hoogste_is_a = (a1 / b1 if b1 else 0) >= (a2 / b2 if b2 else 0)\n    clip_ids = regel[\"clips_a\"] if hoogste_is_a else regel[\"clips_b\"]\n    return {\n        \"titel\": titel.format(**velden),\n        \"zin\": zin.format(**velden),\n        \"zekerheid\": float(regel[\"zekerheid\"]),\n        \"regel_id\": regel[\"id\"],\n        \"clips\": _clips(list(clip_ids), reeksen, namen),\n        \"vergelijking\": regel[\"vergelijking\"],\n    }\n\n\ndef conclusie_schoten(kansen: pd.DataFrame, namen: dict) -> dict:\n    \"\"\"Altijd de eerste conclusie: waar de schoten van beide teams vandaan kwamen.\"\"\"\n    k = schotmomenten(kansen)\n    tegen_s = k[k[\"kant\"] == \"tegen\"]\n    eigen = k[k[\"kant\"] == \"eigen\"]\n\n    def top(sub):\n        if sub.empty:\n            return (\"\", 0)\n        t = sub[\"herkomst\"].value_counts()\n        return (str(t.index[0]), int(t.iloc[0]))\n\n    hk_t, n_t = top(tegen_s)\n    hk_e, n_e = top(eigen)\n    zin = (\n        f\"{namen['tegenstander']} kwam {len(tegen_s)} keer tot een schot, wij {len(eigen)} keer. \"\n        f\"{n_t} van hun {len(tegen_s)} schoten kwamen uit {taal.herkomst_naam(hk_t, namen)}. \"\n        f\"{n_e} van onze {len(eigen)} schoten kwamen uit {taal.herkomst_naam(hk_e, namen)}.\"\n    )\n    return {\"titel\": \"Waar de schoten vandaan kwamen\", \"zin\": zin, \"zekerheid\": 1.0, \"regel_id\": None, \"clips\": [], \"vergelijking\": \"herkomst\"}\n\n\ndef bouw_conclusies(regels: pd.DataFrame, reeksen: pd.DataFrame, kansen: pd.DataFrame, namen: dict) -> list[dict]:\n    opvallend = [conclusie_uit_regel(regel, reeksen, namen) for _, regel in opvallende_condities(regels).iterrows()]\n    return [conclusie_schoten(kansen, namen)] + opvallend\n\n\ndef goals_met_clips(kansen: pd.DataFrame, reeksen: pd.DataFrame, namen: dict, thuis: bool = True) -> list[dict]:\n    \"\"\"Goals op volgorde met de stand erbij, thuisploeg eerst.\"\"\"\n    k = kansen[kansen[\"soort\"] == \"goal\"].sort_values(\"start\")\n    voor = tegen = 0\n    uit = []\n    for _, g in k.iterrows():\n        if g[\"kant\"] == \"eigen\":\n            voor += 1\n        else:\n            tegen += 1\n        clips = _clips([g[\"reeks_id\"]], reeksen, namen) if g[\"reeks_id\"] is not None and not pd.isna(g[\"reeks_id\"]) else []\n        uit.append(\n            {\n                \"stand\": f\"{voor}-{tegen}\" if thuis else f\"{tegen}-{voor}\",\n                \"wie\": namen[\"team\"] if g[\"kant\"] == \"eigen\" else namen[\"tegenstander\"],\n                \"helft\": int(g[\"helft\"]) if g[\"helft\"] is not None and not pd.isna(g[\"helft\"]) else None,\n                \"minuut\": speelminuut(g[\"start_min\"]) if g[\"start_min\"] is not None else None,\n                \"herkomst\": taal.herkomst_naam(g[\"herkomst\"], namen),\n                \"verloop\": clips[0][\"verloop\"] if clips else \"\",\n                \"videotijd\": videotijd(float(g[\"start\"])),\n                \"start\": float(g[\"start\"]),\n                \"clips\": clips,\n            }\n        )\n    return uit\n", "myva_pipeline/weergave/formulering.py": "\"\"\"Van bevinding naar tekst: kiest het sjabloon bij de uitkomst en vult de tellingen in.\n\nEen bevinding uit analyse.seizoen bevat alleen tellingen. `formuleer` geeft de zinnen\nerbij: titel, kernzin, stuurpunt en meetpunt. Er wordt geen tekst bedacht; elke zin\nstaat in teksten.py.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.seizoen import FAMILIE, Aanvalskant, BalverliesZone, SchotenHerkomst, Verschil\nfrom myva_pipeline.weergave import teksten as tk\n\nSTERK_ZEKERHEID = 0.975\nTEAMS_TEGENOVER_ELKAAR = (\"teams_omschakeling\", \"teams_opbouw\", \"doeltrap_teams\", \"achter_blok_teams\", \"teams_druk\", \"corner\", \"vrije_trap\", \"ingooi\")\n\n\n@dataclass(frozen=True)\nclass Formulering:\n    titel: str\n    kernzin: str  # de tellingen in een of twee zinnen\n    zin: str  # de kernzin met de steun per wedstrijd erbij, voor de onderbouwing\n    stuur: str  # de eerste zin is een opdracht en staat op de pagina\n    tel: str  # meetpunt: wat je telt\n    nu: str  # meetpunt: waar het nu staat\n    doel: str  # meetpunt: wat het doel is\n    gezien: str\n    sterkte: str\n    # Alleen bij een vergelijking: de namen van de twee groepen, de paneeltitel en de kleur per groep.\n    label_a: str = \"\"\n    label_b: str = \"\"\n    kort_a: str = \"\"\n    kort_b: str = \"\"\n    maat: str = \"\"\n    kleuren: tuple[str, str] = (\"eigen\", \"tegen\")\n\n    @property\n    def meetpunt(self) -> str:\n        return tk.meetpunt(self.tel, self.nu, self.doel)\n\n    @property\n    def stuur_kort(self) -> str:\n        return self.stuur.split(\". \")[0].rstrip(\".\")\n\n\ndef procent(a: int, b: int) -> int:\n    \"\"\"Heel percentage, een half altijd naar boven: 22,5 wordt 23 en 57,5 wordt 58.\"\"\"\n    return int(100 * a / b + 0.5) if b else 0\n\n\ndef zeker_tekst(zekerheid: float) -> str:\n    if pd.isna(zekerheid):\n        return \"n.v.t.\"\n    return \"meer dan 99%\" if zekerheid > 0.99 else f\"{int(100 * zekerheid + 0.5)}%\"\n\n\ndef ingevuld(zin: str, a1: int, b1: int, a2: int, b2: int) -> str:\n    return zin.format(a1=int(a1), b1=int(b1), a2=int(a2), b2=int(b2), p1=procent(a1, b1), p2=procent(a2, b2))\n\n\ndef kleur_groepen(vergelijking: str, kant: str) -> tuple[str, str]:\n    \"\"\"Welke kleur de twee groepen krijgen: die van het eigen team of die van de tegenstander.\"\"\"\n    if vergelijking in TEAMS_TEGENOVER_ELKAAR:\n        return (\"eigen\", \"tegen\")\n    if vergelijking in FAMILIE:\n        return (\"eigen\", \"eigen\")\n    return (kant, kant) if kant in (\"eigen\", \"tegen\") else (\"eigen\", \"eigen\")\n\n\ndef _verschil(b: Verschil) -> Formulering:\n    sleutel = (b.vergelijking, b.kant, b.uitkomst_code)\n    sj = tk.SJABLONEN[sleutel]\n    tellingen = (b.a1, b.b1, b.a2, b.b2)\n    hoger = b.richting > 0\n    zin_a, zin_b = ingevuld(sj.zin_a, *tellingen), ingevuld(sj.zin_b, *tellingen)\n    return Formulering(\n        titel=sj.titel_hoger if hoger else sj.titel_lager,\n        kernzin=f\"{zin_a}. {zin_b}.\",\n        zin=f\"{zin_a}. {zin_b}. \" + tk.ZELFDE_VERSCHIL.format(steun=b.steun, telbaar=b.telbaar),\n        stuur=sj.stuur_hoger if hoger else sj.stuur_lager,\n        tel=sj.tel,\n        nu=f\"{sj.kort_a} {b.a1} van de {b.b1} ({procent(b.a1, b.b1)}%), {sj.kort_b} {b.a2} van de {b.b2} ({procent(b.a2, b.b2)}%)\",\n        doel=sj.doel_hoger if hoger else sj.doel_lager,\n        gezien=tk.GEZIEN.format(steun=b.steun, telbaar=b.telbaar),\n        sterkte=tk.STERK_PATROON if b.zekerheid >= STERK_ZEKERHEID else tk.AANWIJZING,\n        label_a=sj.label_a, label_b=sj.label_b, kort_a=sj.kort_a, kort_b=sj.kort_b,\n        maat=tk.MAAT[sleutel],\n        kleuren=kleur_groepen(b.vergelijking, b.kant),\n    )\n\n\ndef _herkomst(b: SchotenHerkomst) -> Formulering:\n    h = b.tabel\n    n_tegen = int(h.loc[b.top_tegen, \"schoten_tegen\"])\n    velden = {\n        \"bron_tegen\": tk.SITUATIE_IN_ZIN[b.top_tegen] + (tk.NA_ONS_BALVERLIES if b.top_tegen == \"omschakeling\" else \"\"),\n        \"bron_voor\": tk.SITUATIE_IN_ZIN[b.top_voor],\n        \"n_tegen\": n_tegen, \"schoten_tegen\": int(h[\"schoten_tegen\"].sum()),\n        \"goals_top\": int(h.loc[b.top_tegen, \"goals_tegen\"]), \"goals_tegen\": int(h[\"goals_tegen\"].sum()),\n        \"n_voor\": int(h.loc[b.top_voor, \"schoten_voor\"]), \"schoten_voor\": int(h[\"schoten_voor\"].sum()),\n        \"steun\": b.steun, \"wedstrijden\": b.telbaar, \"per_wedstrijd\": f\"{n_tegen / b.telbaar:.0f}\",\n    }\n    sj = {sleutel: zin.format(**velden) for sleutel, zin in tk.HERKOMST.items()}\n    stuur = tk.HERKOMST_STUUR.get(b.top_tegen, tk.HERKOMST_STUUR_ANDERS.format(bron=tk.SITUATIE_IN_ZIN[b.top_tegen]))\n    return Formulering(\n        titel=sj[\"titel\"], kernzin=sj[\"kernzin\"], zin=f\"{sj['kernzin']} {sj['steun']}\", stuur=stuur,\n        tel=sj[\"tel\"], nu=sj[\"nu\"], doel=sj[\"doel\"], gezien=sj[\"gezien\"], sterkte=tk.TELLING,\n    )\n\n\ndef _balverlies(b: BalverliesZone) -> Formulering:\n    z = b.zones\n    n_zone = int(z.loc[b.top, \"balverlies\"])\n    zone_lang = tk.ZONE_IN_ZIN[b.top]\n    velden = {\n        \"zone\": zone_lang.split(\" (\")[0], \"zone_lang\": zone_lang,\n        \"balverlies\": int(z[\"balverlies\"].sum()), \"n_zone\": n_zone,\n        \"schoten_zone\": int(z.loc[b.top, \"schot_tegen\"]), \"schoten\": int(z[\"schot_tegen\"].sum()),\n        \"balverlies_oms\": b.omschakeling[\"balverlies\"], \"schoten_oms\": b.omschakeling[\"schot_tegen\"],\n        \"wedstrijden\": b.wedstrijden, \"per_wedstrijd\": f\"{n_zone / b.wedstrijden:.0f}\",\n    }\n    sj = {sleutel: zin.format(**velden) for sleutel, zin in tk.BALVERLIES.items()}\n    return Formulering(\n        titel=sj[\"titel\"], kernzin=sj[\"kernzin\"], zin=f\"{sj['kernzin']} {sj['omschakeling']}\", stuur=sj[\"stuur\"],\n        tel=sj[\"tel\"], nu=sj[\"nu\"], doel=sj[\"doel\"], gezien=sj[\"gezien\"], sterkte=tk.TELLING,\n    )\n\n\ndef _aanvalskant(b: Aanvalskant) -> Formulering:\n    t = b.tabel\n    velden = {\n        \"kant\": b.kant, \"ander\": b.ander, \"zijkant\": tk.ZIJKANT[b.kant], \"andere_zijkant\": tk.ZIJKANT[b.ander],\n        \"langs_links\": int(t[\"langs_links\"].sum()), \"langs_rechts\": int(t[\"langs_rechts\"].sum()),\n        \"voorzet_links\": int(t[\"voorzet_links\"].sum()), \"voorzet_rechts\": int(t[\"voorzet_rechts\"].sum()),\n        \"links\": b.links, \"rechts\": b.rechts, \"steun\": b.steun, \"telbaar\": b.telbaar,\n    }\n    sj = {sleutel: zin.format(**velden) for sleutel, zin in tk.AANVALSKANT.items()}\n    return Formulering(\n        titel=sj[\"titel\"], kernzin=sj[\"kernzin\"], zin=sj[\"kernzin\"], stuur=sj[\"stuur\"],\n        tel=sj[\"tel\"], nu=sj[\"nu\"], doel=sj[\"doel\"], gezien=tk.GEZIEN.format(steun=b.steun, telbaar=b.telbaar), sterkte=tk.TELLING,\n    )\n\n\n_PER_SOORT = {\"vergelijking\": _verschil, \"herkomst\": _herkomst, \"balverlies\": _balverlies, \"aanvalskant\": _aanvalskant}\n\n\ndef formuleer(bevinding: Verschil | SchotenHerkomst | BalverliesZone | Aanvalskant) -> Formulering:\n    \"\"\"De zinnen bij een bevinding. Kiest op `soort`, zodat het ook werkt als de code in een draaiend dashboard opnieuw is geladen.\"\"\"\n    try:\n        return _PER_SOORT[bevinding.soort](bevinding)\n    except (AttributeError, KeyError):\n        raise TypeError(f\"Geen formulering voor {type(bevinding).__name__}\") from None\n", "myva_pipeline/weergave/onderbouwing.py": "\"\"\"De natelbare onderbouwing van het seizoensbeeld als markdown.\n\nPure weergave van een `seizoen.Seizoen`: elke bevinding met de tellingen per wedstrijd,\nalle vergelijkingen, de drempels en de tekst over betrouwbaarheid.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.patronen import speelminuut\nfrom myva_pipeline.analyse.seizoen import INGEBAKKEN, BalverliesZone, Seizoen\nfrom myva_pipeline.analyse.vergelijkingen import KOPPEL_NA_S, KOPPEL_VOOR_S\nfrom myva_pipeline.weergave.formulering import formuleer, ingevuld, zeker_tekst\nfrom myva_pipeline.weergave.teksten import BEGRIPPEN, SITUATIE_LABEL, SJABLONEN, ZONE_LABEL\n\nBETROUWBAARHEID = [\n    \"Alles in dit document is een telling uit de MyVA-codering van de wedstrijden. Er zit geen interpretatie van beelden in.\",\n    \"Een verschil staat er alleen in als twee dingen kloppen. Opgeteld over alle wedstrijden is de kans groot genoeg dat het verschil echt bestaat. En we zagen hetzelfde verschil in de meeste losse wedstrijden terug. De grenzen staan hiernaast.\",\n    \"Bij een klein aantal wedstrijden is een bevinding een reden om beelden terug te kijken, geen vaststaand feit. Met elke wedstrijd erbij wordt het beeld steviger.\",\n    \"De tellingen zeggen wat er gebeurde, niet waarom. De sterkte van de tegenstander, de stand en de opstelling zijn niet meegewogen.\",\n    \"De codering is mensenwerk en mogelijk door verschillende mensen gedaan. Wat niet in elke wedstrijd op dezelfde manier is gecodeerd, doet niet mee.\",\n]\n\n\ndef _videotijd(seconden: float) -> str:\n    t = int(round(seconden))\n    return f\"{t // 3600}:{(t % 3600) // 60:02d}:{t % 60:02d}\"\n\n\ndef _balverlies_md(s: Seizoen, b: BalverliesZone) -> list[str]:\n    \"\"\"Tabel per zone en de momenten om terug te kijken: elk balverlies waarna een schot tegen viel.\"\"\"\n    delen = [\"| Zone van het balverlies | Balverlies | Daarna eindfase tegenstander | Daarna schot tegen | waarvan goal |\", \"|---|---|---|---|---|\"]\n    delen += [f\"| {ZONE_LABEL[zone]} | {r['balverlies']} | {r['eindfase_tegen']} | {r['schot_tegen']} | {r['goal_tegen']} |\" for zone, r in b.zones.iterrows()]\n    o = b.omschakeling\n    delen += [f\"| In onze eigen omschakeling | {o['balverlies']} | {o['eindfase_tegen']} | {o['schot_tegen']} | |\", \"\"]\n    delen.append(f\"{b.gekoppeld} van de {b.totaal} keer balverlies zijn gekoppeld aan een omschakeling van de tegenstander die begon tussen {KOPPEL_VOOR_S:g} seconden voor en {str(KOPPEL_NA_S).replace('.', ',')} seconden na het einde van onze reeks.\")\n    momenten = s.balverlies[s.balverlies[\"av_schot\"]].sort_values([\"wedstrijd\", \"videotijd\"])\n    delen += [\"\", \"Terugkijken in MyVA, balverlies waarna een schot tegen viel:\", \"\"]\n    for _, m_ in momenten.iterrows():\n        helft = f\"{int(m_['helft'])}e helft {speelminuut(m_['start_min'])}e minuut\" if m_[\"helft\"] is not None and not pd.isna(m_[\"helft\"]) else \"helft onbekend\"\n        waar = ZONE_LABEL[m_[\"zone\"]].lower() if m_[\"soort\"] == \"opbouw\" else \"onze omschakeling na balverovering\"\n        delen.append(f\"- {m_['titel']}, {helft}, video rond {_videotijd(m_['videotijd'])}: balverlies in {waar}{', goal tegen' if m_['av_goal'] else ''}. Reeks {m_['reeks_id']}.\")\n    delen.append(\"\")\n    return delen\n\n\ndef render_md(s: Seizoen) -> str:\n    \"\"\"Natelbare onderbouwing van het seizoensbeeld: elke conclusie met de tellingen per wedstrijd.\"\"\"\n    w = s.wedstrijden\n    delen = [\n        f\"# {s.team}: beeld over {len(w)} wedstrijden\", \"\",\n        f\"{w['datum'].iloc[0]} tot en met {w['datum'].iloc[-1]}. Alle getallen zijn opgetelde tellingen uit de MyVA-coderingen. \"\n        f\"Een verschil wordt een bevinding als het in de opgetelde tellingen minstens {100 * s.drempels.zekerheid:g}% zeker is, \"\n        f\"in minstens {100 * s.drempels.steun:g}% van de telbare wedstrijden dezelfde kant op wijst, in minstens {s.drempels.wedstrijden} wedstrijden telbaar is \"\n        f\"en per groep minstens {s.drempels.groep} waarnemingen heeft. Er is geen maximum aantal bevindingen.\", \"\",\n        \"## Wedstrijden\", \"\",\n        \"| Wedstrijd | Datum | Schoten voor-tegen | Eindfases voor-tegen | Reeksen |\", \"|---|---|---|---|---|\",\n    ]\n    delen += [f\"| {r['titel']} | {r['datum']} | {r['schoten_voor']}-{r['schoten_tegen']} | {r['eindfase_voor']}-{r['eindfase_tegen']} | {r['reeksen']} |\" for _, r in w.iterrows()]\n    delen += [\"\", \"## Conclusies\", \"\"]\n    for i, b in enumerate(s.bevindingen, start=1):\n        f = formuleer(b)\n        delen += [f\"### {i}. {f.titel}\", \"\", f.zin, \"\", f\"**Stuur op.** {f.stuur}\", \"\", f\"**Meetpunt volgende wedstrijd.** {f.meetpunt}\", \"\"]\n        if b.soort == \"balverlies\":\n            delen += _balverlies_md(s, b)\n        if b.soort == \"aanvalskant\":\n            delen += [\"| Wedstrijd | Langs het blok links | rechts | Voorzetten links | rechts |\", \"|---|---|---|---|---|\"]\n            delen += [f\"| {r['titel']} | {r['langs_links']} | {r['langs_rechts']} | {r['voorzet_links']} | {r['voorzet_rechts']} |\" for _, r in b.tabel.iterrows()]\n            delen.append(\"\")\n        if b.soort == \"vergelijking\":\n            delen.append(f\"Hoe zeker: {zeker_tekst(b.zekerheid)}. Dat is de kans dat dit verschil echt bestaat en geen toeval is ({f.sterkte.lower()}).\")\n            delen += [\"\", f\"| Wedstrijd | {f.label_a} | {f.label_b} | Zelfde verschil gezien |\", \"|---|---|---|---|\"]\n            for d in b.per_wedstrijd:\n                oordeel = \"te weinig om te vergelijken\" if not d.telt else (\"ja\" if d.zelfde else \"nee\")\n                delen.append(f\"| {d.titel} | {d.a1} van {d.b1} | {d.a2} van {d.b2} | {oordeel} |\")\n            delen.append(\"\")\n    if s.verwant:\n        delen += [\"## Verwante verschillen\", \"\", \"Deze halen de drempels ook, maar gaan over hetzelfde onderwerp als een bevinding hierboven.\", \"\"] + [f\"- {formuleer(v).titel}. {formuleer(v).zin} Hoe zeker: {zeker_tekst(v.zekerheid)}.\" for v in s.verwant] + [\"\"]\n\n    h = s.herkomst\n    delen += [\"## Schoten en goals per spelsituatie\", \"\", \"| Spelsituatie | Schoten voor | waarvan goals | Schoten tegen | waarvan goals |\", \"|---|---|---|---|---|\"]\n    delen += [f\"| {SITUATIE_LABEL[idx]} | {r['schoten_voor']} | {r['goals_voor']} | {r['schoten_tegen']} | {r['goals_tegen']} |\" for idx, r in h.iterrows()]\n\n    delen += [\"\", \"## Alle vergelijkingen\", \"\", \"Zekerheid: de kans dat het verschil echt bestaat en geen toeval is. Zelfde verschil: in hoeveel van de vergelijkbare wedstrijden het verschil dezelfde kant op wees.\", \"\", \"| Vergelijking | Zekerheid | Zelfde verschil gezien in |\", \"|---|---|---|\"]\n    for _, v in s.vergelijkingen.iterrows():\n        sj = SJABLONEN.get((v[\"vergelijking\"], v[\"kant\"], v[\"uitkomst_code\"]))\n        naam = f\"{sj.label_a} tegenover {sj.label_b}\" if sj else f\"{v['vergelijking']} {v['kant']} {v['uitkomst_code']}\"\n        if sj:\n            tellingen = (v[\"a1\"], v[\"b1\"], v[\"a2\"], v[\"b2\"])\n            naam += f\": {ingevuld(sj.zin_a, *tellingen)}; {ingevuld(sj.zin_b, *tellingen)}\"\n        zeker = zeker_tekst(v[\"zekerheid\"])\n        delen.append(f\"| {naam} | {zeker} | {v['steun']} van {v['telbaar']} |\")\n\n    delen += [\"\", \"## Niet als bevinding opgenomen\", \"\", \"Deze vergelijkingen worden nooit een bevinding, ook niet als ze de drempels halen. De uitkomst zit ingebakken in het fasemodel en zegt daarom niets over het team. In hun plaats staat de vergelijking met de tegenstander in de tabel hierboven.\", \"\"]\n    for _, v in s.vergelijkingen.iterrows():\n        reden = INGEBAKKEN.get((v[\"vergelijking\"], v[\"uitkomst_code\"]))\n        sj = SJABLONEN.get((v[\"vergelijking\"], v[\"kant\"], v[\"uitkomst_code\"]))\n        if reden and sj:\n            tellingen = (v[\"a1\"], v[\"b1\"], v[\"a2\"], v[\"b2\"])\n            delen.append(f\"- {ingevuld(sj.zin_a, *tellingen)}; {ingevuld(sj.zin_b, *tellingen)}. Reden om het niet op te nemen: {reden}.\")\n\n    g = s.gevoeligheid\n    delen += [\n        \"\", \"## Hoeveel bevindingen bij andere drempels\", \"\",\n        \"Rijen: minimale zekerheid. Kolommen: minimaal aandeel wedstrijden dat dezelfde kant op wijst. In de cel het aantal verschillen dat een bevinding wordt, zonder de vaste tellingen.\", \"\",\n        \"| Zekerheid | \" + \" | \".join(f\"steun {k}\" for k in g.columns) + \" |\", \"|---|\" + \"---|\" * len(g.columns),\n    ]\n    delen += [f\"| {idx} | \" + \" | \".join(str(int(x)) for x in rij) + \" |\" for idx, rij in g.iterrows()]\n\n    let_op = [f\"- {a.wedstrijd.titel}: {m_}\" for a in s.analyses for m_ in a.meldingen]\n    delen += [\"\", \"## Begrippen\", \"\"] + [f\"- **{naam}**: {uitleg}\" for naam, uitleg in BEGRIPPEN]\n    delen += [\"\", \"## Betrouwbaarheid en interpretatie\", \"\"] + [f\"- {b}\" for b in BETROUWBAARHEID] + let_op + [\n        \"- Een aanval waarin zowel door het blok (F2A) als achter het blok (F2C) voorkomt, telt in beide groepen mee.\",\n        \"- De opmerkingen per wedstrijd staan in de losse wedstrijdrapporten.\", \"\",\n    ]\n    return \"\\n\".join(delen)\n", "myva_pipeline/weergave/rapport.py": "\"\"\"Het volledige wedstrijdrapport in markdown.\n\nBovenaan kort en concreet, daaronder alle tellingen. Elk modelgetal staat\nnaast de telling waar het uit komt.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import patronen as pt\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.domein import AANVALLEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA, REEKS_FUNCTIES, STRUCTUUR, VERDEDIGEN\nfrom myva_pipeline.model import markov as m\nfrom myva_pipeline.model.reeksen import schotmomenten\nfrom myva_pipeline.weergave import taal\nfrom myva_pipeline.weergave.regeltekst import met_tekst\n\nFASE_UITLEG = taal.FASE_UITLEG\nEIND_UITLEG = taal.EIND_UITLEG\nZEKERHEID_DREMPEL = 0.80\nECHT_DREMPEL = 0.90\n\n\ndef _tabel(df: pd.DataFrame, index: bool = True) -> str:\n    kolommen = ([df.index.name or \"\"] if index else []) + [str(c) for c in df.columns]\n    regels = [\"| \" + \" | \".join(kolommen) + \" |\", \"|\" + \"|\".join([\"---\"] * len(kolommen)) + \"|\"]\n    for idx, rij in df.iterrows():\n        cellen = ([str(idx)] if index else []) + [_cel(v) for v in rij]\n        regels.append(\"| \" + \" | \".join(cellen) + \" |\")\n    return \"\\n\".join(regels)\n\n\ndef _cel(v) -> str:\n    if v is None or (isinstance(v, float) and pd.isna(v)):\n        return \"\"\n    return f\"{v:.2f}\" if isinstance(v, float) else str(v)\n\n\ndef _pct(a, b) -> str:\n    return f\"{100 * a / b:.0f}%\" if b else \"n.v.t.\"\n\n\ndef _pct_cel(v) -> str:\n    return \"\" if v is None or pd.isna(v) else f\"{100 * float(v):.0f}%\"\n\n\ndef _minuut(start_min) -> str:\n    return f\"{pt.speelminuut(start_min)}e minuut\" if start_min is not None and not pd.isna(start_min) else \"?\"\n\n\ndef _helft(h) -> str:\n    return f\"{int(h)}e helft\" if h is not None and not pd.isna(h) else \"?\"\n\n\ndef _lijst(sub: pd.DataFrame, met_id: bool = True) -> str:\n    if sub.empty:\n        return \"Geen.\"\n    if met_id:\n        return \"\\n\".join(f\"{i}. {r['tekst']}  \\n   `{r['id']}`\" for i, (_, r) in enumerate(sub.iterrows(), start=1))\n    return \"\\n\".join(f\"- {r['tekst']}\" for _, r in sub.iterrows())\n\n\ndef _scoreverloop(a: Analyse) -> list[str]:\n    w, namen = a.wedstrijd, taal.namen(a)\n    per_id = a.reeksen.set_index(\"reeks_id\")\n    kort = {\n        AANVALLEN: \"eigen opbouw\",\n        VERDEDIGEN: \"eigen opbouw\",\n        OMSCHAKELEN_VA: \"een omschakeling na balwinst\",\n        OMSCHAKELEN_AV: f\"een omschakeling na balverlies van {w.team}\",\n    }\n    voor = tegen = 0\n    regels = []\n    sm = schotmomenten(a.kansen)\n    for _, g in sm[sm[\"is_goal\"]].sort_values(\"start\").iterrows():\n        if g[\"kant\"] == \"eigen\":\n            voor += 1\n        else:\n            tegen += 1\n        wie = w.team if g[\"kant\"] == \"eigen\" else w.tegenstander\n        bron = kort.get(g[\"herkomst\"], taal.herkomst_naam(g[\"herkomst\"], namen))\n        via = \"\"\n        if g[\"reeks_id\"] is not None and not pd.isna(g[\"reeks_id\"]):\n            pad = per_id.loc[g[\"reeks_id\"], \"pad\"]\n            if pad:\n                via = \", via \" + \" > \".join(FASE_UITLEG.get(f, f) for f in pad)\n        stand = f\"{voor}-{tegen}\" if w.thuis else f\"{tegen}-{voor}\"\n        regels.append(f\"{_helft(g['helft'])} {_minuut(g['start_min'])}, {stand}: {wie} scoort uit {bron}{via}.\")\n    return regels\n\n\ndef _grootste_herkomst(sub: pd.DataFrame) -> tuple[str, int]:\n    if sub.empty:\n        return (\"\", 0)\n    t = sub[\"herkomst\"].value_counts()\n    return (str(t.index[0]), int(t.iloc[0]))\n\n\ndef in_het_kort(a: Analyse) -> str:\n    w, namen = a.wedstrijd, taal.namen(a)\n    team, tegen = w.team, w.tegenstander\n    sm = schotmomenten(a.kansen)\n    eigen, tegen_s = sm[sm[\"kant\"] == \"eigen\"], sm[sm[\"kant\"] == \"tegen\"]\n    per_functie = {hf: a.reeksen[a.reeksen[\"hoofdfunctie\"] == hf] for hf in REEKS_FUNCTIES}\n    delen = [f\"**Schoten.** {team}: {len(eigen)}, {tegen}: {len(tegen_s)}.\"]\n\n    goals = _scoreverloop(a)\n    delen.append(\"**Goals.**\" + (\"\\n\\n\" + \"\\n\".join(f\"- {g}\" for g in goals) if goals else \" Geen.\"))\n\n    hk_t, n_t = _grootste_herkomst(tegen_s)\n    hk_e, n_e = _grootste_herkomst(eigen)\n    delen.append(\n        f\"**Waar de schoten vandaan kwamen.** {tegen}: {n_t} van de {len(tegen_s)} uit {taal.herkomst_naam(hk_t, namen)}. \"\n        f\"{team}: {n_e} van de {len(eigen)} uit {taal.herkomst_naam(hk_e, namen)}.\"\n    )\n    delen.append(\n        f\"**Balbezit in reeksen.** {team}: {len(per_functie[AANVALLEN])} opgebouwde aanvallen en {len(per_functie[OMSCHAKELEN_VA])} omschakelingen na balwinst. \"\n        f\"{tegen}: {len(per_functie[VERDEDIGEN])} opgebouwde aanvallen en {len(per_functie[OMSCHAKELEN_AV])} omschakelingen na balverlies van {team}.\"\n    )\n\n    regels = met_tekst(a)\n    echt = regels[(regels[\"type\"] == \"conditie\") & (regels[\"zekerheid\"] >= ECHT_DREMPEL)].sort_values(\"score\", ascending=False).head(3)\n    if not echt.empty:\n        delen.append(\"**Wat opviel.** Verschillen die met minstens 90% zekerheid echt zijn:\\n\\n\" + _lijst(echt, met_id=False))\n\n    if not a.verloop.empty:\n        zwaar = a.verloop.sort_values(\"dreiging_tegen\", ascending=False).iloc[0]\n        best = a.verloop.assign(saldo=a.verloop[\"dreiging_voor\"] - a.verloop[\"dreiging_tegen\"]).sort_values(\"saldo\", ascending=False).iloc[0]\n        delen.append(\n            f\"**Periodes.** Zwaarste periode: {_helft(zwaar['helft'])} minuut {zwaar['venster']} \"\n            f\"({taal.meervoud(int(zwaar['omschakelingen_av']), 'omschakeling', 'omschakelingen')} van {tegen}, \"\n            f\"{taal.meervoud(int(zwaar['schoten_tegen']), 'schot', 'schoten')} tegen). \"\n            f\"Beste eigen periode: {_helft(best['helft'])} minuut {best['venster']} \"\n            f\"({taal.meervoud(int(best['schoten_voor']), 'schot', 'schoten')} voor, {int(best['schoten_tegen'])} tegen). \"\n            f\"De hele curve staat onderaan.\"\n        )\n    return \"\\n\\n\".join(delen)\n\n\ndef goals_sectie(a: Analyse) -> str:\n    w, namen = a.wedstrijd, taal.namen(a)\n    sm = schotmomenten(a.kansen)\n    goals = sm[sm[\"is_goal\"]]\n    if goals.empty:\n        return \"Geen goals in de codering.\"\n    per_id = a.reeksen.set_index(\"reeks_id\")\n    regels = []\n    for _, g in goals.iterrows():\n        wie = w.team if g[\"kant\"] == \"eigen\" else w.tegenstander\n        bron = taal.herkomst_naam(g[\"herkomst\"], namen)\n        if g[\"reeks_id\"] is not None and not pd.isna(g[\"reeks_id\"]):\n            r = per_id.loc[g[\"reeks_id\"]]\n            verloop = \" > \".join(FASE_UITLEG.get(f, f) for f in r[\"pad\"]) or \"geen fase gecodeerd\"\n            druk = f\", {taal.druk_tekst(r['hoofdfunctie'], r['drukhoogte'], namen)}\" if r[\"drukhoogte\"] else \"\"\n            bron += f\". Verloop: {verloop}{druk}. Reeks {g['reeks_id']}, {r['duur']:.0f} seconden\"\n        regels.append(f\"- **{wie}**, {_helft(g['helft'])}, {_minuut(g['start_min'])}: uit {bron}.\")\n    return \"\\n\".join(regels)\n\n\ndef patronen_sectie(regels: pd.DataFrame, kant: str, n: int = 5) -> str:\n    paden = pt.top(regels, \"pad\", kant=kant, n=n, strikt=True)\n    paden = paden[paden[\"score\"] > 0]\n    cond = regels[(regels[\"type\"] == \"conditie\") & (regels[\"kant\"] == kant) & (regels[\"zekerheid\"] >= ZEKERHEID_DREMPEL)]\n    cond = cond.sort_values(\"score\", ascending=False).head(n)\n    return \"\\n\".join(\n        [\"**Meest voorkomende verlopen**\", \"\", _lijst(paden), \"\", \"**Opvallendste verschillen** (alleen met minstens 80% zekerheid)\", \"\", _lijst(cond)]\n    )\n\n\ndef vergelijking_sectie(regels: pd.DataFrame, n: int = 5) -> str:\n    cond = regels[(regels[\"type\"] == \"conditie\") & (regels[\"kant\"] == \"beide\") & (regels[\"zekerheid\"] >= ZEKERHEID_DREMPEL)]\n    return _lijst(cond.sort_values(\"score\", ascending=False).head(n))\n\n\ndef schoten_sectie(regels: pd.DataFrame) -> str:\n    hk = regels[regels[\"type\"] == \"herkomst\"].sort_values([\"helft\", \"start_min\"])\n    return \"\\n\".join(f\"- {r['tekst']}  `{r['id']}`\" for _, r in hk.iterrows())\n\n\ndef tempo_sectie(tempo: pd.DataFrame, namen: dict) -> str:\n    t = tempo.copy()\n    t[\"hoofdfunctie\"] = t[\"hoofdfunctie\"].map(namen)\n    t[\"helft\"] = t[\"helft\"].astype(int).map(lambda h: f\"{h}e helft\")\n    t[\"duur_gem\"] = t[\"duur_gem\"].round(0).astype(int)\n    t = t.rename(columns={\"hoofdfunctie\": \"Teamfunctie\", \"helft\": \"Helft\", \"reeksen\": \"Aantal\", \"duur_gem\": \"Gemiddelde duur (s)\"})\n    return _tabel(t, index=False)\n\n\ndef verloop_sectie(verloop: pd.DataFrame, team: str, tegen: str) -> str:\n    v = verloop.copy()\n    v[\"Periode\"] = v.apply(lambda r: f\"{int(r['helft'])}e helft {r['venster']}\", axis=1)\n    v = v[[\"Periode\", \"aanvallen\", \"omschakelingen_va\", \"omschakelingen_av\", \"av_eindfase\", \"schoten_voor\", \"schoten_tegen\", \"dreiging_voor\", \"dreiging_tegen\"]]\n    v = v.rename(\n        columns={\n            \"aanvallen\": f\"Aanvallen {team}\",\n            \"omschakelingen_va\": f\"Omschakelingen {team}\",\n            \"omschakelingen_av\": f\"Omschakelingen {tegen}\",\n            \"av_eindfase\": \"waarvan eindfase\",\n            \"schoten_voor\": \"Schoten voor\",\n            \"schoten_tegen\": \"Schoten tegen\",\n            \"dreiging_voor\": \"Dreiging voor\",\n            \"dreiging_tegen\": \"Dreiging tegen\",\n        }\n    )\n    return _tabel(v, index=False)\n\n\ndef fasewaarden_sectie(resultaten: dict, team: str, tegen: str) -> str:\n    delen = []\n    for titel, hf_e, hf_t in ((\"Opgebouwde aanval\", AANVALLEN, VERDEDIGEN), (\"Omschakeling\", OMSCHAKELEN_VA, OMSCHAKELEN_AV)):\n        fe, ft = resultaten[hf_e].fasewaarden, resultaten[hf_t].fasewaarden\n        rijen = []\n        for fase in m.TRANSIENT:\n            if fe.loc[fase, \"reeksen\"] == 0 and ft.loc[fase, \"reeksen\"] == 0:\n                continue\n            rijen.append(\n                {\n                    \"Fase\": \"start van de reeks\" if fase == m.START else f\"{fase} {FASE_UITLEG[fase]}\",\n                    f\"{team} schot\": f\"{int(fe.loc[fase, 'schot'])} van {int(fe.loc[fase, 'reeksen'])}\",\n                    f\"{team} kans schot\": _pct_cel(fe.loc[fase, \"p_schot\"]),\n                    f\"{team} kans balverlies\": _pct_cel(fe.loc[fase, \"p_verlies\"]),\n                    f\"{tegen} schot\": f\"{int(ft.loc[fase, 'schot'])} van {int(ft.loc[fase, 'reeksen'])}\",\n                    f\"{tegen} kans schot\": _pct_cel(ft.loc[fase, \"p_schot\"]),\n                    f\"{tegen} kans balverlies\": _pct_cel(ft.loc[fase, \"p_verlies\"]),\n                }\n            )\n        delen.append(f\"**{titel}**\\n\\n\" + _tabel(pd.DataFrame(rijen), index=False))\n    return \"\\n\\n\".join(delen)\n\n\ndef overgangen_sectie(resultaten: dict, namen: dict) -> str:\n    delen = []\n    for hf in REEKS_FUNCTIES:\n        res = resultaten[hf]\n        tel = m.compacte_tellingen(res)\n        tel.index = [EIND_UITLEG.get(i, i) for i in tel.index]\n        tel.columns = [EIND_UITLEG.get(c, c) for c in tel.columns]\n        tel.index.name = \"van \\\\ naar\"\n        delen.append(f\"**{taal.hoofdletter(namen[hf])}** ({res.n_reeksen} reeksen). Rij: waar de bal was. Kolom: waar hij daarna heen ging. Aantallen.\\n\\n\" + _tabel(tel))\n    return \"\\n\\n\".join(delen)\n\n\nONGEBRUIKTE_LABELS = (\"Overtreding\", \"Buitenspel\", \"Schot\", \"Goal\", \"Direct\", \"Indirect\")\n\n\ndef _tegenstrijdige_kansen(a: Analyse) -> list[str]:\n    \"\"\"Kansen die elkaar tegenspreken: beide kanten op hetzelfde moment, of een kans uit de spelhervatting van de ander.\"\"\"\n    regels = []\n    k = a.kansen[a.kansen[\"soort\"].isin((\"schot\", \"goal\"))]\n    eigen, tegen = k[k[\"kant\"] == \"eigen\"], k[k[\"kant\"] == \"tegen\"]\n    for _, e in eigen.iterrows():\n        if ((tegen[\"start\"] - e[\"start\"]).abs() <= 1.0).any():\n            regels.append(f\"- **Let op.** Op videotijd {e['start']:.0f} s staat een eigen {e['soort']} op hetzelfde moment als een kans tegen. Een van de twee is vrijwel zeker een misklik; beide zijn meegeteld.\")\n    for _, r in k.iterrows():\n        hk = str(r[\"herkomst\"])\n        verkeerd = (r[\"kant\"] == \"tegen\" and hk.endswith(\"aanvallend\")) or (r[\"kant\"] == \"eigen\" and hk.endswith(\"verdedigend\"))\n        if hk.startswith(\"spelhervatting:\") and verkeerd:\n            wie = \"tegen\" if r[\"kant\"] == \"tegen\" else \"voor\"\n            regels.append(f\"- **Let op.** {taal.hoofdletter(r['soort'])} {wie} op videotijd {r['start']:.0f} s valt samen met `{hk.split(':', 1)[1]}`, een spelhervatting van de andere partij. De herkomst van deze kans is onzeker.\")\n    return regels\n\n\ndef datakwaliteit_sectie(a: Analyse) -> str:\n    df, reeksen, namen = a.instances, a.reeksen, taal.namen(a)\n    regels = [f\"- **Let op.** {m_}\" for m_ in a.meldingen]\n    for _, c in a.correcties.iterrows():\n        regels.append(f\"- Handmatige correctie uit correcties.csv: `{c['code']}` op videotijd {float(c['start']):.0f} s is niet meegeteld. Reden: {c['reden']}.\")\n    regels += _tegenstrijdige_kansen(a)\n    recode = df[df[\"labels\"].apply(lambda ls: \"Recode\" in ls)]\n    if len(recode):\n        tijden = \", \".join(f\"{t:.0f}\" for t in sorted(recode[\"start\"].round().unique())[:12])\n        regels.append(f\"- {len(recode)} instances dragen het label Recode: de codeur wilde ze nog nalopen. Videotijden (s): {tijden}.\")\n    ongebruikt = {lab: int(df[\"labels\"].apply(lambda ls, lab=lab: lab in ls).sum()) for lab in ONGEBRUIKTE_LABELS}\n    ongebruikt = {lab: n for lab, n in ongebruikt.items() if n}\n    if ongebruikt:\n        regels.append(\"- Labels die in de codering staan maar niet in de tellingen worden gebruikt: \" + \", \".join(f\"{lab} ({n})\" for lab, n in ongebruikt.items()) + \".\")\n    for _, r in reeksen[reeksen[\"schoten\"] > 1].iterrows():\n        regels.append(f\"- Reeks {r['reeks_id']} ({namen[r['hoofdfunctie']]}, {_helft(r['helft'])} {_minuut(r['start_min'])}) heeft {int(r['schoten'])} schoten kort na elkaar: rebound of dubbel getagd. Niet samengevoegd.\")\n    if \"H2\" not in set(df[df[\"hoofdfunctie\"] == STRUCTUUR][\"code\"]):\n        regels.append(\"- Geen H2-instance in de export. De tweede helft is afgeleid uit de Aftrap-instances met label 2e helft.\")\n    buiten = df[df[\"helft\"].isna() & (df[\"hoofdfunctie\"] != STRUCTUUR)]\n    if len(buiten):\n        regels.append(f\"- {len(buiten)} instances vallen buiten beide helften en zijn niet meegenomen.\")\n    for naam, sub in a.niet_gekoppeld.items():\n        if naam.startswith(\"kans\"):\n            continue\n        regels += [f\"- Losse fase-instance `{k['code']}` (videotijd {k['start']:.0f} s) raakt geen enkele reeks en is niet meegeteld.\" for _, k in sub.iterrows()]\n    for _, k in a.kansen[a.kansen[\"herkomst\"] == \"onbekend\"].iterrows():\n        regels.append(f\"- Kans {k['kans_id']} ({k['soort']}, videotijd {k['start']:.0f} s) raakt geen reeks en geen spelhervatting: herkomst onbekend.\")\n    regels.append(f\"- {int(reeksen['eind'].isna().sum())} van de {len(reeksen)} reeksen eindigen zonder schot, zonder BV-, BW- of BOP-label en zonder spelhervatting erna. Die tellen als 'einde zonder label'.\")\n    regels.append(f\"- {int((reeksen['pad_str'] == '').sum())} van de {len(reeksen)} reeksen hebben geen fase. Dat zijn korte omschakelingen; die krijgen in de codering geen fase.\")\n    return \"\\n\".join(regels)\n\n\nAANNAMES = [\n    \"- Losse fasecodes zonder teamfunctie zijn fases binnen een omschakeling en zijn op tijd aan de omschakeling gekoppeld.\",\n    \"- `Aanvallen - doeltrap` zonder (F0) is een omhulsel van de hele doeltrapreeks; de fase zelf is `doeltrap (F0)`. F0 staat altijd vooraan in een verloop.\",\n    \"- Een fase of kans die geen reeks raakt maar binnen 3 seconden van een reeks ligt, hoort bij die reeks.\",\n    \"- Een omschakeling die binnen 3 seconden overgaat in een opgebouwde aanval eindigt in 'over in opbouw'. Een reeks met het label BOP (ball out of play), of waarna binnen 10 seconden een spelhervatting begint, eindigt in 'bal uit'.\",\n    \"- Een omschakeling zonder label BV of BW die binnen 3 seconden overgaat in balbezit van de andere partij, eindigt in een balwissel: balwinst als de tegenstander omschakelde, balverlies als wij omschakelden.\",\n    \"- Wat de partij die omschakelt binnen 15 seconden na de balwissel bereikt in de reeks erna, telt voor de omschakeling: de eindfase, een schot en een voorzet. Zo maakt het niet uit of na de omschakeling direct Aanvallen of Verdedigen is aangeklikt.\",\n    \"- Een goal is in MyVA ook als schot getagd. Het schot dat met de goal overlapt telt niet apart mee.\",\n    \"- Bij spelhervattingen wordt geen teamfunctie gecodeerd; schoten uit spelhervattingen krijgen de spelhervatting als herkomst.\",\n    \"- Fasewaarden zijn berekend op deze wedstrijd alleen. Een team dat veel schoot krijgt daardoor ook hogere fasewaarden. Dat wordt zuiverder zodra meerdere wedstrijden gestapeld zijn.\",\n]\n\n\ndef uitleg_sectie(team: str, tegen: str) -> str:\n    return \"\\n\".join(\n        [\n            \"Alle getallen in dit rapport zijn tellingen uit de MyVA-codering. Elke regel heeft een code (zoals `..._conditie_10`) waarmee je hem terugvindt en er feedback op kunt geven.\",\n            \"\",\n            \"**Reeks.** Een periode waarin een team de bal heeft. Er zijn vier soorten:\",\n            \"\",\n            f\"- **Onze opbouw**: {team} heeft de bal en bouwt op.\",\n            f\"- **De opbouw van {tegen}**: {tegen} heeft de bal en bouwt op.\",\n            f\"- **Onze omschakeling na balwinst**: {team} wint de bal en schakelt om.\",\n            f\"- **De omschakeling van {tegen} na ons balverlies**: {team} verliest de bal, {tegen} schakelt om.\",\n            \"\",\n            \"**Fases** volgen het KNVB-fasemodel: F0 doeltrap, F1A opbouw met keeper, F1B opbouw zonder keeper, F1C-L en F1C-R links of rechts langs het blok, F2A en F2B door het blok, F2C achter het blok, F3 eindfase. Een verloop als 'opbouw zonder keeper > door het blok > eindfase > schot' is de route die de bal aflegde.\",\n            \"\",\n            \"**Hoe een reeks eindigt.** Schot of goal; balverlies (label BV in MyVA) of balwinst van de tegenpartij (label BW); over in opbouw; bal uit; of einde zonder label. LB is een lange bal.\",\n            \"\",\n            f\"**Hoge en lage druk** is altijd de drukhoogte van het team dat de bal niet heeft. Bij onze opbouw is dat de druk van {tegen} op ons. Bij de opbouw van {tegen} is het onze druk op hen.\",\n            \"\",\n            \"**Hoe lees je een vergelijking.** Neem als voorbeeld: \\\"Balverlies. Onze opbouw met een lange bal: 9 van 11 (82%, echte kans waarschijnlijk 56 tot 93%). Zonder lange bal: 18 van 37 (49%, waarschijnlijk 36 tot 62%). Zekerheid dat onze opbouw met een lange bal echt hoger ligt: 97%.\\\"\",\n            \"\",\n            \"- **9 van 11** is een telling: van de 11 aanvallen met een lange bal eindigden er 9 in balverlies. Dat is wat er in deze wedstrijd gebeurde, geen kans.\",\n            \"- **82%** is diezelfde telling als percentage. Het is niet de kans dat een volgende lange bal misgaat.\",\n            \"- **Echte kans waarschijnlijk 56 tot 93%.** Met maar 11 aanvallen weet je de echte kans niet precies. Dit bereik zegt waar hij waarschijnlijk ligt (90% zekerheid). Hoe minder aanvallen, hoe breder het bereik.\",\n            \"- **Zekerheid 97%** gaat over de vergelijking: hoe zeker het is dat balverlies met lange bal echt vaker voorkomt dan zonder, en niet alleen door toeval in deze wedstrijd. Vanaf 90% noemen we het een echt verschil, tussen 80 en 90 waarschijnlijk echt, daaronder kan het toeval zijn. Overlappen de twee bereiken elkaar ruim, dan is de zekerheid laag.\",\n            \"\",\n            \"Beide getallen komen uit een eenvoudig kansmodel (Beta-Binomiaal) dat rekening houdt met hoe klein de aantallen zijn. Wat het rapport niet kan zeggen is oorzaak en gevolg: een lange bal in een aanval betekent niet dat de bal direct na die lange bal verloren ging. Daarvoor moet je de beelden van die reeksen terugkijken; de reeksnummers staan in de CSV.\",\n            \"\",\n            \"**Kans op schot per fase** (fasewaarde) is de kans dat een reeks die een bepaalde fase haalt, nog in een schot eindigt. Die kans wordt berekend uit alle overgangen tussen fases in deze wedstrijd (een Markov-keten: van elke fase tellen we waar de bal daarna heen ging). Naast de kans staat altijd de telling waar hij uit komt.\",\n            \"\",\n            \"**Dreiging** per periode van 5 minuten is de som van de fasewaarden van alle reeksen in die periode. Het laat zien hoe hoog de aanvallen kwamen, ook als er niet geschoten werd. Tien aanvallen die in de opbouw stranden tellen minder dan drie die de eindfase halen.\",\n        ]\n    )\n\n\ndef render(a: Analyse) -> str:\n    w, namen = a.wedstrijd, taal.namen(a)\n    team, tegen = w.team, w.tegenstander\n    regels = met_tekst(a)\n\n    delen = [\n        f\"# {w.titel}\",\n        \"\",\n        f\"{w.datum}. Gemaakt uit de MyVA-codering ({len(a.instances)} instances, {len(a.reeksen)} reeksen). Uitleg van de begrippen staat achteraan.\",\n        \"\",\n        \"## In het kort\", \"\", in_het_kort(a), \"\",\n        \"## Goals\", \"\", goals_sectie(a), \"\",\n        f\"## Patronen {team}\", \"\",\n        \"Verlopen staan op volgorde van hoe vaak ze voorkwamen. Verschillen op volgorde van zekerheid maal aantal waarnemingen. De code onder elke regel is voor feedback.\",\n        \"\", patronen_sectie(regels, \"eigen\"), \"\",\n        f\"## Patronen {tegen}\", \"\", patronen_sectie(regels, \"tegen\"), \"\",\n        f\"## {team} tegenover {tegen}\", \"\", vergelijking_sectie(regels), \"\",\n        \"## Alle schoten en goals\", \"\", schoten_sectie(regels), \"\",\n        \"## Cijfers\", \"\",\n        \"### Tempo per helft\", \"\", tempo_sectie(a.tempo, namen), \"\",\n        \"### Verloop per 5 minuten\", \"\", \"Speelminuten per helft. Dreiging: zie uitleg achteraan.\", \"\", verloop_sectie(a.verloop, team, tegen), \"\",\n        \"### Kans op schot per fase\", \"\",\n        f\"Per fase: hoeveel reeksen
