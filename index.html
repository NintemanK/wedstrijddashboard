kwamen daar en hoeveel daarvan eindigden in een schot (telling), en de kans op een schot en op balverlies vanaf die fase (model). Kans balverlies is bij {tegen} de kans dat wij de bal afpakken.\",\n        \"\", fasewaarden_sectie(a.markov, team, tegen), \"\",\n        \"### Overgangen tussen fases\", \"\", overgangen_sectie(a.markov, namen), \"\",\n        \"## Opmerkingen over de data\", \"\", datakwaliteit_sectie(a), \"\",\n        \"## Aannames in de verwerking\", \"\", \"\\n\".join(AANNAMES), \"\",\n        \"## Uitleg van de begrippen\", \"\", uitleg_sectie(team, tegen), \"\",\n        \"## Dreigingscurve\", \"\",\n        f\"Links {team}, rechts {tegen}. Per periode van 5 minuten de dreiging (som van de fasewaarden van alle reeksen in die periode) en het aantal schoten voor-tegen. Hoe langer de balk, hoe dichter dat team bij een schot kwam.\",\n        \"\", \"```\", taal.dreiging_tekst(a.verloop), \"```\", \"\",\n    ]\n    return \"\\n\".join(delen)\n", "myva_pipeline/weergave/regeltekst.py": "\"\"\"De zin bij elke patroonregel van een wedstrijd.\n\nDe analyse levert regels als tellingen. `met_tekst` geeft dezelfde tabel terug met\nper regel een zin, en bij een conditie de namen van de twee groepen en van de uitkomst.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.patronen import speelminuut\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.domein import VERDEDIGEN\nfrom myva_pipeline.model.reeksen import schotmomenten\nfrom myva_pipeline.weergave import taal\n\nUITKOMST_LABEL = {\"f3\": \"eindfase gehaald\", \"schot\": \"schot\", \"verlies\": \"balverlies\"}\nUITKOMST_VERLIES_TEGEN = \"balverlies (wij winnen de bal)\"\n\n\ndef groep_labels(vergelijking: str, hoofdfunctie: str, namen: dict) -> tuple[str, str]:\n    \"\"\"De namen van de twee groepen van een conditie.\"\"\"\n    if \"|\" in hoofdfunctie:\n        hf_a, hf_b = hoofdfunctie.split(\"|\")\n        return (namen[hf_a], namen[hf_b])\n    wie = namen[hoofdfunctie]\n    if vergelijking == \"druk\":\n        hoog, laag = taal.druk_labels(hoofdfunctie, namen)\n        return (f\"{wie} {hoog}\", f\"{wie} {laag}\")\n    return {\n        \"route\": (f\"{wie} door het blok (F2A)\", f\"{wie} achter het blok (F2C)\"),\n        \"doeltrap\": (f\"{wie} vanuit een doeltrap\", f\"{wie} niet vanuit een doeltrap\"),\n        \"lange_bal\": (f\"{wie} met een lange bal\", f\"{wie} zonder lange bal\"),\n        \"helft\": (f\"{wie} in de 1e helft\", f\"{wie} in de 2e helft\"),\n        \"voorzet\": (\"onze voorzetten van links\", \"onze voorzetten van rechts\"),\n    }[vergelijking]\n\n\ndef uitkomst_label(uitkomst_code: str, hoofdfunctie: str) -> str:\n    if uitkomst_code == \"verlies\" and hoofdfunctie == VERDEDIGEN:\n        return UITKOMST_VERLIES_TEGEN\n    return UITKOMST_LABEL[uitkomst_code]\n\n\ndef _pct(a: int, b: int) -> str:\n    return f\"{100 * a / b:.0f}%\" if b else \"n.v.t.\"\n\n\ndef _interval(interval: tuple[float, float]) -> str:\n    lo, hi = interval\n    return \"n.v.t.\" if math.isnan(lo) else f\"{100 * lo:.0f} tot {100 * hi:.0f}%\"\n\n\ndef _zin_pad(r: pd.Series, namen: dict) -> str:\n    leesbaar = taal.pad_leesbaar(r[\"pad\"]).replace(\", \", \" > \")\n    getoond = f\"geen fase gecodeerd, {leesbaar}\" if r[\"leeg\"] else f\"{leesbaar} ({r['pad'].replace('>', ' > ')})\"\n    return f\"{taal.hoofdletter(namen[r['hoofdfunctie']])}: {getoond}. {int(r['a'])} van de {int(r['b'])} keer.\"\n\n\ndef _zin_conditie(r: pd.Series, label_a: str, label_b: str, uitkomst: str) -> str:\n    a1, b1, a2, b2 = int(r[\"a\"]), int(r[\"b\"]), int(r[\"a2\"]), int(r[\"b2\"])\n    kans = r[\"kans_a_groter\"]\n    if math.isnan(kans):\n        model = \"Te weinig waarnemingen om te vergelijken.\"\n    else:\n        model = f\"Zekerheid dat {label_a if kans >= 0.5 else label_b} echt hoger ligt: {100 * max(kans, 1 - kans):.0f}%.\"\n    return (\n        f\"{taal.hoofdletter(uitkomst)}. {taal.hoofdletter(label_a)}: {a1} van {b1} ({_pct(a1, b1)}, echte kans waarschijnlijk {_interval(r['interval_a'])}). \"\n        f\"{taal.hoofdletter(label_b)}: {a2} van {b2} ({_pct(a2, b2)}, waarschijnlijk {_interval(r['interval_b'])}). \"\n        f\"{model}\"\n    )\n\n\ndef _zin_herkomst(k: pd.Series, namen: dict) -> str:\n    herkomst = taal.herkomst_naam(k[\"herkomst\"], namen)\n    fase = f\", laatste fase {taal.FASE_UITLEG.get(k['laatste_fase'], k['laatste_fase'])}\" if k[\"laatste_fase\"] else \"\"\n    druk = f\", {taal.druk_tekst(k['herkomst'], k['drukhoogte'], namen)}\" if k[\"drukhoogte\"] else \"\"\n    wie = namen[\"team\"] if k[\"kant\"] == \"eigen\" else namen[\"tegenstander\"]\n    helft = int(k[\"helft\"]) if k[\"helft\"] is not None and not pd.isna(k[\"helft\"]) else None\n    minuut = f\"{speelminuut(k['start_min'])}e minuut\" if k[\"start_min\"] is not None else \"minuut onbekend\"\n    return f\"{taal.hoofdletter('goal' if k['is_goal'] else 'schot')} {wie}, {helft}e helft {minuut}: uit {herkomst}{fase}{druk}.\"\n\n\ndef _zin_tempo(r: pd.Series, tempo: pd.DataFrame, namen: dict) -> str:\n    sub = tempo[tempo[\"hoofdfunctie\"] == r[\"hoofdfunctie\"]]\n    delen = [f\"{int(t['helft'])}e helft {int(t['reeksen'])} keer, gemiddeld {t['duur_gem']:.0f} seconden\" for _, t in sub.iterrows()]\n    return f\"{taal.hoofdletter(namen[r['hoofdfunctie']])}: \" + \"; \".join(delen) + \".\"\n\n\ndef _zin_verloop(v: pd.Series) -> str:\n    return (\n        f\"{v['helft']}e helft minuut {v['venster']}: {taal.meervoud(int(v['aanvallen']), 'eigen aanval', 'eigen aanvallen')}, \"\n        f\"{taal.meervoud(int(v['omschakelingen_av']), 'omschakeling', 'omschakelingen')} tegen waarvan {v['av_eindfase']} tot de eindfase, \"\n        f\"schoten {v['schoten_voor']} voor en {v['schoten_tegen']} tegen. \"\n        f\"Dreiging voor {v['dreiging_voor']:.2f}, tegen {v['dreiging_tegen']:.2f}.\"\n    )\n\n\ndef met_tekst(a: Analyse) -> pd.DataFrame:\n    \"\"\"De regels van de wedstrijd met de kolommen tekst, label_a, label_b en uitkomst erbij.\"\"\"\n    namen = taal.namen(a)\n    kansen = schotmomenten(a.kansen).set_index(\"kans_id\")\n    verloop = {(int(v[\"helft\"]), v[\"venster\"]): v for _, v in a.verloop.iterrows()}\n\n    teksten, labels_a, labels_b, uitkomsten = [], [], [], []\n    for _, r in a.regels.iterrows():\n        label_a = label_b = uitkomst = None\n        if r[\"type\"] == \"pad\":\n            zin = _zin_pad(r, namen)\n        elif r[\"type\"] == \"conditie\":\n            label_a, label_b = groep_labels(r[\"vergelijking\"], r[\"hoofdfunctie\"], namen)\n            uitkomst = uitkomst_label(r[\"uitkomst_code\"], r[\"hoofdfunctie\"])\n            zin = _zin_conditie(r, label_a, label_b, uitkomst)\n        elif r[\"type\"] == \"herkomst\":\n            zin = _zin_herkomst(kansen.loc[r[\"kans_id\"]], namen)\n        elif r[\"type\"] == \"tempo\":\n            zin = _zin_tempo(r, a.tempo, namen)\n        else:\n            zin = _zin_verloop(verloop[(int(r[\"helft\"]), r[\"venster\"])])\n        teksten.append(zin)\n        labels_a.append(label_a)\n        labels_b.append(label_b)\n        uitkomsten.append(uitkomst)\n\n    regels = a.regels.copy()\n    regels.insert(regels.columns.get_loc(\"hoofdfunctie\") + 1, \"tekst\", teksten)\n    if \"b2\" in regels.columns:\n        na = regels.columns.get_loc(\"b2\")\n        for i, (kolom, waarden) in enumerate(((\"label_a\", labels_a), (\"label_b\", labels_b), (\"uitkomst\", uitkomsten)), start=1):\n            regels.insert(na + i, kolom, waarden)\n    return regels\n", "myva_pipeline/weergave/taal.py": "\"\"\"Van codes naar gewone taal: namen van teamfuncties, fases, eindes en drukhoogte.\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, OMSCHAKELEN_AV, OMSCHAKELEN_VA, REEKS_FUNCTIES, VERDEDIGEN\n\nFASE_UITLEG = {\n    \"F0\": \"doeltrap\",\n    \"F1A\": \"opbouw met keeper\",\n    \"F1B\": \"opbouw zonder keeper\",\n    \"F1C-L\": \"links langs het blok\",\n    \"F1C-R\": \"rechts langs het blok\",\n    \"F2A\": \"door het blok (A)\",\n    \"F2B\": \"door het blok (B)\",\n    \"F2C\": \"achter het blok\",\n    \"F3\": \"eindfase\",\n}\nEIND_UITLEG = {\n    \"schot\": \"schot\",\n    \"goal\": \"goal\",\n    \"BV\": \"balverlies\",\n    \"BW\": \"wij winnen de bal\",\n    \"opbouw\": \"over in opbouw\",\n    \"uit\": \"bal uit\",\n    \"einde\": \"einde zonder label\",\n    \"start\": \"start\",\n}\n\n\ndef namen_voor(team: str = \"wij\", tegenstander: str = \"de tegenstander\") -> dict:\n    \"\"\"De vier teamfuncties in gewone taal, met de echte teamnamen.\"\"\"\n    return {\n        AANVALLEN: \"onze opbouw\",\n        VERDEDIGEN: f\"de opbouw van {tegenstander}\",\n        OMSCHAKELEN_AV: f\"de omschakeling van {tegenstander} na ons balverlies\",\n        OMSCHAKELEN_VA: \"onze omschakeling na balwinst\",\n        \"team\": team,\n        \"tegenstander\": tegenstander,\n    }\n\n\ndef namen(a: Analyse) -> dict:\n    return namen_voor(a.wedstrijd.team, a.wedstrijd.tegenstander)\n\n\ndef druk_labels(hoofdfunctie: str, namen: dict) -> tuple[str, str]:\n    \"\"\"(hoog, laag). Drukhoogte is van het team zonder bal.\"\"\"\n    if hoofdfunctie in EIGEN_BEZIT:\n        t = namen[\"tegenstander\"]\n        return (f\"tegen hoge druk van {t}\", f\"tegen lage druk van {t}\")\n    return (\"als wij hoog druk zetten\", \"als wij laag druk zetten\")\n\n\ndef druk_tekst(hoofdfunctie: str | None, drukhoogte: str | None, namen: dict | None = None) -> str:\n    \"\"\"'hoog' bij aanvallen wordt 'tegen hoge druk van <tegenstander>'.\"\"\"\n    if not drukhoogte or hoofdfunctie not in REEKS_FUNCTIES:\n        return \"\"\n    hoog, laag = druk_labels(hoofdfunctie, namen or namen_voor())\n    return hoog if drukhoogte == \"hoog\" else laag\n\n\ndef herkomst_naam(herkomst: str, namen: dict) -> str:\n    if herkomst.startswith(\"spelhervatting:\"):\n        return herkomst.split(\":\", 1)[1].lower().replace(\"aanvallend\", \"voor ons\").replace(\"verdedigend\", \"tegen ons\")\n    return namen.get(herkomst, herkomst)\n\n\ndef pad_leesbaar(pad_str: str) -> str:\n    \"\"\"'F1B>F2A>BV' wordt 'opbouw zonder keeper, door het blok (A), balverlies'.\"\"\"\n    delen = [d for d in pad_str.split(\">\") if d]\n    return \", \".join(FASE_UITLEG.get(d, EIND_UITLEG.get(d, d)) for d in delen)\n\n\ndef hoofdletter(tekst: str) -> str:\n    return tekst[:1].upper() + tekst[1:]\n\n\ndef meervoud(n: int, enkel: str, meer: str) -> str:\n    return f\"{n} {enkel if n == 1 else meer}\"\n\n\ndef dreiging_tekst(verloop: pd.DataFrame, breedte: int = 30) -> str:\n    \"\"\"Dreigingscurve als tekst: per venster een balk voor (links) en tegen (rechts).\"\"\"\n    hoogste = max(float(verloop[\"dreiging_voor\"].max()), float(verloop[\"dreiging_tegen\"].max()), 0.01)\n    regels = [f\"{'venster':<12}{'voor':>{breedte + 5}}  |  {'tegen'}\"]\n    for _, v in verloop.iterrows():\n        links = int(round(v[\"dreiging_voor\"] / hoogste * breedte))\n        rechts = int(round(v[\"dreiging_tegen\"] / hoogste * breedte))\n        label = f\"H{v['helft']} {v['venster']}\"\n        schoten = f\"{v['schoten_voor']}-{v['schoten_tegen']}\"\n        regels.append(\n            f\"{label:<12}{v['dreiging_voor']:4.2f} {'#' * links:>{breedte}}  |  {'#' * rechts:<{breedte}} {v['dreiging_tegen']:4.2f}  schoten {schoten}\"\n        )\n    return \"\\n\".join(regels)\n", "myva_pipeline/weergave/tabellen.py": "\"\"\"Vaste tabellen voor Power BI of een ander dashboard: een tabel per onderwerp, met `wedstrijd` en `team` als sleutel.\n\nElke rij is een telling die je in MyVA kunt nalopen. De namen van de groepen en wat er\ngeteld is komen uit teksten.py, zodat een dashboard dezelfde woorden gebruikt als de PDF.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse import seizoen\nfrom myva_pipeline.analyse import vergelijkingen as vg\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.model.reeksen import schotmomenten\nfrom myva_pipeline.weergave.teksten import MAAT, SITUATIE_LABEL, SJABLONEN, ZONE_LABEL\n\n\ndef _met_team(df: pd.DataFrame, a: Analyse) -> pd.DataFrame:\n    return df.assign(wedstrijd=a.wedstrijd.naam, team=a.wedstrijd.team)\n\n\ndef _kansen(a: Analyse) -> pd.DataFrame:\n    telt = set(schotmomenten(a.kansen)[\"kans_id\"])\n    k = a.kansen.assign(\n        telt_als_schot=a.kansen[\"kans_id\"].isin(telt),\n        situatie=a.kansen[\"herkomst\"].fillna(\"onbekend\").map(lambda h: SITUATIE_LABEL[seizoen.situatie(h)]),\n    )\n    return _met_team(k, a)\n\n\ndef _vergelijkingen(a: Analyse) -> pd.DataFrame:\n    rijen = []\n    for (vergelijking, kant, uitkomst, teamfunctie), t in vg.tellingen(a).items():\n        sj = SJABLONEN.get((vergelijking, kant, uitkomst))\n        rijen.append(\n            {\n                \"vergelijking\": vergelijking, \"kant\": kant, \"uitkomst\": uitkomst, \"teamfunctie\": teamfunctie,\n                \"groep_a\": sj.label_a if sj else \"\", \"groep_b\": sj.label_b if sj else \"\",\n                \"wat_geteld\": MAAT.get((vergelijking, kant, uitkomst), \"\"),\n                **t,\n            }\n        )\n    return _met_team(pd.DataFrame(rijen), a)\n\n\ndef _balverlies(analyses: list[Analyse]) -> pd.DataFrame:\n    bv = vg.balverlies_tabel(analyses)\n    if bv.empty:\n        return bv\n    team = {a.wedstrijd.naam: a.wedstrijd.team for a in analyses}\n    return bv.assign(team=bv[\"wedstrijd\"].map(team), zone_naam=bv[\"zone\"].map(lambda z: ZONE_LABEL.get(z, z)))\n\n\ndef tabellen(analyses: list[Analyse]) -> dict[str, pd.DataFrame]:\n    \"\"\"wedstrijden, reeksen, kansen, vergelijkingen en balverlies, over alle opgegeven wedstrijden.\"\"\"\n    if not analyses:\n        return {}\n    return {\n        \"wedstrijden\": seizoen.wedstrijden_tabel(analyses),\n        \"reeksen\": pd.concat([_met_team(a.reeksen.drop(columns=[\"pad\"]), a) for a in analyses], ignore_index=True),\n        \"kansen\": pd.concat([_kansen(a) for a in analyses], ignore_index=True),\n        \"vergelijkingen\": pd.concat([_vergelijkingen(a) for a in analyses], ignore_index=True),\n        \"balverlies\": _balverlies(analyses),\n    }\n", "myva_pipeline/weergave/teksten.py": "\"\"\"Alle sjablonen op een plek, in voetbaltaal: die van het seizoensbeeld en die van de trainerspagina per wedstrijd.\n\nDe woorden volgen de KNVB (aanvallen, verdedigen, omschakelen; opbouwen, scoren,\nstoren, doelpunten voorkomen) en de taal van trainers: doorjagen, druk op de bal,\nrestverdediging, achter de bal komen, onder de druk uit voetballen, de tweede bal.\nEen getal staat nooit los: elke zin zegt wat er geteld is en waarvan, in de vorm\n\"a van de b\". Velden in de zinnen: a1 b1 p1 voor groep A, a2 b2 p2 voor groep B.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Sjabloon:\n    titel_lager: str  # titel als groep A lager ligt dan groep B\n    titel_hoger: str\n    label_a: str  # naam voor de balk\n    label_b: str\n    zin_a: str  # volledige zin met de telling van groep A\n    zin_b: str\n    kort_a: str  # een of twee woorden, voor de regel per wedstrijd\n    kort_b: str\n    tel: str  # wat je de volgende wedstrijd opnieuw telt\n    stuur_lager: str  # de eerste zin staat op de pagina, de rest in de onderbouwing\n    stuur_hoger: str\n    doel_lager: str\n    doel_hoger: str\n\n\nVASTHOUDEN = \"Vasthouden. Dit gaat goed: benoem het in de bespreking zodat het zo blijft.\"\nDOEL_VASTHOUDEN = \"dit vasthouden\"\nOPBOUW_TEGEN_DRUK = \"Onder de druk uit voetballen. In de opbouw van achteruit de vrije man vinden, of bewust de lange bal kiezen met bezetting rond de tweede bal.\"\nLANGE_BAL = \"De lange bal beter voorbereiden. Kijk naar het moment van de lange bal en de bezetting rond de tweede bal.\"\nLANGE_BAL_TEGEN = \"De lange bal van de tegenstander verdedigen. Het duel winnen en de tweede bal oprapen.\"\n\nSJABLONEN: dict[tuple[str, str, str], Sjabloon] = {\n    (\"teams_omschakeling\", \"beide\", \"schot\"): Sjabloon(\n        \"Na balverlies zijn we kwetsbaar: de tegenstander komt in de omschakeling vaker tot een schot dan wij\",\n        \"In de omschakeling zijn wij gevaarlijker dan de tegenstander\",\n        \"Wij, na balverovering\", \"Tegenstander, na ons balverlies\",\n        \"Uit {b1} balveroveringen kwamen wij {a1} keer tot een schot ({p1}%)\",\n        \"Na {b2} keer balverlies kwam de tegenstander {a2} keer tot een schot ({p2}%)\",\n        \"wij\", \"zij\",\n        \"hoe vaak een omschakelmoment een schot oplevert: voor ons na balverovering, voor de tegenstander na ons balverlies\",\n        \"Direct doorjagen na balverlies. De spelers rond de bal zetten meteen druk, de rest komt achter de bal, en de restverdediging staat al voordat we de bal verliezen.\",\n        \"Vasthouden. Na balverovering spelen we snel vooruit en komen we vaker tot een schot dan de tegenstander.\",\n        \"minder schoten tegen uit de omschakeling\", DOEL_VASTHOUDEN,\n    ),\n    (\"teams_omschakeling\", \"beide\", \"f3\"): Sjabloon(\n        \"Na balverlies komt de tegenstander vaker in onze eindfase dan wij na balverovering in de hunne\",\n        \"Na balverovering komen wij vaker in de eindfase dan de tegenstander na ons balverlies\",\n        \"Wij, na balverovering\", \"Tegenstander, na ons balverlies\",\n        \"Uit {b1} balveroveringen kwamen wij {a1} keer in de eindfase ({p1}%)\",\n        \"Na {b2} keer balverlies kwam de tegenstander {a2} keer in onze eindfase ({p2}%)\",\n        \"wij\", \"zij\",\n        \"hoe vaak een omschakelmoment in de eindfase komt: voor ons na balverovering, voor de tegenstander na ons balverlies\",\n        \"De counter eruit halen. Bij balverlies druk op de bal en het centrum dicht, zodat de tegenstander niet in onze eindfase komt.\",\n        \"Vasthouden. Na balverovering komen wij vaker in de eindfase dan de tegenstander na ons balverlies.\",\n        \"de tegenstander na ons balverlies minder vaak in onze eindfase\", DOEL_VASTHOUDEN,\n    ),\n    (\"helft_schoten\", \"beide\", \"aandeel\"): Sjabloon(\n        \"Na rust pakken we het initiatief: een groter deel van de schoten is van ons\",\n        \"Na rust verliezen we de grip: de schoten gaan naar de tegenstander\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust waren {a1} van de {b1} schoten van ons ({p1}%)\",\n        \"Na rust waren {a2} van de {b2} schoten van ons ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"de schoten per helft: hoeveel van ons, hoeveel van de tegenstander\",\n        \"Vasthouden. Na rust pakken wij het initiatief.\",\n        \"De grip vasthouden na rust. Kijk wat er in de tweede helft verandert: de fitheid, de wissels, of een omzetting van de tegenstander waar wij geen antwoord op hebben.\",\n        DOEL_VASTHOUDEN, \"na rust minstens evenveel schoten als de tegenstander\",\n    ),\n    (\"helft\", \"eigen\", \"f3\"): Sjabloon(\n        \"Na rust komen we vaker in de eindfase dan voor rust\",\n        \"Na rust komen we minder vaak in de eindfase\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust kwamen we met {a1} van onze {b1} aanvallen in de eindfase ({p1}%)\",\n        \"Na rust kwamen we met {a2} van onze {b2} aanvallen in de eindfase ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"met hoeveel aanvallen per helft we in de eindfase komen\",\n        VASTHOUDEN,\n        \"Het aanvalsspel na rust op peil houden. In de tweede helft stranden meer aanvallen voordat we in de eindfase komen.\",\n        DOEL_VASTHOUDEN, \"na rust net zo vaak in de eindfase als voor rust\",\n    ),\n    (\"helft\", \"eigen\", \"verlies\"): Sjabloon(\n        \"Na rust lijden we vaker balverlies in onze aanvallen\",\n        \"Na rust zijn we zuiniger op de bal\",\n        \"Voor rust\", ak een aanval een schot oplevert, met en zonder lange bal\",\n        LANGE_BAL,\n        \"De lange bal als wapen blijven gebruiken. Met bezetting rond de tweede bal komen we zo vaker tot een schot.\",\n        \"met de lange bal net zo vaak een schot als zonder\", DOEL_VASTHOUDEN,\n    ),\n    (\"lange_bal\", \"tegen\", \"schot\"): Sjabloon(\n        \"Met de lange bal komt de tegenstander minder vaak tot een schot\",\n        \"De lange bal van de tegenstander levert vaker een schot tegen op\",\n        \"Tegenstander speelt de lange bal\", \"Tegenstander speelt geen lange bal\",\n        \"Uit {b1} aanvallen met een lange bal kwam de tegenstander {a1} keer tot een schot ({p1}%)\",\n        \"Uit {b2} aanvallen zonder lange bal kwam de tegenstander {a2} keer tot een schot ({p2}%)\",\n        \"lange bal\", \"zonder\",\n        \"hoe vaak een aanval van de tegenstander een schot oplevert, met en zonder lange bal\",\n        VASTHOUDEN, LANGE_BAL_TEGEN,\n        DOEL_VASTHOUDEN, \"na een lange bal van de tegenstander minder schoten tegen\",\n    ),\n    (\"flank\", \"eigen\", \"f3\"): Sjabloon(\n        \"Over rechts komen we vaker in de eindfase dan over links\",\n        \"Over links komen we vaker in de eindfase dan over rechts\",\n        \"Aanval over links\", \"Aanval over rechts\",\n        \"Met {a1} van onze {b1} aanvallen over links kwamen we in de eindfase ({p1}%)\",\n        \"Met {a2} van onze {b2} aanvallen over rechts kwamen we in de eindfase ({p2}%)\",\n        \"links\", \"rechts\",\n        \"met hoeveel aanvallen over links en over rechts we in de eindfase komen\",\n        \"De aanval over links beter uitspelen. Over rechts komen we vaker in de eindfase.\",\n        \"De aanval over rechts beter uitspelen. Over links komen we vaker in de eindfase.\",\n        \"over links net zo vaak in de eindfase als over rechts\", \"over rechts net zo vaak in de eindfase als over links\",\n    ),\n    (\"flank\", \"eigen\", \"schot\"): Sjabloon(\n        \"Aanvallen over rechts leveren vaker een schot op dan aanvallen over links\",\n        \"Aanvallen over links leveren vaker een schot op dan aanvallen over rechts\",\n        \"Aanval over links\", \"Aanval over rechts\",\n        \"Uit {b1} aanvallen over links kwamen we {a1} keer tot een schot ({p1}%)\",\n        \"Uit {b2} aanvallen over rechts kwamen we {a2} keer tot een schot ({p2}%)\",\n        \"links\", \"rechts\",\n        \"hoe vaak een aanval over links en over rechts een schot oplevert\",\n        \"De afronding van de aanval over links. Over rechts komen we vaker tot een schot.\",\n        \"De afronding van de aanval over rechts. Over links komen we vaker tot een schot.\",\n        \"over links net zo vaak een schot als over rechts\", \"over rechts net zo vaak een schot als over links\",\n    ),\n    (\"flank\", \"eigen\", \"verlies\"): Sjabloon(\n        \"Over rechts lijden we vaker balverlies dan over links\",\n        \"Over links lijden we vaker balverlies dan over rechts\",\n        \"Aanval over links\", \"Aanval over rechts\",\n        \"{a1} van onze {b1} aanvallen over links eindigden in balverlies ({p1}%)\",\n        \"{a2} van onze {b2} aanvallen over rechts eindigden in balverlies ({p2}%)\",\n        \"links\", \"rechts\",\n        \"hoeveel aanvallen over links en over rechts in balverlies eindigen\",\n        \"Zuiniger zijn op de bal aan de rechterkant. Over rechts lijden we vaker balverlies dan over links.\",\n        \"Zuiniger zijn op de bal aan de linkerkant. Over links lijden we vaker balverlies dan over rechts.\",\n        \"over rechts niet vaker balverlies dan over links\", \"over links niet vaker balverlies dan over rechts\",\n    ),\n    (\"keeper\", \"eigen\", \"f3\"): Sjabloon(\n        \"Als de keeper meedoet in de opbouw, komen we minder vaak in de eindfase\",\n        \"Als de keeper meedoet in de opbouw, komen we vaker in de eindfase\",\n        \"Opbouw met de keeper\", \"Opbouw zonder de keeper\",\n        \"Met {a1} van de {b1} aanvallen waarin de keeper meedeed kwamen we in de eindfase ({p1}%)\",\n        \"Met {a2} van de {b2} aanvallen zonder de keeper kwamen we in de eindfase ({p2}%)\",\n        \"met keeper\", \"zonder\",\n        \"met hoeveel aanvallen we in de eindfase komen, met en zonder de keeper in de opbouw\",\n        \"De opbouw met de keeper. Kijk of de keeper de vrije man vindt, of dat de tegenstander daar de tijd krijgt om te kantelen.\",\n        \"De keeper blijven gebruiken als extra man in de opbouw.\",\n        \"met de keeper in de opbouw net zo vaak in de eindfase als zonder\", DOEL_VASTHOUDEN,\n    ),\n    (\"keeper\", \"eigen\", \"verlies\"): Sjabloon(\n        \"Met de keeper in de opbouw zijn we zuiniger op de bal\",\n        \"Met de keeper in de opbouw lijden we vaker balverlies\",\n        \"Opbouw met de keeper\", \"Opbouw zonder de keeper\",\n        \"{a1} van de {b1} aanvallen waarin de keeper meedeed eindigden in balverlies ({p1}%)\",\n        \"{a2} van de {b2} aanvallen zonder de keeper eindigden in balverlies ({p2}%)\",\n        \"met keeper\", \"zonder\",\n        \"hoeveel aanvallen in balverlies eindigen, met en zonder de keeper in de opbouw\",\n        \"De keeper blijven gebruiken als extra man in de opbouw.\",\n        \"De opbouw met de keeper. Als de keeper meedoet, lijden we vaker balverlies: kijk naar de afspeelmogelijkheden rond de keeper.\",\n        DOEL_VASTHOUDEN, \"met de keeper in de opbouw niet vaker balverlies dan zonder\",\n    ),\n    (\"keeper\", \"tegen\", \"f3\"): Sjabloon(\n        \"Als de tegenstander met de keeper opbouwt, komt hij minder vaak in onze eindfase\",\n        \"Als de tegenstander met de keeper opbouwt, komt hij vaker in onze eindfase\",\n        \"Tegenstander bouwt op met de keeper\", \"Tegenstander bouwt op zonder de keeper\",\n        \"Met {a1} van zijn {b1} aanvallen via de keeper kwam de tegenstander in onze eindfase ({p1}%)\",\n        \"Met {a2} van zijn {b2} aanvallen zonder de keeper kwam de tegenstander in onze eindfase ({p2}%)\",\n        \"met keeper\", \"zonder\",\n        \"met hoeveel aanvallen de tegenstander in onze eindfase komt, met en zonder zijn keeper in de opbouw\",\n        VASTHOUDEN,\n        \"Het storen van de opbouw via de keeper. Als de keeper meedoet, komt de tegenstander vaker door ons druk zetten heen.\",\n        DOEL_VASTHOUDEN, \"de opbouw via de keeper net zo goed verdedigen als de rest\",\n    ),\n    (\"keeper\", \"tegen\", \"verlies\"): Sjabloon(\n        \"Als de tegenstander met de keeper opbouwt, veroveren we minder vaak de bal\",\n        \"Als de tegenstander met de keeper opbouwt, veroveren we vaker de bal\",\n        \"Tegenstander bouwt op met de keeper\", \"Tegenstander bouwt op zonder de keeper\",\n        \"In {a1} van de {b1} aanvallen waarin hun keeper meedeed veroverden wij de bal ({p1}%)\",\n        \"In {a2} van de {b2} aanvallen zonder hun keeper veroverden wij de bal ({p2}%)\",\n        \"met keeper\", \"zonder\",\n        \"in hoeveel aanvallen van de tegenstander wij de bal veroveren, met en zonder zijn keeper in de opbouw\",\n        \"Het storen van de opbouw via de keeper. Samen doorjagen op de terugspeelbal, zodat het druk zetten ook de bal oplevert.\",\n        \"De terugspeelbal op de keeper uitlokken en dan doorjagen. Daar veroveren we vaker de bal.\",\n        \"de bal net zo vaak veroveren als de keeper meedoet\", DOEL_VASTHOUDEN,\n    ),\n    (\"teams_druk\", \"beide\", \"hoog\"): Sjabloon(\n        \"De tegenstander zet vaker hoog druk op onze opbouw dan wij op de zijne\",\n        \"Wij zetten vaker hoog druk dan de tegenstander\",\n        \"Wij zetten hoog druk\", \"Tegenstander zet hoog druk\",\n        \"Op {a1} van de {b1} aanvallen van de tegenstander zetten wij hoog druk ({p1}%)\",\n        \"Op {a2} van onze {b2} aanvallen zette de tegenstander hoog druk ({p2}%)\",\n        \"wij\", \"zij\",\n        \"op hoeveel aanvallen hoog druk wordt gezet, door ons en door de tegenstander\",\n        \"Bepalen of we hoger willen storen. De tegenstander zet vaker hoog druk op ons dan wij op hem.\",\n        \"Vasthouden als het bij het plan past. Wij zetten vaker hoog druk dan de tegenstander.\",\n        \"even vaak hoog druk zetten als de tegenstander\", DOEL_VASTHOUDEN,\n    ),\n    (\"helft_druk\", \"eigen\", \"hoog\"): Sjabloon(\n        \"Na rust zetten we vaker hoog druk dan voor rust\",\n        \"Na rust zetten we minder vaak hoog druk: we zakken verder in\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust zetten we op {a1} van de {b1} aanvallen van de tegenstander hoog druk ({p1}%)\",\n        \"Na rust zetten we op {a2} van de {b2} aanvallen van de tegenstander hoog druk ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"op hoeveel aanvallen van de tegenstander wij per helft hoog druk zetten\",\n        VASTHOUDEN,\n        \"Het hoog druk zetten na rust volhouden. In de tweede helft zakken we vaker in.\",\n        DOEL_VASTHOUDEN, \"na rust net zo vaak hoog druk zetten als voor rust\",\n    ),\n    (\"helft\", \"tegen\", \"f3\"): Sjabloon(\n        \"Na rust komt de tegenstander vaker in onze eindfase\",\n        \"Na rust komt de tegenstander minder vaak in onze eindfase\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust kwam de tegenstander met {a1} van zijn {b1} aanvallen in onze eindfase ({p1}%)\",\n        \"Na rust kwam de tegenstander met {a2} van zijn {b2} aanvallen in onze eindfase ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"met hoeveel aanvallen de tegenstander per helft in onze eindfase komt\",\n        \"Compact blijven na rust. In de tweede helft komt de tegenstander met meer aanvallen in onze eindfase.\",\n        VASTHOUDEN,\n        \"na rust niet meer eindfases tegen dan voor rust\", DOEL_VASTHOUDEN,\n    ),\n    (\"helft\", \"tegen\", \"verlies\"): Sjabloon(\n        \"Na rust veroveren we vaker de bal dan voor rust\",\n        \"Na rust veroveren we minder vaak de bal\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust veroverden we in {a1} van de {b1} aanvallen van de tegenstander de bal ({p1}%)\",\n        \"Na rust veroverden we in {a2} van de {b2} aanvallen van de tegenstander de bal ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"in hoeveel aanvallen van de tegenstander wij per helft de bal veroveren\",\n        VASTHOUDEN,\n        \"De balverovering na rust. In de tweede helft pakken we de bal minder vaak af: blijven doorstappen en de duels aangaan.\",\n        DOEL_VASTHOUDEN, \"na rust net zo vaak de bal veroveren als voor rust\",\n    ),\n    (\"helft_omschakeling\", \"eigen\", \"f3\"): Sjabloon(\n        \"Na rust komen we na balverovering vaker in de eindfase\",\n        \"Na rust komen we na balverovering minder vaak in de eindfase\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust kwamen we uit {b1} balveroveringen {a1} keer in de eindfase ({p1}%)\",\n        \"Na rust kwamen we uit {b2} balveroveringen {a2} keer in de eindfase ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"hoe vaak we per helft na een balverovering in de eindfase komen\",\n        VASTHOUDEN,\n        \"Na balverovering vooruit blijven spelen in de tweede helft. De eerste pass vooruit en lopende mensen zonder bal.\",\n        DOEL_VASTHOUDEN, \"na rust net zo vaak in de eindfase na balverovering als voor rust\",\n    ),\n    (\"helft_omschakeling\", \"tegen\", \"f3\"): Sjabloon(\n        \"Na rust komt de tegenstander na ons balverlies vaker in onze eindfase\",\n        \"Na rust komt de tegenstander na ons balverlies minder vaak in onze eindfase\",\n        \"Voor rust\", \"Na rust\",\n        \"Voor rust kwam de tegenstander na {b1} keer balverlies van ons {a1} keer in onze eindfase ({p1}%)\",\n        \"Na rust kwam de tegenstander na {b2} keer balverlies van ons {a2} keer in onze eindfase ({p2}%)\",\n        \"voor rust\", \"na rust\",\n        \"hoe vaak de tegenstander per helft na ons balverlies in onze eindfase komt\",\n        \"Blijven omschakelen na rust. Bij balverlies achter de bal komen, ook als de benen zwaar worden.\",\n        VASTHOUDEN,\n        \"na rust niet meer eindfases tegen uit de omschakeling dan voor rust\", DOEL_VASTHOUDEN,\n    ),\n    (\"beginfase_schoten\", \"beide\", \"aandeel\"): Sjabloon(\n        \"We beginnen slap: in het eerste kwartier gaan de schoten naar de tegenstander\",\n        \"We beginnen scherp: in het eerste kwartier zijn de meeste schoten van ons\",\n        \"Eerste kwartier\", \"Rest van de wedstrijd\",\n        \"In het eerste kwartier waren {a1} van de {b1} schoten van ons ({p1}%)\",\n        \"In de rest van de wedstrijd waren {a2} van de {b2} schoten van ons ({p2}%)\",\n        \"eerste kwartier\", \"daarna\",\n        \"de schoten in het eerste kwartier: hoeveel van ons, hoeveel van de tegenstander\",\n        \"Scherp aan de aftrap. In het eerste kwartier krijgt de tegenstander het grootste deel van de schoten.\",\n        \"De scherpte van het eerste kwartier vasthouden. Daarna zakt ons deel van de schoten terug.\",\n        \"in het eerste kwartier minstens evenveel schoten als de tegenstander\", \"na het eerste kwartier hetzelfde deel van de schoten houden\",\n    ),\n    (\"slotfase_schoten\", \"beide\", \"aandeel\"): Sjabloon(\n        \"In het laatste kwartier pakken we het initiatief: meer van de schoten zijn van ons\",\n        \"In het laatste kwartier geven we de wedstrijd uit handen: de schoten gaan naar de tegenstander\",\n        \"Eerste 75 minuten\", \"Laatste kwartier\",\n        \"In de eerste 75 minuten waren {a1} van de {b1} schoten van ons ({p1}%)\",\n        \"In het laatste kwartier waren {a2} van de {b2} schoten van ons ({p2}%)\",\n        \"eerste 75 min\", \"laatste kwartier\",\n        \"de schoten in het laatste kwartier: hoeveel van ons, hoeveel van de tegenstander\",\n        VASTHOUDEN,\n        \"Het laatste kwartier. Kijk naar de fitheid, de wissels en de keuzes bij een achterstand of voorspr
