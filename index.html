ooi\": \"Ingooi\", \"onbekend\": \"Niet te herleiden\",\n}\nSITUATIE_IN_ZIN = {\n    \"opbouw\": \"een opgebouwde aanval\", \"omschakeling\": \"de omschakeling\", \"corner\": \"een corner\",\n    \"vrije trap\": \"een vrije trap\", \"ingooi\": \"een ingooi\", \"onbekend\": \"een situatie die niet te herleiden is\",\n}\n\n\ndef meetpunt(tel: str, nu: str, doel: str) -> str:\n    return f\"Tel na de volgende wedstrijd: {tel}. Nu: {nu}. Doel: {doel}.\"\n\n\n# Drie bevindingen zijn geen vergelijking maar een telling: waar de schoten vandaan komen, waar balverlies\n# wordt afgestraft en over welke kant we aanvallen. Hun zinnen hebben eigen velden.\nGEZIEN = \"Gezien in {steun} van de {telbaar} wedstrijden\"\nZELFDE_VERSCHIL = \"In {steun} van de {telbaar} wedstrijden die te vergelijken zijn, zagen we hetzelfde verschil.\"\nSTERK_PATROON, AANWIJZING, TELLING = \"Sterk patroon\", \"Aanwijzing\", \"Telling\"\nNA_ONS_BALVERLIES = \" na ons balverlies\"\nZIJKANT = {\"links\": \"linkerkant\", \"rechts\": \"rechterkant\"}\n\nHERKOMST = {\n    \"titel\": \"De meeste schoten tegen krijgen we uit {bron_tegen}\",\n    \"kernzin\": (\n        \"{n_tegen} van de {schoten_tegen} schoten tegen kregen we uit {bron_tegen}, en {goals_top} van de {goals_tegen} tegengoals. \"\n        \"Van onze eigen {schoten_voor} schoten kwamen er {n_voor} uit {bron_voor}.\"\n    ),\n    \"steun\": \"In {steun} van de {wedstrijden} wedstrijden was dit de grootste bron van schoten tegen.\",\n    \"gezien\": \"In {steun} van de {wedstrijden} wedstrijden de grootste bron\",\n    \"tel\": \"het aantal schoten tegen uit {bron_tegen}\",\n    \"nu\": \"{n_tegen} in {wedstrijden} wedstrijden, gemiddeld {per_wedstrijd} per wedstrijd\",\n    \"doel\": \"minder dan {per_wedstrijd} per wedstrijd\",\n}\nHERKOMST_STUUR = {\n    \"omschakeling\": \"Scherp zijn op het omschakelmoment na balverlies. Daar geven we de meeste schoten weg: druk op de bal en achter de bal komen.\",\n    \"opbouw\": \"De opbouw van de tegenstander eerder storen. De meeste schoten tegen komen uit zijn opgebouwde aanvallen.\",\n}\nHERKOMST_STUUR_ANDERS = \"Het verdedigen van {bron} tegen. Daar geven we de meeste schoten weg.\"\n\nBALVERLIES = {\n    \"titel\": \"Balverlies {zone} wordt het vaakst afgestraft\",\n    \"kernzin\": (\n        \"We leden {balverlies} keer balverlies in een aanval, waarvan {n_zone} keer {zone_lang}. \"\n        \"Dat werd {schoten_zone} keer afgestraft met een schot tegen. \"\n        \"In totaal kregen we {schoten} schoten tegen na balverlies in een aanval.\"\n    ),\n    \"omschakeling\": \"Daarnaast waren we de bal {balverlies_oms} keer direct weer kwijt na een balverovering, waarna {schoten_oms} schoten tegen volgden.\",\n    \"gezien\": \"Optelling van {wedstrijden} wedstrijden\",\n    \"stuur\": \"Zuinig zijn op de bal {zone}. En de restverdediging al klaar hebben staan, zodat balverlies daar niet direct een schot tegen wordt.\",\n    \"tel\": \"balverlies {zone}, en de schoten tegen die daarop volgen\",\n    \"nu\": \"{n_zone} keer in {wedstrijden} wedstrijden, gemiddeld {per_wedstrijd} per wedstrijd, waarna {schoten_zone} schoten tegen\",\n    \"doel\": \"minder dan {per_wedstrijd} keer balverlies {zone}\",\n}\n\nAANVALSKANT = {\n    \"titel\": \"Ons aanvalsspel gaat vooral over {kant}\",\n    \"kernzin\": (\n        \"We kwamen {langs_rechts} keer over rechts langs het blok en {langs_links} keer over links. \"\n        \"Er kwamen {voorzet_rechts} voorzetten van rechts en {voorzet_links} van links. \"\n        \"In {steun} van de {telbaar} wedstrijden zochten we vooral de {zijkant}.\"\n    ),\n    \"stuur\": \"Bewust kiezen: over {kant} blijven aanvallen of vaker de {andere_zijkant} zoeken. We zijn nu voorspelbaar over {kant}.\",\n    \"tel\": \"hoe vaak we links en rechts langs het blok komen, plus de voorzetten per kant\",\n    \"nu\": \"{rechts} keer over rechts en {links} keer over links\",\n    \"doel\": \"een bewuste keuze: zo houden, of vaker over {ander}\",\n}\n\n\n# (titel, zin) per (vergelijking, kant, uitkomst). Velden: a1 b1 a2 b2, r1 r2 (\"1 op 4\"), tegen en team.\n# 'kant' is eigen (onze opbouw of omschakeling), tegen (die van de tegenstander) of beide.\nWEDSTRIJD_SJABLONEN: dict[tuple[str, str, str], tuple[str, str]] = {\n    (\"druk\", \"eigen\", \"verlies\"): (\n        \"Balverlies tegen hoge druk\",\n        \"Tegen hoge druk van {tegen} verloren we de bal in {a1} van de {b1} aanvallen. Tegen lage druk in {a2} van de {b2}.\",\n    ),\n    (\"druk\", \"eigen\", \"f3\"): (\n        \"Eindfase tegen druk\",\n        \"Tegen hoge druk van {tegen} haalden we in {a1} van de {b1} aanvallen de eindfase. Tegen lage druk in {a2} van de {b2}.\",\n    ),\n    (\"druk\", \"tegen\", \"verlies\"): (\n        \"Ons drukzetten\",\n        \"Als wij hoog druk zetten, verloor {tegen} de bal in {a1} van de {b1} aanvallen. Als wij laag stonden in {a2} van de {b2}.\",\n    ),\n    (\"druk\", \"tegen\", \"f3\"): (\n        \"Ons drukzetten\",\n        \"Als wij hoog druk zetten, kwam {tegen} in {a1} van de {b1} aanvallen tot de eindfase. Als wij laag stonden in {a2} van de {b2}.\",\n    ),\n    (\"lange_bal\", \"eigen\", \"verlies\"): (\n        \"De lange bal\",\n        \"In {a1} van de {b1} aanvallen met een lange bal ging de bal verloren. In de aanvallen zonder lange bal {a2} van de {b2}.\",\n    ),\n    (\"lange_bal\", \"eigen\", \"f3\"): (\n        \"De lange bal\",\n        \"Met een lange bal haalden we in {a1} van de {b1} aanvallen de eindfase. Zonder lange bal in {a2} van de {b2}.\",\n    ),\n    (\"lange_bal\", \"tegen\", \"verlies\"): (\n        \"Lange bal van {tegen}\",\n        \"{tegen} verloor de bal in {a1} van de {b1} aanvallen met een lange bal. Zonder lange bal in {a2} van de {b2}.\",\n    ),\n    (\"lange_bal\", \"tegen\", \"f3\"): (\n        \"Lange bal van {tegen}\",\n        \"{tegen} haalde met een lange bal in {a1} van de {b1} aanvallen de eindfase. Zonder lange bal in {a2} van de {b2}.\",\n    ),\n    (\"helft\", \"eigen\", \"f3\"): (\n        \"Eerste tegen tweede helft\",\n        \"In de 1e helft haalden we in {a1} van de {b1} aanvallen de eindfase. In de 2e helft in {a2} van de {b2}.\",\n    ),\n    (\"helft\", \"eigen\", \"verlies\"): (\n        \"Eerste tegen tweede helft\",\n        \"In de 1e helft verloren we de bal in {a1} van de {b1} aanvallen. In de 2e helft in {a2} van de {b2}.\",\n    ),\n    (\"helft\", \"eigen\", \"schot\"): (\n        \"Omschakelen per helft\",\n        \"In de 1e helft kwamen we na balwinst in {a1} van de {b1} omschakelingen tot een schot. In de 2e helft in {a2} van de {b2}.\",\n    ),\n    (\"helft\", \"tegen\", \"schot\"): (\n        \"Hun omschakeling per helft\",\n        \"In de 1e helft kwam {tegen} na ons balverlies in {a1} van de {b1} omschakelingen tot een schot. In de 2e helft in {a2} van de {b2}.\",\n    ),\n    (\"route\", \"eigen\", \"f3\"): (\n        \"Door of achter het blok\",\n        \"Aanvallen door het blok haalden in {a1} van de {b1} keer de eindfase, aanvallen achter het blok in {a2} van de {b2}.\",\n    ),\n    (\"route\", \"tegen\", \"f3\"): (\n        \"Hoe {tegen} het blok passeerde\",\n        \"{tegen} haalde door het blok in {a1} van de {b1} aanvallen de eindfase, achter het blok in {a2} van de {b2}.\",\n    ),\n    (\"doeltrap\", \"eigen\", \"f3\"): (\n        \"Vanuit de doeltrap\",\n        \"Vanuit een doeltrap haalden we in {a1} van de {b1} aanvallen de eindfase. Vanuit ander balbezit in {a2} van de {b2}.\",\n    ),\n    (\"doeltrap\", \"tegen\", \"f3\"): (\n        \"Doeltrap van {tegen}\",\n        \"Vanuit een doeltrap haalde {tegen} in {a1} van de {b1} aanvallen de eindfase. Vanuit ander balbezit in {a2} van de {b2}.\",\n    ),\n    (\"teams_opbouw\", \"beide\", \"f3\"): (\n        \"Opbouw: wij tegenover {tegen}\",\n        \"Wij haalden in {a1} van de {b1} opgebouwde aanvallen de eindfase, {tegen} in {a2} van de {b2}.\",\n    ),\n    (\"teams_opbouw\", \"beide\", \"verlies\"): (\n        \"Balverlies in de opbouw\",\n        \"Wij verloren de bal in {a1} van de {b1} opgebouwde aanvallen, {tegen} in {a2} van de {b2}.\",\n    ),\n    (\"teams_opbouw\", \"beide\", \"schot\"): (\n        \"Schoten uit de opbouw\",\n        \"Wij kwamen in {a1} van de {b1} opgebouwde aanvallen tot een schot, {tegen} in {a2} van de {b2}.\",\n    ),\n    (\"teams_omschakeling\", \"beide\", \"schot\"): (\n        \"Omschakelen: balwinst tegenover balverlies\",\n        \"Na balwinst kwamen wij in {a1} van de {b1} omschakelingen tot een schot ({r1}). Na ons balverlies kwam {tegen} in {a2} van de {b2} omschakelingen tot een schot ({r2}).\",\n    ),\n    (\"teams_omschakeling\", \"beide\", \"f3\"): (\n        \"Omschakelen: balwinst tegenover balverlies\",\n        \"Na balwinst haalden wij in {a1} van de {b1} omschakelingen de eindfase. Na ons balverlies haalde {tegen} dat in {a2} van de {b2}.\",\n    ),\n    (\"voorzet\", \"eigen\", \"schot\"): (\n        \"Voorzetten van links en rechts\",\n        \"Voorzetten van links leverden in {a1} van de {b1} keer een schot op, van rechts in {a2} van de {b2}.\",\n    ),\n}\n\n\nXML_WEL = [\n    (\"Balbezit in reeksen\", \"elke aanval, elke keer verdedigen en elke omschakeling, met begin, einde en duur\"),\n    (\"Het verloop van een aanval\", \"welke fases een aanval doorliep: opbouw, langs of door het blok, achter het blok, eindfase\"),\n    (\"Druk\", \"of het team zonder bal hoog of laag druk zette, en wat dat opleverde\"),\n    (\"Hoe een aanval eindigt\", \"schot, goal, balverlies, balverovering, bal uit het spel\"),\n    (\"Schoten en goals\", \"van wie, in welke minuut, en uit welke spelsituatie: opbouw, omschakeling of spelhervatting\"),\n    (\"Balverlies en wat erna gebeurt\", \"in welke fase de bal verloren ging en of de tegenstander daarna tot een schot kwam\"),\n    (\"Spelhervattingen en voorzetten\", \"corners, vrije trappen, ingooien, en voorzetten van links en rechts\"),\n    (\"Verloop van de wedstrijd\", \"per vijf minuten wie de wedstrijd in handen had\"),\n    (\"Trends\", \"dezelfde tellingen per wedstrijd naast elkaar, over het seizoen\"),\n]\nXML_NIET = [\n    (\"De plek op het veld\", \"de XML heeft geen coordinaten; het veld is een schema dat de fases volgt\"),\n    (\"Spelers\", \"er staat geen speler in de codering; dat kan alleen via de wedstrijdformulieren\"),\n    (\"Passes en duels\", \"alleen wat een codeur aanklikt, niet elke balcontact\"),\n    (\"Kwaliteit van een kans\", \"een schot is een schot; hoe groot de kans was staat er niet in\"),\n    (\"Wie er speelde\", \"teams, datum en uitslag komen uit de bestandsnaam, niet uit de XML\"),\n]\n\n\n@dataclass(frozen=True)\nclass Kaarttekst:\n    functie: str  # de teamfunctie waar het punt onder valt\n    naam: str\n    eenheid: str  # waarvan het een deel is, of wat er geteld is\n    hoger_is_beter: bool\n\n\n# De wedstrijdkaart: elke wedstrijd dezelfde punten, twee per teamfunctie.\nKAART: dict[str, Kaarttekst] = {\n    \"eindfase_voor\": Kaarttekst(\"Aanvallen\", \"In de eindfase gekomen\", \"aanvallen\", True),\n    \"schoten_voor\": Kaarttekst(\"Aanvallen\", \"Schoten\", \"schoten\", True),\n    \"eindfase_tegen\": Kaarttekst(\"Verdedigen\", \"Tegenstander in onze eindfase\", \"aanvallen van de tegenstander\", False),\n    \"schoten_tegen\": Kaarttekst(\"Verdedigen\", \"Schoten tegen\", \"schoten tegen\", False),\n    \"omschakeling_voor\": Kaarttekst(\"Omschakelen\", \"Na balverovering in de eindfase\", \"balveroveringen\", True),\n    \"omschakeling_tegen\": Kaarttekst(\"Omschakelen\", \"Na balverlies: tegenstander in onze eindfase\", \"keer balverlies\", False),\n}\n", "myva_pipeline/weergave/trainerspagina.py": "\"\"\"Trainerspagina: conclusies met clips en twee grafieken.\n\nDrie weergaven van dezelfde inhoud: markdown, HTML met SVG-grafieken en een\nclipslijst in het MyVA-instancesformaat.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport html\nimport uuid\nfrom dataclasses import dataclass\n\nimport pandas as pd\n\nfrom myva_pipeline.analyse.patronen import schoten_per_groep\nfrom myva_pipeline.analyse.resultaat import Analyse\nfrom myva_pipeline.weergave import conclusies as cz\nfrom myva_pipeline.weergave import taal\n\nMAX_CLIPS_TEKST = cz.MAX_CLIPS_TEKST\nClipMap = dict[str, str]\n\n\n@dataclass\nclass Inhoud:\n    conclusies: list[dict]\n    goals: list[dict]\n    herkomst: pd.DataFrame\n\n\ndef bouw_inhoud(a: Analyse) -> Inhoud:\n    namen = taal.namen(a)\n    return Inhoud(\n        conclusies=cz.bouw_conclusies(a.regels, a.reeksen, a.kansen, namen),\n        goals=cz.goals_met_clips(a.kansen, a.reeksen, namen, thuis=a.wedstrijd.thuis),\n        herkomst=schoten_per_groep(a.kansen),\n    )\n\n\ndef alle_clips(inhoud: Inhoud) -> list[dict]:\n    return [c for g in inhoud.goals for c in g[\"clips\"]] + [c for con in inhoud.conclusies for c in con[\"clips\"]]\n\n\ndef _clips_md(clips: list[dict], clip_map: ClipMap) -> str:\n    regels = []\n    for c in clips[:MAX_CLIPS_TEKST]:\n        link = f\" [clip]({clip_map[c['reeks_id']]})\" if c[\"reeks_id\"] in clip_map else \"\"\n        regels.append(f\"  - {c['helft']}e helft {c['minuut']}e min (video {c['videotijd']}): {c['verloop']}, {c['eind']}. Reeks {c['reeks_id']}.{link}\")\n    if len(clips) > MAX_CLIPS_TEKST:\n        regels.append(f\"  - en nog {len(clips) - MAX_CLIPS_TEKST} clips, zie het clipsbestand.\")\n    return \"\\n\".join(regels)\n\n\ndef render_md(a: Analyse, inhoud: Inhoud, clip_map: ClipMap | None = None) -> str:\n    clip_map = clip_map or {}\n    w = a.wedstrijd\n    delen = [\n        f\"# {w.titel}\",\n        \"\",\n        f\"{w.datum}. E\u00e9n pagina voor de staf. De onderbouwing staat in `{w.naam}.md`, de clips in `{w.naam}_clips.xml`.\",\n        \"\",\n        \"## Goals\",\n        \"\",\n    ]\n    for g in inhoud.goals:\n        rid = g[\"clips\"][0][\"reeks_id\"] if g[\"clips\"] else None\n        link = f\" [clip]({clip_map[rid]})\" if rid in clip_map else \"\"\n        delen.append(f\"- **{g['stand']}** {g['helft']}e helft {g['minuut']}e min, {g['wie']}: uit {g['herkomst']}, {g['verloop']}. Video {g['videotijd']}.{link}\")\n    delen += [\"\", \"## Wat opviel\", \"\"]\n    for i, c in enumerate(inhoud.conclusies, start=1):\n        delen += [f\"### {i}. {c['titel']}\", \"\", c[\"zin\"], \"\"]\n        if c[\"clips\"]:\n            delen += [f\"Kijk terug ({len(c['clips'])} clips):\", _clips_md(c[\"clips\"], clip_map)]\n        if c[\"regel_id\"]:\n            delen.append(f\"  `{c['regel_id']}`\")\n        delen.append(\"\")\n\n    t = inhoud.herkomst.rename(columns={\"eigen\": w.team, \"tegen\": w.tegenstander})\n    delen += [\"## Waar de schoten vandaan kwamen\", \"\", \"| | \" + \" | \".join(t.columns) + \" |\", \"|---|\" + \"|\".join([\"---\"] * len(t.columns)) + \"|\"]\n    delen += [f\"| {str(idx).capitalize()} | \" + \" | \".join(str(int(v)) for v in rij) + \" |\" for idx, rij in t.iterrows()]\n    delen += [\n        \"\", \"## Dreiging per 5 minuten\", \"\",\n        f\"Links {w.team}, rechts {w.tegenstander}. Hoe langer de balk, hoe dichter dat team bij een schot kwam. Erachter de schoten voor-tegen.\",\n        \"\", \"```\", taal.dreiging_tekst(a.verloop), \"```\", \"\",\n    ]\n    return \"\\n\".join(delen)\n\n\ndef render_clips_xml(a: Analyse, inhoud: Inhoud) -> str:\n    \"\"\"Clips als instances in het MyVA-exportformaat; de conclusie is de code.\"\"\"\n    regels = ['<?xml version=\"1.0\" encoding=\"UTF-8\"?>', \"<file>\", \"<info>\", f\"<NAME>{html.escape(a.wedstrijd.naam)} clips<\/NAME>\", \"<\/info>\", \"<ALL_INSTANCES>\"]\n    codes: list[str] = []\n\n    def instance(code: str, c: dict, extra: list[str]) -> None:\n        regels.append(\"<instance>\")\n        regels.append(f\"<ID>{uuid.uuid4()}<\/ID>\")\n        regels.append(f\"<code>{html.escape(code)}<\/code>\")\n        regels.append(f\"<start>{c['start']:.2f}<\/start>\")\n        regels.append(f\"<end>{c['end']:.2f}<\/end>\")\n        for lab in [c[\"reeks_id\"], c[\"verloop\"], c[\"eind\"], *extra]:\n            regels.append(f\"<label><text>{html.escape(str(lab))}<\/text><\/label>\")\n        regels.append(\"<\/instance>\")\n        if code not in codes:\n            codes.append(code)\n\n    for g in inhoud.goals:\n        for c in g[\"clips\"]:\n            instance(f\"Goal {g['stand']}\", c, [g[\"wie\"]])\n    for i, con in enumerate(inhoud.conclusies, start=1):\n        for c in con[\"clips\"]:\n            instance(f\"{i}. {con['titel']}\", c, [])\n    regels += [\"<\/ALL_INSTANCES>\", \"<ROWS>\"]\n    regels += [f\"<row><ID>{uuid.uuid4()}<\/ID><code>{html.escape(code)}<\/code><R>20000<\/R><G>50000<\/G><B>30000<\/B><\/row>\" for code in codes]\n    regels += [\"<\/ROWS>\", \"<\/file>\"]\n    return \"\\n\".join(regels)\n\n\ndef _svg_dreiging(verloop: pd.DataFrame, team: str, tegen: str) -> str:\n    \"\"\"Gespiegelde staafgrafiek: eigen team boven de as, tegenstander eronder.\"\"\"\n    n = len(verloop)\n    if n == 0:\n        return \"\"\n    breedte, hoogte = 720, 300\n    links, rechts, boven, onder = 44, 12, 28, 46\n    plot_h = (hoogte - boven - onder) / 2\n    stap = (breedte - links - rechts) / n\n    balk = max(6, stap * 0.62)\n    hoogste = max(float(verloop[\"dreiging_voor\"].max()), float(verloop[\"dreiging_tegen\"].max()), 0.5)\n    schaal = plot_h / hoogste\n    y0 = boven + plot_h\n\n    delen = [f'<svg viewBox=\"0 0 {breedte} {hoogte}\" role=\"img\" aria-label=\"Dreiging per 5 minuten, {team} boven de as en {tegen} eronder\" class=\"chart\">']\n    for e in range(1, int(hoogste) + 1):\n        for y in (y0 - e * schaal, y0 + e * schaal):\n            delen.append(f'<line x1=\"{links}\" x2=\"{breedte - rechts}\" y1=\"{y:.1f}\" y2=\"{y:.1f}\" class=\"grid\"/>')\n            delen.append(f'<text x=\"{links - 6}\" y=\"{y + 4:.1f}\" class=\"tick\" text-anchor=\"end\">{e}<\/text>')\n    delen.append(f'<line x1=\"{links}\" x2=\"{breedte - rechts}\" y1=\"{y0:.1f}\" y2=\"{y0:.1f}\" class=\"axis\"/>')\n\n    vorige_helft = None\n    for i, (_, v) in enumerate(verloop.iterrows()):\n        x = links + i * stap + (stap - balk) / 2\n        hv, ht = float(v[\"dreiging_voor\"]) * schaal, float(v[\"dreiging_tegen\"]) * schaal\n        titel = (\n            f\"{int(v['helft'])}e helft minuut {v['venster']}: {team} {v['dreiging_voor']:.2f} ({int(v['schoten_voor'])} schoten), \"\n            f\"{tegen} {v['dreiging_tegen']:.2f} ({int(v['schoten_tegen'])} schoten)\"\n        )\n        delen.append(f'<g class=\"bar\" tabindex=\"0\"><title>{html.escape(titel)}<\/title>')\n        if hv > 0:\n            delen.append(f'<rect x=\"{x:.1f}\" y=\"{y0 - hv:.1f}\" width=\"{balk:.1f}\" height=\"{hv:.1f}\" rx=\"3\" class=\"voor\"/>')\n        if ht > 0:\n            delen.append(f'<rect x=\"{x:.1f}\" y=\"{y0 + 1:.1f}\" width=\"{balk:.1f}\" height=\"{ht:.1f}\" rx=\"3\" class=\"tegen\"/>')\n        for k in range(int(v[\"schoten_voor\"])):\n            delen.append(f'<circle cx=\"{x + balk / 2:.1f}\" cy=\"{y0 - hv - 8 - k * 9:.1f}\" r=\"3\" class=\"dot voor\"/>')\n        for k in range(int(v[\"schoten_tegen\"])):\n            delen.append(f'<circle cx=\"{x + balk / 2:.1f}\" cy=\"{y0 + ht + 9 + k * 9:.1f}\" r=\"3\" class=\"dot tegen\"/>')\n        delen.append(\"<\/g>\")\n\n        helft = int(v[\"helft\"])\n        if helft != vorige_helft:\n            delen.append(f'<text x=\"{links + i * stap + 2:.1f}\" y=\"{hoogte - 26}\" class=\"label\">{helft}e helft<\/text>')\n            if vorige_helft is not None:\n                delen.append(f'<line x1=\"{links + i * stap:.1f}\" x2=\"{links + i * stap:.1f}\" y1=\"{boven}\" y2=\"{hoogte - onder + 4}\" class=\"sep\"/>')\n            vorige_helft = helft\n        if i % 2 == 0:\n            delen.append(f'<text x=\"{x + balk / 2:.1f}\" y=\"{hoogte - 8}\" class=\"tick\" text-anchor=\"middle\">{str(v[\"venster\"]).split(\"-\")[0]}<\/text>')\n    delen.append(\"<\/svg>\")\n    return \"\\n\".join(delen)\n\n\ndef _svg_herkomst(herkomst: pd.DataFrame, team: str, tegen: str) -> str:\n    \"\"\"Horizontale staven per herkomst, eigen team en tegenstander onder elkaar.\"\"\"\n    rijen = list(herkomst.itertuples())\n    if not rijen:\n        return \"\"\n    breedte, rij_h, links = 720, 44, 130\n    hoogte = 16 + rij_h * len(rijen)\n    schaal = (breedte - links - 40) / max(1, int(herkomst.to_numpy().max()))\n    delen = [f'<svg viewBox=\"0 0 {breedte} {hoogte}\" role=\"img\" aria-label=\"Schoten per herkomst\" class=\"chart\">']\n    for i, r in enumerate(rijen):\n        y = 16 + i * rij_h\n        naam = str(r.Index).capitalize()\n        delen.append(f'<text x=\"{links - 10}\" y=\"{y + 20}\" class=\"label\" text-anchor=\"end\">{html.escape(naam)}<\/text>')\n        for j, (waarde, cls, wie) in enumerate(((int(r.eigen), \"voor\", team), (int(r.tegen), \"tegen\", tegen))):\n            yy, w = y + j * 16, waarde * schaal\n            delen.append(f'<g class=\"bar\" tabindex=\"0\"><title>{html.escape(f\"{wie}: {waarde} schoten uit {naam.lower()}\")}<\/title>')\n            if w > 0:\n                delen.append(f'<rect x=\"{links}\" y=\"{yy}\" width=\"{w:.1f}\" height=\"12\" rx=\"3\" class=\"{cls}\"/>')\n            delen.append(f'<text x=\"{links + w + 6:.1f}\" y=\"{yy + 10}\" class=\"value\">{waarde}<\/text>')\n            delen.append(\"<\/g>\")\n    delen.append(\"<\/svg>\")\n    return \"\\n\".join(delen)\n\n\ndef _speler(rid: str | None, clip_map: ClipMap) -> str:\n    if rid not in clip_map:\n        return \"\"\n    return (\n        f\"<button type='button' class='speel' data-src='{html.escape(clip_map[rid])}' aria-expanded='false'>Bekijk clip<\/button>\"\n        f\"<div class='speler' hidden><\/div>\"\n    )\n\n\ndef _clips_html(clips: list[dict], clip_map: ClipMap) -> str:\n    items = [\n        f\"<li><span class='tijd'>{c['helft']}e helft {c['minuut']}e min<\/span> \"\n        f\"<span class='video'>video {c['videotijd']}<\/span> \"\n        f\"<span class='verloop'>{html.escape(c['verloop'])}, {html.escape(c['eind'])}<\/span> \"\n        f\"<span class='reeks'>{c['reeks_id']}<\/span>{_speler(c['reeks_id'], clip_map)}<\/li>\"\n        for c in clips[:MAX_CLIPS_TEKST]\n    ]\n    if len(clips) > MAX_CLIPS_TEKST:\n        items.append(f\"<li class='muted'>en nog {len(clips) - MAX_CLIPS_TEKST} clips in het clipsbestand<\/li>\")\n    return f\"<ul class='clips'>{''.join(items)}<\/ul>\"\n\n\ndef _goal_html(g: dict, clip_map: ClipMap) -> str:\n    rid = g[\"clips\"][0][\"reeks_id\"] if g[\"clips\"] else None\n    return (\n        f\"<li><span class='stand'>{g['stand']}<\/span><span class='goalregel'>{g['helft']}e helft, {g['minuut']}e minuut, \"\n        f\"<strong>{html.escape(g['wie'])}<\/strong>: uit {html.escape(g['herkomst'])}, {html.escape(g['verloop'])}. \"\n        f\"<span class='video'>Video {g['videotijd']}<\/span> {_speler(rid, clip_map)}<\/span><\/li>\"\n    )\n\n\ndef _conclusie_html(i: int, c: dict, clip_map: ClipMap) -> str:\n    kijk = f\"<p class='kijk'>Kijk terug, {len(c['clips'])} clips<\/p>{_clips_html(c['clips'], clip_map)}\" if c[\"clips\"] else \"\"\n    regel = f\"<div class='regel'>{c['regel_id']}<\/div>\" if c[\"regel_id\"] else \"\"\n    return f\"<section class='conclusie'><h3>{i}. {html.escape(c['titel'])}<\/h3><p>{html.escape(c['zin'])}<\/p>{kijk}{regel}<\/section>\"\n\n\nSPELER_JS = \"\"\"\n<script>\ndocument.addEventListener('click', function (e) {\n  var knop = e.target.closest('button.speel');\n  if (!knop) return;\n  var vak = knop.nextElementSibling;\n  var sluit = function (v) {\n    v.hidden = true; v.innerHTML = '';\n    var k = v.previousElementSibling; k.textContent = 'Bekijk clip'; k.setAttribute('aria-expanded', 'false');\n  };\n  if (!vak.hidden) { sluit(vak); return; }\n  document.querySelectorAll('.speler:not([hidden])').forEach(sluit);\n  var video = document.createElement('video');\n  video.controls = true; video.autoplay = true; video.playsInline = true; video.src = knop.dataset.src;\n  vak.appendChild(video); vak.hidden = false;\n  knop.textContent = 'Sluit clip'; knop.setAttribute('aria-expanded', 'true');\n});\n<\/script>\n\"\"\"\n\nCSS = \"\"\"\n:root{--ground:#f7f8f6;--paper:#ffffff;--ink:#17211b;--ink2:#4d5a52;--muted:#7a857e;--line:#dfe4df;--voor:#1B7F4C;--tegen:#2F5FA8;--voor-soft:#e3f1e8;--accent:#1B7F4C}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--ground:#161a17;--paper:#1f2521;--ink:#eef2ee;--ink2:#b9c3bc;--muted:#8a948d;--line:#303933;--voor:#3FA86C;--tegen:#6C95D8;--voor-soft:#233a2c;--accent:#3FA86C}}\n:root[data-theme=\"dark\"]{--ground:#161a17;--paper:#1f2521;--ink:#eef2ee;--ink2:#b9c3bc;--muted:#8a948d;--line:#303933;--voor:#3FA86C;--tegen:#6C95D8;--voor-soft:#233a2c;--accent:#3FA86C}\nbody{background:var(--ground);color:var(--ink);font-family:\"Barlow\",\"Segoe UI\",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}\nmain{max-width:720px;margin:0 auto}\nh1,h2,h3{font-family:\"Barlow Condensed\",\"Arial Narrow\",sans-serif;text-wrap:balance;margin:0}\nh1{font-size:2.4rem;line-height:1.05;font-weight:700}\nh2{font-size:1.4rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);margin-top:2.2rem;margin-bottom:.6rem}\nh3{font-size:1.35rem;font-weight:700;margin-bottom:.2rem}\n.kop{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;border-bottom:2px solid var(--line);padding-bottom:14px}\n.score{font-family:\"Barlow Condensed\",\"Arial Narrow\",sans-serif;font-size:2.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}\n.meta{color:var(--muted);font-size:.95rem;flex-basis:100%}\n.goals{list-style:none;padding:0;margin:0;display:grid;gap:8px}\n.goals li{display:grid;grid-template-columns:3.2rem 1fr;gap:10px;align-items:baseline}\n.stand{font-family:\"Barlow Condensed\",sans-serif;font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--accent)}\n.conclusie{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px}\n.conclusie p{margin:.3rem 0 .6rem}\n.kijk{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}\n.clips{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:.92rem}\n.clips li{display:flex;flex-wrap:wrap;gap:4px 10px;padding:4px 0;border-top:1px dashed var(--line)}\n.tijd{font-weight:600;min-width:9.5rem}.video{color:var(--ink2);font-variant-numeric:tabular-nums}.verloop{color:var(--ink2)}.reeks{color:var(--muted);font-size:.8rem;margin-left:auto}\n.muted{color:var(--muted)}.regel{color:var(--muted);font-size:.75rem;margin-top:6px}\n.speel{font:inherit;font-size:.82rem;font-weight:600;color:var(--accent);background:var(--voor-soft);border:1px solid transparent;border-radius:4px;padding:2px 10px;cursor:pointer}\n.speel:hover{border-color:var(--accent)}.speel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.speler{flex-basis:100%;margin-top:6px}.speler video{width:100%;max-width:100%;border-radius:6px;background:#000;display:block}\n.chart{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:6px}\n.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--ink2);stroke-width:1.5}.chart .sep{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}\n.chart .voor{fill:var(--voor)}.chart .tegen{fill:var(--tegen)}.chart .dot{stroke:var(--paper);stroke-width:1.5}\n.chart text{fill:var(--ink2);font-family:\"Barlow\",system-ui,sans-serif;font-size:12px}.chart .label{font-weight:600;fill:var(--ink)}.chart .value{fill:var(--ink);font-weight:600}\n.chart .bar{cursor:default}.chart .bar:hover rect,.chart .bar:focus rect{opacity:.75}.chart .bar:focus{outline:none}\n.legenda{display:flex;gap:18px;font-size:.9rem;color:var(--ink2);margin:8px 0 0}\n.legenda span::before{content:\"\";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}\n.legenda .voor::before{background:var(--voor)}.legenda .tegen::before{background:var(--tegen)}\n.uitleg{font-size:.95rem;color:var(--ink2)}\n.voet{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:.85rem}\n@media (max-width:480px){h1{font-size:1.9rem}.score{font-size:1.9rem}.clips li{font-size:.86rem}.tijd{min-width:8rem}}\n\"\"\"\n\n\ndef render_html(a: Analyse, inhoud: Inhoud, clip_map: ClipMap | None = None) -> str:\n    clip_map = clip_map or {}\n    w = a.wedstrijd\n    team, tegen = html.escape(w.team), html.escape(w.tegenstander)\n    eerste, tweede = (team, tegen) if w.thuis else (tegen, team)\n    goals = \"\".join(_goal_html(g, clip_map) for g in inhoud.goals) or \"<li>Geen goals.<\/li>\"\n    conclusies = \"\".join(_conclusie_html(i, c, clip_map) for i, c in enumerate(inhoud.conclusies, start=1))\n    legenda = f\"<p class='legenda'><span class='voor'>{team}<\/span><span class='tegen'>{tegen}<\/span><\/p>\"\n    return f\"\"\"<title>{html.escape(w.titel)}<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap\">\n<style>{CSS}<\/style>\n<main>\n<header class=\"kop\">\n  <h1>{eerste} <span class=\"muted\">tegen<\/span> {tweede}<\/h1>\n  <span class=\"score\">{html.escape(w.uitslag)}<\/span>\n  <span class=\"meta\">{html.escape(w.datum)}. E\u00e9n pagina voor de staf, gemaakt uit de MyVA-codering. De onderbouwing staat in het volledige rapport.<\/span>\n<\/header>\n\n<h2>Goals<\/h2>\n<ul class=\"goals\">{goals}<\/ul>\n\n<h2>Wat opviel<\/h2>\n{conclusies}\n\n<h2>Waar de schoten vandaan kwamen<\/h2>\n{_svg_herkomst(inhoud.herkomst, w.team, w.tegenstander)}\n{legenda}\n\n<h2>Dreiging per 5 minuten<\/h2>\n<p class=\"uitleg\">Hoe hoog kwamen de aanvallen in elke periode, ook als er niet geschoten werd. {team} boven de lijn, {tegen} eronder. De stippen zijn schoten.<\/p>\n{_svg_dreiging(a.verloop, w.team, w.tegenstander)}\n{legenda}\n\n<p class=\"voet\">Alle getallen zijn tellingen uit de MyVA-codering. Videotijden verwijzen naar de wedstrijdvideo in MyVA. Onderbouwing en uitleg van de begrippen: {html.escape(w.naam)}.md.<\/p>\n<\/main>\n{SPELER_JS if clip_map else ''}\n\"\"\"\n", "myva_pipeline/weergave/veldstippen.py": "\"\"\"Het grote veld: per vraag de zones en een stip per moment, klaar om te tekenen.\n\nHet veld is 105 bij 68 meter en wij vallen aan naar rechts, dus onze linkerkant ligt\nboven. De zones volgen het veld zoals een trainer het ziet: van eigen doel naar het\ndoel van de tegenstander, met de flanken aan de zijkant. Spelhervattingen hebben geen\nplek op het veld en staan in een strook eronder. De XML heeft geen coordinaten: een\nstip staat in de zone waar het moment volgens de codering hoort, in een net raster.\nDe plek binnen de zone betekent niets.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass, field\nfrom typing import Callable\n\nimport pandas as pd\n\nfrom myva_pipeline.weergave.formulering import procent\nfrom myva_pipeline.weergave.visueel import GROEN, GROEN_LICHT, ROOD, ROOD_LICHT\n\nVELD = (105.0, 68.0)\nSTROOK = (-15.0, -3.0)  # onder het veld: wat geen plek op het veld heeft\nGRIJS, GRIJS_LICHT = \"#8A968F\", \"#C9D2CC\"\nGOALS = (\"goal\", \"goal tegen\")\n\n# De veldindeling, in meters. Drie stroken in de lengte en drie banen in de breedte.\nLAAG, MIDDEN, HOOG = (1.0, 34.0), (36.0, 33.0), (70.0, 34.0)\nLINKS, CENTRUM, RECHTS = (47.0, 20.0), (22.0, 24.0), (1.0, 20.0)\nBREED = (1.0, 66.0)\n\n\n@dataclass(frozen=True)\nclass Uitkomst:\n    code: str\n    naam: str\n    kleur: str\n\n\n@dataclass(frozen=True)\nclass Vraag:\n    knop: str  # kort, op de knop\n    titel: str\n    uitleg: str\n    zones: dict[str, tuple[float, float, float, float, str]]  # sleutel -> (x, y, breedte, hoogte, naam)\n    uitkomsten: tuple[Uitkomst, ...]  # de kleuren van de stippen\n    telt: tuple[str, ...]  # de uitkomsten die per zone geteld worden\n    telt_naam: str  # kort, in het label per zone: \"3 van de 12 veroverd\"\n    samenvatting: str  # hele zin bij het veld, met {a}, {b} en {p}\n    zone_van: Callable[[pd.Series], str]\n    kleur_van: Callable[[pd.Series], str] = field(default=lambda r: r[\"uitkomst\"])\n\n\ndef _zone(x: tuple[float, float], y: tuple[float, float], naam: str) -> tuple[float, float, float, float, str]:\n    return (x[0], y[0], x[1], y[1], naam)\n\n\ndef _strook(naam: str) -> tuple[float, float, float, float, str]:\n    return (HOOG[0] - 15, STROOK[0], HOOG[1] + 15, STROOK[1] - STROOK[0], naam)\n\n\nTEGEN_ZONE = {\"hun_doeltrap\": \"hoog_doeltrap\", \"hun_opbouw\": \"hoog_opbouw\", \"langs_blok\": \"middenveld\", \"door_blok\": \"middenveld\", \"achter_blok\": \"laag_blok\", \"onze_eindfase\": \"laag_eindfase\"}\n\nVRAGEN: dict[str, Vraag] = {\n    \"doeltrap\": Vraag(\n        \"Veroveren na hun doeltrap\",\n        \"Hoe hoog veroveren we de bal na een doeltrap van de tegenstander?\",\n        \"Elke stip is een doeltrap van de tegenstander, in de strook waar zijn aanval eindigde. Hoe verder naar rechts, hoe hoger we de bal veroverden.\",\n        {\n            \"laag_eindfase\": _zone((1, 16), BREED, \"In onze eindfase\"),\n            \"laag_blok\": _zone((18, 17), BREED, \"Achter ons blok\"),\n            \"middenveld\": _zone(MIDDEN, BREED, \"Op het middenveld\"),\n            \"hoog_opbouw\": _zone((70, 17), BREED, \"In hun opbouw\"),\n            \"hoog_doeltrap\": _zone((88, 16), BREED, \"Direct bij hun doeltrap\"),\n        },\n        (\n            Uitkomst(\"veroverd\", \"Wij veroveren de bal\", GROEN),\n            Uitkomst(\"schot\", \"Schot of goal tegen\", ROOD),\n            Uitkomst(\"uit\", \"Bal uit het spel\", GRIJS),\n            Uitkomst(\"anders\", \"Anders of niet gecodeerd\", GRIJS_LICHT),\n        ),\n        (\"veroverd\",), \"veroverd\",\n        \"Na {b} doeltrappen van de tegenstander veroverden we de bal {a} keer ({p}%).\",\n        lambda r: TEGEN_ZONE.get(r[\"zone\"], \"laag_eindfase\"),\n        lambda r: \"schot\" if r[\"uitkomst\"] in (\"schot\", \"goal\") else r[\"uitkomst\"],\n    ),\n    \"opbouw\": Vraag(\n        \"Onze opbouw per kant\",\n        \"Via welke kant bouwen we op, en hoe ver komen we?\",\n        \"Elke stip is een opgebouwde aanval, bij de kant waarover hij ging en de verste fase die hij haalde.\",\n        {\n            f\"{kant}|{verst}\": _zone(x, y, f\"{kant_naam}, {verst_naam}\")\n            for kant, kant_naam, y in ((\"links\", \"Links\", LINKS), (\"midden\", \"Centraal of geen kant\", CENTRUM), (\"rechts\", \"Rechts\", RECHTS))\n            for verst, verst_naam, x in ((\"opbouw\", \"blijft in de opbouw\", LAAG), (\"middenveld\", \"tot het middenveld\", MIDDEN), (\"eindfase\", \"in de eindfase\", HOOG))\n        },\n        (\n            Uitkomst(\"schot\", \"Schot of goal\", GROEN),\n            Uitkomst(\"balverlies\", \"Balverlies\", ROOD),\n            Uitkomst(\"uit\", \"Bal uit het spel\", GRIJS),\n            Uitkomst(\"anders\", \"Anders\", GRIJS_LICHT),\n        ),\n        (\"goal\", \"schot\"), \"met een schot\",\n        \"Uit {b} opgebouwde aanvallen kwamen we {a} keer tot een schot ({p}%).\",\n        lambda r: f\"{r['kant']}|{r['zone']}\",\n        lambda r: \"schot\" if r[\"uitkomst\"] in (\"schot\", \"goal\") else r[\"uitkomst\"],\n    ),\n    \"gevaar_voor\": Vraag(\n        \"Ons gevaar per kant\",\n        \"Van welke kant komt ons gevaar?\",\n        \"Elke stip is een schot van ons, bij de kant waarover de aanval ging of de voorzet kwam. Spelhervattingen staan onder het veld.\",\n        {\n            \"links\": _zone(HOOG, LINKS, \"Over links\"),\n            \"midden\": _zone(HOOG, CENTRUM, \"Centraal of kant niet gecodeerd\"),\n            \"rechts\": _zone(HOOG, RECHTS, \"Over rechts\"),\n            \"spelhervatting\": _strook(\"Uit een spelhervatting\"),\n        },\n        (Uitkomst(\"opbouw\", \"Uit de opbouw\", GROEN), Uitkomst(\"omschakeling\", \"Uit de omschakeling\", GROEN_LICHT), Uitkomst(\"spelhervatting\", \"Uit een spelhervatting\", GRIJS)),\n        GOALS, \"raak\",\n        \"Van onze {b} schoten gingen er {a} in ({p}%).\",\n        lambda r: \"spelhervatting\" if r[\"zone\"] == \"spelhervatting\" else r[\"kant\"],\n        lambda r: r[\"zone\"] if r[\"zone\"] in (\"opbouw\", \"omschakeling\", \"spelhervatting\") else \"opbouw\",\n    ),\n    \"gevaar_tegen\": Vraag(\n        \"Gevaar tegen\",\n        \"Hoe ontstaat het gevaar tegen?\",\n        \"Elke stip is een schot tegen, gekleurd naar hoe het ontstond. De kant tekenen we nog niet: niet vastgelegd is of links in de codering van de tegenstander ons links is.\",\n        {\"doel\": _zone(LAAG, BREED, \"Schoten op ons doel\")},\n        (Uitkomst(\"omschakeling\", \"Na ons balverlies\", ROOD), Uitkomst(\"opbouw\", \"Uit hun opgebouwde aanval\", ROOD_LICHT), Uitkomst(\"spelhervatting\", \"Uit een spelhervatting\", GRIJS)),\n        GOALS, \"raak\",\n        \"Van de {b} schoten tegen gingen er {a} in ({p}%).\",\n        lambda r: \"doel\",\n        lambda r: r[\"zone\"] if r[\"zone\"] in (\"opbouw\", \"omschakeling\") else \"spelhervatting\",\n    ),\n    \"balverlies\": Vraag(\n        \"Balverlies per zone\",\n        \"Waar verliezen we de bal, en worden we afgestraft?\",\n        \"Elke stip is een balverlies in een opgebouwde aanval, in de laatste fase voor het balverlies.\",\n        {\n            \"opbouw\": _zone(LAAG, BREED, \"In onze opbouw\"),\n            \"links langs het blok\": _zone(MIDDEN, LINKS, \"Links langs het blok\"),\n            \"door het blok\": _zone(MIDDEN, CENTRUM, \"Door het blok\"),\n            \"rechts langs het blok\": _zone(MIDDEN, RECHTS, \"Rechts langs het blok\"),\n            \"achter het blok\": _zone((70, 17), BREED, \"Achter het blok\"),\n            \"eindfase\": _zone((88, 16), BREED, \"In de eindfase\"),\n        },\n        (\n            Uitkomst(\"schot tegen\", \"Schot of goal tegen\", ROOD),\n            Uitkomst(\"eindfase tegen\", \"Tegenstander in onze eindfase\", ROOD_LICHT),\n            Uitkomst(\"geen gevaar\", \"Geen gevaar\", GRIJS_LICHT),\n        ),\n        (\"goal tegen\", \"schot tegen\"), \"afgestraft\",\n        \"We verloren {b} keer de bal in een aanval en werden {a} keer afgestraft met een schot tegen ({p}%).\",\n        lambda r: r[\"zone\"],\n        lambda r: \"schot tegen\" if r[\"uitkomst\"] in GOALS + (\"schot tegen\",) else r[\"uitkomst\"],\n    ),\n}\n\n\ndef kleuren(momenten: pd.DataFrame, vraag: Vraag) -> pd.Series:\n    \"\"\"De kleurcode van elk moment, zoals in de legenda.\"\"\"\n    return momenten.apply(vraag.kleur_van, axis=1) if len(momenten) else pd.Series(dtype=str)\n\n\ndef _raster(n: int, x: float, y: float, b: float, h: float) -> list[tuple[float, float]]:\n    \"\"\"n punten netjes verdeeld over een rechthoek, met ruimte bovenaan voor het label.\"\"\"\n    if n == 0:\n        return []\n    h_vrij = h - 9\n    kolommen = max(1, math.ceil(math.sqrt(n * b / max(h_vrij, 1))))\n    rijen = math.ceil(n / kolommen)\n    stap_x, stap_y = b / kolommen, h_vrij / rijen\n    return [(x + stap_x * (i % kolommen + 0.5), y + h_vrij - stap_y * (i // kolommen + 0.5)) for i in range(n)]\n\n\ndef plaats(momenten: pd.DataFrame, vraag: Vraag) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(stippen met x en y, zones met de telling). Momenten buiten de zones vallen weg.\"\"\"\n    volgorde = {u.code: i for i, u in enumerate(vraag.uitkomsten)}\n    namen = {u.code: u.naam for u in vraag.uitkomsten}\n    m = momenten.assign(\n        zone_sleutel=momenten.apply(vraag.zone_van, axis=1) if len(momenten) else pd.Series(dtype=str),\n        kleur=kleuren(momenten, vraag),\n    )\n    m = m[m[\"zone_sleutel\"].isin(vraag.zones)]\n    stippen, zones = [], []\n    for sleutel, (x, y, b, h, naam) in vraag.zones.items():\n        sub = m[m[\"zone_sleutel\"] == sleutel].assign(_orde=lambda d: d[\"kleur\"].map(volgorde).fillna(99)).sort_values([\"_orde\", \"wedstrijd\", \"videotijd\"])\n        for (px, py), (_, r) in zip(_raster(len(sub), x, y, b, h), sub.iterrows()):\n            stippen.append({\n                **r.drop(labels=[\"_orde\"]).to_dict(), \"x\": px, \"y\": py, \"zone_naam\": naam,\n                \"uitkomst_naam\": namen.get(r[\"kleur\"], r[\"kleur\"]), \"goal\": r[\"uitkomst\"] in GOALS,\n            })\n        geteld = int(sub[\"uitkomst\"].isin(vraag.telt).sum())\n        telling = f\"{geteld} van de {len(sub)}\\n{vraag.telt_naam} ({procent(geteld, len(sub))}%)\" if len(sub) else \"geen\"\n        zones.append({\"zone_naam\": naam, \"x\": x, \"x2\": x + b, \"y\": y, \"y2\": y + h, \"label\": f\"{naam}\\n{telling}\", \"label_x\": x + b / 2, \"label_y\": y + h - 1.5, \"aantal\": len(sub), \"geteld\": geteld})\n    return pd.DataFrame(stippen), pd.DataFrame(zones)\n\n\ndef lijnen() -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(rechthoeken, lijnstukken) van het veld: buitenlijnen, strafschopgebieden, doelgebieden, middellijn en middencirkel.\"\"\"\n    lengte, breedte = VELD\n    rechthoeken = [\n        (0, 0, lengte, breedte),\n        (0, breedte / 2 - 20.16, 16.5, breedte / 2 + 20.16), (lengte - 16.5, breedte / 2 - 20.16, lengte, breedte / 2 + 20.16),\n        (0, breedte / 2 - 9.16, 5.5, breedte / 2 + 9.16), (lengte - 5.5, breedte / 2 - 9.16, lengte, breedte / 2 + 9.16),\n    ]\n    cirkel = [(lengte / 2 + 9.15 * math.cos(2 * math.pi * i / 60), breedte / 2 + 9.15 * math.sin(2 * math.pi * i / 60), \"cirkel\", i) for i in range(61)]\n    middellijn = [(lengte / 2, 0, \"middellijn\", 0), (lengte / 2, breedte, \"middellijn\", 1)]\n    return (\n        pd.DataFrame(rechthoeken, columns=[\"x\", \"y\", \"x2\", \"y2\"]),\n        pd.DataFrame(cirkel + middellijn, columns=[\"x\", \"y\", \"lijn\", \"orde\"]),\n    )\n", "myva_pipeline/weergave/visueel.py": "\"\"\"Het seizoensbeeld als visuele PDF in de huisstijl: een pagina per bevinding.\n\nPure weergave van een `seizoen.Seizoen`. Geeft bytes terug en schrijft niets\nnaar schijf. Elke pagina bestaat uit een titel, een ondertitel, een grafiek over\nde hele breedte, een regel \"Stuur op\" en een kleine voetregel. Meer tekst hoort\nin de onderbouwing. Elke balk en elke zone draagt zijn eigen telling. Het veld\nis een schema: de zones volgen de fases, want de codering bevat geen plek op het veld.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport textwrap\n\nfrom matplotlib import font_manager\nfrom matplotlib.backends.backend_pdf import PdfPages\nfrom matplotlib.figure import Figure\nfrom matplotlib.lines import Line2D\nfrom matplotlib.patches import Arc, Circle, FancyArrowPatch, FancyBboxPatch, Rectangle\nfrom matplotlib.ticker import MaxNLocator\n\nfrom myva_pipeline.analyse.seizoen import Aanvalskant, BalverliesZone, SchotenHerkomst, Seizoen, Verschil\nfrom myva_pipeline.weergave.formulering import Formulering, formuleer, procent, zeker_tekst\nfrom myva_pipeline.weergave.teksten import SITUATIE_LABEL, ZONE_LABEL\n\nPAGINA = (13.333, 7.5)\nVLAK = \"#E9F4EC\"\nINKT = \"#111111\"\nINKT_2 = \"#3C4A42\"\nINKT_3 = \"#5F6E65\"\nLIJN = \"#C5D6CB\"\nVELDLIJN = \"#A9C2B3\"\nGROEN, GROEN_LICHT = \"#3E8B5D\", \"#94CDAA\"\nROOD, ROOD_LICHT = \"#E83F28\", \"#F2A392\"\n# Huisstijl: groen is van ons, rood is tegen. De lichte tint is voor de groep waar de nadruk niet op ligt;\n# hij haalt geen 3:1 tegen het vlak en staat daarom nooit zonder getal ernaast.\nKLEUR = {\"eigen\": (GROEN, GROEN_LICHT), \"tegen\": (ROOD, ROOD_LICHT)}\n# Het eerste lettertype uit de huisstijl dat op deze machine staat. DejaVu Sans zit in matplotlib en is er altijd.\n_GEINSTALLEERD = {f.name for f in font_manager.fontManager.ttflist}\nLETTERTYPE = next(naam for naam in (\"Proxima Nova\", \"Segoe UI\", \"Arial\", \"DejaVu Sans\") if naam in _GEINSTALLEERD)\nMARGE = 0.02\nVELD_L, VELD_B = 105.0, 68.0\n\n# Plek van elke zone op het schematische veld (x0, y0, breedte, hoogte). We vallen aan naar rechts,\n# dus onze linkerkant ligt boven.\nZONE_VLAK = {\n    \"opbouw\": (5, 9, 31, 50),\n    \"links langs het blok\": (38, 51, 32, 14),\n    \"rechts langs het blok\": (38, 3, 32, 14),\n    \"door het blok\": (40, 22, 28, 22),\n    \"achter het blok\": (70.5, 15, 15.5, 38),\n    \"eindfase\": (87.5, 15, 16, 38),\n}\n\n_MAANDEN = [\"januari\", \"februari\", \"maart\", \"april\", \"mei\", \"juni\", \"juli\", \"augustus\", \"september\", \"oktober\", \"november\", \"december\"]\n\n\ndef _tekst(doel, x, y, tekst, **kw):\n    kw.setdefault(\"color\", INKT)\n    kw.setdefault(\"family\", LETTERTYPE)\n    return doel.text(x, y, tekst, **kw)\n\n\ndef _kop(nummer: int | None, titel: str) -> str:\n    return f\"{nummer}. {titel}\" if nummer else titel\n\n\ndef datum_tekst(iso: str, kort: bool = False) -> str:\n    \"\"\"\"2026-09-12\" wordt \"12 september 2026\", of kort \"12 sep\".\"\"\"\n    try:\n        jaar, maand, dag = (int(x) for x in iso.split(\"-\"))\n        return f\"{dag} {_MAANDEN[maand - 1][:3]}\" if kort else f\"{dag} {_MAANDEN[maand - 1]} {jaar}\"\n    except (ValueError, IndexError):\n        return iso\n\n\ndef _ondertitel(s: Seizoen) -> str:\n    w = s.wedstrijden\n    return f\"{len(w)} wedstrijden, {datum_tekst(w['datum'].iloc[0])} tot en met {datum_tekst(w['datum'].iloc[-1])}  |  {s.team}\"\n\n\ndef _pagina(titel: str, ondertitel: str, voet: list[str], stuur: str | None = None) -> tuple[Figure, float, float]:\n    \"\"\"Lege pagina met titel, ondertitel, stuurregel en voet. Geeft (figuur, bovenkant, onderkant) van het tekenvlak.\"\"\"\n    fig = Figure(figsize=PAGINA, facecolor=VLAK)\n    y = 0.955\n    for regel in textwrap.wrap(titel, 72):\n        _tekst(fig, MARGE, y, regel, fontsize=25, fontweight=\"bold\", va=\"top\")\n        y -= 0.058\n    _tekst(fig, MARGE, y, ondertitel, fontsize=15, va=\"top\")\n    y_voet = 0.03\n    for regel in reversed(voet):\n        _tekst(fig, 0.5, y_voet, regel, fontsize=10.5, color=INKT_2, ha=\"center\", va=\"bottom\")\n        y_voet += 0.027\n    if stuur:\n        y_voet += 0.018\n        _tekst(fig, 0.5, y_voet, f\"Stuur op:  {stuur}\", fontsize=15, fontweight=\"bold\", ha=\"center\", va=\"bottom\", color=GROEN)\n        y_voet += 0.04\n    return fig, y - 0.075, y_voet + 0.03\n\n\ndef _as(fig: Figure, rect: tuple[float, float, float, float]):\n    ax = fig.add_axes(rect, facecolor=VLAK)\n    for rand in ax.spines.values():\n        rand.set_visible(False)\n    ax.tick_params(length=0, colors=INKT_2, labelsize=11)\n    ax.set_xticks([])\n    ax.set_yticks([])\n    return ax\n\n\ndef _paneeltitel(fig: Figure, x_midden: float, y: float, tekst: str, legenda: list[tuple[str, str, str]] | None = None) -> None:\n    \"\"\"Vette titel boven een grafiek, met de legenda er direct onder zoals in de huisstijl.\"\"\"\n    _tekst(fig, x_midden, y, tekst, fontsize=14.5, fontweight=\"bold\", ha=\"center\", va=\"bottom\")\n    if legenda:\n        handvatten = [Line2D([], [], marker=vorm, linestyle=\"none\", markersize=8, color=kleur, label=naam) for naam, kleur, vorm in legenda]\n        fig.legend(handles=handvatten, loc=\"upper center\", bbox_to_anchor=(x_midden, y + 0.004), ncol=len(legenda), frameon=False,\n                   labelcolor=INKT, prop={\"family\": LETTERTYPE, \"size\": 11}, handletextpad=0.2, columnspacing=1.6, borderpad=0)\n\n\ndef _rijlabel(fig: Figure, x: float, y: float, naam: str, onder: str = \"\") -> None:\n    \"\"\"Naam rechts uitgelijnd voor een balk, met de telling klein eronder.\"\"\"\n    _tekst(fig, x, y + (0.011 if onder else 0), naam, fontsize=12.5, fontweight=\"bold\", ha=\"right\", va=\"center\")\n    if onder:\n        _tekst(fig, x, y - 0.017, onder, fontsize=10, color=INKT_3, ha=\"right\", va=\"center\")\n\n\ndef _rij_y(rect: tuple[float, float, float, float], rij: int, n: int) -> float:\n    return rect[1] + (n - rij - 0.5) / n * rect[3]\n\n\ndef pagina_overzicht(s: Seizoen) -> Figure:\n    w = s.wedstrijden\n    fig, top, onder = _pagina(\n        \"Schoten voor en tegen per wedstrijd\", _ondertitel(s),\n        [\"Een schot is elke keer dat de codeur Kans-schot of Kans-goal aanklikte. Een bevinding op de volgende pagina's is een reden om beelden terug te kijken, geen vaststaand feit.\"],\n    )\n    n = len(w)\n    links, rechts = (0.24, onder, 0.30, top - 0.05 - onder), (0.66, onder, 0.30, top - 0.05 - onder)\n    _paneeltitel(fig, links[0] + links[2] / 2, top, \"Schoten voor en tegen\", [(\"Onze schoten\", GROEN, \"o\"), (\"Schoten tegen\", ROOD, \"o\")])\n    _paneeltitel(fig, rechts[0] + rechts[2] / 2, top, \"Verschil in schoten\")\n    ax, ax2 = _as(fig, links), _as(fig, rechts)\n    maximum = max(int(w[\"schoten_voor\"].max()), int(w[\"schoten_tegen\"].max()), 1)\n    grootste = max(int((w[\"schoten_voor\"] - w[\"schoten_tegen\"]).abs().max()), 1)\n    for i, (_, r) in enumerate(w.iterrows()):\n        y = n - 1 - i\n        _rijlabel(fig, links[0] - 0.012, _rij_y(links, i, n), r[\"titel\"], datum_tekst(r[\"datum\"]))\n        for waarde, dy, kleur in ((r[\"schoten_voor\"], 0.17, GROEN), (r[\"schoten_tegen\"], -0.17, ROOD)):\n            ax.barh(y + dy, waarde, height=0.30, color=kleur)\n            ax.text(waarde + maximum * 0.02, y + dy, str(int(waarde)), va=\"center\", fontsize=12, color=INKT, family=LETTERTYPE)\n        verschil = int(r[\"schoten_voor\"] - r[\"schoten_tegen\"])\n        ax2.barh(y, verschil, height=0.5, color=GROEN if verschil >= 0 else ROOD)\n        ax2.text(verschil + (grootste * 0.04 if verschil >= 0 else -grootste * 0.04), y, f\"{verschil:+d}\", va=\"center\",\n                 ha=\"left\" if verschil >= 0 else \"right\", fontsize=12, color=INKT, family=LETTERTYPE)\n    ax.set_xlim(0, maximum * 1.15)\n    ax.set_ylim(-0.5, n - 0.5)\n    ax2.axvline(0, color=LIJN, linewidth=1.2)\n    ax2.set_xlim(-grootste * 1.3, grootste * 1.3)\n    ax2.set_ylim(-0.5, n - 0.5)\n    return fig\n\n\nLABEL_INCH = 2.2\n\n\ndef _stippenpaneel(fig: Figure, rect: tuple[float, float, float, float], rijen: list[tuple[str, int, int]], kleuren: tuple[str, str], stap_inch: float) -> None:\n    \"\"\"Een rij per spelsituatie, een stip per schot. Goals staan vooraan met een zwarte rand; de grootste rij is donker.\"\"\"\n    label = LABEL_INCH / stap_inch\n    ax = _as(fig, rect)\n    n = len(rijen)\n    if not rijen:\n        ax.text(0.5, 0.5, \"Geen schoten\", transform=ax.transAxes, ha=\"center\", va=\"center\", fontsize=12.5, color=INKT_3, family=LETTERTYPE)\n        return\n    ax.set_xlim(-label, rect[2] * PAGINA[0] / stap_inch - label)\n    ax.set_ylim(n - 0.5, -0.5)\n    donker, licht = kleuren\n    for y, (naam, schoten, goals) in enumerate(rijen):\n        kleur = donker if y == 0 else licht\n        onder = f\"waarvan {goals} {'goal' if goals == 1 else 'goals'}\" if goals else \"\"\n        ax.text(-0.42 / stap_inch * 1.4, y - (0.13 if onder else 0), naam, fontsize=12.5, fontweight=\"bold\", color=INKT, family=LETTERTYPE, va=\"center\", ha=\"right\")\n        if onder:\n            ax.text(-0.42 / stap_inch * 1.4, y + 0.24, onder, fontsize=10, color=INKT_3, family=LETTERTYPE, va=\"center\", ha=\"right\")\n        ax.text(-1.4, y, str(schoten), fontsize=15, fontweight=\"bold\", color=INKT, family=LETTERTYPE, va=\"center\", ha=\"right\")\n        xs = list(range(schoten))\n        grootte = (stap_inch * 72 * 0.86) ** 2\n        ax.scatter(xs[goals:], [y] * (schoten - goals), s=grootte, color=kleur, linewidths=0, zorder=2)\n        ax.scatter(xs[:goals], [y] * goals, s=grootte, color=kleur, edgecolor=INKT, linewidths=1.8, zorder=3)\n\n\ndef pagina_herkomst(s: Seizoen, b: SchotenHerkomst, f: Formulering, nummer: int | None = None) -> Figure:\n    h = s.herkomst\n    fig, top, onder = _pagina(\n        _kop(nummer, f.titel), _ondertitel(s),\n        [\"Elke stip is een schot, ingedeeld bij de spelsituatie waarin het ontstond. Een stip met een zwarte rand is een goal.  |  \" + f.gezien],\n        f.stuur_kort,\n    )\n    breedte = 0.46\n    meeste = max(int(h[\"schoten_tegen\"].max()), int(h[\"schoten_voor\"].max()), 1)\n    stap = min(0.15, (breedte * PAGINA[0] - LABEL_INCH - 0.1) / meeste)\n    for kant, x0, kop, kleuren in (\n        (\"tegen\", 0.03, \"Schoten tegen: {n}\", KLEUR[\"tegen\"]),\n        (\"voor\", 0.52, \"Onze schoten: {n}\", KLEUR[\"eigen\"]),\n    ):\n        sub = h[h[f\"schoten_{kant}\"] > 0].sort_values(f\"schoten_{kant}\", ascending=False, kind=\"stable\")\n        rijen = [(SITUATIE_LABEL[naam], int(r[f\"schoten_{kant}\"]), int(r[f\"goals_{kant}\"])) for naam, r in sub.iterrows()]\n        hoogte = min(top - 0.04 - onder, 0.075 * max(len(rijen), 1) + 0.02)\n        rect = (x0, top - 0.04 - hoogte, breedte, hoogte)\n        _paneeltitel(fig, x0 + 0.23, top, kop.format(n=int(h[f\"schoten_{kant}\"].sum())))\n        _stippenpaneel(fig, rect, rijen, kleuren, stap)\n    return fig\n\n\ndef _veld(fig: Figure, rect: tuple[float, float, float, float]):\n    \"\"\"Schematisch veld, aanvalsrichting naar rechts.\"\"\"\n    ax = fig.add_axes(rect, facecolor=VLAK)\n    ax.set_xlim(-1, VELD_L + 1)\n    ax.set_ylim(-6.5, VELD_B + 1)\n    ax.set_aspect(\"equal\")\n    ax.set_anchor(\"N\")\n    ax.axis(\"off\")\n    stijl = {\"edgecolor\": VELDLIJN, \"facecolor\": \"none\", \"linewidth\": 1.5}\n    ax.add_patch(Rectangle((0, 0), VELD_L, VELD_B, **stijl))\n    ax.plot([VELD_L / 2] * 2, [0, VELD_B], color=VELDLIJN, linewidth=1.5)\n    ax.add_patch(Circle((VELD_L / 2, VELD_B / 2), 9.15, **stijl))\n    for x0, richting in ((0, 1), (VELD_L, -1)):\n        ax.add_patch(Rectangle((x0, VELD_B / 2 - 20.16), richting * 16.5, 40.32, **stijl))\n        ax.add_patch(Rectangle((x0, VELD_B / 2 - 9.16), richting * 5.5, 18.32, **stijl))\n        ax.add_patch(Arc((x0 + richting * 11, VELD_B / 2), 18.3, 18.3, theta1=-53 if richting > 0 else 127, theta2=53 if richting > 0 else 233, color=VELDLIJN, linewidth=1.5))\n    ax.add_patch(FancyArrowPatch((44, -4), (70, -4), arrowstyle=\"-|>\", mutation_scale=15, color=INKT_3, linewidth=1.3))\n    ax.text(42.5, -4, \"wij vallen aan naar rechts\", ha=\"right\", va=\"center\", fontsize=10.5, color=INKT_3, family=LETTERTYPE)\n    return ax\n\n\ndef pagina_balverlies(s: Seizoen, b: BalverliesZone, f: Formulering, nummer: int | None = None) -> Figure:\n    z, oms = b.zones, b.omschakeling\n    fig, top, onder = _pagina(\n        _kop(nummer, f.titel), _ondertitel(s),\n        [\n            \"Het grote getal is hoe vaak we in die zone de bal verloren in een aanval, eronder de schoten tegen in de omschakeling direct daarna. Hoe roder, hoe meer schoten tegen.\",\n            f\"Het veld is een schema: de zone is de laatste fase van onze aanval voor het balverlies.  |  Niet op het veld: {oms['balverlies']} keer de bal direct weer kwijt na een balverovering, daarna {oms['schot_tegen']} schoten tegen.\",\n        ],\n        f.stuur_kort,\n    )\n    ax = _veld(fig, (0.14, onder, 0.72, top + 0.015 - onder))\n    meeste = max(int(z[\"schot_tegen\"].max()), 1)\n    ax.add_patch(Rectangle((38.5, 19.5), 31, 29.5, facecolor=\"none\", edgecolor=INKT_3, linewidth=1.0, linestyle=(0, (4, 3))))\n    ax.text(54, 47, \"blok van de tegenstander\", ha=\"center\", va=\"center\", fontsize=9, color=INKT_3, family=LETTERTYPE, style=\"italic\")\n    for zone, (x0, y0, breed, h) in ZONE_VLAK.items():\n        r = z.loc[zone]\n        ax.add_patch(FancyBboxPatch((x0, y0), breed, h, boxstyle=\"round,pad=0,rounding_size=1.2\", facecolor=ROOD, alpha=0.08 + 0.5 * r[\"schot_tegen\"] / meeste, edgecolor=\"none\"))\n        ax.add_patch(FancyBboxPatch((x0, y0), breed, h, boxstyle=\"round,pad=0,rounding_size=1.2\", facecolor=\"none\", edgecolor=ROOD, linewidth=1.1))\n        cx, cy = x0 + breed / 2, y0 + h / 2\n        n_schot = int(r[\"schot_tegen\"])\n        schot = f\"{n_schot} schot tegen\" if n_schot == 1 else f\"{n_schot} schoten tegen\"\n        naam, fases = ZONE_LABEL[zone].split(\" (\")\n        if h < 20:\n            ax.text(cx, cy + 3.4, f\"{naam} ({fases}\", ha=\"center\", va=\"center\", fontsize=10, color=INKT_2, family=LETTERTYPE)\n            ax.text(cx, cy - 1.8, f\"{int(r['balverlies'])}  |  {schot}\", ha=\"center\", va=\"center\", fontsize=13, fontweight=\"bold\", color=INKT, family=LETTERTYPE)\n            continue\n        smal, laag = breed < 20, h <= 30\n        ax.text(cx, y0 + h - 2.2, f\"{naam}\\n({fases}\" if smal else f\"{naam} ({fases}\", ha=\"center\", va=\"top\", fontsize=9.5 if smal else 11, color=INKT_2, family=LETTERTYPE, linespacing=1.2)\n        ax.text(cx, cy + (0 if laag else 1.5), str(int(r[\"balverlies\"])), ha=\"center\", va=\"center\", fontsize=24 if smal or laag else 38, fontweight=\"bold\", color=INKT, family=LETTERTYPE)\n        ax.text(cx, cy - (6.5 if laag else 9.5), schot.replace(\" schot\", \"\\nschot\", 1) if smal else schot, ha=\"center\", va=\"center\",\n                fontsize=10.5 if smal else 12.5, fontweight=\"bold\", color=INKT, family=LETTERTYPE, linespacing=1.15)\n    return fig\n\n\ndef pagina_aanvalskant(s: Seizoen, b: Aanvalskant, f: Formulering, nummer: int | None = None) -> Figure:\n    t = b.tabel\n    tegenstander = dict(zip(s.wedstrijden[\"wedstrijd\"], s.wedstrijden[\"tegenstander\"]))\n    per_wedstrijd = \", \".join(\n        f\"{tegenstander.get(r['wedstrijd'], r['wedstrijd'])} {int(r['langs_rechts'] + r['voorzet_rechts'])} rechts en {int(r['langs_links'] + r['voorzet_links'])} links\"\n        for _, r in t.iterrows()\n    )\n    fig, top, onder = _pagina(\n        _kop(nummer, f.titel), _ondertitel(s),\n        [\n            \"De dikte van een pijl is het aantal keren, het is geen looplijn. Links en rechts gezien vanuit ons eigen team.  |  \" + f.gezien,\n            f\"Per wedstrijd, langs het blok plus voorzetten: {per_wedstrijd}.\",\n        ],\n        f.stuur_kort,\n    )\n    ax = _veld(fig, (0.14, onder, 0.72, top + 0.015 - onder))\n    langs = {\"links\": int(t[\"langs_links\"].sum()), \"rechts\": int(t[\"langs_rechts\"].sum())}\n    voorzet = {\"links\": int(t[\"voorzet_links\"].sum()), \"rechts\": int(t[\"voorzet_rechts\"].sum())}\n    grootste = max(*langs.values(), *voorzet.values(), 1)\n    pijl = \"simple,head_length=0.7,head_width=1.5,tail_width=1\"\n    for kant, y, y_doel, bocht in ((\"links\", 57, 40, -0.35), (\"rechts\", 11, 28, 0.35)):\n        ax.add_patch(FancyArrowPatch((30, y), (76, y), arrowstyle=pijl, mutation_scale=2.5 + 20 * langs[kant] / grootste, color=GROEN, linewidth=0))\n        ax.add_patch(FancyArrowPatch((86, y), (97, y_doel), connectionstyle=f\"arc3,rad={bocht}\", arrowstyle=pijl, mutation_scale=2.5 + 20 * voorzet[kant] / grootste, color=GROEN_LICHT, linewidth=0))\n        y_label = y + 7 if kant == \"links\" else y - 7\n        ax.text(30, y_label, f\"{kant.capitalize()} langs het blok: {langs[kant]} keer\", ha=\"left\", va=\"center\", fontsize=14, fontweight=\"bold\", color=INKT, family=LETTERTYPE)\n        ax.text(83, y - 10 if kant == \"links\" else y + 10, f\"{voorzet[kant]} voorzetten\", ha=\"right\", va=\"center\", fontsize=13, fontweight=\"bold\", color=INKT, family=LETTERTYPE)\n    return fig\n\n\ndef _kleuren(groepen: tuple[str, str]) -> tuple[str, str]:\n    a, b = groepen\n    return (KLEUR[a][0], KLEUR[b][0]) if a != b else KLEUR[a]\n\n\ndef pagina_vergelijking(s: Seizoen, b: Verschil, f: Formulering, nummer: int | None = None) -> Figure:\n    kleur_a, kleur_b = _kleuren(f.kleuren)\n    fig, top, onder = _pagina(\n        _kop(nummer, f.titel), _ondertitel(s),\n        [f\"{f.gezien}  |  Zekerheid dat dit geen toeval is: {zeker_tekst(b.zekerheid)}\"],\n        f.stuur_kort,\n    )\n    hoogte = top - 0.06 - onder\n\n    # Links: alle wedstrijden samen. De lengte van de balk is het percentage, de telling staat onder de naam.\n    links = (0.25, onder + hoogte * 0.22, 0.24, hoogte * 0.56)\n    _paneeltitel(fig, 0.30, top, f.maat)\n    ax = _as(fig, links)\n    paren = ((b.a1, b.b1, kleur_a, f.label_a), (b.a2, b.b2, kleur_b, f.label_b))\n    maximum = max(max(100 * raak / totaal for raak, totaal, _, _ in paren), 1.0)\n    for i, (raak, totaal, kleur, label) in enumerate(paren):\n        _rijlabel(fig, links[0] - 0.012, _rij_y(links, i, 2), label, f\"{raak} van de {totaal}\")\n        ax.barh(1 - i, 100 * raak / totaal, height=0.5, color=kleur)\n        ax.text(100 * raak / totaal + maximum * 0.03, 1 - i, f\"{procent(raak, totaal)}%\", fontsize=17, fontweight=\"bold\", color=INKT, family=LETTERTYPE, va=\"center\")\n    ax.set_xlim(0, maximum * 1.3)\n    ax.set_ylim(-0.5, 1.5)\n\n    details = b.per_wedstrijd\n    n = len(details)\n    rechts = (0.745, onder + 0.035, 0.215, hoogte - 0.075)\n    _paneeltitel(fig, 0.79, top, \"Per wedstrijd\", [(f.label_a, kleur_a, \"o\"), (f.label_b, kleur_b, \"s\")])\n    ax2 = _as(fig, rechts)\n    grootste = max([100 * d.a1 / d.b1 for d in details if d.b1] + [100 * d.a2 / d.b2 for d in details if d.b2] + [1.0])\n    for i, d in enumerate(details):\n        y = n - 1 - i\n        _rijlabel(fig, rechts[0] - 0.012, _rij_y(rechts, i, n), d.titel, f\"{f.kort_a} {d.a1} van {d.b1},  {f.kort_b} {d.a2} van {d.b2}\")\n        if not d.telt:\n            ax2.text(0, y, \"te weinig om te vergelijken\", fontsize=10.5, color=INKT_3, family=LETTERTYPE, va=\"center\", style=\"italic\")\n            continue\n        qa, qb = 100 * d.a1 / d.b1, 100 * d.a2 / d.b2\n        ax2.plot([qa, qb], [y, y], color=INKT_3, linewidth=1.8, zorder=1, solid_capstyle=\"round\")\n        ax2.scatter([qa], [y], s=150, color=kleur_a, edgecolor=VLAK, linewidth=2, zorder=3, marker=\"o\")\n        ax2.scatter([qb], [y], s=130, color=kleur_b, edgecolor=VLAK, linewidth=2, zorder=3, marker=\"s\")\n    ax2.set_xlim(-grootste * 0.08, grootste * 1.1)\n    ax2.set_ylim(-0.5, n - 0.5)\n    ax2.xaxis.grid(True, color=LIJN, linewidth=1, linestyle=(0, (4, 3)))\n    ax2.set_axisbelow(True)\n    ax2.xaxis.set_major_locator(MaxNLocator(nbins=4, steps=[1, 2, 5, 10]))\n    ax2.xaxis.set_major_formatter(lambda v, _: f\"{v:.0f}%\")\n    for label in ax2.get_xticklabels():\n        label.set_family(LETTERTYPE)\n    return fig\n\n\n_PAGINA = {\"herkomst\": pagina_herkomst, \"balverlies\": pagina_balverlies, \"aanvalskant\": pagina_aanvalskant, \"vergelijking\": pagina_vergelijking}\n\n\ndef paginas(s: Seizoen) -> list[Figure]:\n    return [pagina_overzicht(s)] + [_PAGINA[b.soort](s, b, formuleer(b), i) for i, b in enumerate(s.bevindingen, start=1)]\n\n\ndef pagina(s: Seizoen, b, nummer: int | None = None) -> Figure:\n    \"\"\"De pagina van een bevinding, met de zinnen erbij.\"\"\"\n    return _PAGINA[b.soort](s, b, formuleer(b), nummer)\n\n\ndef naar_png(fig: Figure, dpi: int = 110) -> bytes:\n    buffer = io.BytesIO()\n    fig.savefig(buffer, format=\"png\", dpi=dpi, facecolor=VLAK)\n    return buffer.getvalue()\n\n\ndef render_pdf(s: Seizoen) -> bytes:\n    buffer = io.BytesIO()\n    with PdfPages(buffer, metadata={\"Title\": f\"{s.team}: beeld over {len(s.wedstrijden)} wedstrijden\", \"Creator\": \"myva_pipeline\"}) as pdf:\n        for fig in paginas(s):\n            pdf.savefig(fig, facecolor=VLAK)\n    return buffer.getvalue()\n", "app.py": "import os\nimport runpy\nimport sys\n\nos.environ['MYVA_WEDSTRIJDKAART'] = '0'\nos.environ['MYVA_FEEDBACK_ADRES'] = ''\nsys.path.insert(0, '.')\nrunpy.run_module('myva_pipeline.dashboard', run_name='__main__')\n"}, "streamlitConfig": {"theme.base": "light", "theme.primaryColor": "#3E8B5D", "theme.backgroundColor": "#FFFFFF", "theme.secondaryBackgroundColor": "#E9F4EC", "theme.textColor": "#111111", "client.toolbarMode": "minimal"}}, document.getElementById("root"));
    </script>
