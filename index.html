resource(show_spinner=False)\ndef _seizoen(sleutel: tuple, zekerheid: float, steun: float, _analyses: list[Analyse]) -> seizoen.Seizoen:\n    return seizoen.bouw(_analyses, seizoen.Drempels(zekerheid=zekerheid, steun=steun))\n\n\n@st.cache_data(show_spinner=False)\ndef _png(sleutel: tuple, nummer: int | None, _s: seizoen.Seizoen, _b) -> bytes:\n    return visueel.naar_png(visueel.pagina(_s, _b, nummer))\n\n\n@st.cache_data(show_spinner=False)\ndef _pdf(sleutel: tuple, _s: seizoen.Seizoen) -> bytes:\n    return visueel.render_pdf(_s)\n\n\nVRAAG_MOMENTEN = {\n    \"doeltrap\": momenten.doeltrap_tegenstander,\n    \"opbouw\": momenten.opbouw,\n    \"gevaar_voor\": lambda analyses: momenten.schoten(analyses, \"eigen\"),\n    \"gevaar_tegen\": lambda analyses: momenten.schoten(analyses, \"tegen\"),\n    \"balverlies\": momenten.balverlies,\n}\n\n\n@st.cache_data(show_spinner=False)\ndef _momenten(vraag: str, sleutel: tuple, _analyses: list[Analyse]) -> pd.DataFrame:\n    return VRAAG_MOMENTEN[vraag](_analyses)\n\n\ndef _label(a: Analyse) -> str:\n    w = a.wedstrijd\n    return f\"{visueel.datum_tekst(w.datum, kort=True)}  {w.tegenstander} {'thuis' if w.thuis else 'uit'}\"\n\n\ndef _as_wedstrijd(w: pd.DataFrame) -> pd.Series:\n    return w[\"datum\"].map(lambda d: visueel.datum_tekst(d, kort=True)) + \" \" + w[\"tegenstander\"]\n\n\ndef _tabel(tabel: pd.DataFrame, hoogte: int | None = None, **opties) -> None:\n    \"\"\"Een tabel. In de browser als gewone HTML, omdat het tabelonderdeel van Streamlit daar niet in elke browser werkt.\"\"\"\n    if not IN_DE_BROWSER:\n        st.dataframe(tabel, hide_index=True, **({\"height\": hoogte} if hoogte else {}), **opties)\n        return\n    inhoud = tabel.to_html(index=False, classes=\"tabel\", border=0, float_format=lambda x: f\"{x:.0f}\")\n    st.markdown(f\"<div class='tabelvak' style='max-height: {hoogte or 2000}px'>{inhoud}<\/div>\", unsafe_allow_html=True)\n\n\ndef _videotijd(seconden: float) -> str:\n    t = int(round(seconden))\n    return f\"{t // 3600}:{(t % 3600) // 60:02d}:{t % 60:02d}\"\n\n\ndef _resultaat(voor: int, tegen: int) -> str:\n    return \"W\" if voor > tegen else \"V\" if voor < tegen else \"G\"\n\n\ndef _kleuren(vergelijking: str, kant: str) -> tuple[str, str]:\n    a, b = kleur_groepen(vergelijking, kant)\n    return (visueel.KLEUR[a][0], visueel.KLEUR[b][0]) if a != b else visueel.KLEUR[a]\n\n\ndef _tegel(wat: str, getal: str, onder: str = \"\") -> str:\n    return f'<div class=\"tegel\"><div class=\"wat\">{html.escape(wat)}<\/div><div class=\"getal\">{getal}<\/div><div class=\"onder\">{html.escape(onder)}<\/div><\/div>'\n\n\ndef _kop(team: str, s: seizoen.Seizoen) -> None:\n    w = s.wedstrijden\n    periode = f\"{len(w)} wedstrijden, {visueel.datum_tekst(w['datum'].iloc[0])} tot en met {visueel.datum_tekst(w['datum'].iloc[-1])}\"\n    st.markdown(f'<div class=\"kop\"><span class=\"team\">{html.escape(team)}<\/span><span class=\"periode\">{html.escape(periode)}<\/span><\/div>', unsafe_allow_html=True)\n\n\ndef _waar_balverlies(s: seizoen.Seizoen) -> str:\n    \"\"\"Waar we de bal verloren in de keren dat de tegenstander daarna tot een schot kwam, de meeste eerst.\"\"\"\n    afgestraft = s.balverlies[s.balverlies[\"av_schot\"]] if not s.balverlies.empty else s.balverlies\n    if afgestraft.empty:\n        return \"\"\n    plek = afgestraft[\"zone\"].map(ZONE_KORT).where(afgestraft[\"soort\"] == \"opbouw\", \"onze omschakeling\")\n    delen = [f\"{naam} {aantal}\" for naam, aantal in plek.value_counts().items()]\n    return f\"<div class='waar'>Balverlies waarna een schot tegen volgde ({len(afgestraft)} keer): {html.escape(', '.join(delen))}. Zie Veld, Balverlies per zone.<\/div>\"\n\n\ndef tab_samenvatting(s: seizoen.Seizoen, team_analyses: list[Analyse], sleutel: tuple) -> None:\n    w = s.wedstrijden\n    uitslagen = [_resultaat(v, t) for v, t in zip(w[\"goals_voor\"], w[\"goals_tegen\"])]\n    doeltrap = _momenten(\"doeltrap\", sleutel, team_analyses)\n    balverlies = _momenten(\"balverlies\", sleutel, team_analyses)\n    veroverd = int((doeltrap[\"uitkomst\"] == \"veroverd\").sum())\n    afgestraft = int(balverlies[\"uitkomst\"].isin([\"schot tegen\", \"goal tegen\"]).sum())\n    n = len(w)\n    tegels = [\n        _tegel(\"Resultaten\", f\"{uitslagen.count('W')}W {uitslagen.count('G')}G {uitslagen.count('V')}V\", f\"doelsaldo {int(w['goals_voor'].sum())}-{int(w['goals_tegen'].sum())}\"),\n        _tegel(\"Schoten, wij en zij\", f\"{int(w['schoten_voor'].sum())} <span class='tegen'>{int(w['schoten_tegen'].sum())}<\/span>\", f\"per wedstrijd {w['schoten_voor'].sum() / n:.0f} tegen {w['schoten_tegen'].sum() / n:.0f}\"),\n        _tegel(\"In de eindfase, wij en zij\", f\"{int(w['eindfase_voor'].sum())} <span class='tegen'>{int(w['eindfase_tegen'].sum())}<\/span>\", f\"per wedstrijd {w['eindfase_voor'].sum() / n:.0f} tegen {w['eindfase_tegen'].sum() / n:.0f}\"),\n        _tegel(\"Bal veroverd na hun doeltrap\", f\"{procent(veroverd, len(doeltrap))}%\", f\"{veroverd} van de {len(doeltrap)} doeltrappen\"),\n        _tegel(\"Balverlies afgestraft\", f\"<span class='tegen'>{procent(afgestraft, len(balverlies))}%<\/span>\", f\"{afgestraft} van de {len(balverlies)} keer een schot tegen\"),\n    ]\n    st.markdown(f'<div class=\"tegels\">{\"\".join(tegels)}<\/div>', unsafe_allow_html=True)\n\n    per_zone = wedstrijdbeeld.balverovering_per_zone(team_analyses)\n    per_zone = per_zone[per_zone[\"aanvallen\"] > 0]\n    if not per_zone.empty:\n        zones = [_tegel(ZONE_TEGEN[z], f\"{procent(v_, n_)}%\", f\"{v_} van de {n_} aanvallen\") for z, n_, v_ in zip(per_zone[\"zone\"], per_zone[\"aanvallen\"], per_zone[\"veroverd\"])]\n        st.markdown(\n            f'<div class=\"tussenkop\">Bal veroverd, per plek waar de aanval van de tegenstander eindigde<\/div><div class=\"tegels klein\">{\"\".join(zones)}<\/div>',\n            unsafe_allow_html=True,\n        )\n\n    links, rechts = st.columns([3, 2], gap=\"large\")\n    with links:\n        st.markdown(\"**Wat opvalt**\")\n        if n < s.drempels.wedstrijden:\n            st.caption(f\"Met {n} wedstrijd{'en' if n != 1 else ''} zijn alleen de vaste tellingen mogelijk; vergelijkingen volgen vanaf {s.drempels.wedstrijden} wedstrijden.\")\n        kaarten = []\n        for b in s.bevindingen:\n            f = formuleer(b)\n            tegen = \"tegen\" if f.kleuren[0] == \"tegen\" or b.soort in (\"herkomst\", \"balverlies\") else \"\"\n            waar = _waar_balverlies(s) if b.soort == \"herkomst\" and b.top_tegen == \"omschakeling\" else \"\"\n            kaarten.append(\n                f'<div class=\"kaart {tegen}\"><div class=\"titel\">{html.escape(f.titel)}<\/div>'\n                f'<div class=\"stuur\">Stuur op: {html.escape(f.stuur_kort)}<\/div>{waar}<div class=\"gezien\">{html.escape(f.gezien)}<\/div><\/div>'\n            )\n        st.markdown(\"\".join(kaarten), unsafe_allow_html=True)\n        st.caption(\"Een bevinding is een reden om beelden terug te kijken, geen vaststaand feit. Alle tellingen staan bij Bevindingen.\")\n    with rechts:\n        st.markdown(\"**Per wedstrijd**\")\n        tabel = pd.DataFrame({\n            \"Datum\": w[\"datum\"].map(lambda d: visueel.datum_tekst(d, kort=True)),\n            \"Tegenstander\": w[\"tegenstander\"] + w[\"thuis\"].map({True: \" (t)\", False: \" (u)\"}),\n            \"Uitslag\": w[\"uitslag\"],\n            \"\": uitslagen,\n            \"Schoten\": w[\"schoten_voor\"].astype(str) + \" - \" + w[\"schoten_tegen\"].astype(str),\n            \"Eindfase\": w[\"eindfase_voor\"].astype(str) + \" - \" + w[\"eindfase_tegen\"].astype(str),\n        })\n        _tabel(tabel, width=\"stretch\")\n        st.caption(\"Schoten en eindfase: wij - zij. Uitslag met de thuisploeg eerst.\")\n        st.markdown(\"**Wat voor wedstrijd was het?**\")\n        st.altair_chart(_kwadrant(w))\n        st.caption(\"Per wedstrijd: hoe vaak wij in hun eindfase kwamen tegenover hoe vaak zij in de onze. De lijnen zijn het gemiddelde over deze wedstrijden.\")\n\n\ndef _veld(stippen: pd.DataFrame, zones: pd.DataFrame, vraag: veldstippen.Vraag) -> alt.LayerChart:\n    rechthoeken, lijnen = veldstippen.lijnen()\n    onder = veldstippen.STROOK[0] - 1 if (zones[\"y\"] < 0).any() else -1\n    hoogte = round(VELD_BREEDTE * (70 - onder) / 107)\n    x = alt.X(\"x:Q\", scale=alt.Scale(domain=[-1, 106], nice=False), axis=None)\n    y = alt.Y(\"y:Q\", scale=alt.Scale(domain=[onder, 69], nice=False), axis=None)\n    zone = alt.selection_point(name=\"zone\", fields=[\"zone_naam\"], on=\"click\", clear=\"dblclick\")\n    veldkleur = alt.Chart(pd.DataFrame([{\"x\": 0, \"y\": 0, \"x2\": 105, \"y2\": 68}])).mark_rect(fill=\"#F3F8F4\").encode(x=x, y=y, x2=\"x2:Q\", y2=\"y2:Q\")\n    veld = alt.Chart(rechthoeken).mark_rect(fill=None, stroke=visueel.VELDLIJN, strokeWidth=1.5).encode(x=x, y=y, x2=\"x2:Q\", y2=\"y2:Q\")\n    cirkel = alt.Chart(lijnen).mark_line(color=visueel.VELDLIJN, strokeWidth=1.5).encode(x=x, y=y, detail=\"lijn:N\", order=\"orde:Q\")\n    vlakken = alt.Chart(zones).mark_rect(cornerRadius=5, stroke=visueel.INKT_3, strokeDash=[4, 3], strokeWidth=1).encode(\n        x=x, y=y, x2=\"x2:Q\", y2=\"y2:Q\",\n        fill=alt.condition(zone, alt.value(VLAK), alt.value(\"#FFFFFF\")),\n        fillOpacity=alt.value(0.7),\n        tooltip=[alt.Tooltip(\"label:N\", title=\"Zone\")],\n    ).add_params(zone)\n    # Alle lagen gebruiken dezelfde kolommen x en y; met andere kolomnamen tekent Streamlit het gelaagde veld niet.\n    plek_label = zones[[\"zone_naam\", \"label\", \"label_x\", \"label_y\"]].rename(columns={\"label_x\": \"x\", \"label_y\": \"y\"})\n    labels = alt.Chart(plek_label).mark_text(fontSize=10.5, fontWeight=\"bold\", lineHeight=12, color=visueel.INKT, lineBreak=\"\\n\", baseline=\"top\").encode(x=x, y=y, text=\"label:N\")\n    lagen = [veldkleur, vlakken, veld, cirkel, labels]\n    if not stippen.empty:\n        grootte = 130 if len(stippen) < 60 else 85 if len(stippen) < 160 else 55\n        stippen = stippen.assign(video=stippen[\"videotijd\"].map(_videotijd), rand=stippen[\"goal\"].map({True: visueel.INKT, False: \"#FFFFFF\"}), goal_tekst=stippen[\"goal\"].map({True: \"ja\", False: \"nee\"}))\n        kleur = alt.Color(\n            \"uitkomst_naam:N\", scale=alt.Scale(domain=[u.naam for u in vraag.uitkomsten], range=[u.kleur for u in vraag.uitkomsten]),\n            legend=alt.Legend(orient=\"top\", title=None, labelLimit=260, symbolSize=120, labelFontSize=12),\n        )\n        lagen.append(\n            alt.Chart(stippen).mark_point(filled=True, size=grootte, strokeWidth=1.8).encode(\n                x=x, y=y, fill=kleur, stroke=alt.Stroke(\"rand:N\", scale=None),\n                opacity=alt.condition(zone, alt.value(1.0), alt.value(0.18)),\n                tooltip=[alt.Tooltip(\"titel:N\", title=\"Wedstrijd\"), alt.Tooltip(\"helft:Q\", title=\"Helft\"), alt.Tooltip(\"minuut:Q\", title=\"Minuut\"),\n                         alt.Tooltip(\"video:N\", title=\"Videotijd\"), alt.Tooltip(\"uitkomst_naam:N\", title=\"Wat\"), alt.Tooltip(\"goal_tekst:N\", title=\"Goal\")],\n            )\n        )\n    return alt.layer(*lagen).properties(width=VELD_BREEDTE, height=hoogte).configure_view(stroke=None)\n\n\ndef tab_veld(team_analyses: list[Analyse], sleutel: tuple) -> None:\n    keuze = st.segmented_control(\n        \"Wat wil je zien?\", list(veldstippen.VRAGEN), format_func=lambda k: veldstippen.VRAGEN[k].knop, default=\"doeltrap\", key=\"vraag\", label_visibility=\"collapsed\"\n    )\n    vraag_sleutel = keuze or \"doeltrap\"\n    vraag = veldstippen.VRAGEN[vraag_sleutel]\n    alle = _momenten(vraag_sleutel, sleutel, team_analyses)\n\n    f1, f2, f3 = st.columns([1.1, 1.4, 3.5], gap=\"small\")\n    helft = f1.segmented_control(\"Helft\", [\"Beide\", \"1e\", \"2e\"], default=\"Beide\", key=f\"helft_{vraag_sleutel}\") or \"Beide\"\n    labels = {_label(a): a.wedstrijd.naam for a in team_analyses}\n    wedstrijd = f2.selectbox(\"Wedstrijd\", [\"Alle wedstrijden\", *labels], key=f\"wedstrijd_{vraag_sleutel}\")\n    namen = [u.naam for u in vraag.uitkomsten]\n    getoond = f3.pills(\"Laat zien\", namen, default=namen, selection_mode=\"multi\", key=f\"uitkomst_{vraag_sleutel}\") or []\n    kort = {a.wedstrijd.naam: f\"{visueel.datum_tekst(a.wedstrijd.datum, kort=True)} {a.wedstrijd.tegenstander}\" for a in team_analyses}\n    links, rechts = st.columns([3, 2], gap=\"medium\")\n\n    m = alle\n    if helft != \"Beide\":\n        m = m[m[\"helft\"] == int(helft[0])]\n    if wedstrijd != \"Alle wedstrijden\":\n        m = m[m[\"wedstrijd\"] == labels[wedstrijd]]\n    codes = {u.naam: u.code for u in vraag.uitkomsten}\n    m = m[veldstippen.kleuren(m, vraag).isin([codes[n] for n in getoond])] if len(m) else m\n    stippen, zones = veldstippen.plaats(m, vraag)\n\n    with links:\n        st.markdown(f\"#### {vraag.titel}\")\n        event = st.altair_chart(_veld(stippen, zones, vraag), on_select=\"rerun\", key=f\"veld_{vraag_sleutel}\")\n        st.caption(vraag.uitleg + \" Een stip met een zwarte rand is een goal. De plek binnen een zone betekent niets: de XML heeft geen plek op het veld.\")\n\n    gekozen = [z[\"zone_naam\"] for z in (event.selection.get(\"zone\", []) if event and event.selection else [])]\n    with rechts:\n        totaal, geteld = int(zones[\"aantal\"].sum()), int(zones[\"geteld\"].sum())\n        st.markdown(f\"**{vraag.samenvatting.format(a=geteld, b=totaal, p=procent(geteld, totaal))}**\")\n        lijst = stippen[stippen[\"zone_naam\"].isin(gekozen)] if gekozen and not stippen.empty else stippen\n        st.markdown(f\"**Terugkijken in MyVA**: {', '.join(gekozen) if gekozen else 'klik op een zone om te kiezen'}\")\n        if lijst.empty:\n            st.caption(\"Geen momenten.\")\n            return\n        tabel = lijst.sort_values([\"wedstrijd\", \"videotijd\"]).assign(Video=lambda d: d[\"videotijd\"].map(_videotijd), Wedstrijd=lambda d: d[\"wedstrijd\"].map(kort))\n        _tabel(\n            tabel[[\"Wedstrijd\", \"helft\", \"minuut\", \"Video\", \"uitkomst_naam\"]].rename(columns={\"helft\": \"H\", \"minuut\": \"Min\", \"uitkomst_naam\": \"Wat\"}),\n            hoogte=440, width=\"stretch\",\n            column_config={\"H\": st.column_config.NumberColumn(width=30), \"Min\": st.column_config.NumberColumn(width=40), \"Video\": st.column_config.TextColumn(width=70)},\n        )\n\n\ndef _kwadrant(w: pd.DataFrame) -> alt.LayerChart:\n    df = pd.DataFrame({\"wedstrijd\": _as_wedstrijd(w), \"tegen\": w[\"eindfase_tegen\"], \"voor\": w[\"eindfase_voor\"], \"uitslag\": w[\"uitslag\"]})\n    gem_x, gem_y = float(df[\"tegen\"].mean()), float(df[\"voor\"].mean())\n    top = max(float(df[\"tegen\"].max()), float(df[\"voor\"].max()), 1.0) * 1.15\n    x = alt.X(\"tegen:Q\", title=\"Tegenstander in onze eindfase\", scale=alt.Scale(domain=[0, top]), axis=alt.Axis(grid=False))\n    y = alt.Y(\"voor:Q\", title=\"Wij in hun eindfase\", scale=alt.Scale(domain=[0, top]), axis=alt.Axis(grid=False))\n    punten = alt.Chart(df).mark_point(filled=True, size=170, color=GROEN, stroke=\"#fff\", strokeWidth=1.5).encode(x=x, y=y, tooltip=[\"wedstrijd\", \"uitslag\", \"voor\", \"tegen\"])\n    df[\"boven\"] = (df[\"tegen\"].rank(method=\"first\") % 2 == 0).to_numpy()\n    naam = lambda boven, dy: alt.Chart(df).mark_text(dy=dy, fontSize=11, fontWeight=\"bold\", color=visueel.INKT).transform_filter(alt.datum.boven == boven).encode(x=x, y=y, text=\"wedstrijd:N\")\n    lijnen = alt.Chart(pd.DataFrame({\"x\": [gem_x], \"y\": [gem_y]}))\n    hoek = lambda tekst, px, py, uitlijning: alt.Chart(pd.DataFrame({\"x\": [top * px], \"y\": [top * py], \"tekst\": [tekst]})).mark_text(\n        align=uitlijning, fontSize=10, color=INKT_3, fontStyle=\"italic\"\n    ).encode(x=\"x:Q\", y=\"y:Q\", text=\"tekst:N\")\n    return alt.layer(\n        lijnen.mark_rule(color=INKT_3, strokeDash=[4, 3]).encode(x=\"x:Q\"),\n        lijnen.mark_rule(color=INKT_3, strokeDash=[4, 3]).encode(y=\"y:Q\"),\n        hoek(\"Wij domineerden\", 0.02, 0.98, \"left\"), hoek(\"Open wedstrijd\", 0.98, 0.98, \"right\"),\n        hoek(\"Weinig gebeurd\", 0.02, 0.02, \"left\"), hoek(\"Weggespeeld\", 0.98, 0.02, \"right\"),\n        punten, naam(True, -13), naam(False, 15),\n    ).properties(height=330)\n\n\ndef _rijlabels(df: pd.DataFrame, naam: str, onder: str) -> alt.LayerChart:\n    \"\"\"Naam rechts uitgelijnd voor de balk, met de telling klein en grijs eronder.\"\"\"\n    basis = alt.Chart(df).encode(y=alt.Y(\"rij:N\", sort=None, title=None, axis=None))\n    return alt.layer(\n        basis.mark_text(align=\"right\", dx=-8, dy=-7, fontSize=12, fontWeight=\"bold\", color=visueel.INKT).encode(x=alt.value(0), text=f\"{naam}:N\"),\n        basis.mark_text(align=\"right\", dx=-8, dy=8, fontSize=10, color=INKT_3).encode(x=alt.value(0), text=f\"{onder}:N\"),\n    )\n\n\ndef _rangschikking(df: pd.DataFrame, waarde: str, kleur: str, kleur_laatste: str) -> alt.LayerChart:\n    \"\"\"Balken in de stijl van de club: naam en telling links, waarde aan het eind, de laatste wedstrijd donker.\"\"\"\n    basis = alt.Chart(df).encode(y=alt.Y(\"rij:N\", sort=None, title=None, axis=None))\n    balken = basis.mark_bar(height=18, cornerRadiusEnd=3).encode(\n        x=alt.X(f\"{waarde}:Q\", title=None, axis=None, scale=alt.Scale(domainMin=0)),\n        color=alt.condition(alt.datum.laatste, alt.value(kleur_laatste), alt.value(kleur)),\n        tooltip=[\"naam\", \"onder\"],\n    )\n    waarden = basis.mark_text(align=\"left\", dx=6, fontSize=12, fontWeight=\"bold\", color=visueel.INKT).encode(x=f\"{waarde}:Q\", text=\"tekst:N\")\n    return alt.layer(balken, waarden, _rijlabels(df, \"naam\", \"onder\")).properties(height=42 * len(df) + 10, padding={\"left\": 230})\n\n\ndef tab_wedstrijden(s: seizoen.Seizoen) -> None:\n    w = s.wedstrijden\n    namen = _as_wedstrijd(w)\n    links, rechts = st.columns(2, gap=\"large\")\n    with links:\n        st.markdown(\"**Goals tegenover schoten, per wedstrijd**\")\n        lang = pd.concat([\n            pd.DataFrame({\"rij\": namen, \"wat\": \"Schoten\", \"aantal\": w[\"schoten_voor\"]}),\n            pd.DataFrame({\"rij\": namen, \"wat\": \"Goals\", \"aantal\": w[\"goals_voor\"]}),\n        ])\n        basis = alt.Chart(lang).encode(y=alt.Y(\"rij:N\", sort=list(namen), title=None, axis=alt.Axis(labelLimit=200)), yOffset=alt.YOffset(\"wat:N\", sort=[\"Schoten\", \"Goals\"]))\n        st.altair_chart(\n            (basis.mark_bar(height=12).encode(x=alt.X(\"aantal:Q\", title=None, axis=alt.Axis(grid=False)), color=alt.Color(\"wat:N\", scale=alt.Scale(domain=[\"Schoten\", \"Goals\"], range=[GROEN_LICHT, GROEN]), legend=alt.Legend(orient=\"top\", title=None)), tooltip=[\"rij\", \"wat\", \"aantal\"])\n             + basis.mark_text(align=\"left\", dx=4, fontSize=11, fontWeight=\"bold\").encode(x=\"aantal:Q\", text=\"aantal:Q\")).properties(height=44 * len(w) + 30)\n        )\n    with rechts:\n        st.markdown(\"**Verschil in schoten, wij min zij**\")\n        verschil = pd.DataFrame({\"rij\": namen, \"verschil\": w[\"schoten_voor\"] - w[\"schoten_tegen\"], \"tekst\": (w[\"schoten_voor\"] - w[\"schoten_tegen\"]).map(lambda v: f\"{v:+d}\")})\n        grens = max(int(verschil[\"verschil\"].abs().max()), 1) * 1.3\n        basis = alt.Chart(verschil).encode(y=alt.Y(\"rij:N\", sort=list(namen), title=None, axis=alt.Axis(labelLimit=200)), x=alt.X(\"verschil:Q\", title=None, axis=alt.Axis(grid=False), scale=alt.Scale(domain=[-grens, grens])))\n        st.altair_chart(\n            (basis.mark_bar(height=18).encode(color=alt.condition(alt.datum.verschil >= 0, alt.value(GROEN), alt.value(ROOD)), tooltip=[\"rij\", \"verschil\"])\n             + basis.mark_text(align=\"left\", dx=5, fontSize=11, fontWeight=\"bold\").transform_filter(alt.datum.verschil >= 0).encode(text=\"tekst:N\")\n             + basis.mark_text(align=\"right\", dx=-5, fontSize=11, fontWeight=\"bold\").transform_filter(alt.datum.verschil < 0).encode(text=\"tekst:N\")\n             + alt.Chart(pd.DataFrame({\"verschil\": [0]})).mark_rule(color=INKT_3).encode(x=\"verschil:Q\")).properties(height=44 * len(w) + 30)\n        )\n\n    verg = s.vergelijkingen[[(v_, k, u) in SJABLONEN and (v_, k, u) in MAAT for v_, k, u in zip(s.vergelijkingen[\"vergelijking\"], s.vergelijkingen[\"kant\"], s.vergelijkingen[\"uitkomst_code\"])]]\n    if verg.empty:\n        return\n    st.markdown(\"**Rangschikking per wedstrijd**\")\n    opties = {f\"{MAAT[(v_['vergelijking'], v_['kant'], v_['uitkomst_code'])]}: {SJABLONEN[(v_['vergelijking'], v_['kant'], v_['uitkomst_code'])].label_a}\": (v_, \"a\") for _, v_ in verg.iterrows()}\n    opties |= {f\"{MAAT[(v_['vergelijking'], v_['kant'], v_['uitkomst_code'])]}: {SJABLONEN[(v_['vergelijking'], v_['kant'], v_['uitkomst_code'])].label_b}\": (v_, \"b\") for _, v_ in verg.iterrows()}\n    keuze = st.selectbox(\"Waarop rangschikken?\", list(opties), key=\"rang\")\n    v_, groep = opties[keuze]\n    datums = dict(zip(w[\"wedstrijd\"], namen))\n    laatste = w[\"wedstrijd\"].iloc[-1]\n    rijen = []\n    for d in v_[\"per_wedstrijd\"]:\n        a, b = (d[\"a1\"], d[\"b1\"]) if groep == \"a\" else (d[\"a2\"], d[\"b2\"])\n        if b:\n            rijen.append({\"naam\": datums.get(d[\"wedstrijd\"], d[\"wedstrijd\"]), \"onder\": f\"{a} van de {b}\", \"pct\": procent(a, b), \"tekst\": f\"{procent(a, b)}%\", \"laatste\": d[\"wedstrijd\"] == laatste})\n    if not rijen:\n        st.info(\"Deze vergelijking komt in de gekozen wedstrijden niet voor.\")\n        return\n    df = pd.DataFrame(rijen).sort_values(\"pct\", ascending=False).assign(rij=lambda d: d[\"naam\"])\n    st.altair_chart(_rangschikking(df, \"pct\", GROEN_LICHT, GROEN))\n    st.caption(\"De laatste wedstrijd is donkergroen.\")\n\n\ndef _spiegel(h: pd.DataFrame) -> alt.LayerChart:\n    \"\"\"Per spelsituatie onze schoten naar links en die van de tegenstander naar rechts, met de goals als donkere balk erin.\"\"\"\n    d = h.assign(naam=h[\"situatie\"].map(SITUATIE_LABEL), links=-h[\"schoten_voor\"], links_goal=-h[\"goals_voor\"])\n    d[\"tekst_voor\"] = d[\"schoten_voor\"].astype(str) + d[\"goals_voor\"].map(lambda g: f\" ({g} goal{'s' if g != 1 else ''})\" if g else \"\")\n    d[\"tekst_tegen\"] = d[\"schoten_tegen\"].astype(str) + d[\"goals_tegen\"].map(lambda g: f\" ({g} goal{'s' if g != 1 else ''})\" if g else \"\")\n    grens = max(int(d[\"schoten_voor\"].max()), int(d[\"schoten_tegen\"].max()), 1) * 1.45\n    volgorde = list(d[\"naam\"])\n    basis = alt.Chart(d).encode(y=alt.Y(\"naam:N\", sort=volgorde, title=None, axis=alt.Axis(labelFontSize=12, labelFontWeight=\"bold\", labelPadding=8, labelLimit=220)))\n    x = lambda veld: alt.X(f\"{veld}:Q\", title=None, axis=None, scale=alt.Scale(domain=[-grens, grens]))\n    return alt.layer(\n        basis.mark_bar(height=22, color=GROEN_LICHT).encode(x=x(\"links\"), x2=alt.value(0)),\n        basis.mark_bar(height=22, color=GROEN).encode(x=x(\"links_goal\"), x2=alt.value(0)),\n        basis.mark_bar(height=22, color=ROOD_LICHT).encode(x=x(\"schoten_tegen\"), x2=alt.value(0)),\n        basis.mark_bar(height=22, color=ROOD).encode(x=x(\"goals_tegen\"), x2=alt.value(0)),\n        basis.mark_text(align=\"right\", dx=-6, fontSize=11, fontWeight=\"bold\").encode(x=x(\"links\"), text=\"tekst_voor:N\"),\n        basis.mark_text(align=\"left\", dx=6, fontSize=11, fontWeight=\"bold\").encode(x=x(\"schoten_tegen\"), text=\"tekst_tegen:N\"),\n        alt.Chart(pd.DataFrame({\"links\": [0]})).mark_rule(color=INKT_3).encode(x=x(\"links\")),\n    ).properties(height=40 * len(d) + 20, title=alt.Title(\"Onze schoten links, schoten tegen rechts\", anchor=\"middle\", fontSize=13, color=INKT_3, fontWeight=\"normal\"))\n\n\ndef tab_wanneer(s: seizoen.Seizoen, team_analyses: list[Analyse]) -> None:\n    kw = wedstrijdbeeld.kwartieren(team_analyses)\n    st.markdown(\"**Wanneer in de wedstrijd: schoten per kwartier, wij en zij**\")\n    lang = pd.concat([\n        pd.DataFrame({\"kwartier\": kw[\"kwartier\"], \"wie\": \"Wij\", \"schoten\": kw[\"schoten_voor\"], \"goals\": kw[\"goals_voor\"]}),\n        pd.DataFrame({\"kwartier\": kw[\"kwartier\"], \"wie\": \"Tegenstander\", \"schoten\": kw[\"schoten_tegen\"], \"goals\": kw[\"goals_tegen\"]}),\n    ]).assign(tekst=lambda d: d[\"schoten\"].astype(str) + d[\"goals\"].map(lambda g: f\" ({g} goal{'s' if g != 1 else ''})\" if g else \"\"))\n    basis = alt.Chart(lang).encode(x=alt.X(\"kwartier:N\", sort=wedstrijdbeeld.KWARTIEREN, title=\"Minuut\", axis=alt.Axis(labelAngle=0)), xOffset=alt.XOffset(\"wie:N\", sort=[\"Wij\", \"Tegenstander\"]))\n    st.altair_chart(\n        (basis.mark_bar(width=26).encode(y=alt.Y(\"schoten:Q\", title=\"Schoten\", axis=alt.Axis(grid=False)), color=alt.Color(\"wie:N\", scale=alt.Scale(domain=[\"Wij\", \"Tegenstander\"], range=[GROEN, ROOD]), legend=alt.Legend(orient=\"top\", title=None)), tooltip=[\"kwartier\", \"wie\", \"schoten\", \"goals\"])\n         + basis.mark_text(dy=-8, fontSize=10.5, fontWeight=\"bold\").encode(y=\"schoten:Q\", text=\"tekst:N\")).properties(height=300)\n    )\n    st.caption(\"Blessuretijd telt bij het laatste kwartier van die helft. Tussen haakjes hoeveel van die schoten een goal waren.\")\n\n    st.markdown(\"**Waaruit: schoten en goals per spelsituatie**\")\n    st.altair_chart(_spiegel(s.herkomst.reset_index()))\n    st.caption(\"De lichte balk is het aantal schoten uit die spelsituatie, de donkere balk erin het aantal goals.\")\n\n\ndef _kaarttegel(sleutel: str, nu: wedstrijdbeeld.Kaartpunt, andere: list[wedstrijdbeeld.Kaartpunt], wie_andere: str) -> str:\n    \"\"\"Een punt van de wedstrijdkaart: de waarde groot, de telling eronder, en een pijl tegenover de andere wedstrijden.\"\"\"\n    tekst = KAART[sleutel]\n    geteld = sum(k.geteld for k in andere)\n    if nu.van is None:\n        gemiddeld = geteld / len(andere)\n        goals = int(nu.momenten[\"goal\"].sum())\n        waarde, onder = str(nu.geteld), f\"waarvan {goals} goal{'' if goals == 1 else 's'}\"\n        verschil, grens = nu.geteld - gemiddeld, KAART_VERSCHIL_AANTAL\n        vergelijk = \"gemiddeld \" + f\"{gemiddeld:.1f}\".replace(\".\", \",\") + \" per wedstrijd\"\n    else:\n        van = sum(k.van for k in andere)\n        waarde, onder = f\"{procent(nu.geteld, nu.van)}%\", f\"{nu.geteld} van de {nu.van} {tekst.eenheid}\"\n        verschil, grens = procent(nu.geteld, nu.van) - procent(geteld, van), KAART_VERSCHIL_PCT\n        vergelijk = f\"{procent(geteld, van)}% ({geteld} van de {van})\"\n    if abs(verschil) < grens:\n        pijl, soort = \"=\", \"gelijk\"\n    else:\n        pijl, soort = (\"\u25b2\" if verschil > 0 else \"\u25bc\"), (\"beter\" if (verschil > 0) == tekst.hoger_is_beter else \"minder\")\n    return (\n        f\"<div class='kaartpunt'><div class='naam'>{html.escape(tekst.naam)}<\/div>\"\n        f\"<div class='waarde'>{waarde}<span class='pijl {soort}'>{pijl}<\/span><\/div>\"\n        f\"<div class='onder'>{html.escape(onder)}<\/div>\"\n        f\"<div class='ander'>{html.escape(wie_andere)}: {html.escape(vergelijk)}<\/div><\/div>\"\n    )\n\n\ndef _wedstrijdkaart(nu: Analyse, andere: list[Analyse], wie_andere: str, sleutel_widget: str) -> None:\n    kaart, kaarten_andere = wedstrijdbeeld.wedstrijdkaart(nu), [wedstrijdbeeld.wedstrijdkaart(a) for a in andere]\n    functies = list(dict.fromkeys(KAART[k].functie for k in wedstrijdbeeld.KAARTPUNTEN))\n    for kolom, functie in zip(st.columns(len(functies), gap=\"medium\"), functies):\n        tegels = [_kaarttegel(k, kaart[k], [ka[k] for ka in kaarten_andere], wie_andere) for k in wedstrijdbeeld.KAARTPUNTEN if KAART[k].functie == functie]\n        kolom.markdown(f\"<div class='functie'>{functie}<\/div>{''.join(tegels)}\", unsafe_allow_html=True)\n    st.caption(\n        \"Elke wedstrijd dezelfde zes punten. Groene pijl: beter dan in de andere wedstrijden, rode pijl: minder, = ongeveer gelijk \"\n        f\"(minder dan {KAART_VERSCHIL_PCT} procentpunten of {KAART_VERSCHIL_AANTAL} schoten verschil).\"\n    )\n    namen = {KAART[k].naam: k for k in wedstrijdbeeld.KAARTPUNTEN}\n    with st.expander(\"Terugkijken: de momenten achter een punt\"):\n        punt = st.selectbox(\"Welk punt?\", list(namen), key=f\"kaartpunt_{sleutel_widget}\")\n        m = kaart[namen[punt]].momenten\n        if m.empty:\n            st.caption(\"Geen momenten in deze wedstrijd.\")\n        else:\n            tabel = m.sort_values(\"videotijd\").assign(Video=lambda d: d[\"videotijd\"].map(_videotijd), Goal=lambda d: d[\"goal\"].map({True: \"goal\", False: \"\"}))\n            _tabel(\n                tabel[[\"helft\", \"start_min\", \"Video\", \"Goal\"]].rename(columns={\"helft\": \"H\", \"start_min\": \"Min\"}), hoogte=440, width=\"stretch\",\n                column_config={\"H\": st.column_config.NumberColumn(width=30), \"Min\": st.column_config.NumberColumn(width=50, format=\"%.0f\"), \"Video\": st.column_config.TextColumn(width=80)},\n            )\n            st.caption(\"De videotijd is het begin van het moment in de video die in MyVA op de tijdlijn stond.\")\n\n\ndef tab_wedstrijdkaart(s: seizoen.Seizoen, team_analyses: list[Analyse]) -> None:\n    w = s.wedstrijden\n    if len(w) < 2:\n        st.info(\"Vanaf twee wedstrijden kan een wedstrijd vergeleken worden met de andere.\")\n        return\n    per_naam = {a.wedstrijd.naam: a for a in team_analyses}\n    labels = dict(zip(_as_wedstrijd(w), w[\"wedstrijd\"]))\n    namen = list(labels)\n    links, rechts = st.columns([1, 2])\n    gekozen = links.selectbox(\"Wedstrijd\", namen, index=len(namen) - 1, key=f\"vergelijk_{namen[0]}_{len(namen)}\")\n    andere = [n for n in namen if n != gekozen]\n    ervoor = namen[: namen.index(gekozen)]\n    rest = rechts.multiselect(\"Tegenover\", andere, default=ervoor or andere, key=f\"tegenover_{gekozen}_{len(namen)}\", help=\"Standaard de wedstrijden ervoor. Kies zelf een reeks, bijvoorbeeld alleen de thuiswedstrijden.\")\n    if not rest:\n        st.info(\"Kies minstens een wedstrijd om mee te vergelijken.\")\n        return\n    reeks = f\"de {len(rest)} gekozen wedstrijden\" if len(rest) > 1 else rest[0]\n    st.markdown(f\"**{w.loc[w['wedstrijd'] == labels[gekozen], 'titel'].iloc[0]}** tegenover {reeks}\")\n    nu, vergelijk = per_naam[labels[gekozen]], [per_naam[labels[n]] for n in rest]\n    if not MET_WEDSTRIJDKAART:\n        _grootste_verschillen(nu, vergelijk, gekozen, rest)\n        return\n    _wedstrijdkaart(nu, vergelijk, f\"In de {len(rest)} andere\" if len(rest) > 1 else rest[0], f\"{gekozen}_{len(namen)}\")\n    with st.expander(\"Waar week deze wedstrijd het meest af?\"):\n        _grootste_verschillen(nu, vergelijk, gekozen, rest)\n\n\ndef _grootste_verschillen(nu: Analyse, vergelijk: list[Analyse], gekozen: str, rest: list[str]) -> None:\n    af = wedstrijdbeeld.afwijking(nu, vergelijk)\n    af = af[[(v_, k, u) in SJABLONEN and (v_, k, u) in MAAT for v_, k, u in zip(af[\"vergelijking\"], af[\"kant\"], af[\"uitkomst\"])]]\n    # Een vergelijking een keer, geen tweede tegel met dezelfde tellingen, en hooguit twee tegels over hetzelfde.\n    af = af.drop_duplicates(\"vergelijking\").drop_duplicates([\"gekozen_a\", \"gekozen_b\", \"rest_a\", \"rest_b\"])\n    maat = pd.Series([MAAT[(v_, k, u)] for v_, k, u in zip(af[\"vergelijking\"], af[\"kant\"], af[\"uitkomst\"])], index=af.index)\n    af = af[maat.groupby(maat).cumcount() < 2].head(6)\n    if af.empty:\n        st.info(\"Te weinig waarnemingen om deze wedstrijden te vergelijken.\")\n        return\n    andere = f\"de {len(rest)} gekozen wedstrijden samen\" if len(rest) > 1 else rest[0]\n    tegels = []\n    for _, r in af.iterrows():\n        sleutel = (r[\"vergelijking\"], r[\"kant\"], r[\"uitkomst\"])\n        sj, is_a = SJABLONEN[sleutel], r[\"groep\"] == \"a\"\n        tegen = kleur_groepen(r[\"vergelijking\"], r[\"kant\"])[0 if is_a else 1] == \"tegen\"\n        donker, licht = (ROOD, ROOD_LICHT) if tegen else (GROEN, GROEN_LICHT)\n        p_nu, p_rest = procent(r[\"gekozen_a\"], r[\"gekozen_b\"]), procent(r[\"rest_a\"], r[\"rest_b\"])\n        zin = lambda a, b: ingevuld(sj.zin_a, a, b, 0, 0) if is_a else ingevuld(sj.zin_b, 0, 0, a, b)\n        tegels.append(\n            f\"<div class='vgl'><div class='naam'>{html.escape(sj.label_a if is_a else sj.label_b)}<\/div>\"\n            f\"<div class='maat'>{html.escape(MAAT[sleutel])}<\/div>\"\n            f\"<div class='rij'><span class='pct'>{p_nu}%<\/span><span class='balk'><i style='width:{p_nu}%;background:{donker}'><\/i><\/span>\"\n            f\"<span class='tel'>{r['gekozen_a']} van de {r['gekozen_b']}<\/span><\/div>\"\n            f\"<div class='rij rest'><span class='pct'>{p_rest}%<\/span><span class='balk'><i style='width:{p_rest}%;background:{licht}'><\/i><\/span>\"\n            f\"<span class='tel'>{r['rest_a']} van de {r['rest_b']}<\/span><\/div>\"\n            f\"<details><summary>Meer<\/summary><p><b>{html.escape(gekozen)}.<\/b> {html.escape(zin(r['gekozen_a'], r['gekozen_b']))}.<\/p>\"\n            f\"<p><b>{html.escape(andere[0].upper() + andere[1:])}.<\/b> {html.escape(zin(r['rest_a'], r['rest_b']))}.<\/p><\/details><\/div>\"\n        )\n    st.markdown(f\"<div class='vgl-raster'>{''.join(tegels)}<\/div>\", unsafe_allow_html=True)\n    st.caption(f\"Bovenste balk: {gekozen}. Onderste balk: {andere}. De zes grootste verschillen. Een verschil in een wedstrijd is een reden om beelden terug te kijken, geen patroon.\")\n\n\ndef _trend(df: pd.DataFrame, kleuren: tuple[str, str], groepen: tuple[str, str], titel_y: str) -> alt.Chart:\n    kleur = lambda legenda: alt.Color(\"groep:N\", scale=alt.Scale(domain=list(groepen), range=list(kleuren)), legend=alt.Legend(orient=\"top\", title=None, labelLimit=400) if legenda else None)\n    basis = alt.Chart(df).encode(\n        x=alt.X(\"wedstrijd:N\", sort=None, title=None, axis=alt.Axis(labelAngle=0, labelLimit=160)),\n        y=alt.Y(\"procent:Q\", title=titel_y, scale=alt.Scale(domainMin=0)),\n        color=kleur(False),\n        tooltip=[\"wedstrijd\", \"groep\", \"telling\", alt.Tooltip(\"procent:Q\", format=\".0f\")],\n    )\n    glad = df[\"wedstrijd\"].nunique() >= MIN_TREND\n    punten = basis.mark_point(filled=True, size=160, opacity=1).encode(color=kleur(True))\n    waarden = basis.mark_text(dy=-14, fontWeight=\"bold\", fontSize=13).encode(text=alt.Text(\"procent:Q\", format=\".0f\"))\n    lagen = [basis.mark_line(strokeWidth=2 if glad else 3, opacity=0.35 if glad else 1), punten, waarden]\n    if glad:\n        gemiddeld = df.assign(procent=df.groupby(\"groep\")[\"procent\"].transform(lambda r: r.rolling(5, center=True, min_periods=1).mean()))\n        lagen.append(alt.Chart(gemiddeld).mark_line(strokeWidth=3.5, interpolate=\"monotone\").encode(x=alt.X(\"wedstrijd:N\", sort=None), y=\"procent:Q\", color=kleur(False)))\n    return alt.layer(*lagen).properties(height=280)\n\n\ndef tab_trends(s: seizoen.Seizoen) -> None:\n    w = s.wedstrijden\n    if len(w) < MIN_TREND:\n        st.caption(f\"Een trend zegt pas iets vanaf zo'n {MIN_TREND} wedstrijden; met {len(w)} is het vooral per wedstrijd kijken. Vanaf {MIN_TREND} komt er een gladde lijn bij, het gemiddelde over vijf wedstrijden.\")\n    as_x = _as_wedstrijd(w)\n    links, rechts = st.columns(2, gap=\"large\")\n    with links:\n        st.markdown(\"**Schoten per wedstrijd**\")\n        schoten = pd.concat(\n            [pd.DataFrame({\"wedstrijd\": as_x, \"groep\": groep, \"procent\": w[kolom], \"telling\": w[kolom].astype(str)}) for groep, kolom in ((\"Wij\", \"schoten_voor\"), (\"Tegenstander\", \"schoten_tegen\"))]\n        )\n        st.altair_chart(_trend(schoten, (GROEN, ROOD), (\"Wij\", \"Tegenstander\"), \"Schoten\"))\n    with rechts:\n        st.markdown(\"**Keer in de eindfase per wedstrijd**\")\n        eindfase = pd.concat(\n            [pd.DataFrame({\"wedstrijd\": as_x, \"groep\": groep, \"procent\": w[kolom], \"telling\": w[kolom].astype(str)}) for groep, kolom in ((\"Wij\", \"eindfase_voor\"), (\"Tegenstander\", \"eindfase_tegen\"))]\n        )\n        st.altair_chart(_trend(eindfase, (GROEN, ROOD), (\"Wij\", \"Tegenstander\"), \"Keer in de eindfase\"))\n\n    verg = s.vergelijkingen[[(v, k, u) in SJABLONEN and (v, k, u) in MAAT for v, k, u in zip(s.vergelijkingen[\"vergelijking\"], s.vergelijkingen[\"kant\"], s.vergelijkingen[\"uitkomst_code\"])]]\n    if verg.empty:\n        return\n    opties = {f\"{MAAT[(v['vergelijking'], v['kant'], v['uitkomst_code'])]}: {SJABLONEN[(v['vergelijking'], v['kant'], v['uitkomst_code'])].label_a} tegenover {SJABLONEN[(v['vergelijking'], v['kant'], v['uitkomst_code'])].label_b}\": v for _, v in verg.iterrows()}\n    keuze = st.selectbox(\"Kies een vergelijking\", list(opties))\n    v = opties[keuze]\n    sj = SJABLONEN[(v[\"vergelijking\"], v[\"kant\"], v[\"uitkomst_code\"])]\n    datums = dict(zip(w[\"wedstrijd\"], as_x))\n    rijen = []\n    for d in v[\"per_wedstrijd\"]:\n        for groep, a, b in ((sj.label_a, d[\"a1\"], d[\"b1\"]), (sj.label_b, d[\"a2\"], d[\"b2\"])):\n            if b:\n                rijen.append({\"wedstrijd\": datums.get(d[\"wedstrijd\"], d[\"wedstrijd\"]), \"groep\": groep, \"procent\": procent(a, b), \"telling\": f\"{a} van de {b}\"})\n    if not rijen:\n        st.info(\"Deze vergelijking komt in de gekozen wedstrijden niet voor.\")\n        return\n    st.altair_chart(_trend(pd.DataFrame(rijen), _kleuren(v[\"vergelijking\"], v[\"kant\"]), (sj.label_a, sj.label_b), \"Procent\"))\n    st.caption(\n        f\"Over alle wedstrijden: {sj.kort_a} {int(v['a1'])} van de {int(v['b1'])} ({procent(v['a1'], v['b1'])}%), \"\n        f\"{sj.kort_b} {int(v['a2'])} van de {int(v['b2'])} ({procent(v['a2'], v['b2'])}%). \"\n        f\"Kans dat het verschil echt is en geen toeval: {zeker_tekst(v['zekerheid'])}.\"\n    )\n\n\ndef tab_bevindingen(s: seizoen.Seizoen, sleutel: tuple) -> None:\n    st.caption(\"Dezelfde pagina's als in de PDF. Onder elke pagina staan de tellingen en het meetpunt.\")\n    kolommen = st.columns(2, gap=\"medium\")\n    for i, b in enumerate(s.bevindingen, start=1):\n        f = formuleer(b)\n        with kolommen[(i - 1) % 2]:\n            st.image(_png(sleutel + (i,), i, s, b))\n            with st.expander(\"Tellingen en meetpunt\"):\n                st.write(f.kernzin)\n                st.markdown(f\"**Stuur op.** {f.stuur}\")\n                st.markdown(f\"**Meetpunt.** {f.meetpunt}\")\n                zeker = f\"  |  Kans dat dit verschil echt is en geen toeval: {zeker_tekst(b.zekerheid)}\" if b.soort == \"vergelijking\" else \"\"\n                st.caption(f\"{f.gezien}{zeker}\")\n\n\ndef tab_codering(team_analyses: list[Analyse]) -> None:\n    links, rechts = st.columns([1, 1], gap=\"large\")\n    with links:\n        st.markdown(\"**Wat de codering levert**\")\n        st.markdown(\"\\n\".join(f\"- **{naam}**: {uitleg}\" for naam, uitleg in XML_WEL))\n        st.markdown(\"**Wat er niet in zit**\")\n        st.markdown(\"\\n\".join(f\"- **{naam}**: {uitleg}\" for naam, uitleg in XML_NIET))\n    with rechts:\n        alle = pd.concat([a.instances for a in team_analyses], ignore_index=True)\n        telling = alle.assign(soort=alle[\"hoofdfunctie\"].map(lambda h: \"Niet meegeteld\" if h == OVERIG else \"Meegeteld\")).groupby([\"code\", \"soort\"]).size().reset_index(name=\"aantal\")\n        telling = telling.sort_values(\"aantal\", ascending=False).head(25)\n        st.markdown(f\"**De meest gebruikte knoppen** ({len(alle)} klikken in {len(team_analyses)} wedstrijden)\")\n        st.altair_chart(\n            alt.Chart(telling).mark_bar().encode(\n                x=alt.X(\"aantal:Q\", title=None), y=alt.Y(\"code:N\", sort=\"-x\", title=None, axis=alt.Axis(labelLimit=300, labelOverlap=False)),\n                color=alt.Color(\"soort:N\", scale=alt.Scale(domain=[\"Meegeteld\", \"Niet meegeteld\"], range=[GROEN, ROOD]), legend=alt.Legend(orient=\"top\", title=None)),\n                tooltip=[\"code\", \"aantal\", \"soort\"],\n            ).properties(height=22 * len(telling) + 30)\n        )\n        onbekend = [(a.wedstrijd.titel, code, n) for a in team_analyses for code, n in inlezen.onbekende_codes(a.instances).items()]\n        if onbekend:\n            st.markdown(\"**Knoppen die het programma niet kent**\")\n            _tabel(pd.DataFrame(onbekend, columns=[\"Wedstrijd\", \"Knop\", \"Aantal\"]))\n            st.caption(\"Die tellen nergens mee. Een knop die een keer voorkomt is meestal een misklik.\")\n\n\ndef feedbackformulier(team: str, tabbladen: list[str], plek: str) -> None:\n    \"\"\"Tekst en schermafbeeldingen naar de makers sturen. De wedstrijdbestanden gaan niet mee.\"\"\"\n    st.markdown(\"**Wat kan beter, wat mis je, wat klopt er niet?**\")\n    with st.form(f\"feedback_{plek}\", clear_on_submit=True):\n        links, rechts = st.columns(2)\n        naam = links.text_input(\"Je naam\", placeholder=\"mag leeg blijven\")\n        over = rechts.selectbox(\"Waar gaat het over?\", [\"Algemeen\", *tabbladen])\n        tekst = st.text_area(\"Je feedback\", height=160, placeholder=\"Schrijf het op zoals je het tegen een collega zou zeggen.\")\n        beelden = st.file_uploader(\n            f\"Schermafbeeldingen (hooguit {MAX_BEELDEN})\", type=[\"png\", \"jpg\", \"jpeg\"], accept_multiple_files=True,\n            help=\"Maak een schermafbeelding van wat je bedoelt en sleep hem hierheen.\",\n        )\n        verstuurd = st.form_submit_button(\"Verstuur\", type=\"primary\")\n    st.caption(\"Wat je hier verstuurt gaat naar de makers van het dashboard. Je wedstrijdbestanden worden niet meegestuurd.\")\n    if verstuurd:\n        st.session_state[\"feedback_uitkomst\"] = _verstuur_feedback(team, naam, over, tekst, beelden or [])\n    # De uitkomst blijft staan tot de volgende keer versturen: het formulier wordt na het versturen opnieuw getekend.\n    soort, melding = st.session_state.get(\"feedback_uitkomst\", (\"\", \"\"))\n    if soort:\n        {\"gelukt\": st.success, \"let op\": st.warning, \"mislukt\": st.error}[soort](melding)\n\n\ndef _verstuur_feedback(team: str, naam: str, over: str, tekst: str, beelden: list) -> tuple[str, str]:\n    te_groot = [b.name for b in beelden if b.size > MAX_BEELD_MB * 1024 * 1024]\n    if not tekst.strip() and not beelden:\n        return \"let op\", \"Schrijf iets op of voeg een schermafbeelding toe.\"\n    if len(beelden) > MAX_BEELDEN or te_groot:\n        return \"let op\", f\"Hooguit {MAX_BEELDEN} schermafbeeldingen van elk hooguit {MAX_BEELD_MB} MB.\"\n    bericht = {\n        \"naam\": naam.strip(), \"team\": team, \"over\": over, \"tekst\": tekst.strip(),\n        \"beelden\": [versturen.beeld(b.name, b.type, b.getvalue()) for b in beelden],\n    }\n    try:\n        versturen.verstuur(FEEDBACK_ADRES, bericht)\n    except OSError as fout:\n        return \"mislukt\", f\"Versturen is niet gelukt ({fout}). Probeer het later nog eens.\"\n    return \"gelukt\", \"Bedankt, je feedback is verstuurd.\"\n\n\ndef tab_downloaden(s: seizoen.Seizoen, sleutel: tuple, team_analyses: list[Analyse]) -> None:\n    kolommen = st.columns(3)\n    kolommen[0].download_button(\"PDF voor de trainer\", data=_pdf(sleutel, s), file_name=f\"{s.naam}.pdf\", mime=\"application/pdf\", type=\"primary\", width=\"stretch\")\n    kolommen[1].download_button(\"Onderbouwing (markdown)\", data=onderbouwing.render_md(s).encode(\"utf-8\"), file_name=f\"{s.naam}.md\", mime=\"text/markdown\", width=\"stretch\")\n    buffer = io.BytesIO()\n    with zipfile.ZipFile(buffer, \"w\", zipfile.ZIP_DEFLATED) as z:\n        for naam, tabel in tabellen.tabellen(team_analyses).items():\n            z.writestr(f\"{naam}.csv\", tabel.to_csv(index=False).encode(\"utf-8-sig\"))\n    kolommen[2].download_button(\"Tabellen voor Power BI (zip)\", data=buffer.getvalue(), file_name=f\"{s.naam}_tabellen.zip\", mime=\"application/zip\", width=\"stretch\")\n    st.caption(\"Power BI: pak de zip uit en kies Gegevens ophalen > Map. Elke tabel heeft de kolommen wedstrijd en team om ze te koppelen.\")\n\n\ndef main() -> None:\n    st.set_page_config(page_title=\"MyVA-dashboard\", layout=\"wide\")\n    st.markdown(STIJL, unsafe_allow_html=True)\n    instellingen = config.laad()\n\n    with st.sidebar:\n        st.markdown(\"### MyVA-dashboard\")\n        uploads = st.file_uploader(\"Sleep MyVA-exports hierheen\", type=[\"xml\", \"csv\"], accept_multiple_files=True, help=\"XML's, en eventueel meta.csv en correcties.csv\")\n        map_tekst, lees_map = STANDAARD_MAP, False\n        if not IN_DE_BROWSER:\n            with st.expander(\"Of lees een map op deze computer\"):\n                map_tekst = st.text_input(\"Map\", value=STANDAARD_MAP, disabled=bool(uploads))\n                lees_map = st.toggle(\"Deze map gebruiken\", value=False, disabled=bool(uploads), key=\"lees_map\")\n\n    if not uploads and not lees_map:\n        st.markdown('<div class=\"kop\"><span class=\"team\">MyVA-dashboard<\/span><\/div>', unsafe_allow_html=True)\n        st.info(\"Sleep een of meer MyVA-exports in het vak links. Minstens twee wedstrijden van hetzelfde team geven het meeste beeld; met een wedstrijd zie je het veld en de samenvatting.\")\n        if FEEDBACK_ADRES:\n            with st.expander(\"Feedback geven\"):\n                feedbackformulier(\"\", [], \"start\")\n        return\n    bron = _uploads_naar_map(uploads) if uploads else Path(map_tekst)\n    if not bron.exists():\n        st.warning(f\"De map {bron} bestaat niet.\")\n        return\n    herkend = instellingen.eigen_club or metadata.raad_eigen_club([p.stem for p in verzamel_bestanden([str(bron)])[0]])\n    with st.sidebar:\n        with st.expander(f\"Eigen team: {herkend}\" if herkend else \"Eigen team: niet herkend\", expanded=not herkend):\n            eigen_club = st.text_input(\n                \"Eigen team\", value=herkend or \"\", label_visibility=\"collapsed\",\n                help=\"Herkend uit de bestandsnamen. Pas het alleen aan als het niet klopt; het is nodig om uitwedstrijden te herkennen.\",\n            ).strip() or None\n    plek = st.empty()\n    _meld_inlezen(bron, eigen_club, plek)\n    analyses, fouten = _lees(bron, eigen_club)\n    teams, meldingen = _per_team(analyses)\n    if not teams:\n        plek.empty()\n        st.info(\"In deze bestanden staat geen wedstrijd die gelezen kon worden. Kijk bij de meldingen hieronder waarom.\")\n        for regel in fouten + meldingen:\n            st.warning(regel)\n        return\n\n    with st.sidebar:\n        team = st.selectbox(\"Team\", list(teams))\n        labels = {_label(a): a for a in teams[team]}\n        keuze = st.multiselect(\"Wedstrijden\", list(labels), default=list(labels), key=f\"wedstrijden_{team}\")\n        with st.expander(\"Wanneer is iets een bevinding?\"):\n            zekerheid = st.select_slider(\"Zekerheid\", options=ZEKERHEDEN, value=min(ZEKERHEDEN, key=lambda z: abs(z - instellingen.zekerheid)), format_func=lambda z: f\"{100 * z:g}%\")\n            steun = st.select_slider(\"Gezien in minstens dit deel van de wedstrijden\", options=STEUNEN, value=min(STEUNEN, key=lambda x: abs(x - instellingen.steun)), format_func=lambda x: f\"{100 * x:g}%\")\n        if st.button(\"Bestanden opnieuw inlezen\", width=\"stretch\"):\n            _analyse.clear()\n            st.session_state.pop(\"ingelezen\", None)\n            st.rerun()\n\n    team_analyses = [labels[k] for k in keuze]\n    if not team_analyses:\n        plek.empty()\n        st.info(\"Kies een of meer wedstrijden.\")\n        return\n    sleutel = tuple(id(a) for a in team_analyses)\n    try:\n        s = _seizoen(sleutel, zekerheid, steun, team_analyses)\n    except ValueError as fout:\n        plek.empty()\n        st.error(str(fout))\n        return\n\n    let_op = fouten + meldingen + [f\"{a.wedstrijd.titel}: {m}\" for a in team_analyses for m in a.meldingen]\n    if let_op:\n        with st.sidebar.expander(f\"Let op ({len(let_op)})\"):\n            for regel in let_op:\n                st.markdown(f\"- {regel}\")\n\n    _kop(team, s)\n    def tab_meer() -> None:\n        tab_downloaden(s, sleutel + (zekerheid, steun), team_analyses)\n        st.divider()\n        tab_codering(team_analyses)\n\n    tabbladen = {\n        \"Samenvatting\": lambda: tab_samenvatting(s, team_analyses, sleutel),\n        \"Wedstrijdkaart\": lambda: tab_wedstrijdkaart(s, team_analyses),\n        \"Veld\": lambda: tab_veld(team_analyses, sleutel),\n        \"Wedstrijden\": lambda: tab_wedstrijden(s),\n        \"Wanneer en waaruit\": lambda: tab_wanneer(s, team_analyses),\n        \"Trends\": lambda: tab_trends(s),\n        \"Vergelijken\": lambda: tab_wedstrijdkaart(s, team_analyses),\n        \"Bevindingen\": lambda: tab_bevindingen(s, sleutel + (zekerheid, steun)),\n        \"Meer\": tab_meer,\n    }\n    del tabbladen[\"Vergelijken\" if MET_WEDSTRIJDKAART else \"Wedstrijdkaart\"]\n    if FEEDBACK_ADRES:\n        tabbladen[\"Feedback\"] = lambda: feedbackformulier(team, list(tabbladen)[:-1], \"tab\")\n    for tab, inhoud in zip(st.tabs(list(tabbladen)), tabbladen.values()):\n        with tab:\n            inhoud()\n    plek.empty()\n\n\nmain()\n", "myva_pipeline/domein.py": "\"\"\"De begrippen van de codering: teamfuncties, fases en wie de bal heeft.\n\nElke laag gebruikt deze namen; de module zelf gebruikt niets uit het pakket.\n\"\"\"\n\nAANVALLEN = \"aanvallen\"\nVERDEDIGEN = \"verdedigen\"\nOMSCHAKELEN_AV = \"omschakelen_av\"\nOMSCHAKELEN_VA = \"omschakelen_va\"\nKANS = \"kans\"\nKANS_TEGEN = \"kans_tegen\"\nSPELHERVATTING = \"spelhervatting\"\nSTRUCTUUR = \"structuur\"\nFASE_LOS = \"fase_los\"\n# Bekende knoppen die nergens in meetellen, en knoppen die het programma niet kent.\nOVERIG = \"overig\"\n\nHOOFDFUNCTIES = (\n    AANVALLEN,\n    VERDEDIGEN,\n    OMSCHAKELEN_AV,\n    OMSCHAKELEN_VA,\n    KANS,\n    KANS_TEGEN,\n    SPELHERVATTING,\n    STRUCTUUR,\n    FASE_LOS,\n    OVERIG,\n)\n\nFASES = (\n    \"F0\",\n    \"F1A\",\n    \"F1B\",\n    \"F1C-L\",\n    \"F1C-R\",\n    \"F2A\",\n    \"F2B\",\n    \"F2C\",\n    \"F3\",\n    \"hoog_druk\",\n    \"laag_druk\",\n    \"eindfase\",\n)\n\n# Reeksen zijn periodes van een van de vier teamfuncties.\nREEKS_FUNCTIES = (AANVALLEN, VERDEDIGEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA)\nEIGEN_BEZIT = (AANVALLEN, OMSCHAKELEN_VA)\nTEGEN_BEZIT = (VERDEDIGEN, OMSCHAKELEN_AV)\n# Van wie de reeks is: \"eigen\" als wij de bal hebben, anders \"tegen\".\nKANT = {functie: (\"eigen\" if functie in EIGEN_BEZIT else \"tegen\") for functie in REEKS_FUNCTIES}\n", "myva_pipeline/invoer/__init__.py": "\"\"\"Invoer: de MyVA-export, de gegevens van de wedstrijd en de correcties inlezen.\"\"\"\n", "myva_pipeline/invoer/correcties.py": "\"\"\"Handmatige correcties: instances die niet mee mogen tellen, met de reden.\n\nZe staan in correcties.csv naast de XML (bestand, instance_id, actie, reden).\nDe XML zelf wordt nooit bewerkt, en elke toegepaste correctie komt in het rapport.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport pandas as pd\n\nKOLOMMEN = [\"bestand\", \"instance_id\", \"actie\", \"reden\"]\nTOEGEPAST_KOLOMMEN = KOLOMMEN + [\"code\", \"start\"]\nACTIES = {\"negeer\"}\n\n\ndef lees_correcties(xml_path: Path) -> pd.DataFrame:\n    \"\"\"De regels uit correcties.csv die bij deze XML horen.\"\"\"\n    pad = Path(xml_path).parent / \"correcties.csv\"\n    if not pad.exists():\n        return pd.DataFrame(columns=KOLOMMEN)\n    c = pd.read_csv(pad, dtype=str).fillna(\"\")\n    ontbreekt = set(KOLOMMEN) - set(c.columns)\n    if ontbreekt:\n        raise ValueError(f\"correcties.csv mist kolommen: {sorted(ontbreekt)}\")\n    c = c[c[\"bestand\"] == Path(xml_path).name]\n    onbekend = set(c[\"actie\"]) - ACTIES\n    if onbekend:\n        raise ValueError(f\"correcties.csv: onbekende actie {sorted(onbekend)}; alleen {sorted(ACTIES)} bestaat\")\n    return c[KOLOMMEN].reset_index(drop=True)\n\n\ndef pas_toe(instances: pd.DataFrame, correcties: pd.DataFrame) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"Haalt genegeerde instances weg. Geeft (instances, toegepaste correcties). Een onbekend id is een fout.\"\"\"\n    if correcties.empty:\n        return instances, pd.DataFrame(columns=TOEGEPAST_KOLOMMEN)\n    ids = instances[\"id\"].str.upper()\n    gevraagd = correcties[\"instance_id\"].str.upper()\n    ontbreekt = sorted(set(gevraagd) - set(ids))\n    if ontbreekt:\n        raise ValueError(f\"correcties.csv noemt instance-id's die niet in de XML staan: {ontbreekt}\")\n    geraakt = instances[ids.isin(set(gevraagd))].assign(sleutel=lambda d: d[\"id\"].str.upper())\n    toegepast = correcties.assign(sleutel=gevraagd).merge(geraakt[[\"sleutel\", \"code\", \"start\"]], on=\"sleutel\").drop(columns=\"sleutel\")\n    return instances[~ids.isin(set(gevraagd))].reset_index(drop=True), toegepast[TOEGEPAST_KOLOMMEN]\n", "myva_pipeline/invoer/inlezen.py": "\"\"\"MyVA-XML inlezen naar een tabel met een rij per instance.\n\nAlleen ALL_INSTANCES wordt gelezen. Elke code wordt via een vaste tabel\nvertaald naar een hoofdfunctie en een fase. Een onbekende code telt nergens mee en\nwordt gemeld; de wedstrijd wordt wel verwerkt.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nimport pandas as pd\n\nfrom myva_pipeline.domein import AANVALLEN, FASE_LOS, KANS, KANS_TEGEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA, OVERIG, SPELHERVATTING, STRUCTUUR, VERDEDIGEN\n\n# Fase-suffixen zoals ze achter \"Aanvallen - \" en \"Verdedigen - \" staan,\n# en ook als losse code zonder prefix voorkomen.\n_FASE_SUFFIX: dict[str, str] = {\n    \"doeltrap\": \"F0\",\n    \"doeltrap (F0)\": \"F0\",\n    \"Opbouw met keeper (F1A)\": \"F1A\",\n    \"Opbouw zonder keeper (F1B)\": \"F1B\",\n    \"links langs het blok (F1C-L)\": \"F1C-L\",\n    \"rechts langs het blok (F1C-R)\": \"F1C-R\",\n    \"door het blok (F2A)\": \"F2A\",\n    \"door het blok (F2B)\": \"F2B\",\n    \"achter het blok (F2C)\": \"F2C\",\n    \"eindfase (F3)\": \"F3\",\n    \"hoog druk\": \"hoog_druk\",\n    \"laag druk\": \"laag_druk\",\n}\n\nCODE_MAP: dict[str, tuple[str, str | None]] = {\n    \"Aanvallen\": (AANVALLEN, None),\n    \"Verdedigen\": (VERDEDIGEN, None),\n    \"Omschakelen A-V\": (OMSCHAKELEN_AV, None),\n    \"Omschakelen V-A\": (OMSCHAKELEN_VA, None),\n    \"Omschakelen A-V - Eindfase\": (OMSCHAKELEN_AV, \"eindfase\"),\n    \"Omschakelen V-A - Eindfase\": (OMSCHAKELEN_VA, \"eindfase\"),\n    \"Kans - schot\": (KANS, None),\n    \"Kans - goal\": (KANS, None),\n    \"Kans - voorzet links\": (KANS, None),\n    \"Kans - voorzet rechts\": (KANS, None),\n    \"Kans tegen - schot\": (KANS_TEGEN, None),\n    \"Kans tegen - goal\": (KANS_TEGEN, None),\n    \"Kans tegen - voorzet links\": (KANS_TEGEN, None),\n    \"Kans tegen - voorzet rechts\": (KANS_TEGEN, None),\n    \"Corner aanvallend\": (SPELHERVATTING, None),\n    \"Corner verdedigend\": (SPELHERVATTING, None),\n    \"Ingooi aanvallend\": (SPELHERVATTING, None),\n    \"Ingooi verdedigend\": (SPELHERVATTING, None),\n    \"Vrijetrap aanvallend\": (SPELHERVATTING, None),\n    \"Vrijetrap verdedigend\": (SPELHERVATTING, None),\n    \"H1\": (STRUCTUUR, None),\n    \"H2\": (STRUCTUUR, None),\n    \"Q1\": (STRUCTUUR, None),\n    \"Q2\": (STRUCTUUR, None),\n    \"Q3\": (STRUCTUUR, None),\n    \"Q4\": (STRUCTUUR, None),\n    \"Q5\": (STRUCTUUR, None),\n    \"Q6\": (STRUCTUUR, None),\n    \"Aftrap\": (STRUCTUUR, None),\n    # Een afgekeurde goal is een schot geweest, maar geen goal\n    \"Kans - goal afgekeurd\": (KANS, None),\n    # Bekende knoppen die nergens in meetellen\n    \"Kaarten\": (OVERIG, None),\n    \"Rode kaart\": (OVERIG, None),\n    \"Rode kaart TP\": (OVERIG, None),\n}\n\nfor _suffix, _fase in _FASE_SUFFIX.items():\n    CODE_MAP[f\"Aanvallen - {_suffix}\"] = (AANVALLEN, _fase)\n    CODE_MAP[f\"Verdedigen - {_suffix}\"] = (VERDEDIGEN, _fase)\n    # Zonder prefix: een fase binnen een omschakeling, later op tijd aan de reeks gekoppeld.\n    CODE_MAP[_suffix] = (FASE_LOS, _fase)\n# De losse drukcodes hebben een hoofdletter, anders dan de suffix-vorm.\nCODE_MAP[\"Hoog druk\"] = (FASE_LOS, \"hoog_druk\")\nCODE_MAP[\"Laag druk\"] = (FASE_LOS, \"laag_druk\")\n\n# Labels: BV balverlies, BW balwinst, LB lange bal.\nVLAG_LABELS = (\"BV\", \"BW\", \"LB\")\n\nKOLOMMEN = [\n    \"id\",\n    \"code\",\n    \"hoofdfunctie\",\n    \"fase\",\n    \"start\",\n    \"end\",\n    \"duur\",\n    \"helft\",\n    \"labels\",\n    \"label_BV\",\n    \"label_BW\",\n    \"label_LB\",\n]\n\n\ndef tel_instance_elementen(path: str | Path) -> int:\n    \"\"\"Aantal <instance>-elementen onder ALL_INSTANCES, onafhankelijk van parse().\"\"\"\n    root = ET.parse(path).getroot()\n    all_instances = root.find(\"ALL_INSTANCES\")\n    if all_instances is None:\n        raise ValueError(f\"Geen ALL_INSTANCES in {path}\")\n    return len(all_instances.findall(\"instance\"))\n\n\ndef _lees_instances(path: str | Path) -> list[dict]:\n    root = ET.parse(path).getroot()\n    all_instances = root.find(\"ALL_INSTANCES\")\n    if all_instances is None:\n        raise ValueError(f\"Geen ALL_INSTANCES in {path}\")\n\n    rijen: list[dict] = []\n    for inst in all_instances.findall(\"instance\"):\n        code = (inst.findtext(\"code\") or \"\").strip()\n        hoofdfunctie, fase = CODE_MAP.get(code, (OVERIG, None))\n        start = float(inst.findtext(\"start\"))\n        end = float(inst.findtext(\"end\"))\n        labels = [\n            (lab.findtext(\"text\") or \"\").strip() for lab in inst.findall(\"label\")\n        ]\n        rijen.append(\n            {\n                \"id\": (inst.findtext(\"ID\") or \"\").strip(),\n                \"code\": code,\n                \"hoofdfunctie\": hoofdfunctie,\n                \"fase\": fase,\n                \"start\": start,\n                \"end\": end,\n                \"duur\": end - start,\n                \"labels\": labels,\n                \"label_BV\": \"BV\" in labels,\n                \"label_BW\": \"BW\" in labels,\n                \"label_LB\": \"LB\" in labels,\n            }\n        )\n    return rijen\n\n\ndef onbekende_codes(df: pd.DataFrame) -> pd.Series:\n    \"\"\"Aantal instances per code die niet in CODE_MAP staat. Die tellen nergens mee.\"\"\"\n    return df.loc[~df[\"code\"].isin(CODE_MAP), \"code\"].value_counts().sort_index()\n\n\ndef helft_intervallen(df: pd.DataFrame) -> dict[int, tuple[float, float]]:\n    \"\"\"Tijdsinterval (start, end) in videoseconden per helft.\n\n    Primaire bron: de structuurinstances met code H1 en H2.\n    Terugval als H1 of H2 ontbreekt: de Aftrap-instances met label\n    \"1e helft\" of \"2e helft\". Per helft zijn dat er twee: het beginsignaal en\n    het eindsignaal. Het interval loopt van de start van de eerste tot de\n    start van de laatste.\n    \"\"\"\n    intervallen: dict[int, tuple[float, float]] = {}\n    struct = df[df[\"hoofdfunctie\"] == STRUCTUUR]\n\n    for helft, code in ((1, \"H1\"), (2, \"H2\")):\n        rij = struct[struct[\"code\"] == code]\n        if len(rij) == 1:\n            intervallen[helft] = (float(rij[\"start\"].iloc[0]), float(rij[\"end\"].iloc[0]))\n        elif len(rij) > 1:\n            raise ValueError(f\"Meerdere {code}-instances gevonden: {len(rij)}\")\n\n    # De helft-knop maakt bij aan- en uitklikken een Aftrap aan met het helftlabel;\n    # die twee markeren begin en einde als de H-instance zelf ontbreekt.\n    aftrap = struct[struct[\"code\"] == \"Aftrap\"]\n    for helft, label in ((1, \"1e helft\"), (2, \"2e helft\")):\n        if helft in intervallen:\n            continue\n        rijen = aftrap[aftrap[\"labels\"].apply(lambda ls: label in ls)]\n        if len(rijen) == 2:\n            starts = sorted(float(s) for s in rijen[\"start\"])\n            intervallen[helft] = (starts[0], starts[1])\n        elif len(rijen) > 0:\n            raise ValueError(\n                f\"Helft {helft}: geen H{helft}-instance en {len(rijen)} Aftrap-instances \"\n                f\"met label {label!r} (verwacht 2)\"\n            )\n\n    if not intervallen:\n        raise ValueError(\"Geen helftinformatie gevonden (geen H1/H2 en geen Aftrap-labels)\")\n    return intervallen\n\n\n# De eerste reeks van een helft wordt soms een paar seconden voor het\n# beginsignaal aangeklikt en hoort dan toch bij die helft.\nHELFT_TOLERANTIE_S = 5.0\n\n\ndef bepaal_helft(start: pd.Series, intervallen: dict[int, tuple[float, float]]) -> pd.Series:\n    \"\"\"Helft per instance op basis van de starttijd. None buiten beide intervallen.\n\n    Een instance hoort bij een helft als de start binnen het interval ligt,\n    of hoogstens HELFT_TOLERANTIE_S seconden voor het begin ervan. Helften\n    worden in volgorde toegekend, dus het einde van H1 wint van de tolerantie\n    voor H2.\n    \"\"\"\n    helft = pd.Series([None] * len(start), index=start.index, dtype=\"object\")\n    for nummer, (begin, eind) in sorted(intervallen.items()):\n        masker = (start >= begin - HELFT_TOLERANTIE_S) & (start <= eind) & helft.isna()\n        helft[masker] = nummer\n    return helft\n\n\ndef lees_instances(path: str | Path) -> pd.DataFrame:\n    \"\"\"Lees een MyVA-XML naar een DataFrame met een rij per instance.\n\n    Kolommen: id, code, hoofdfunctie, fase, start, end, duur, helft,\n    labels (list), label_BV, label_BW, label_LB. Gesorteerd op start.\n    \"\"\"\n    rijen = _lees_instances(path)\n    df = pd.DataFrame(rijen)\n    if df.empty:\n        raise ValueError(f\"Geen instances in {path}\")\n    # Object-dtype houdt None als None; de standaard string-dtype maakt er NaN van.\n    df[\"fase\"] = pd.Series([r[\"fase\"] for r in rijen], index=df.index, dtype=\"object\")\n    intervallen = helft_intervallen(df)\n    df[\"helft\"] = bepaal_helft(df[\"start\"], intervallen)\n    df = df[KOLOMMEN].sort_values([\"start\", \"end\"], kind=\"stable\").reset_index(drop=True)\n    return df\n", "myva_pipeline/invoer/metadata.py": "\"\"\"Gegevens van de wedstrijd: datum, teams, uitslag en thuis of uit.\n\nDe XML bevat die niet. Ze komen uit de bestandsnaam; een regel in meta.csv naast\nde XML gaat voor. De codering is altijd vanuit het eigen team gemaakt, dus de\nwedstrijd wordt ook zo bewaard: `team` is het eigen team, ook bij een uitwedstrijd.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport re\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nONBEKEND_TEAM, ONBEKENDE_TEGENSTANDER = \"eigen team\", \"tegenstander\"\nMETA_KOLOMMEN = [\"bestand\", \"datum\", \"team\", \"tegenstander\", \"uitslag\", \"thuis_uit\"]\n\n_DATUM = re.compile(r\"^(\\d{4})[.\\-](\\d{2})[.\\-](\\d{2})[ _]*(.*)$\")\n_UITSLAG = re.compile(r\"\\s(\\d+)-(\\d+)\\s*$\")\n_KORTE_VORM = re.compile(r\"^\\d{4}-\\d{2}-\\d{2}_[^\\s()]+$\")\n\n\n@dataclass(frozen=True)\nclass Wedstrijd:\n    naam: str\n    bron: Path\n    datum: str = \"\"\n    team: str = ONBEKEND_TEAM\n    tegenstander: str = ONBEKENDE_TEGENSTANDER\n    uitslag: str = \"\"\n    thuis: bool = True\n\n    @property\n    def compleet(self) -> bool:\n        \"\"\"Datum, team en tegenstander zijn bekend. Zonder die drie kan een wedstrijd niet gestapeld worden.\"\"\"\n        return bool(self.datum) and self.team != ONBEKEND_TEAM and self.tegenstander != ONBEKENDE_TEGENSTANDER\n\n    @property\n    def titel(self) -> str:\n        \"\"\"Thuisploeg eerst, met de uitslag in die volgorde.\"\"\"\n        eerste, tweede = (self.team, self.tegenstander) if self.thuis else (self.tegenstander, self.team)\n        return f\"{eerste} - {tweede} {self.uitslag}\".strip()\n\n\ndef wedstrijd_uit_bestandsnaam(stem: str, eigen_club: str | None = None) -> dict:\n    \"\"\"Datum, teams en uitslag uit de bestandsnaam. Wat niet herkend wordt, blijft weg.\n\n    Twee vormen worden herkend: de naam die MyVA geeft,\n    \"2026.01.31 AAA O19 - BBB O19 1-2 (C).MyVAproject\", en de korte vorm\n    \"2026-01-31_AAA-O19_BBB-O19\". Begint het tweede team met `eigen_club` en\n    het eerste niet, dan is het een uitwedstrijd.\n    \"\"\"\n    stem = re.sub(r\"\\.MyVAproject$\", \"\", stem)\n    stem = re.sub(r\"\\s*\\([^)]*\\)\\s*$\", \"\", stem)\n    velden: dict = {}\n    m = _DATUM.match(stem)\n    if not m:\n        return velden\n    velden[\"datum\"] = f\"{m.group(1)}-{m.group(2)}-{m.group(3)}\"\n    rest = m.group(4).strip()\n    u = _UITSLAG.search(rest)\n    if u:\n        velden[\"uitslag\"] = f\"{u.group(1)}-{u.group(2)}\"\n        rest = rest[: u.start()].strip()\n    if \" - \" in rest:\n        team, tegen = rest.split(\" - \", 1)\n    elif \"_\" in rest:\n        team, tegen = (deel.replace(\"-\", \" \") for deel in rest.split(\"_\", 1))\n    else:\n        return velden\n    team, tegen = team.strip(), tegen.strip()\n    if eigen_club and tegen.upper().startswith(eigen_club.upper()) and not team.upper().startswith(eigen_club.upper()):\n        team, tegen = tegen, team\n        velden[\"thuis_uit\"] = \"uit\"\n    velden[\"team\"], velden[\"tegenstander\"] = team, tegen\n    return velden\n\n\ndef raad_eigen_club(stems: list[str]) -> str | None:\n    \"\"\"Het eigen team uit een reeks bestandsnamen: het team dat in elke naam staat.\n\n    De codering is altijd vanuit het eigen team, dus dat team staat in elke bestandsnaam\n    en de tegenstander wisselt. Staan er meerdere eigen teams tussen, dan telt het eerste\n    woord dat overal staat, zoals de club. Is het niet eenduidig, dan None.\n    \"\"\"\n    paren = [{v[\"team\"], v[\"tegenstander\"]} for v in map(wedstrijd_uit_bestandsnaam, stems) if \"team\" in v]\n    if len(paren) < 2:\n        return None\n    teams = set.intersection(*paren)\n    if len(teams) == 1:\n        return teams.pop()\n    woorden = set.intersection(*({team.split()[0].upper() for team in paar} for paar in paren))\n    return woorden.pop() if len(woorden) == 1 else None\n\n\ndef _korte_naam(velden: dict, stem: str) -> str:\n    \"\"\"Bestandsnaam voor de uitvoer: datum_team_tegenstander zonder spaties.\"\"\"\n    if _KORTE_VORM.match(stem):\n        return stem\n    if not {\"datum\", \"team\", \"tegenstander\"} <= velden.keys():\n        return re.sub(r\"[^\\w.-]+\", \"_\", stem).strip(\"_\")\n    kort = lambda s: re.sub(r\"\\s+\", \"-\", s.strip())\n    return f\"{velden['datum']}_{kort(velden['team'])}_{kort(velden['tegenstander'])}\"\n\n\ndef _meta_regels(meta_pad: Path) -> tuple[list[dict], list[str]]:\n    if not meta_pad.exists():\n        return [], list(META_KOLOMMEN)\n    with meta_pad.open(encoding=\"utf-8\", newline=\"\") as f:\n        lezer = csv.DictReader(f)\n        return list(lezer), list(lezer.fieldnames or META_KOLOMMEN)\n\n\ndef lees_wedstrijd(xml_path: Path, eigen_club: str | None = None) -> Wedstrijd:\n    xml_path = Path(xml_path)\n    velden = wedstrijd_uit_bestandsnaam(xml_path.stem, eigen_club)\n    for rij in _meta_regels(xml_path.parent / \"meta.csv\")[0]:\n        if rij.get(\"bestand\") == xml_path.name:\n            velden.update({k: v.strip() for k, v in rij.items() if v and k in META_KOLOMMEN[1:]})\n    thuis_uit = velden.pop(\"thuis_uit\", \"thuis\").lower()\n    if thuis_uit not in (\"thuis\", \"uit\"):\n        raise ValueError(f\"meta.csv: thuis_uit moet 'thuis' of 'uit' zijn, niet {thuis_uit!r} ({xml_path.name})\")\n    return Wedstrijd(naam=_korte_naam(velden, xml_path.stem), bron=xml_path, thuis=thuis_uit == \"thuis\", **velden)\n\n\ndef vul_meta_aan(bestanden: list[Path], eigen_club: str | None = None) -> list[Path]:\n    \"\"\"Zet voor elke XML zonder datum, team of tegenstander een in te vullen regel in meta.csv.\n\n    Bestaande regels blijven staan. Geeft de bestanden terug waar nog gegevens van ontbreken.\n    \"\"\"\n    onvolledig = [Path(b) for b in bestanden if not lees_wedstrijd(Path(b), eigen_club).compleet]\n    for map_ in sorted({b.parent for b in onvolledig}):\n        meta_pad = map_ / \"meta.csv\"\n        regels, kolommen = _meta_regels(meta_pad)\n        bekend = {rij.get(\"bestand\", \"\") for rij in regels}\n        nieuw = [b for b in onvolledig if b.parent == map_ and b.name not in bekend]\n        if not nieuw:\n            continue\n        bestaat = meta_pad.exists()\n        eindigt_netjes = not bestaat or meta_pad.read_text(encoding=\"utf-8\").endswith(\"\\n\")\n        with meta_pad.open(\"a\", encoding=\"utf-8\", newline=\"\") as f:\n            schrijver = csv.DictWriter(f, fieldnames=kolommen, extrasaction=\"ignore\")\n            if not bestaat:\n                schrijver.writeheader()\n            elif not eindigt_netjes:\n                f.write(\"\\n\")\n            for b in nieuw:\n                velden = wedstrijd_uit_bestandsnaam(b.stem, eigen_club)\n                schrijver.writerow({k: velden.get(k, \"\") for k in META_KOLOMMEN} | {\"bestand\": b.name})\n    return onvolledig\n", "myva_pipeline/model/__init__.py": "\"\"\"Model: van losse instances naar reeksen, kansen en overgangen tussen fases.\"\"\"\n", "myva_pipeline/model/markov.py": "\"\"\"Overgangsmatrices en fasewaarden per teamfunctie.\n\nAbsorberende Markov-keten van orde 1 over de fases van een reeks. Toestanden\nzijn `start`, de fases en de eindtoestanden; overgangen worden geteld tussen\nopeenvolgende elementen van [\"start\"] + pad + [eind]. De absorptiekansen uit\nde gesmoothde matrix zijn de fasewaarden: kans op een schot en kans op\nbalverlies vanaf elke fase. Alles vanuit het team dat de bal heeft, dus bij\nverdedigen en omschakelen_av is \"verlies\" BW.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom myva_pipeline.domein import EIGEN_BEZIT, REEKS_FUNCTIES\n\nSTART = \"start\"\nFASES = [\"F0\", \"F1A\", \"F1B\", \"F1C-L\", \"F1C-R\", \"F2A\", \"F2B\", \"F2C\", \"F3\"]\nEINDEN = [\"schot\", \"goal\", \"BV\", \"BW\", \"opbouw\", \"uit\", \"einde\"]\nTRANSIENT = [START] + FASES\nTOESTANDEN = TRANSIENT + EINDEN\n\nSCHOT_EINDEN = (\"schot\", \"goal\")\n\n# Smoothing: per rij PSEUDO_TELLINGEN extra waarnemingen, verdeeld volgens de\n# totale verdeling van aankomsttoestanden binnen de hoofdfunctie. Dit is een\n# Dirichlet-prior met als gemiddelde de marginale verdeling, zodat een rij\n# met weinig waarnemingen naar het algemene beeld van die hoofdfunctie\n# schuift in plaats van naar een vlakke verdeling over 16 mogelijkheden.\nPSEUDO_TELLINGEN = 2.0\n\n\n@dataclass\nclass MarkovResultaat:\n    hoofdfunctie: str\n    n_reeksen: int\n    tellingen: pd.DataFrame  # rijen TRANSIENT, kolommen TOESTANDEN, ruwe aantallen\n    kansen: pd.DataFrame  # rijgenormaliseerd, NaN voor lege rijen\n    gesmoothd: pd.DataFrame  # rijgenormaliseerd na smoothing\n    fasewaarden: pd.DataFrame  # per transient toestand: tellingen en modelkansen\n\n\ndef verlies_eind(hoofdfunctie: str) -> str:\n    \"\"\"Eindtoestand die balverlies is voor het team dat de bal heeft.\"\"\"\n    return \"BV\" if hoofdfunctie in EIGEN_BEZIT else \"BW\"\n\n\ndef keten(pad: list[str], eind: str | None) -> list[str]:\n    \"\"\"Toestandenreeks van een reeks: start, fases, eindtoestand.\"\"\"\n    return [START] + list(pad) + [\"einde\" if eind is None or pd.isna(eind) else str(eind)]\n\n\ndef tel_overgangen(reeksen: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Ruwe overgangstellingen: rijen TRANSIENT, kolommen TOESTANDEN.\"\"\"\n    tel = pd.DataFrame(0, index=TRANSIENT, columns=TOESTANDEN, dtype=int)\n    for pad, eind in zip(reeksen[\"pad\"], reeksen[\"eind\"]):\n        k = keten(pad, eind)\n        for a, b in zip(k[:-1], k[1:]):\n            tel.loc[a, b] += 1\n    return tel\n\n\ndef normaliseer(tel: pd.DataFrame) -> pd.DataFrame:\n    som = tel.sum(axis=1)\n    return tel.div(som.where(som > 0), axis=0)\n\n\ndef smooth(tel: pd.DataFrame, pseudo: float = PSEUDO_TELLINGEN) -> pd.DataFrame:\n    \"\"\"Dirichlet-smoothing rond de marginale verdeling van aankomsttoestanden.\n\n    Vanuit `start` kan een reeks niet direct naar `start`, en vanuit een fase\n    ook niet; die kolom krijgt geen pseudo-telling.\n    \"\"\"\n    marge = tel.sum(axis=0).astype(float)\n    marge[START] = 0.0\n    if marge.sum() == 0:\n        marge[:] = 1.0\n        marge[START] = 0.0\n    prior = marge / marge.sum()\n    ges = tel.astype(float) + pseudo * prior.to_numpy()[None, :]\n    return normaliseer(ges)\n\n\ndef absorptie(P: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Absorptiekansen B = (I - Q)^-1 R voor elke transient toestand.\n\n    Rijen met NaN (geen waarnemingen, ongesmoothd) worden overgeslagen en\n    krijgen NaN terug.\n    \"\"\"\n    geldig = [s for s in TRANSIENT if not P.loc[s].isna().any()]\n    uit = pd.DataFrame(np.nan, index=TRANSIENT, columns=EINDEN)\n    if not geldig:\n        return uit\n    Q = P.loc[geldig, geldig].to_numpy()\n    R = P.loc[geldig, EINDEN].to_numpy()\n    try:\n        B = np.linalg.solve(np.eye(len(geldig)) - Q, R)\n    except np.linalg.LinAlgError:\n        return uit\n    uit.loc[geldig, :] = B\n    return uit\n\n\ndef _directe_tellingen(reeksen: pd.DataFrame, hoofdfunctie: str) -> pd.DataFrame:\n    \"\"\"Per toestand: hoeveel reeksen kwamen er, en hoeveel daarvan eindigden in schot of verlies.\n\n    Dit zijn de natelbare \"a van b\"-getallen naast de modelkansen.\n    \"\"\"\n    verlies = verlies_eind(hoofdfunctie)\n    rijen = {}\n    for s in TRANSIENT:\n        if s == START:\n            sub = reeksen\n        else:\n            masker = np.array([s in pad for pad in reeksen[\"pad\"]], dtype=bool)\n            sub = reeksen[masker]\n        rijen[s] = {\n            \"reeksen\": len(sub),\n            \"schot\": int(sub[\"eind\"].isin(SCHOT_EINDEN).sum()),\n            \"verlies\": int((sub[\"eind\"] == verlies).sum()),\n        }\n    return pd.DataFrame.from_dict(rijen, orient=\"index\")\n\n\ndef bereken_een(reeksen: pd.DataFrame, hoofdfunctie: str) -> MarkovResultaat:\n    sub = reeksen[reeksen[\"hoofdfunctie\"] == hoofdfunctie]\n    tel = tel_overgangen(sub)\n    kansen = normaliseer(tel)\n    ges = smooth(tel)\n    B_model = absorptie(ges)\n    B_raw = absorptie(kansen)\n    verlies = verlies_eind(hoofdfunctie)\n\n    fw = _directe_tellingen(sub, hoofdfunctie)\n    fw[\"overgangen\"] = tel.sum(axis=1)\n    fw[\"p_schot_ruw\"] = B_raw[list(SCHOT_EINDEN)].sum(axis=1).where(B_raw[\"schot\"].notna())\n    fw[\"p_verlies_ruw\"] = B_raw[verlies].where(B_raw[verlies].notna())\n    fw[\"p_schot\"] = B_model[list(SCHOT_EINDEN)].sum(axis=1)\n    fw[\"p_verlies\"] = B_model[verlies]\n    fw = fw[[\"reeksen\", \"schot\", \"verlies\", \"overgangen\", \"p_schot_ruw\", \"p_schot\", \"p_verlies_ruw\", \"p_verlies\"]]\n\n    return MarkovResultaat(\n        hoofdfunctie=hoofdfunctie,\n        n_reeksen=len(sub),\n        tellingen=tel,\n        kansen=kansen,\n        gesmoothd=ges,\n        fasewaarden=fw,\n    )\n\n\ndef bereken(reeksen: pd.DataFrame) -> dict[str, MarkovResultaat]:\n    return {hf: bereken_een(reeksen, hf) for hf in REEKS_FUNCTIES}\n\n\ndef reeks_dreiging(reeksen: pd.DataFrame, resultaten: dict[str, MarkovResultaat]) -> pd.Series:\n    \"\"\"Per reeks de fasewaarde (p_schot, model) van de hoogste fase die hij haalde.\n\n    Hoogste = de fase met de grootste p_schot binnen die hoofdfunctie. Een reeks\n    zonder fases krijgt de waarde van `start`.\n    \"\"\"\n    waarden = []\n    for hf, pad in zip(reeksen[\"hoofdfunctie\"], reeksen[\"pad\"]):\n        fw = resultaten[hf].fasewaarden[\"p_schot\"]\n        kandidaten = [fw[f] for f in pad if f in fw.index] or [fw[START]]\n        waarden.append(float(max(kandidaten)))\n    return pd.Series(waarden, index=reeksen.index, name=\"dreiging\")\n\n\ndef compacte_tellingen(res: MarkovResultaat) -> pd.DataFrame:\n    \"\"\"Overgangstabel zonder lege rijen en kolommen, met rijtotaal.\"\"\"\n    tel = res.tellingen\n    rijen = tel.index[tel.sum(axis=1) > 0]\n    kolommen = tel.columns[tel.sum(axis=0) > 0]\n    uit = tel.loc[rijen, kolommen].copy()\n    uit[\"totaal\"] = uit.sum(axis=1)\n    return uit\n", "myva_pipeline/model/reeksen.py": "\"\"\"Van instances naar reeksen.\n\nEen reeks is een instance van een van de vier teamfuncties zonder fase.\nFases, eindfases en kansen worden op tijdsoverlap aan de reeks gekoppeld\nwaarmee ze het langst overlappen. De aannames achter de eindtoestanden staan\nin het wedstrijdrapport onder \"Aannames\".\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom myva_pipeline.domein import AANVALLEN, EIGEN_BEZIT, FASE_LOS, KANS, KANS_TEGEN, OMSCHAKELEN_AV, OMSCHAKELEN_VA, REEKS_FUNCTIES, SPELHERVATTING, TEGEN_BEZIT, VERDEDIGEN\nfrom myva_pipeline.invoer import inlezen\n\nPREFIX = {AANVALLEN: \"A\", VERDEDIGEN: \"V\", OMSCHAKELEN_AV: \"AV\", OMSCHAKELEN_VA: \"VA\"}\nDRUK_FASES = (\"hoog_druk\", \"laag_druk\")\nDOELTRAP_CONTAINERS = (\"Aanvallen - doeltrap\", \"Verdedigen - doeltrap\")\n\n# MyVA-knoppen hebben een voorloop van 2 s: een volgende reeks begint vaak\n# 2,0 s voor het einde van de vorige.\nVOORLOOP_S = 2.0\n# Een kind zonder overlap hoort bij de dichtstbijzijnde reeks binnen deze marge.\nKOPPEL_MARGE_S = 3.0\n# Vensters rond het einde van een reeks voor de eindtoestanden \"opbouw\" en \"uit\".\nOPBOUW_VENSTER_S = 3.0\nUIT_VENSTER_S = 10.0\n# De omschakelknop heeft een voorloop van 5 s. Wat de partij die omschakelt binnen NA_WISSEL_S\n# na de balwissel bereikt in de reeks erna (eindfase, schot), telt voor de omschakeling.\nOMSCHAKEL_VOORLOOP_S = 5.0\nNA_WISSEL_S = 15.0\n\nKOLOMMEN = [\n    \"reeks_id\", \"wedstrijd\", \"hoofdfunctie\", \"helft\", \"start_min\", \"start\", \"end\", \"duur\",\n    \"pad\", \"pad_str\", \"drukhoogte\", \"eind\", \"voorzet\", \"schoten\", \"lange_bal\", \"label_BV\", \"label_BW\", \"eindfase_vervolg\",\n]\nKANS_KOLOMMEN = [\n    \"kans_id\", \"wedstrijd\", \"kant\", \"soort\", \"helft\", \"start_min\", \"start\",\n    \"reeks_id\", \"herkomst\", \"laatste_fase\", \"drukhoogte\", \"voorzet_type\", \"dubbel\",\n]\n_OBJECT_KOLOMMEN = (\"helft\", \"start_min\", \"drukhoogte\", \"eind\", \"voorzet\", \"wedstrijd\")\n_KANS_OBJECT_KOLOMMEN = (\"wedstrijd\", \"helft\", \"start_min\", \"reeks_id\", \"laatste_fase\", \"drukhoogte\", \"voorzet_type\")\n\n\n@dataclass\nclass ReeksResultaat:\n    reeksen: pd.DataFrame\n    kansen: pd.DataFrame\n    niet_gekoppeld: dict[str, pd.DataFrame]\n\n\ndef _overlap_matrix(a: pd.DataFrame, b: pd.DataFrame) -> np.ndarray:\n    \"\"\"Overlap in seconden tussen elke rij van a en elke rij van b.\"\"\"\n    if a.empty or b.empty:\n        return np.zeros((len(a), len(b)))\n    a_start, a_end = a[\"start\"].to_numpy()[:, None], a[\"end\"].to_numpy()[:, None]\n    b_start, b_end = b[\"start\"].to_numpy()[None, :], b[\"end\"].to_numpy()[None, :]\n    return np.clip(np.minimum(a_end, b_end) - np.maximum(a_start, b_start), 0, None)\n\n\ndef koppel_aan_reeks(kinderen: pd.DataFrame, reeksen: pd.DataFrame) -> pd.Series:\n    \"\"\"Per kind het index-label van de reeks met de grootste overlap.\n\n    Zonder overlap telt de dichtstbijzijnde reeks binnen KOPPEL_MARGE_S; anders None.\n    \"\"\"\n    uit = pd.Series([None] * len(kinderen), index=kinderen.index, dtype=\"object\")\n    if kinderen.empty or reeksen.empty:\n        return uit\n    overlap = _overlap_matrix(kinderen, reeksen)\n    labels = reeksen.index.to_numpy()\n    heeft = overlap.max(axis=1) > 0\n    uit[heeft] = labels[overlap.argmax(axis=1)][heeft]\n\n    if (~heeft).any():\n        gat = np.maximum(\n            kinderen[\"start\"].to_numpy()[:, None] - reeksen[\"end\"].to_numpy()[None, :],\n            reeksen[\"start\"].to_numpy()[None, :] - kinderen[\"end\"].to_numpy()[:, None],\n        )\n        binnen = ~heeft & (gat.min(axis=1) <= KOPPEL_MARGE_S)\n        uit[binnen] = labels[gat.argmin(axis=1)][binnen]\n    return uit\n\n\ndef kans_soort(code: str) -> str:\n    if code.endswith(\"afgekeurd\"):\n        return \"schot\"\n    if code.endswith(\"goal\"):\n        return \"goal\"\n    if code.endswith(\"schot\"):\n        return \"sc
